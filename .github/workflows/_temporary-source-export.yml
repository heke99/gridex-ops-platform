name: temporary-source-export

on:
  push:
    branches:
      - remediation/gridex-ops-api-performance-2026-08-09

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: gridex-remediation-source
          path: |
            .
            !node_modules
            !.next
          include-hidden-files: true
          retention-days: 1
