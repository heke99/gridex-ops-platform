name: Agent apply checkout audit

on:
  push:
    branches:
      - audit/website-contract-e2e-20260817

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited patch
        shell: bash
        run: |
          base64 --decode .github/ops-audit.patch.gz.b64 > /tmp/ops-audit.patch.gz
          echo 'e528fc987705f2d1abbd07825ea6fdc6ea4b5860e8a545a3b9f40129802e6324  /tmp/ops-audit.patch.gz' | sha256sum --check --strict
          gzip -dc /tmp/ops-audit.patch.gz > /tmp/ops-audit.patch
          git apply --check /tmp/ops-audit.patch
          git apply /tmp/ops-audit.patch
      - name: Commit audited remediation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/admin/contracts/page.tsx lib/contracts/canonical.ts lib/customers/canonicalOnboarding.ts scripts/
          git commit -m 'fix: certify website customer contract onboarding'
          git push origin HEAD:audit/website-contract-e2e-20260817
