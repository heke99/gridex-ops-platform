name: Agent commercial terms integrity

on:
  push:
    branches:
      - fix/website-commercial-terms-integrity-20260817

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply audited commercial terms fix onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin 0fee5deec088255da754f41db9ba607cb0fac499
          if ! git cherry-pick 0fee5deec088255da754f41db9ba607cb0fac499; then
            test -f scripts/gridex-contract-go-live-regression.cjs
            git checkout --ours scripts/gridex-contract-go-live-regression.cjs
            git add scripts/gridex-contract-go-live-regression.cjs
            git cherry-pick --continue
          fi
          python - <<'PY'
          from pathlib import Path
          import subprocess

          p = Path('__tests__/contract-admin-schema.test.ts')
          s = p.read_text()
          needle = '    invoice_fee_sek: "0",\n'
          replacement = needle + '    default_notice_months: "1",\n'
          prefix = s.split('const values = {', 1)[1].split('price_options_json:', 1)[0]
          if '    default_notice_months: "1",\n' not in prefix:
              if needle not in s:
                  raise SystemExit('baseForm invoice fee fixture not found')
              p.write_text(s.replace(needle, replacement, 1))
              subprocess.run(['git','add',str(p)], check=True)
              subprocess.run(['git','commit','-m','test: align canonical contract lifecycle fixture'], check=True)

          r = Path('scripts/gridex-contract-commercial-selection-regression.cjs')
          rs = r.read_text()
          old = 'const onboarding = read("lib/website/customerApplications.ts");'
          new = 'const onboarding = read("lib/website/customerApplicationOnboarding.ts");'
          if old in rs:
              r.write_text(rs.replace(old, new, 1))
              subprocess.run(['git','add',str(r)], check=True)
              subprocess.run(['git','commit','-m','test: follow modular website onboarding boundary'], check=True)
          PY
      - run: npm ci
      - name: Targeted commercial and checkout regression
        run: |
          npm test -- --run __tests__/contract-admin-schema.test.ts
          node scripts/gridex-contract-commercial-selection-regression.cjs
          node scripts/gridex-website-full-regression.cjs
          node scripts/gridex-website-quote-integrity-regression.cjs
          node scripts/gridex-website-ops-chain-regression.cjs
      - run: npm run typecheck
      - run: npm run lint
      - name: Push applied fix
        run: git push origin HEAD:fix/website-commercial-terms-integrity-20260817
