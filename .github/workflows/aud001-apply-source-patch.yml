name: AUD-001 apply source patch

on:
  push:
    branches:
      - remediation/gridex-aud-001-document-storage-isolation

permissions:
  contents: write

concurrency:
  group: aud001-source-patch
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/gridex-aud-001-document-storage-isolation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/aud001-apply-source-patch.mjs
      - run: node scripts/gridex-aud-001-customer-document-storage-isolation-regression.cjs
      - name: Commit final source patch
        run: |
          git checkout -- .github/workflows/ops-hardening.yml
          rm .github/scripts/aud001-apply-source-patch.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(aud-001): canonicalize customer document storage flows"
          git push origin HEAD:remediation/gridex-aud-001-document-storage-isolation
