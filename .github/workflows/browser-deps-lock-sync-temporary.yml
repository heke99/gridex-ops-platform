name: Gridex browser deps lock sync temporary

on:
  push:
    branches:
      - agent/release-certification-hardening-20260817
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-browser-dependencies:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-certification-hardening-20260817
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add pinned browser dependencies to manifest and lock
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.devDependencies ||= {}
          pkg.devDependencies['@playwright/test'] = '1.60.0'
          pkg.devDependencies['@axe-core/playwright'] = '4.11.3'
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`)
          NODE
          npm install --package-lock-only --ignore-scripts
      - name: Commit generated lock state
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Browser dependencies already synchronized.'
            exit 0
          fi
          git config user.name 'gridex-ci-bot'
          git config user.email '129280077+heke99@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'test(browser): pin Playwright and axe in dependency lock'
          git push origin HEAD:agent/release-certification-hardening-20260817
