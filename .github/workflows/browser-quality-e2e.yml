name: Gridex browser and quality E2E

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Open-source E2E layer to run
        required: true
        default: public
        type: choice
        options:
          - public
          - staging
          - all

permissions:
  contents: read

concurrency:
  group: gridex-browser-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  browser-public:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'public' || inputs.mode == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify open-source E2E wiring
        run: node scripts/gridex-open-source-e2e-tooling-regression.cjs
      - name: Install pinned Playwright and axe-core tooling
        run: bash scripts/install-browser-e2e-tooling.sh
      - name: Run public browser and accessibility E2E
        run: |
          mkdir -p e2e-artifacts
          npx playwright test e2e/browser/public.spec.mjs --config=playwright.config.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gridex-browser-public-${{ github.run_id }}
          path: e2e-artifacts/
          if-no-files-found: error
          retention-days: 14

  browser-staging:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'staging' || inputs.mode == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRIDEX_E2E_BROWSER_BASE_URL: ${{ secrets.GRIDEX_E2E_BROWSER_BASE_URL }}
      GRIDEX_E2E_BROWSER_EMAIL: ${{ secrets.GRIDEX_E2E_BROWSER_EMAIL }}
      GRIDEX_E2E_BROWSER_PASSWORD: ${{ secrets.GRIDEX_E2E_BROWSER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: staging-browser-secrets
        name: Verify staging browser configuration
        shell: bash
        run: |
          missing=0
          for name in GRIDEX_E2E_BROWSER_BASE_URL GRIDEX_E2E_BROWSER_EMAIL GRIDEX_E2E_BROWSER_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          if [[ "$missing" -eq 1 ]]; then
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "Manual staging browser E2E requires all browser secrets." >&2
              exit 1
            fi
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nightly staging browser E2E skipped because browser secrets are not configured."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify open-source E2E wiring
        if: steps.staging-browser-secrets.outputs.enabled == 'true'
        run: node scripts/gridex-open-source-e2e-tooling-regression.cjs
      - name: Install pinned Playwright and axe-core tooling
        if: steps.staging-browser-secrets.outputs.enabled == 'true'
        run: bash scripts/install-browser-e2e-tooling.sh
      - name: Run staging browser E2E
        if: steps.staging-browser-secrets.outputs.enabled == 'true'
        run: |
          mkdir -p e2e-artifacts
          npx playwright test --config=playwright.config.mjs
      - name: Upload staging browser evidence
        if: always() && steps.staging-browser-secrets.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gridex-browser-staging-${{ github.run_id }}
          path: e2e-artifacts/
          if-no-files-found: error
          retention-days: 30

  k6-staging-smoke:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'staging' || inputs.mode == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRIDEX_E2E_BASE_URL: ${{ secrets.GRIDEX_E2E_BROWSER_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - id: k6-target
        name: Verify k6 staging target
        shell: bash
        run: |
          if [[ -z "$GRIDEX_E2E_BASE_URL" ]]; then
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "Manual k6 staging E2E requires GRIDEX_E2E_BROWSER_BASE_URL." >&2
              exit 1
            fi
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nightly k6 smoke skipped because the staging URL is not configured."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run pinned k6 smoke thresholds
        if: steps.k6-target.outputs.enabled == 'true'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p e2e-artifacts
          docker run --rm \
            -e GRIDEX_E2E_BASE_URL="$GRIDEX_E2E_BASE_URL" \
            -v "$PWD:/work" \
            -w /work \
            grafana/k6:2.1.0 \
            run e2e/k6/platform-smoke.js | tee e2e-artifacts/k6-smoke.log
      - name: Upload k6 evidence
        if: always() && steps.k6-target.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gridex-k6-staging-${{ github.run_id }}
          path: e2e-artifacts/k6-smoke.log
          if-no-files-found: error
          retention-days: 30

  zap-staging-baseline:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'staging' || inputs.mode == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRIDEX_E2E_ZAP_TARGET: ${{ secrets.GRIDEX_E2E_BROWSER_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - id: zap-target
        name: Verify ZAP staging target
        shell: bash
        run: |
          if [[ -z "$GRIDEX_E2E_ZAP_TARGET" ]]; then
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "Manual ZAP staging baseline requires GRIDEX_E2E_BROWSER_BASE_URL." >&2
              exit 1
            fi
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nightly ZAP baseline skipped because the staging URL is not configured."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run OWASP ZAP passive baseline
        if: steps.zap-target.outputs.enabled == 'true'
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ env.GRIDEX_E2E_ZAP_TARGET }}
          allow_issue_writing: false
          fail_action: false
          cmd_options: '-a'
          artifact_name: gridex-zap-staging-${{ github.run_id }}
