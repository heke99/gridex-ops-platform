name: Gridex coverage lock sync temporary

on:
  push:
    branches:
      - agent/release-certification-hardening-20260817
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-coverage-dependency:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-certification-hardening-20260817
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add pinned Vitest coverage dependency and script
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.scripts ||= {}
          pkg.devDependencies ||= {}
          pkg.scripts['test:coverage'] = 'vitest run --coverage'
          pkg.devDependencies['@vitest/coverage-v8'] = '4.1.9'
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`)
          NODE
          npm install --package-lock-only --ignore-scripts
      - name: Commit generated package lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Coverage dependency already synchronized.'
            exit 0
          fi
          git config user.name 'gridex-ci-bot'
          git config user.email '129280077+heke99@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'test(coverage): pin Vitest v8 coverage provider'
          git push origin HEAD:agent/release-certification-hardening-20260817
