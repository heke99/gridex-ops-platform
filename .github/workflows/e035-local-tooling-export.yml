name: E035 isolated tooling export
on:
  push:
    branches: [codex/e035-local-tooling-export-20260922]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: cp .e035-transfer/fix-native.py "$RUNNER_TEMP/fix-native.py"
      - uses: actions/checkout@v4
        with:
          ref: 6fcb56ca31f87bf9115405cf88c03e2f8ff86e1b
          persist-credentials: false
      - name: Publish exact locally checked fixture and security regressions
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/fix-native.py"
          git add scripts/ediel-source-owner-native.test.ts __tests__/ediel-structure-review-action.test.ts __tests__/ediel-structural-source-selection.test.ts
          git diff --cached --check
          test "$(git write-tree)" = ef3d9ee8b3661588434e72f42b8381989f58f890
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(e035): exercise review authorization and corrected baseline coverage'
          sha="$(git rev-parse HEAD)"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c credential.helper= -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/codex/e035-native-market-candidate-20260922
          unset auth GH_TOKEN
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  native:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Install matching PostgreSQL client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo 'GRIDEX_PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump' >> "$GITHUB_ENV"
      - name: Actual empty replay, native ownership, types and isolation
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e035-native-proof"
          exec > >(tee "$RUNNER_TEMP/e035-native-proof/native.log") 2>&1
          git rev-parse HEAD | tee "$RUNNER_TEMP/e035-native-proof/candidate-sha.txt"
          source scripts/gridex-aud-003-clean-replay.sh
          supabase status -o json > "$RUNNER_TEMP/e035-native-status.json"
          set +e
          GRIDEX_NATIVE_STATUS="$RUNNER_TEMP/e035-native-status.json" npx vitest run --config scripts/ediel-source-owner-native.config.ts
          native_rc=$?
          set -e
          rm -f "$RUNNER_TEMP/e035-native-status.json"
          echo "$native_rc" > "$RUNNER_TEMP/e035-native-proof/native.exit"
          supabase gen types typescript --local > "$RUNNER_TEMP/e035-native-proof/database.types.ts"
          node scripts/apply-supabase-types-nullability-overrides.cjs "$RUNNER_TEMP/e035-native-proof/database.types.ts"
          sha256sum "$RUNNER_TEMP/e035-native-proof/database.types.ts" | tee "$RUNNER_TEMP/e035-native-proof/types.sha256"
          cmp "$RUNNER_TEMP/e035-native-proof/database.types.ts" supabase/database.types.ts
          date -u +%FT%TZ > "$RUNNER_TEMP/e035-native-proof/typegen-time.txt"
          DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres' npm run tenant:invariants
          npm run db:parity:selftest -- 'postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          exit "$native_rc"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e035-market-native-evidence
          path: ${{ runner.temp }}/e035-native-proof/
          retention-days: 14
          if-no-files-found: warn
