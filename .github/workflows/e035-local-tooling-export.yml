name: E035 isolated tooling export
on:
  push:
    branches: [codex/e035-local-tooling-export-20260922]
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 64bf9713b412ef629e7c8ecc6bc575e02ff5968f
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Create forward migration with actual CLI
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e035-cli"
          supabase --version | tee "$RUNNER_TEMP/e035-cli/version.txt"
          supabase --help > "$RUNNER_TEMP/e035-cli/help.txt"
          supabase migration --help > "$RUNNER_TEMP/e035-cli/migration-help.txt"
          supabase migration new --help > "$RUNNER_TEMP/e035-cli/new-help.txt"
          supabase migration new ediel_reviewed_structural_source
          cp supabase/migrations/*_ediel_reviewed_structural_source.sql "$RUNNER_TEMP/e035-cli/"
          cp -L "$(command -v supabase)" "$RUNNER_TEMP/e035-cli/supabase"
          cd "$RUNNER_TEMP/e035-cli"
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: e035-cli-created-forward
          path: ${{ runner.temp }}/e035-cli/
          retention-days: 3
