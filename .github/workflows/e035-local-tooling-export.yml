name: E035 isolated tooling export
on:
  push:
    branches: [codex/e035-local-tooling-export-20260922]
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 64bf9713b412ef629e7c8ecc6bc575e02ff5968f
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Export only installed public dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e035-tooling"
          tar -czf "$RUNNER_TEMP/e035-tooling/node_modules.tar.gz" node_modules
          sha256sum package-lock.json > "$RUNNER_TEMP/e035-tooling/package-lock.sha256"
          sha256sum "$RUNNER_TEMP/e035-tooling/node_modules.tar.gz" > "$RUNNER_TEMP/e035-tooling/dependencies.sha256"
          node --version > "$RUNNER_TEMP/e035-tooling/node-version.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: e035-local-tooling-64bf971
          path: ${{ runner.temp }}/e035-tooling/
          retention-days: 3
