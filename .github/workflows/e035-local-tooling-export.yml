name: E035 isolated tooling export
on:
  push:
    branches: [codex/e035-local-tooling-export-20260922]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact local candidate transport
        shell: bash
        run: |
          set -euo pipefail
          cat .e035-transfer/part-*.bin > "$RUNNER_TEMP/e035-candidate.patch.xz"
          echo "520c804cab17767d3d11afa3b185aaff9a4b52f0a4b7958c9db38ca92a2c3cb9  $RUNNER_TEMP/e035-candidate.patch.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/e035-candidate.patch.xz" > "$RUNNER_TEMP/e035-candidate.patch"
          echo "30865e88f822b8223ea5ded33108b604d578fa6c320113bafa3b8ec0ac1ef55b  $RUNNER_TEMP/e035-candidate.patch" | sha256sum -c -
      - uses: actions/checkout@v4
        with:
          ref: 64bf9713b412ef629e7c8ecc6bc575e02ff5968f
          persist-credentials: false
      - name: Reconstruct and publish separate candidate, never main or PR branch
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git apply --index --check "$RUNNER_TEMP/e035-candidate.patch"
          git apply --index "$RUNNER_TEMP/e035-candidate.patch"
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 45
          if git diff --cached --name-only | grep -Eq '^\.github/|^\.e035-transfer/'; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(e035): review dated market structures and qualify E61/E62'
          sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = 64bf9713b412ef629e7c8ecc6bc575e02ff5968f
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c credential.helper= -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/codex/e035-native-market-candidate-20260922
          unset auth GH_TOKEN
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/e035-transfer-proof"
          git show --no-patch --format=fuller HEAD > "$RUNNER_TEMP/e035-transfer-proof/commit.txt"
          git diff HEAD^ HEAD --stat > "$RUNNER_TEMP/e035-transfer-proof/paths.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/e035-transfer-proof/source.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/e035-candidate.patch" > "$RUNNER_TEMP/e035-transfer-proof/patch.sha256"
          printf '%s\n' "$sha" > "$RUNNER_TEMP/e035-transfer-proof/candidate-sha.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: e035-market-candidate-source
          path: ${{ runner.temp }}/e035-transfer-proof/
          retention-days: 14
  native:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Install matching native PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          server_major="$(python3 -c "import re,pathlib;print(re.search(r'^major_version\s*=\s*(\d+)', pathlib.Path('supabase/config.toml').read_text(), re.M).group(1))")"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-$server_major"
          echo "GRIDEX_PG_DUMP=/usr/lib/postgresql/$server_major/bin/pg_dump" >> "$GITHUB_ENV"
      - name: Exact candidate empty replay, native owner tests, generated types and isolation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e035-native-proof"
          exec > >(tee "$RUNNER_TEMP/e035-native-proof/native.log") 2>&1
          git rev-parse HEAD | tee "$RUNNER_TEMP/e035-native-proof/candidate-sha.txt"
          source scripts/gridex-aud-003-clean-replay.sh
          supabase status -o json > "$RUNNER_TEMP/e035-native-status.json"
          set +e
          GRIDEX_NATIVE_STATUS="$RUNNER_TEMP/e035-native-status.json" npx vitest run --config scripts/ediel-source-owner-native.config.ts
          native_rc=$?
          set -e
          rm -f "$RUNNER_TEMP/e035-native-status.json"
          echo "$native_rc" > "$RUNNER_TEMP/e035-native-proof/native.exit"
          supabase gen types typescript --local > "$RUNNER_TEMP/e035-native-proof/database.types.ts"
          node scripts/apply-supabase-types-nullability-overrides.cjs "$RUNNER_TEMP/e035-native-proof/database.types.ts"
          sha256sum "$RUNNER_TEMP/e035-native-proof/database.types.ts" | tee "$RUNNER_TEMP/e035-native-proof/types.sha256"
          if cmp -s "$RUNNER_TEMP/e035-native-proof/database.types.ts" supabase/database.types.ts; then echo 'types_match_committed=true'; else echo 'types_match_committed=false'; fi
          date -u +%FT%TZ > "$RUNNER_TEMP/e035-native-proof/typegen-time.txt"
          SHADOW_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          DATABASE_URL="$SHADOW_URL" npm run tenant:invariants
          npm run db:parity:selftest -- "$SHADOW_URL"
          exit "$native_rc"
      - name: Upload native evidence only, never local API keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e035-market-native-evidence
          path: ${{ runner.temp }}/e035-native-proof/
          retention-days: 14
          if-no-files-found: warn
