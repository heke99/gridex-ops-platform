name: E035 recover interrupted preparation input (read only)
on:
  push:
    branches: [codex/e035-input-recovery-20260922]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Decode and verify only; do not execute candidate code
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),zlib=require('node:zlib');
          const sh=b=>crypto.createHash('sha256').update(b).digest('hex');
          const gh=b=>crypto.createHash('sha1').update(`blob ${Buffer.byteLength(b)}\0`).update(b).digest('hex');
          const expected=['fd582d599b53f7bd26347c0865c3a9087c377bc0','4bc45467c19354e6f6639d79723a52293777bfc6','208ac3a101a024b20f553036c75fbbcc1c65baf6','e03eea0ca7a6b8048367e046c544979f827aae28','02cda139cbe184877cd61f3971ae12215c746629'];
          const parts=expected.map((hash,i)=>{let s=fs.readFileSync(`.e035-preparation/chunk-${i}.b64`,'utf8');if(i===0&&gh(s)==='59482ea163d2150b67ccb933a06d835f5f5bfad2'){const bad='FfrVDlTydTntdJJWECoipr6';if(s.split(bad).length!==2)throw Error('transport correction mismatch');s=s.replace(bad,'FfrVDlTydTntdJWECoipr6');}if(gh(s)!==hash)throw Error('chunk digest mismatch');return s;});
          const bytes=Buffer.from(parts.join(''),'base64');
          if(sh(bytes)!=='d62941828047f76926e20492dee8414d7a9c7b57f4809802085af68ce8246acd')throw Error('input digest mismatch');
          const json=zlib.brotliDecompressSync(bytes);JSON.parse(json);
          fs.mkdirSync('recovered',{recursive:true});fs.writeFileSync('recovered/input.json',json);
          fs.writeFileSync('recovered/provenance.json',JSON.stringify({commit:process.env.GITHUB_SHA,compressed_sha256:sh(bytes),json_sha256:sh(json),scope:'decode-only; no candidate execution, database or deployment'},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: e035-recovered-input
          path: recovered/
          if-no-files-found: error
