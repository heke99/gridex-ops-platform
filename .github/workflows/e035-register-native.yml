name: E035 isolated object decisions preparation
on:
  push:
    branches: [codex/e035-register-native-20260922]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Install a PostgreSQL client matching the replay server
        shell: bash
        run: |
          set -euo pipefail
          # supabase/config.toml pins major_version 17, and pg_dump refuses to
          # dump a server newer than itself. The runner ships an older client,
          # so the schema snapshot aborts on a version mismatch.
          server_major="$(python3 -c "import re,pathlib;print(re.search(r'^major_version\s*=\s*(\d+)', pathlib.Path('supabase/config.toml').read_text(), re.M).group(1))")"
          echo "replay server major version: $server_major"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-$server_major"
          # Name the matching binary explicitly. pg_wrapper does not reliably
          # resolve to the newest installed major, so relying on PATH here can
          # still pick an older pg_dump and abort on a version mismatch.
          echo "GRIDEX_PG_DUMP=/usr/lib/postgresql/$server_major/bin/pg_dump" >> "$GITHUB_ENV"
          psql --version
          "/usr/lib/postgresql/$server_major/bin/pg_dump" --version
      - name: Disposable native forward, SQL regressions and generated contracts
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e035-native"
          exec > >(tee "$RUNNER_TEMP/e035-native/native.log") 2>&1
          source scripts/gridex-aud-003-clean-replay.sh
          db='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          set +e
          psql "$db" -X -v ON_ERROR_STOP=1 -f scripts/ediel-register-validation-regression.sql > "$RUNNER_TEMP/e035-native/message-line-red.log" 2>&1
          red_exit=$?
          set -e
          test "$red_exit" -ne 0
          grep -F 'register_validation_regressions_failed:' "$RUNNER_TEMP/e035-native/message-line-red.log"
          cp scripts/e035-register-line-forward.sql supabase/migrations/20260922152602_ediel_register_message_line_scope.sql
          # Forward files originated in actual pinned CLI, never hand named.
          cp scripts/e035-object-forward.sql supabase/migrations/20260922144906_ediel_source_object_decisions.sql
          cp scripts/e035-selection-forward.sql supabase/migrations/20260922150922_ediel_source_decision_snapshots.sql
          supabase migration up --local --yes
          psql "$db" -X -v ON_ERROR_STOP=1 -f scripts/ediel-source-object-decisions-regression.sql | tee "$RUNNER_TEMP/e035-native/object-green.log"
          psql "$db" -X -v ON_ERROR_STOP=1 -f scripts/manual-inbound-tenant-graph-regression.sql
          psql "$db" -X -v ON_ERROR_STOP=1 -f scripts/gridex-canonical-provision-request-hash-regression.sql
          psql "$db" -X -v ON_ERROR_STOP=1 -f scripts/pr164-review-remediation-regression.sql
          python3 scripts/ediel-source-validation-concurrency-regression.py
          python3 scripts/ediel-source-object-concurrency-regression.py
          supabase db lint --local --schema gridex_received_sources --level warning --fail-on warning
          supabase db advisors --local --type security > "$RUNNER_TEMP/e035-native/advisors.txt"
          DATABASE_URL="$db" npm run tenant:invariants
          npm run db:parity:selftest -- "$db"
          supabase gen types typescript --local > "$RUNNER_TEMP/e035-native/database.types.ts"
          supabase gen types typescript --local > "$RUNNER_TEMP/e035-native/database.types.repeat.ts"
          node scripts/apply-supabase-types-nullability-overrides.cjs "$RUNNER_TEMP/e035-native/database.types.ts"
          node scripts/apply-supabase-types-nullability-overrides.cjs "$RUNNER_TEMP/e035-native/database.types.repeat.ts"
          cmp "$RUNNER_TEMP/e035-native/database.types.ts" "$RUNNER_TEMP/e035-native/database.types.repeat.ts"
          npm run db:schema:snapshot -- --url "$db" --out-dir "$RUNNER_TEMP/e035-native/schema"
          npm run db:schema:snapshot -- --url "$db" --out-dir "$RUNNER_TEMP/e035-native/schema-repeat"
          cmp "$RUNNER_TEMP/e035-native/schema/schema.sql" "$RUNNER_TEMP/e035-native/schema-repeat/schema.sql"
          cmp "$RUNNER_TEMP/e035-native/schema/schema.fingerprint.json" "$RUNNER_TEMP/e035-native/schema-repeat/schema.fingerprint.json"
          cp supabase/migrations/20260922144906_ediel_source_object_decisions.sql "$RUNNER_TEMP/e035-native/"
          cp supabase/migrations/20260922150922_ediel_source_decision_snapshots.sql "$RUNNER_TEMP/e035-native/"
          cp supabase/migrations/20260922152602_ediel_register_message_line_scope.sql "$RUNNER_TEMP/e035-native/"
          git rev-parse HEAD > "$RUNNER_TEMP/e035-native/source-commit.txt"
          cleanup
          trap - EXIT
          set -euo pipefail
          (cd "$RUNNER_TEMP/e035-native" && sha256sum database.types.ts schema/schema.sql schema/schema.fingerprint.json *.sql > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e035-register-native
          path: ${{ runner.temp }}/e035-native/
          retention-days: 7
