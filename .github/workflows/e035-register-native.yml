name: E035 isolated register evidence preparation
on:
  push:
    branches: [codex/e035-register-native-20260922]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Create forward migration with actual CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e035-cli"
          supabase --version
          supabase migration new --help
          supabase migration new ediel_received_register_validation
          cp supabase/migrations/*_ediel_received_register_validation.sql "$RUNNER_TEMP/e035-cli/"
          cp "$(command -v supabase)" "$RUNNER_TEMP/e035-cli/supabase"
          git rev-parse HEAD > "$RUNNER_TEMP/e035-cli/source-commit.txt"
          (cd "$RUNNER_TEMP/e035-cli" && sha256sum supabase *_ediel_received_register_validation.sql > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: e035-cli-created-migration
          path: ${{ runner.temp }}/e035-cli/
          retention-days: 7
