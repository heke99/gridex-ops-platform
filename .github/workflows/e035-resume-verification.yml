name: E035 isolated resume verification
on:
  push:
    branches: [codex/e035-resume-verification-20260922]
    paths: [.github/workflows/e035-resume-verification.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bc6085e192bbab4da50b9db9d47bb27b73178b87
          fetch-depth: 1
      - name: Export only the two exact E035 sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e035-recovery"
          test "$(git rev-parse HEAD)" = bc6085e192bbab4da50b9db9d47bb27b73178b87
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/e035-recovery/published-bc6085e.tar.gz"
          git ls-tree -r HEAD > "$RUNNER_TEMP/e035-recovery/published-tree.txt"
          git fetch --no-tags --depth=1 origin 4a502344e3fce5824eee52aee6d744e4abc3fde9
          git archive --format=tar.gz 4a502344e3fce5824eee52aee6d744e4abc3fde9 > "$RUNNER_TEMP/e035-recovery/preparation-4a502344.tar.gz"
          git ls-tree -r 4a502344e3fce5824eee52aee6d744e4abc3fde9 > "$RUNNER_TEMP/e035-recovery/preparation-tree.txt"
          git diff --stat bc6085e192bbab4da50b9db9d47bb27b73178b87 4a502344e3fce5824eee52aee6d744e4abc3fde9 > "$RUNNER_TEMP/e035-recovery/preparation-v-published.txt"
          (cd "$RUNNER_TEMP/e035-recovery" && sha256sum *.tar.gz *tree.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: e035-resume-source-recovery
          path: ${{ runner.temp }}/e035-recovery/
          retention-days: 14
