name: E035 isolated resume verification
on:
  push:
    branches: [codex/e035-resume-verification-20260922]
    paths: [.github/workflows/e035-resume-verification.yml]
permissions:
  contents: write
jobs:
  refresh-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 06f78e220d6d26cbbda5c1a0d4c3356df8f1916b
          fetch-depth: 1
      - name: Correct only six active memory records
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = c8ee80bd7959d31eb44a63c4ffa72c015791a538
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          old='Qualify and publish recovered database continuation in existing PR370; complete exact-head ordinary CI and independent whole-PR review. Recover or implement missing runtime tenant/party/business disposition owners, then timeline/supersession/E61/E62. Preserve existing facets. No checkpoint merge.'
          new='Inspect ordinary CI and independent review for the current PR head; then complete runtime tenant/legal-party/business disposition owners, full source approval and later timeline/supersession/E61/E62. Preserve implemented facets and the qualified database continuation; do not repeat qualification/publication or merge a checkpoint.'
          paths=['.agent-memory/checkpoint.json']+['.agent-memory/'+x for x in ['current-state.md','current-task.md','handover.md','open-blockers.md','work-plan.md']]
          for name in paths:
              p=Path(name); text=p.read_text(); assert text.count(old)==1,name
              p.write_text(text.replace(old,new,1))
          p=Path('.agent-memory/checkpoint.json');v=json.loads(p.read_text())
          v['published_database_qualification']={'head':'06f78e220d6d26cbbda5c1a0d4c3356df8f1916b','tree':'c8ee80bd7959d31eb44a63c4ffa72c015791a538','run':35757416281,'job':106846584126,'artifact':10708884175,'artifact_sha256':'bd22ba47ec700c016c47ab9127e79a08e0f1598b83b71e03daf6dcbe2d696fb2','status':'SUCCESS_PUBLISHED','tests':5565,'test_files':340,'register_sql':61,'object_sql':71,'full_runtime_source_approval':'NOT_COMPLETE'}
          p.write_text(json.dumps(v,indent=2)+'\n')
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert set(changed)==set(paths),changed
          assert all(old not in Path(name).read_text() for name in paths)
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git diff --cached --check
          node scripts/check-agent-memory-git-state.cjs
          test "$(git write-tree)" = 5f0102d932b4faf0ed26264f82825bdb707d6c0f
          git diff --cached --exit-code -- app lib scripts supabase __tests__ .github package.json package-lock.json
          candidate="$(git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$(git write-tree)" -p 06f78e220d6d26cbbda5c1a0d4c3356df8f1916b -m 'docs(e035): replace completed qualification next-action with remaining CI and runtime gates')"
          evidence="$RUNNER_TEMP/e035-memory-final"
          mkdir -p "$evidence"
          printf '%s\n' "$candidate" > "$evidence/candidate-commit.txt"
          git diff --cached --binary > "$evidence/memory-correction.patch"
          git show --stat "$candidate" > "$evidence/commit.txt"
          test -z "$(git ls-remote --heads origin refs/heads/codex/e035-memory-final-20260922)"
          git push origin "$candidate:refs/heads/codex/e035-memory-final-20260922"
          (cd "$evidence" && sha256sum candidate-commit.txt memory-correction.patch commit.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e035-memory-final-evidence
          path: ${{ runner.temp }}/e035-memory-final/
          retention-days: 14
