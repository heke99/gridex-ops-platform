name: E035 isolated temporal qualification
on:
  push:
    branches: [codex/e035-temporal-qualification-20260922]
    paths: [.github/workflows/e035-temporal-qualification.yml]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: de9e459a5843a9cf562436fb46e0376a61a7e53e
          fetch-depth: 1
      - name: Assemble exact temporal source and reviewed correction
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/e035-temporal"
          mkdir -p "$evidence"
          test "$(git rev-parse HEAD)" = de9e459a5843a9cf562436fb46e0376a61a7e53e
          python3 - "$evidence" <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,subprocess,sys
          out=pathlib.Path(sys.argv[1])
          def blob(sha):
              response=json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}']))
              assert response['encoding']=='base64'
              data=base64.b64decode(''.join(response['content'].split()),validate=True)
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              return data
          shas=['df993ba880067b1e73d55636ba586c8a053d51ac','60e462b788931772c1658f0eab1b5604f142d44a','f58c45328530b49a2d6668f9dd6fca1321123ac7','64fe2ddb84875d1a80b2dfe686a920ed48322d59']
          packed=b''.join(blob(sha) for sha in shas)
          assert hashlib.sha256(packed).hexdigest()=='b89ea0700736ea82bb473b73e30b4e3a0bc439f357f8346d8d0adb78451d3ddb'
          patch=gzip.decompress(packed)
          assert hashlib.sha256(patch).hexdigest()=='b2f450093dd425ed617760143e8b457c646a88f7160b9bd90e5dc1e209544358'
          (out/'candidate.patch').write_bytes(patch)
          packed=blob('b808d8ce91a0360c45999a183fd3fb5f99382840')
          assert hashlib.sha256(packed).hexdigest()=='7eda569a8490b6d0772e27c0bce87649377eeb07f8f129efc34241100b458cf5'
          patch=gzip.decompress(packed)
          assert hashlib.sha256(patch).hexdigest()=='648fd5b66d476ae2e2ed575edc3cb25fcf37632f0b7e3625227e8e5400c78a25'
          (out/'amendment.patch').write_bytes(patch)
          PY
          git apply --check "$evidence/candidate.patch"
          git apply "$evidence/candidate.patch"
          git apply --check "$evidence/amendment.patch"
          git apply "$evidence/amendment.patch"
          git diff --check
          git diff --exit-code -- supabase .github package.json package-lock.json scripts/migration-history-manifest.runtime.additions.json scripts/supabase-types-manifest.json
          git add -A
          tree="$(git write-tree)"
          test "$tree" = 0dfeebb7978ef770b58df3da7161ac3bfd2755f9
          candidate="$(git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$tree" -p de9e459a5843a9cf562436fb46e0376a61a7e53e -m 'feat(e035): consume witnessed structure snapshots at original receipt cutoff before transaction ACKs')"
          git reset --hard "$candidate"
          printf '%s\n' "$candidate" > "$evidence/candidate-commit.txt"
          printf '%s\n' "$tree" > "$evidence/candidate-tree.txt"
          git cat-file commit HEAD > "$evidence/candidate-commit.raw"
          git ls-tree -r HEAD > "$evidence/candidate-files.txt"
          git archive --format=tar.gz HEAD > "$evidence/candidate-source.tar.gz"
          git diff --stat de9e459a5843a9cf562436fb46e0376a61a7e53e HEAD > "$evidence/source-diff.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Install matching PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          server_major="$(python3 -c 'import tomllib;print(tomllib.load(open("supabase/config.toml","rb"))["db"]["major_version"])')"
          test "$server_major" = 17
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -sS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-$server_major"
          echo "GRIDEX_PG_DUMP=/usr/lib/postgresql/$server_major/bin/pg_dump" >> "$GITHUB_ENV"
          supabase --version
          supabase db --help
          supabase gen types --help
      - name: Full current project tests and contracts
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/e035-temporal/project.log") 2>&1
          npm run db:migrations:check
          npm run tenant:service-role-ratchet
          node scripts/check-agent-memory-git-state.cjs
          npm run typecheck
          npm run typecheck:scripts
          npm run typecheck:tests
          npm run lint
          npm test
          printf '\nPROJECT_CHECKS_PASS\n'
      - name: Real disposable database and HTTP owner to E61 E62 consumer
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/e035-temporal"
          exec > >(tee "$evidence/native.log") 2>&1
          source scripts/gridex-aud-003-clean-replay.sh
          db='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$db" -X -v ON_ERROR_STOP=1 -f scripts/manual-inbound-tenant-graph-regression.sql
          psql "$db" -X -v ON_ERROR_STOP=1 -f scripts/gridex-canonical-provision-request-hash-regression.sql
          psql "$db" -X -v ON_ERROR_STOP=1 -f scripts/pr164-review-remediation-regression.sql
          supabase status --help
          supabase status -o json > "$RUNNER_TEMP/e035-temporal-native-status.json"
          GRIDEX_NATIVE_STATUS="$RUNNER_TEMP/e035-temporal-native-status.json" npx vitest run --config scripts/ediel-source-owner-native.config.ts
          rm -f "$RUNNER_TEMP/e035-temporal-native-status.json"
          DATABASE_URL="$db" npm run tenant:invariants
          npm run db:parity:selftest -- "$db"
          supabase db lint --local --schema gridex_received_sources --level warning --fail-on warning
          supabase db advisors --local --type security > "$evidence/advisors.txt"
          supabase gen types typescript --local > "$evidence/database.types.ts"
          supabase gen types typescript --local > "$evidence/database.types.repeat.ts"
          node scripts/apply-supabase-types-nullability-overrides.cjs "$evidence/database.types.ts"
          node scripts/apply-supabase-types-nullability-overrides.cjs "$evidence/database.types.repeat.ts"
          cmp "$evidence/database.types.ts" "$evidence/database.types.repeat.ts"
          cmp "$evidence/database.types.ts" supabase/database.types.ts
          npm run db:schema:snapshot -- --url "$db" --out-dir "$evidence/schema"
          npm run db:schema:snapshot -- --url "$db" --out-dir "$evidence/schema-repeat"
          cmp "$evidence/schema/schema.sql" "$evidence/schema-repeat/schema.sql"
          cmp "$evidence/schema/schema.fingerprint.json" "$evidence/schema-repeat/schema.fingerprint.json"
          cmp "$evidence/schema/schema.sql" supabase/schema.sql
          cmp "$evidence/schema/schema.fingerprint.json" supabase/schema.fingerprint.json
          cleanup
          trap - EXIT
          set -euo pipefail
          git diff --exit-code HEAD --
          npm run db:migrations:check
          printf '\nNATIVE_TEMPORAL_CANDIDATE_PASS\n'
      - name: Preserve exact verified source on isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/e035-temporal"
          test "$(git rev-parse HEAD)" = "$(cat "$evidence/candidate-commit.txt")"
          test "$(git rev-parse HEAD^{tree})" = 0dfeebb7978ef770b58df3da7161ac3bfd2755f9
          git diff --exit-code HEAD --
          (cd "$evidence" && sha256sum candidate.patch amendment.patch candidate-commit.txt candidate-tree.txt candidate-commit.raw candidate-files.txt candidate-source.tar.gz project.log native.log > SHA256SUMS)
          test -z "$(git ls-remote --heads origin refs/heads/codex/e035-temporal-qualified-20260922)"
          git push origin "HEAD:refs/heads/codex/e035-temporal-qualified-20260922"
      - name: Remove local API credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/e035-temporal-native-status.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e035-temporal-qualified-evidence
          path: ${{ runner.temp }}/e035-temporal/
          retention-days: 14
