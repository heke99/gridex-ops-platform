name: E2E Ediel autopatch

on:
  push:
    branches:
      - fix/e2e-ediel-approval-20260815

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic E2E fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          agt = Path('lib/ediel/testing/agtRuntime.ts')
          text = agt.read_text()
          old = """    .eq('company_id', companyId)\n    .eq('environment', 'test')\n    .eq('is_active', true)\n    .limit(2)"""
          new = """    .eq('company_id', companyId)\n    .eq('environment', 'test')\n    .eq('is_active', true)\n    .in('actor_role', ['supplier', 'electricity_supplier'])\n    .limit(2)"""
          if text.count(old) != 1:
              raise SystemExit(f'AGT supplier-selection anchor count={text.count(old)}')
          agt.write_text(text.replace(old, new, 1))

          ui = Path('components/admin/ediel/ActorTestingViews.tsx')
          text = ui.read_text()
          old = """                      <form action={saveActorTestResultAction} className=\"grid gap-3 rounded-2xl border border-slate-200 bg-white p-3\">\n                        <input type=\"hidden\" name=\"company_id\" value={summary.company.id} />\n                        <input type=\"hidden\" name=\"test_key\" value={testCase.key} />\n                        <input type=\"hidden\" name=\"ediel_test_run_id\" value={result?.ediel_test_run_id ?? ''} />\n                        <div className=\"grid gap-3 md:grid-cols-3\">\n                          <label className=\"grid gap-1 text-xs font-semibold text-slate-700\">\n                            Status\n                            <select name=\"status\" defaultValue={result?.status ?? 'passed'} className=\"rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm\">\n                              <option value=\"passed\">Godkänd</option>\n                              <option value=\"manual_verified\">Manuellt verifierad</option>\n                              <option value=\"failed\">Nekad</option>\n                              <option value=\"blocked\">Blockerad</option>\n                              <option value=\"running\">Pågår</option>\n                            </select>\n                          </label>\n                          <label className=\"grid gap-1 text-xs font-semibold text-slate-700 md:col-span-2\">\n                            Portalstatus / kommentar\n                            <input name=\"portal_status\" defaultValue={result?.portal_status ?? ''} className=\"rounded-xl border border-slate-300 px-3 py-2 text-sm\" placeholder=\"Ex. Godkänt i Edielportalen\" />\n                          </label>\n                        </div>\n                        <label className=\"grid gap-1 text-xs font-semibold text-slate-700\">\n                          Felorsak vid nekad/blockerad\n                          <input name=\"failure_reason\" defaultValue={result?.failure_reason ?? ''} className=\"rounded-xl border border-slate-300 px-3 py-2 text-sm\" placeholder=\"Ange felorsak om testet inte är godkänt\" />\n                        </label>\n                        <label className=\"grid gap-1 text-xs font-semibold text-slate-700\">\n                          Rå payload / bevisnotering\n                          <textarea name=\"raw_payload\" defaultValue={result?.raw_payload ?? ''} className=\"min-h-24 rounded-xl border border-slate-300 px-3 py-2 font-mono text-xs\" placeholder=\"Klistra in payload eller portalnotering vid behov\" />\n                        </label>\n                        <button className=\"w-fit rounded-xl bg-slate-950 px-3 py-2 text-xs font-semibold text-white hover:bg-slate-800\">Spara testresultat</button>\n                      </form>"""
          new = """                      {result?.status === 'passed' ? (\n                        <div className=\"rounded-2xl border border-emerald-200 bg-emerald-50 p-4 text-sm font-semibold text-emerald-900\">\n                          Godkänd av evidensmotorn. Statusen är skrivskyddad; starta eller synka en ny körning för ny maskinell verifiering.\n                        </div>\n                      ) : (\n                        <form action={saveActorTestResultAction} className=\"grid gap-3 rounded-2xl border border-slate-200 bg-white p-3\">\n                          <input type=\"hidden\" name=\"company_id\" value={summary.company.id} />\n                          <input type=\"hidden\" name=\"test_key\" value={testCase.key} />\n                          <input type=\"hidden\" name=\"ediel_test_run_id\" value={result?.ediel_test_run_id ?? ''} />\n                          <div className=\"grid gap-3 md:grid-cols-3\">\n                            <label className=\"grid gap-1 text-xs font-semibold text-slate-700\">\n                              Status\n                              <select name=\"status\" defaultValue={result?.status ?? 'manual_verified'} className=\"rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm\">\n                                <option value=\"manual_verified\">Manuellt verifierad</option>\n                                <option value=\"failed\">Nekad</option>\n                                <option value=\"blocked\">Blockerad</option>\n                                <option value=\"running\">Pågår</option>\n                              </select>\n                            </label>\n                            <label className=\"grid gap-1 text-xs font-semibold text-slate-700 md:col-span-2\">\n                              Portalstatus / kommentar\n                              <input name=\"portal_status\" defaultValue={result?.portal_status ?? ''} className=\"rounded-xl border border-slate-300 px-3 py-2 text-sm\" placeholder=\"Ex. Godkänt i Edielportalen\" />\n                            </label>\n                          </div>\n                          <label className=\"grid gap-1 text-xs font-semibold text-slate-700\">\n                            Felorsak vid nekad/blockerad\n                            <input name=\"failure_reason\" defaultValue={result?.failure_reason ?? ''} className=\"rounded-xl border border-slate-300 px-3 py-2 text-sm\" placeholder=\"Ange felorsak om testet inte är godkänt\" />\n                          </label>\n                          <label className=\"grid gap-1 text-xs font-semibold text-slate-700\">\n                            Rå payload / bevisnotering\n                            <textarea name=\"raw_payload\" defaultValue={result?.raw_payload ?? ''} className=\"min-h-24 rounded-xl border border-slate-300 px-3 py-2 font-mono text-xs\" placeholder=\"Klistra in payload eller portalnotering vid behov\" />\n                          </label>\n                          <button className=\"w-fit rounded-xl bg-slate-950 px-3 py-2 text-xs font-semibold text-white hover:bg-slate-800\">Spara testresultat</button>\n                        </form>\n                      )}"""
          if text.count(old) != 1:
              raise SystemExit(f'ActorTestingViews manual-result anchor count={text.count(old)}')
          ui.write_text(text.replace(old, new, 1))

          test = Path('__tests__/ediel-e2e-regressions.test.ts')
          test.write_text("""import { readFileSync } from 'node:fs'\nimport { describe, expect, it } from 'vitest'\n\nconst agtRuntime = readFileSync('lib/ediel/testing/agtRuntime.ts', 'utf8')\nconst actorUi = readFileSync('components/admin/ediel/ActorTestingViews.tsx', 'utf8')\nconst migration = readFileSync('supabase/migrations/20260815002945_fix_actor_profile_hash_and_authoritative_projection.sql', 'utf8')\n\ndescribe('Ediel E2E regression guards', () => {\n  it('selects only supplier identities for supplier AGT', () => {\n    expect(agtRuntime).toContain(\".in('actor_role', ['supplier', 'electricity_supplier'])\")\n    expect(agtRuntime).toContain('agt_active_test_actor_ambiguous')\n  })\n\n  it('does not offer machine-authoritative passed as a manual status', () => {\n    expect(actorUi).not.toContain('<option value=\"passed\">Godkänd</option>')\n    expect(actorUi).toContain('Godkänd av evidensmotorn. Statusen är skrivskyddad')\n    expect(actorUi).toContain(\"result?.status ?? 'manual_verified'\")\n  })\n\n  it('keeps request hashes atomic and running projections non-destructive', () => {\n    expect(migration).toContain(\"request_hash = v_hash\")\n    expect(migration).toContain(\"v_status='running'\")\n    expect(migration).toContain('EDIEL_TEST_PROJECTION_PRESERVED_AUTHORITATIVE')\n    expect(migration).toContain(\"v_authoritative.status in ('passed','manual_verified')\")\n  })\n})\n""")

          migration = Path('supabase/migrations/20260815002945_fix_actor_profile_hash_and_authoritative_projection.sql')
          digest = hashlib.sha256(migration.read_bytes()).hexdigest()
          manifest_path = Path('scripts/migration-history-manifest.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['files'][migration.name] = digest
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n')

          types_path = Path('scripts/supabase-types-manifest.json')
          types = json.loads(types_path.read_text())
          types['latest_migration'] = migration.name
          types_path.write_text(json.dumps(types, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Remove temporary workflow and commit patch
        run: |
          git rm .github/workflows/e2e-ediel-autopatch.yml
          git config user.name "gridex-e2e-bot"
          git config user.email "129280077+heke99@users.noreply.github.com"
          git add lib/ediel/testing/agtRuntime.ts components/admin/ediel/ActorTestingViews.tsx __tests__/ediel-e2e-regressions.test.ts scripts/migration-history-manifest.json scripts/supabase-types-manifest.json
          git commit -m "fix(ediel): repair E2E actor testing regressions"
          git push origin HEAD:fix/e2e-ediel-approval-20260815
