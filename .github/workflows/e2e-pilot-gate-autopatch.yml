name: E2E pilot gate autopatch

on:
  push:
    branches:
      - fix/e2e-ediel-approval-20260815

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply conditional pilot gate fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          evidence = Path('lib/ediel/certificationEvidence.ts')
          text = evidence.read_text()
          old = """export type EdielCertificationEvidenceSnapshot = {\n  records: EdielCertificationEvidenceRecord[]\n  verifiedAt: number\n}"""
          new = """export type EdielCertificationEvidenceSnapshot = {\n  records: EdielCertificationEvidenceRecord[]\n  verifiedAt: number\n  pilotRequired: boolean\n}"""
          if text.count(old) != 1: raise SystemExit('snapshot type anchor missing')
          text = text.replace(old, new, 1)

          old = """function timestamp(value: unknown): number | null {\n  const normalized = text(value)\n  if (!normalized) return null\n  const parsed = new Date(normalized).getTime()\n  return Number.isFinite(parsed) ? parsed : null\n}"""
          new = old + """\n\nasync function isLimitedPilotRequired(companyId: string): Promise<boolean> {\n  const { count, error } = await supabaseService\n    .from('ediel_messages')\n    .select('id', { count: 'exact', head: true })\n    .eq('company_id', companyId)\n    .eq('environment', 'production')\n    .eq('direction', 'outbound')\n    .eq('status', 'sent')\n  if (error) throw error\n  return (count ?? 0) > 0\n}\n\nfunction requiredProductionEvidence(pilotRequired: boolean) {\n  return pilotRequired\n    ? [...REQUIRED_PRODUCTION_EVIDENCE]\n    : REQUIRED_PRODUCTION_EVIDENCE.filter((type) => type !== 'LIMITED_PILOT')\n}"""
          if text.count(old) != 1: raise SystemExit('timestamp anchor missing')
          text = text.replace(old, new, 1)

          old = """export async function getEdielCertificationEvidenceSnapshot(\n  companyId: string,\n): Promise<EdielCertificationEvidenceSnapshot> {\n  const records = await listEdielCertificationEvidence(companyId)\n  return { records, verifiedAt: Date.now() }\n}"""
          new = """export async function getEdielCertificationEvidenceSnapshot(\n  companyId: string,\n): Promise<EdielCertificationEvidenceSnapshot> {\n  const normalizedCompanyId = text(companyId)\n  if (!normalizedCompanyId) throw new Error('certification_evidence_company_required')\n  const [records, pilotRequired] = await Promise.all([\n    listEdielCertificationEvidence(normalizedCompanyId),\n    isLimitedPilotRequired(normalizedCompanyId),\n  ])\n  return { records, verifiedAt: Date.now(), pilotRequired }\n}"""
          if text.count(old) != 1: raise SystemExit('snapshot function anchor missing')
          text = text.replace(old, new, 1)

          old = """  if (error) throw error\n  const now = Date.now()\n  const rows = (data ?? []) as EvidenceRow[]"""
          new = """  if (error) throw error\n  const pilotRequired = await isLimitedPilotRequired(normalizedCompanyId)\n  const now = Date.now()\n  const rows = (data ?? []) as EvidenceRow[]"""
          if text.count(old) != 1: raise SystemExit('readiness query anchor missing')
          text = text.replace(old, new, 1)

          old = """  const missing = REQUIRED_PRODUCTION_EVIDENCE.filter((type) => !passed.has(type))\n  return { ready: missing.length === 0, passed: [...passed], missing }"""
          new = """  const required = requiredProductionEvidence(pilotRequired)\n  const missing = required.filter((type) => !passed.has(type))\n  return { ready: missing.length === 0, passed: [...passed], missing, pilotRequired }"""
          if text.count(old) != 1: raise SystemExit('readiness missing anchor missing')
          text = text.replace(old, new, 1)

          old = """  if (input.status === 'passed') {\n    if (!approvedBy) throw new Error('certification_evidence_approver_required')"""
          new = """  if (input.status === 'passed') {\n    if (input.evidenceType === 'LIMITED_PILOT' && !(await isLimitedPilotRequired(companyId))) {\n      throw new Error('limited_pilot_requires_real_production_send')\n    }\n    if (!approvedBy) throw new Error('certification_evidence_approver_required')"""
          if text.count(old) != 1: raise SystemExit('record passed anchor missing')
          evidence.write_text(text.replace(old, new, 1))

          panel = Path('components/admin/go-live/CertificationEvidencePanel.tsx')
          text = panel.read_text()
          old = """  verifiedAt,\n}: {\n  companyId: string\n  records: EdielCertificationEvidenceRecord[]\n  verifiedAt: number\n}) {"""
          new = """  verifiedAt,\n  pilotRequired,\n}: {\n  companyId: string\n  records: EdielCertificationEvidenceRecord[]\n  verifiedAt: number\n  pilotRequired: boolean\n}) {"""
          if text.count(old) != 1: raise SystemExit('panel props anchor missing')
          text = text.replace(old, new, 1)
          old = """  const missingCount = REQUIRED_PRODUCTION_EVIDENCE.filter((type) => !approved.has(type)).length"""
          new = """  const requiredNow = pilotRequired\n    ? REQUIRED_PRODUCTION_EVIDENCE\n    : REQUIRED_PRODUCTION_EVIDENCE.filter((type) => type !== 'LIMITED_PILOT')\n  const missingCount = requiredNow.filter((type) => !approved.has(type)).length"""
          if text.count(old) != 1: raise SystemExit('panel missing count anchor missing')
          text = text.replace(old, new, 1)
          old = """            verkligt testdatum innan superadmin kan attestera det. Utgången eller\n            ofullständig evidens visas inte som godkänd."""
          new = """            verkligt testdatum innan superadmin kan attestera det. LIMITED_PILOT blir\n            obligatorisk först efter den första verkliga production-sändningen; därefter\n            stoppas fortsatt drift tills pilotutfallet är attesterat. Utgången eller\n            ofullständig evidens visas inte som godkänd."""
          if text.count(old) != 1: raise SystemExit('panel intro anchor missing')
          text = text.replace(old, new, 1)
          old = """        {REQUIRED_PRODUCTION_EVIDENCE.map((evidenceType) => {\n          const current = currentFor(records, evidenceType)\n          const isApproved = current ? isEdielCertificationEvidenceApproved(current, verifiedAt) : false\n          return ("""
          new = """        {REQUIRED_PRODUCTION_EVIDENCE.map((evidenceType) => {\n          const current = currentFor(records, evidenceType)\n          const isApproved = current ? isEdielCertificationEvidenceApproved(current, verifiedAt) : false\n          const isRequiredNow = evidenceType !== 'LIMITED_PILOT' || pilotRequired\n          return ("""
          if text.count(old) != 1: raise SystemExit('panel map anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace('              open={!isApproved}\n', '              open={isRequiredNow && !isApproved}\n', 1)
          old = """                    {isApproved ? 'Godkänd' : current ? 'Ej giltig' : 'Saknas'}"""
          new = """                    {isApproved ? 'Godkänd' : !isRequiredNow ? 'Efter första live-send' : current ? 'Ej giltig' : 'Saknas'}"""
          if text.count(old) != 1: raise SystemExit('panel badge anchor missing')
          text = text.replace(old, new, 1)
          old = """              <form action={saveCertificationEvidenceAction} className=\"mt-4 grid gap-3\">"""
          new = """              {isRequiredNow ? (\n              <form action={saveCertificationEvidenceAction} className=\"mt-4 grid gap-3\">"""
          if text.count(old) != 1: raise SystemExit('panel form open anchor missing')
          text = text.replace(old, new, 1)
          old = """                </button>\n              </form>"""
          new = """                </button>\n              </form>\n              ) : (\n                <div className=\"mt-4 rounded-xl border border-blue-200 bg-blue-50 p-3 text-xs font-semibold leading-5 text-blue-900\">\n                  Pilotbevis kan attesteras först efter att den första riktiga production-sändningen har skickats.\n                </div>\n              )}"""
          if text.count(old) != 1: raise SystemExit('panel form close anchor missing')
          panel.write_text(text.replace(old, new, 1))

          page = Path('app/admin/platform/go-live/[companyId]/page.tsx')
          text = page.read_text()
          old = """            records={certificationEvidence.records}\n            verifiedAt={certificationEvidence.verifiedAt}"""
          new = """            records={certificationEvidence.records}\n            verifiedAt={certificationEvidence.verifiedAt}\n            pilotRequired={certificationEvidence.pilotRequired}"""
          if text.count(old) != 1: raise SystemExit('go-live page evidence props anchor missing')
          page.write_text(text.replace(old, new, 1))

          test = Path('__tests__/ediel-e2e-regressions.test.ts')
          text = test.read_text()
          insert = """\n  it('treats limited pilot as a post-first-send stop-loss', () => {\n    const evidence = readFileSync('lib/ediel/certificationEvidence.ts', 'utf8')\n    const pilotMigration = readFileSync('supabase/migrations/20260815003554_conditional_limited_pilot_evidence_gate.sql', 'utf8')\n    const panel = readFileSync('components/admin/go-live/CertificationEvidencePanel.tsx', 'utf8')\n    expect(evidence).toContain('limited_pilot_requires_real_production_send')\n    expect(evidence).toContain(\"type !== 'LIMITED_PILOT'\")\n    expect(pilotMigration).toContain(\"m.status = 'sent'\")\n    expect(pilotMigration).toContain(\"select 'LIMITED_PILOT'\")\n    expect(panel).toContain('Efter första live-send')\n  })\n"""
          marker = "\n})\n"
          if text.count(marker) != 1: raise SystemExit('test close anchor missing')
          test.write_text(text.replace(marker, insert + marker, 1))

          migration = Path('supabase/migrations/20260815003554_conditional_limited_pilot_evidence_gate.sql')
          digest = hashlib.sha256(migration.read_bytes()).hexdigest()
          manifest_path = Path('scripts/migration-history-manifest.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['files'][migration.name] = digest
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n')
          types_path = Path('scripts/supabase-types-manifest.json')
          types = json.loads(types_path.read_text())
          types['latest_migration'] = migration.name
          types_path.write_text(json.dumps(types, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Remove temporary workflow and commit patch
        run: |
          git rm .github/workflows/e2e-pilot-gate-autopatch.yml
          git config user.name "gridex-e2e-bot"
          git config user.email "129280077+heke99@users.noreply.github.com"
          git add lib/ediel/certificationEvidence.ts components/admin/go-live/CertificationEvidencePanel.tsx app/admin/platform/go-live/'[companyId]'/page.tsx __tests__/ediel-e2e-regressions.test.ts scripts/migration-history-manifest.json scripts/supabase-types-manifest.json
          git commit -m "fix(ediel): make pilot evidence sequencing executable"
          git push origin HEAD:fix/e2e-ediel-approval-20260815
