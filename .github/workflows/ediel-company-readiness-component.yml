name: Ediel company readiness component

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/schema.sql'
      - 'scripts/ediel-company-readiness-sql-regression.mjs'
      - 'scripts/migration-history-manifest*.json'
      - 'lib/ediel/productionReadinessTestAuthority.ts'
      - '.github/workflows/ediel-company-readiness-component.yml'
  push:
    branches: [main, 'codex/shared-readiness-*']
    paths:
      - 'supabase/migrations/**'
      - 'supabase/schema.sql'
      - 'scripts/ediel-company-readiness-sql-regression.mjs'
      - 'scripts/migration-history-manifest*.json'
      - 'lib/ediel/productionReadinessTestAuthority.ts'
      - '.github/workflows/ediel-company-readiness-component.yml'

permissions:
  contents: read

jobs:
  optional-company-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Install isolated pinned PostgreSQL test tooling
        run: npm install --prefix "$RUNNER_TEMP/company-readiness-tooling" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
      - name: Verify migration checksums
        run: node scripts/check-migration-versions.cjs
      - name: Run actual SQL and readiness consumer regressions
        env:
          EDIEL_PGLITE_MODULE: ${{ runner.temp }}/company-readiness-tooling/node_modules/@electric-sql/pglite/dist/index.js
        run: node --experimental-strip-types scripts/ediel-company-readiness-sql-regression.mjs
