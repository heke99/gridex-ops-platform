          python3 "$CONTRL_HOME/evidence.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && env.CONTRL_HOME != ''
        with:
          name: contrl-native-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: ${{ env.CONTRL_HOME }}/safe/
          if-no-files-found: ignore
          retention-days: 14
