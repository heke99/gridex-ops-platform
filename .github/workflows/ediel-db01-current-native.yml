# dependencies/prospective public DTO hint + two forwards is reconstructed
# supplemental composition only. Original 42703 and AGT 23502 failures remain.
# Current canonical clean/capture/upgrade and all ordinary OPS gates remain.
jobs:
  db01-historical-upgrade-native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Execute BASE56 clean, repaired historical births and fresh current owners
        shell: bash
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
