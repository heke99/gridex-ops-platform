          import hashlib,json,os,pathlib,re,subprocess,sys,urllib.request,urllib.error,time
          root=pathlib.Path(os.environ['CURRENT_ROOT']); receipt_path=pathlib.Path(os.environ['GRIDEX_DB01_NATIVE_RECEIPT'])
          receipt=json.loads(receipt_path.read_text()); private=receipt_path.parent.parent
          url='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          sha=lambda value:hashlib.sha256(value.encode()).hexdigest()
          def sql(query):
              return subprocess.check_output(['psql',url,'-X','-At','-v','ON_ERROR_STOP=1','-c',query],text=True).strip()
          def fail(reason): raise RuntimeError(reason)
          def blocks(source):
              source=source.split('\n--\n-- PostgreSQL database dump complete\n--',1)[0]
              pattern=re.compile(r'^-- Name: (.*?); Type: (.*?); Schema: (.*?); Owner: (.*?)\n--\n',re.M)
              headers=list(pattern.finditer(source)); result={}
              for index,header in enumerate(headers):
                  body=source[header.end():headers[index+1].start() if index+1<len(headers) else len(source)]
                  # Dump framing is not an object definition. Function bodies, policies,
                  # ACL statements and every constraint/trigger byte remain significant.
                  body=re.sub(r'^SET default_(?:tablespace|table_access_method) = .*?;\n','',body,flags=re.M)
                  body=re.sub(r'^\\(?:un)?restrict \S+\n','',body,flags=re.M)
                  body=re.sub(r'^-- PostgreSQL database dump complete\n','',body,flags=re.M)
                  body=body.strip().removesuffix('--').strip()
                  key=(header[3],header[2],header[1])
                  if key in result:
                      if key[1]!='DEFAULT ACL':fail('duplicate object identity: '+repr(key))
                      result[key]+='\n-- distinct default ACL issuer --\n'+body
                  else:result[key]=body
              if not result:fail('empty catalog object source')
