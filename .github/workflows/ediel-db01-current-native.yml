            test ! -f "$DB01_PRIVATE/evidence/historical-native.log"
            test ! -f "$DB01_PRIVATE/evidence/current-native.log"
            python3 scripts/gridex-redact-native-evidence.py --root "$DB01_PRIVATE/evidence"
