name: Ediel F G composition native feedback

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ediel-at-z06f-supplier-acceptance-native.test.ts'
      - 'scripts/ediel-at-z06g-supplier-acceptance-native.test.ts'
      - 'scripts/ediel-at-z09fg-supplier-composition-native.config.ts'
      - 'scripts/ediel-at-z09fg-supplier-composition-native.test.ts'
      - 'scripts/ediel-source-owner-native.config.ts'
      - 'scripts/ediel-at-z06fg-supplier-acceptance-native.config.ts'
      - 'scripts/helpers/ediel-z06f-reading-followup-native-fixture.ts'
      - 'scripts/helpers/ediel-z09fg-composition-inputs-native-producer.ts'
      - 'scripts/ediel-z09fg-composition-producer-native.config.ts'
