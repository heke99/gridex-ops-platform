name: Ediel PRODAT held-response native proof

on:
  pull_request:
    paths:
      - 'scripts/ediel-prodat-response-hold-native*'
      - 'scripts/helpers/ediel-requested-change-native-fixture.ts'
      - 'scripts/helpers/ediel-normal-switch-native-fixture.ts'
      - 'scripts/helpers/ediel-bilateral-customer-native-fixture.ts'
      - 'scripts/helpers/originalMailboxNative.ts'
      - 'scripts/ediel-source-owner-native.config.ts'
      - 'scripts/helpers/ediel-native-permission-catalog.setup.ts'
      - 'scripts/gridex-aud-003-clean-replay.sh'
      - 'scripts/gridex-redact-native-evidence.py'
      - 'scripts/migration-history-manifest*.json'
      - '__tests__/fixtures/prodat-register.ts'
      - 'lib/ediel/**'
      - 'lib/inbound-mail/**'
      - 'supabase/migrations/**'
      - '.github/workflows/ediel-prodat-response-hold-native.yml'

permissions:
  contents: read

concurrency:
  group: ediel-prodat-response-hold-native-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Supplemental feedback only. All ordinary OPS clean/upgrade/native/browser
# and parity gates remain mandatory; this does not approve any rule card.
jobs:
  prodat-response-hold-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Execute the actual held-source recording proof after disposable clean replay
        shell: bash
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: |
          set -euo pipefail
          mkdir -p prodat-response-hold-native-working
          # The existing owner keeps its EXIT cleanup trap. Replay/status
          # output can contain disposable credentials and is never uploaded.
          # Replay temporarily replaces migrations with historical markers.
          # Verify the actual original input before replay; hash HEAD at receipt.
          python3 - <<'PY'
          import pathlib, subprocess
          path = 'supabase/migrations/20261001040236_ediel_prodat_combined_primary_v6_facets.sql'
          assert pathlib.Path(path).read_bytes() == subprocess.check_output(['git', 'show', 'HEAD:' + path])
          PY
          source scripts/gridex-aud-003-clean-replay.sh > "$RUNNER_TEMP/prodat-response-hold-replay.log" 2>&1
          export GRIDEX_NATIVE_STATUS="$RUNNER_TEMP/prodat-response-hold-native-status.json"
          supabase status -o json > "$GRIDEX_NATIVE_STATUS"
          native_tests=(scripts/ediel-prodat-response-hold-native.test.ts)
          export PRODAT_RESPONSE_HOLD_NATIVE_TEST_SCOPE
          PRODAT_RESPONSE_HOLD_NATIVE_TEST_SCOPE="$(printf '%s\n' "${native_tests[@]}")"
          native_exit=0
          GRIDEX_NATIVE_STATUS="$GRIDEX_NATIVE_STATUS" npx vitest run \
            --config scripts/ediel-prodat-response-hold-native.config.ts \
            "${native_tests[@]}" \
            --reporter=default --reporter=junit \
            --outputFile=prodat-response-hold-native-working/native-junit.xml \
            > prodat-response-hold-native-working/native.log 2>&1 || native_exit=$?
          export PRODAT_RESPONSE_HOLD_NATIVE_EXIT="$native_exit"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          test_scope = os.environ['PRODAT_RESPONSE_HOLD_NATIVE_TEST_SCOPE'].splitlines()
          paths = test_scope + ['.github/workflows/ediel-prodat-response-hold-native.yml',
                   'scripts/ediel-prodat-response-hold-native.config.ts',
                   'scripts/ediel-source-owner-native.config.ts',
                   'scripts/helpers/ediel-requested-change-native-fixture.ts',
                   'scripts/helpers/ediel-normal-switch-native-fixture.ts',
                   'scripts/helpers/ediel-bilateral-customer-native-fixture.ts',
                   'scripts/helpers/originalMailboxNative.ts',
                   'scripts/helpers/ediel-native-permission-catalog.setup.ts',
                   '__tests__/fixtures/prodat-register.ts',
                   'scripts/gridex-redact-native-evidence.py',
                   'scripts/gridex-aud-003-clean-replay.sh',
                   'lib/inbound-mail/inboundStatusUpdater.ts',
                   'lib/inbound-mail/inboundMatcher.ts',
                   'lib/inbound-mail/inboundTenantResolver.ts',
                   'lib/ediel/flows/inboundProcessing.ts',
                   'lib/ediel/sources/receivedSourceOwnerSession.ts',
                   'lib/ediel/sources/sourceOwnerPersistence.ts',
                   'lib/ediel/core/sourceRulePackEvidence.ts',
                   'lib/ediel/ack/sourceCorrelation.ts',
                   'lib/ediel/core/edifactValidation.ts',
                   'lib/ediel/mailReadiness.ts',
                   'lib/ediel/core/receivedSourceValidationEvidence.ts',
                   'lib/ediel/core/receivedSourceValidationLedger.ts',
                   'lib/ediel/core/receivedProdatResponseValidation.ts',
                   'lib/ediel/prodat/prodatApplicationObjectValidation.ts',
                   'lib/ediel/core/receivedRegisterValidationBinding.ts',
                   'supabase/migrations/20261001040236_ediel_prodat_combined_primary_v6_facets.sql',
                   'lib/ediel/sources/reviewReceivedStructuralSource.ts',
                   'lib/ediel/sources/structuralSourceReadset.ts',
                   'lib/ediel/inboundCases.ts',
                   'lib/ediel/core/receivedProdatFinalResponsePlan.ts',
                   'lib/ediel/ack/committedInboundAck.ts',
                   'scripts/migration-history-manifest.json',
                   'scripts/migration-history-manifest.additions.json',
                   'scripts/migration-history-manifest.runtime.additions.json']
          receipt = {
              'purpose': 'bounded_actual_held_source_recording_not_whole_acceptance',
              'checkout_sha': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'checkout_tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'native_exit_code': int(os.environ['PRODAT_RESPONSE_HOLD_NATIVE_EXIT']),
              'input_sha256': {p: hashlib.sha256(subprocess.check_output(['git','show','HEAD:'+p])
                  if p.startswith('supabase/migrations/') else pathlib.Path(p).read_bytes()).hexdigest() for p in paths},
              'migration_hash_origin': 'HEAD original bytes verified before canonical replay temporarily replaces migration files',
              'test_scope': test_scope,
              'ordinary_required_gates': 'NOT_REPLACED',
              'schema_capture': 'NOT_RUN', 'browser_tests': 'NOT_RUN',
              'upgrade_parity': 'NOT_RUN', 'authentic_market_evidence': 'NOT_PROVIDED',
          }
          pathlib.Path('prodat-response-hold-native-working/receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          python3 scripts/gridex-redact-native-evidence.py \
            --local-secrets "$GRIDEX_NATIVE_STATUS" --root prodat-response-hold-native-working
          # Only successfully redacted files enter the uploaded directory.
          # Receipt/redaction failure leaves no artifact directory to upload.
          mv prodat-response-hold-native-working prodat-response-hold-native-evidence
          cat prodat-response-hold-native-evidence/native.log
          rm -f "$GRIDEX_NATIVE_STATUS"
          exit "$native_exit"
      - name: Upload redacted native feedback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ediel-prodat-response-hold-native-${{ github.event.pull_request.head.sha }}
          path: prodat-response-hold-native-evidence/
          if-no-files-found: warn
          retention-days: 14
