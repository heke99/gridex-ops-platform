name: Ediel SC003 SC005 native feedback

on:
  pull_request:
    paths:
      - '__tests__/ediel-sc-003-provider-legal-dgi.test.ts'
      - '__tests__/ediel-sc-005-shared-dgi-projections.test.ts'
      - 'scripts/ediel-sc-003-005-service-native.test.ts'
      - 'scripts/ediel-ten-09-service-coordination-native.test.ts'
      - 'scripts/ediel-ten-09-service-native.config.ts'
      - 'scripts/fixtures/ediel-service-evidence-native.ts'
      - 'scripts/helpers/utiltsConsumptionParties.ts'
      - 'scripts/ediel-source-owner-native.config.ts'
      - 'scripts/gridex-aud-003-clean-replay.sh'
      - 'scripts/migration-history-manifest*.json'
      - 'lib/ediel/services/**'
      - 'lib/ediel/utilts/**'
      - 'lib/ediel/flows/prodatServicePermission.ts'
      - 'supabase/migrations/**'
      - '.github/workflows/ediel-sc003-sc005-native.yml'

permissions:
  contents: read

concurrency:
  group: ediel-sc003-sc005-native-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Supplemental feedback only. All ordinary OPS clean/upgrade/native/browser
# and parity gates remain mandatory; this does not approve any rule card.
jobs:
  sc003-sc005-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Execute the actual service owners after disposable clean replay
        shell: bash
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: |
          set -euo pipefail
          mkdir -p sc003-sc005-native-working
          # The existing owner keeps its EXIT cleanup trap. Replay/status
          # output can contain disposable credentials and is never uploaded.
          source scripts/gridex-aud-003-clean-replay.sh > "$RUNNER_TEMP/sc003-sc005-replay.log" 2>&1
          export GRIDEX_NATIVE_STATUS="$RUNNER_TEMP/sc003-sc005-native-status.json"
          supabase status -o json > "$GRIDEX_NATIVE_STATUS"
          native_tests=(scripts/ediel-sc-003-005-service-native.test.ts scripts/ediel-ten-09-service-coordination-native.test.ts)
          export SC003_SC005_NATIVE_TEST_SCOPE
          SC003_SC005_NATIVE_TEST_SCOPE="$(printf '%s\n' "${native_tests[@]}")"
          native_exit=0
          GRIDEX_NATIVE_STATUS="$GRIDEX_NATIVE_STATUS" npx vitest run \
            --config scripts/ediel-ten-09-service-native.config.ts \
            "${native_tests[@]}" \
            --reporter=default --reporter=junit \
            --outputFile=sc003-sc005-native-working/native-junit.xml \
            > sc003-sc005-native-working/native.log 2>&1 || native_exit=$?
          export SC003_SC005_NATIVE_EXIT="$native_exit"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          test_scope = os.environ['SC003_SC005_NATIVE_TEST_SCOPE'].splitlines()
          paths = test_scope + ['.github/workflows/ediel-sc003-sc005-native.yml',
                   'scripts/fixtures/ediel-service-evidence-native.ts',
                   'scripts/ediel-ten-09-service-native.config.ts',
                   'scripts/helpers/utiltsConsumptionParties.ts',
                   'scripts/helpers/ediel-native-permission-catalog.setup.ts',
                   'scripts/gridex-redact-native-evidence.py',
                   'scripts/ediel-source-owner-native.config.ts',
                   'scripts/gridex-aud-003-clean-replay.sh',
                   'lib/ediel/services/administration.ts',
                   'lib/ediel/services/projection.ts',
                   'lib/ediel/flows/prodatServicePermission.ts',
                   'lib/ediel/utilts/transactionPersistence.ts',
                   'scripts/migration-history-manifest.json',
                   'scripts/migration-history-manifest.additions.json',
                   'scripts/migration-history-manifest.runtime.additions.json']
          receipt = {
              'purpose': 'supplemental_actual_native_feedback',
              'checkout_sha': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'checkout_tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'native_exit_code': int(os.environ['SC003_SC005_NATIVE_EXIT']),
              'input_sha256': {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths},
              'test_scope': test_scope,
              'ordinary_required_gates': 'NOT_REPLACED',
              'schema_capture': 'NOT_RUN', 'browser_tests': 'NOT_RUN',
              'upgrade_parity': 'NOT_RUN', 'authentic_market_evidence': 'NOT_PROVIDED',
          }
          pathlib.Path('sc003-sc005-native-working/receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          python3 scripts/gridex-redact-native-evidence.py \
            --local-secrets "$GRIDEX_NATIVE_STATUS" --root sc003-sc005-native-working
          # Only successfully redacted files enter the uploaded directory.
          # Receipt/redaction failure leaves no artifact directory to upload.
          mv sc003-sc005-native-working sc003-sc005-native-evidence
          cat sc003-sc005-native-evidence/native.log
          rm -f "$GRIDEX_NATIVE_STATUS"
          exit "$native_exit"
      - name: Upload redacted native feedback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ediel-sc003-sc005-native-${{ github.event.pull_request.head.sha }}
          path: sc003-sc005-native-evidence/
          if-no-files-found: warn
          retention-days: 14
