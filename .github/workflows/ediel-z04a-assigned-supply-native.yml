name: Ediel Z04 A and D native feedback

on:
  pull_request:
    paths:
      - 'scripts/ediel-at-z04a-assigned-supply-native.test.ts'
      - 'scripts/ediel-at-z04a-assigned-supply-native.config.ts'
      - 'scripts/ediel-at-z04d-production-native.test.ts'
      - 'scripts/helpers/ediel-z04d-production-native-fixture.ts'
      - 'scripts/helpers/ediel-regulated-supply-ground-native-fixture.ts'
      - 'scripts/helpers/ediel-normal-switch-native-fixture.ts'
      - 'scripts/helpers/originalMailboxNative.ts'
      - 'scripts/ediel-source-owner-native.config.ts'
      - 'scripts/gridex-aud-003-clean-replay.sh'
      - 'scripts/migration-history-manifest*.json'
      - 'lib/inbound-mail/inboundStatusUpdater.ts'
      - 'lib/inbound-mail/assignedSupplyBirthProfile.ts'
      - '__tests__/ediel-assigned-supply-birth-profile.test.ts'
      - 'lib/ediel/production/regulatedSupplyGroundIntake.ts'
      - 'lib/ediel/core/kernel.ts'
      - 'lib/ediel/core/messagePolicy.ts'
      - 'lib/ediel/core/prodatBilateralSourceCapability.ts'
      - 'lib/ediel/core/prodatSourceRegisterReadingDeclarations.ts'
      - 'lib/ediel/rulebook/canonicalRulePackRegistry.ts'
      - '__tests__/ediel-kernel-prodat-direction-before-fields.test.ts'
      - 'lib/ediel/flows/inboundProcessing.ts'
      - 'lib/ediel/flows/supplyMarketTransition.ts'
      - 'supabase/migrations/**'
      - 'lib/**'
      - 'types/**'
      - 'supabase/**'
      - 'scripts/**'
      - '__tests__/helpers/**'
      - '__tests__/fixtures/**'
      - 'docs/ediel/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - '*.config.*'
      - '.nvmrc'
      - '.npmrc'
      - '.github/workflows/ediel-z04a-assigned-supply-native.yml'

permissions:
  contents: read

concurrency:
  group: ediel-z04a-assigned-supply-native-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Supplemental feedback only. All ordinary OPS clean/upgrade/native/browser
# and parity gates remain mandatory; this does not approve any rule card.
jobs:
  z04a-assigned-supply-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Execute the actual assigned and production supply owners after disposable clean replay
        shell: bash
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: |
          set -euo pipefail
          mkdir -p z04a-assigned-supply-native-working
          native_tests=(scripts/ediel-at-z04a-assigned-supply-native.test.ts scripts/ediel-at-z04d-production-native.test.ts)
          export Z04A_ASSIGNED_SUPPLY_NATIVE_TEST_SCOPE
          Z04A_ASSIGNED_SUPPLY_NATIVE_TEST_SCOPE="$(printf '%s\n' "${native_tests[@]}")"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          test_scope = os.environ['Z04A_ASSIGNED_SUPPLY_NATIVE_TEST_SCOPE'].splitlines()
          paths = test_scope + ['.github/workflows/ediel-z04a-assigned-supply-native.yml', 'scripts/ediel-at-z04a-assigned-supply-native.config.ts', 'scripts/helpers/ediel-regulated-supply-ground-native-fixture.ts', 'scripts/helpers/ediel-normal-switch-native-fixture.ts', 'scripts/helpers/originalMailboxNative.ts', '__tests__/helpers/prodatGuideOrderedFixture.ts', '__tests__/fixtures/prodat-register.ts', 'scripts/helpers/ediel-native-permission-catalog.setup.ts', 'scripts/gridex-redact-native-evidence.py', 'scripts/ediel-source-owner-native.config.ts', 'scripts/gridex-aud-003-clean-replay.sh', 'lib/inbound-mail/inboundStatusUpdater.ts',
              'scripts/helpers/ediel-z04d-production-native-fixture.ts', '__tests__/helpers/sourceOwnerFixtures.ts', 'lib/ediel/core/messagePolicy.ts',
              'lib/ediel/core/prodatBilateralSourceCapability.ts', 'lib/ediel/core/prodatSourceRegisterReadingDeclarations.ts',
              '__tests__/ediel-prodat-bilateral-source-capability.test.ts', '__tests__/ediel-prodat-source-register-reading-declarations.test.ts',
              'lib/ediel/prodat/prodatRegisterReadings.ts', 'lib/ediel/prodat/prodatRegisterGroups.ts', 'lib/ediel/rulebook/guideRegistry.ts', 'lib/ediel/core/canonicalMessage.ts',
              'lib/customer-contracts/agreementPdf.ts', 'lib/customer-contracts/documents.ts', 'lib/ediel/testing/invoiceTestContractLifecycle.ts',
              'lib/ediel/core/sourceRulePackEvidence.ts', 'lib/ediel/sources/receivedSourceOwnerSession.ts', 'lib/ediel/flows/inboundBusinessStateMachine.ts',
              'lib/ediel/rulebook/canonicalRulePackRegistry.ts', '__tests__/ediel-kernel-prodat-direction-before-fields.test.ts',
              'supabase/schema.sql', 'docs/ediel/masterplan-v2/annex/source_tables.json',
              'supabase/migrations/20260716183000_contract_canonical_finalization.sql', 'supabase/migrations/20260727030000_contract_operation_readiness_completion.sql',
              'supabase/migrations/20260727040000_contract_security_energy_direction_api_completion.sql', 'supabase/migrations/20260727160000_contract_valid_to_active_rpc_repair.sql',
              'supabase/migrations/20260731152000_public_contract_publication_graph_repair.sql',
              'supabase/migrations/20260930174333_ediel_production_contract_source_commands.sql',
              'lib/inbound-mail/assignedSupplyBirthProfile.ts', '__tests__/ediel-assigned-supply-birth-profile.test.ts', 'lib/ediel/production/regulatedSupplyGroundIntake.ts', 'lib/ediel/core/runtimeDecision.ts', 'lib/ediel/core/kernel.ts', 'lib/ediel/core/outboundExecutionContext.ts', 'lib/ediel/core/actorRegistry.ts', 'lib/ediel/rulebook/validator.ts', 'lib/ediel/rulebook/validatorLegacy.ts', 'lib/ediel/core/receivedSourceValidationEvidence.ts', 'lib/ediel/core/receivedSourceValidationLedger.ts', 'lib/ediel/core/receivedRegisterValidationBinding.ts', 'lib/ediel/core/receivedProdatResponseValidation.ts', 'lib/ediel/prodat/prodatDependentConditionEngine.ts', 'lib/ediel/prodat/prodatDiagnosticProjection.ts', 'supabase/migrations/20260930234111_ediel_prodat_canonical_response_facets.sql', 'lib/ediel/flows/inboundProcessing.ts', 'lib/ediel/flows/supplyMarketTransition.ts', 'supabase/migrations/20261001004331_ediel_regulated_supply_ground_archive_review.sql', 'docs/ediel/masterplan-v2/registers/acceptance_tests.json', 'scripts/migration-history-manifest.json', 'scripts/migration-history-manifest.additions.json', 'scripts/migration-history-manifest.runtime.additions.json']
          # Bind the complete tracked checkout before replay mutates SQL.
          # This is repository source identity, not a claim every blob ran.
          checkout_sha = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          checkout_tree = subprocess.check_output(['git','rev-parse',checkout_sha+'^{tree}'],text=True).strip()
          entries = subprocess.check_output(['git','ls-tree','-r','-z','--full-tree',checkout_sha]).split(b'\0')
          source_blobs = {}
          for entry in filter(None, entries):
              metadata, name = entry.split(b'\t', 1)
              mode, kind, oid = metadata.decode('ascii').split()
              path = name.decode('utf-8')
              if kind != 'blob' or mode not in {'100644', '100755'}:
                  raise RuntimeError('unsupported tracked source entry: '+path)
              if path in source_blobs:
                  raise RuntimeError('duplicate tracked source path: '+path)
              source_blobs[path] = {'mode': mode, 'git_blob_oid': oid}
          if len(paths) != len(set(paths)) or not set(paths).issubset(source_blobs):
              raise RuntimeError('required native inputs are duplicate or missing from checkout')
          input_hashes = {}
          with subprocess.Popen(['git','cat-file','--batch'], stdin=subprocess.PIPE, stdout=subprocess.PIPE) as blobs:
              for path in sorted(source_blobs):
                  expected_oid = source_blobs[path]['git_blob_oid']
                  blobs.stdin.write((expected_oid+'\n').encode('ascii'))
                  blobs.stdin.flush()
                  oid, kind, size = blobs.stdout.readline().decode('ascii').strip().split()
                  if oid != expected_oid or kind != 'blob':
                      raise RuntimeError('unexpected source blob identity: '+path)
                  content = blobs.stdout.read(int(size))
                  if len(content) != int(size) or blobs.stdout.read(1) != b'\n':
                      raise RuntimeError('incomplete source blob: '+path)
                  input_hashes[path] = hashlib.sha256(content).hexdigest()
              blobs.stdin.close()
              if blobs.wait() != 0:
                  raise RuntimeError('Git source blob reader failed')
          receipt = {
              'purpose': 'supplemental_actual_native_feedback',
              'checkout_sha': checkout_sha,
              'checkout_tree': checkout_tree,
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'native_exit_code': None,
              # Replay temporarily substitutes SQL ledger markers until its
              # EXIT trap. Hash original checked-out inputs, not those markers.
              'input_authority': 'git_HEAD_source_before_replay_substitution',
              'input_inventory_scope': 'complete_tracked_repository_source_identity',
              'required_input_paths': sorted(paths),
              'source_blobs': {p: source_blobs[p] for p in sorted(source_blobs)},
              'input_sha256': input_hashes,
              'tool_versions': {'python': sys.version.split()[0],
                  'git': subprocess.check_output(['git','--version'],text=True).strip(),
                  'node': subprocess.check_output(['node','--version'],text=True).strip(),
                  'supabase': subprocess.check_output(['supabase','--version'],text=True).strip()},
              'test_scope': test_scope,
              'ordinary_required_gates': 'NOT_REPLACED',
              'schema_capture': 'NOT_RUN', 'browser_tests': 'NOT_RUN',
              'upgrade_parity': 'NOT_RUN', 'authentic_market_evidence': 'NOT_PROVIDED',
          }
          pathlib.Path('z04a-assigned-supply-native-working/receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          # The existing owner keeps its EXIT cleanup trap. Replay/status
          # output can contain disposable credentials and is never uploaded.
          source scripts/gridex-aud-003-clean-replay.sh > "$RUNNER_TEMP/z04a-assigned-supply-replay.log" 2>&1
          export GRIDEX_NATIVE_STATUS="$RUNNER_TEMP/z04a-assigned-supply-native-status.json"
          supabase status -o json > "$GRIDEX_NATIVE_STATUS"
          native_exit=0
          GRIDEX_NATIVE_STATUS="$GRIDEX_NATIVE_STATUS" npx vitest run \
            --config scripts/ediel-at-z04a-assigned-supply-native.config.ts \
            "${native_tests[@]}" \
            --reporter=default --reporter=junit \
            --outputFile=z04a-assigned-supply-native-working/native-junit.xml \
            > z04a-assigned-supply-native-working/native.log 2>&1 || native_exit=$?
          export Z04A_ASSIGNED_SUPPLY_NATIVE_EXIT="$native_exit"
          python3 - <<'PY'
          import json, os, pathlib
          receipt_path = pathlib.Path('z04a-assigned-supply-native-working/receipt.json')
          receipt = json.loads(receipt_path.read_text())
          receipt['native_exit_code'] = int(os.environ['Z04A_ASSIGNED_SUPPLY_NATIVE_EXIT'])
          receipt_path.write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          python3 scripts/gridex-redact-native-evidence.py \
            --local-secrets "$GRIDEX_NATIVE_STATUS" --root z04a-assigned-supply-native-working
          # Only successfully redacted files enter the uploaded directory.
          # Receipt/redaction failure leaves no artifact directory to upload.
          mv z04a-assigned-supply-native-working z04a-assigned-supply-native-evidence
          cat z04a-assigned-supply-native-evidence/native.log
          rm -f "$GRIDEX_NATIVE_STATUS"
          exit "$native_exit"
      - name: Upload redacted native feedback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ediel-z04a-assigned-supply-native-${{ github.event.pull_request.head.sha }}
          path: z04a-assigned-supply-native-evidence/
          if-no-files-found: warn
          retention-days: 14
