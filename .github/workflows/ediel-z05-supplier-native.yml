name: Ediel Z05 supplier native feedback

on:
  pull_request:
    paths:
      - 'scripts/ediel-at-z05-supplier-native.test.ts'
      - 'scripts/ediel-z05-supplier-native.config.ts'
      - 'scripts/ediel-bilateral-prodat-h-original-native.test.ts'
      - 'scripts/helpers/ediel-bilateral-lk-native-fixture.ts'
      - 'scripts/helpers/ediel-national-end-native-fixture.ts'
      - 'scripts/ediel-at-z08lk-supplier-native.test.ts'
      - 'lib/ediel/flows/prodatBilateralClosure.ts'
      - 'lib/ediel/flows/inboundProcessing.ts'
      - 'lib/ediel/production/bilateralProdatClosureOperation.ts'
      - 'lib/**'
      - 'types/**'
      - 'supabase/**'
      - 'scripts/helpers/**'
      - 'scripts/lib/**'
      - 'scripts/sql/**'
      - 'scripts/**'
      - 'e2e/production/helpers/swedish-organization-number.mjs'
      - 'scripts/gridex-aud-003-clean-replay.sh'
      - 'scripts/gridex-redact-native-evidence.py'
      - 'scripts/migration-history-manifest*.json'
      - '__tests__/fixtures/**'
      - '__tests__/helpers/**'
      - '__tests__/ediel-at-z05l-z05lk-supplier-profile.test.ts'
      - 'docs/ediel/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.github/workflows/ediel-z05-supplier-native.yml'

permissions:
  contents: read

concurrency:
  group: ediel-z05-supplier-native-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Supplemental feedback only. All ordinary OPS clean/upgrade/native/browser
# and parity gates remain mandatory; this does not approve any rule card.
jobs:
  z05-supplier-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1 (branch snapshot)
        with:
          version: 2.101.0
      - name: Execute the actual Z05 supplier chain after disposable clean replay
        id: z05_native
        shell: bash
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: |
          set -euo pipefail
          printf '%s\n' 'Z05 phase: prepare-checkout-pins'
          mkdir -p z05-supplier-native-working
          # Pin immutable checkout inputs before the canonical replay temporarily
          # moves original migration files. No credentials exist in this receipt.
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          paths = ['scripts/ediel-at-z05-supplier-native.test.ts',
                   'scripts/ediel-z05-supplier-native.config.ts',
                   '.github/workflows/ediel-z05-supplier-native.yml',
                   'scripts/gridex-redact-native-evidence.py',
                   'scripts/ediel-source-owner-native.config.ts',
                   'scripts/ediel-bilateral-prodat-h-original-native.test.ts',
                   'scripts/helpers/ediel-bilateral-lk-native-fixture.ts',
                   'scripts/helpers/ediel-national-end-native-fixture.ts',
                   'scripts/ediel-at-z08lk-supplier-native.test.ts',
                   '__tests__/ediel-at-z05l-z05lk-supplier-profile.test.ts',
                   'supabase/migrations/20261001115000_ediel_national_supply_rescission_atomic_original_and_matched_end.sql',
                   'supabase/migrations/20261001085523_ediel_bilateral_prodat_closure_operation_and_matched_end.sql',
                   'lib/ediel/flows/inboundBusinessStateMachineLegacy.ts',
                   'lib/ediel/core/ackPreflight.ts',
                   'lib/ediel/tenant/resolveInboundTenant.ts',
                   'lib/ediel/core/tenantResolver.ts',
                   'scripts/sql/tenant-isolation-invariants.sql',
                   'supabase/migrations/20261005043923_ediel_unattributed_technical_intake.sql',
                   'lib/ediel/rulebook/prodatInvoiceePolicy.ts',
                   'scripts/helpers/nationalRescissionNative.ts',
                   'lib/ediel/flows/prodatBilateralClosure.ts',
                   'lib/ediel/flows/inboundProcessing.ts',
                   'lib/ediel/production/bilateralProdatClosureOperation.ts',
                   'scripts/helpers/ediel-normal-switch-native-fixture.ts',
                   'scripts/helpers/ediel-native-permission-catalog.setup.ts',
                   'lib/ediel/outbox/sendOutboxItem.ts',
                   'lib/ediel/outbox/routeContract.ts',
                   'lib/tenant/operationPolicy.ts',
                   'scripts/gridex-aud-003-clean-replay.sh',
                   'scripts/migration-history-manifest.json',
                   'scripts/migration-history-manifest.additions.json',
                   'scripts/migration-history-manifest.runtime.additions.json']
          # Preserve every declared historical input as a required subset, then
          # capture the complete tracked checkout, including transitive imports,
          # replay SQL, shared helpers, manifests and runtime configuration.
          required_paths = paths
          tracked_paths = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          paths = sorted(set(p for p in tracked_paths if p))
          assert set(required_paths).issubset(paths)
          input_hashes = {}
          for p in paths:
              original = subprocess.check_output(['git','show','HEAD:'+p])
              checkout = os.readlink(p).encode() if pathlib.Path(p).is_symlink() else pathlib.Path(p).read_bytes()
              assert checkout == original, 'modified checkout input: '+p
              input_hashes[p] = hashlib.sha256(original).hexdigest()
          receipt = {
              'purpose': 'supplemental_actual_native_feedback',
              'checkout_sha': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'checkout_tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'input_scope': 'ALL_TRACKED_CHECKOUT_INPUTS_BEFORE_REPLAY',
              'required_input_paths': required_paths,
              'input_sha256': input_hashes,
              'test_scope': ['scripts/ediel-bilateral-prodat-h-original-native.test.ts',
                             'scripts/ediel-at-z08lk-supplier-native.test.ts',
                             'scripts/ediel-at-z05-supplier-native.test.ts'],
              'ordinary_required_gates': 'NOT_REPLACED',
              'schema_capture': 'NOT_RUN', 'browser_tests': 'NOT_RUN',
              'upgrade_parity': 'NOT_RUN', 'authentic_market_evidence': 'NOT_PROVIDED',
          }
          pathlib.Path(os.environ['RUNNER_TEMP'],'z05-supplier-input-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          # The existing owner keeps its EXIT cleanup trap. Replay/status
          # output can contain disposable credentials and is never uploaded.
          printf '%s\n' 'Z05 phase: clean-replay'
          export GRIDEX_CAPTURE_ERROR_BOUNDARY=1
          source scripts/gridex-aud-003-clean-replay.sh > "$RUNNER_TEMP/z05-supplier-replay.log" 2>&1
          unset GRIDEX_CAPTURE_ERROR_BOUNDARY
          trap - ERR
          set +E
          printf '%s\n' 'Z05 phase: read-disposable-status'
          export GRIDEX_NATIVE_STATUS="$RUNNER_TEMP/z05-supplier-native-status.json"
          supabase status -o json > "$GRIDEX_NATIVE_STATUS"
          printf '%s\n' 'Z05 phase: run-native-tests'
          native_exit=0
          GRIDEX_NATIVE_STATUS="$GRIDEX_NATIVE_STATUS" npx vitest run \
            --config scripts/ediel-z05-supplier-native.config.ts \
            --reporter=default --reporter=junit \
            --outputFile=z05-supplier-native-working/native-junit.xml \
            > z05-supplier-native-working/native.log 2>&1 || native_exit=$?
          printf '%s\n' 'Z05 phase: record-native-result'
          export Z05_SUPPLIER_NATIVE_EXIT="$native_exit"
          python3 - <<'PY'
          import json, os, pathlib
          receipt_path = pathlib.Path(os.environ['RUNNER_TEMP'],'z05-supplier-input-receipt.json')
          receipt = json.loads(receipt_path.read_text())
          receipt['native_exit_code'] = int(os.environ['Z05_SUPPLIER_NATIVE_EXIT'])
          pathlib.Path('z05-supplier-native-working/receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          receipt_path.unlink()
          PY
          printf '%s\n' 'Z05 phase: redact-evidence'
          python3 scripts/gridex-redact-native-evidence.py \
            --local-secrets "$GRIDEX_NATIVE_STATUS" --root z05-supplier-native-working
          # Only successfully redacted files enter the uploaded directory.
          # Receipt/redaction failure leaves no artifact directory to upload.
          printf '%s\n' 'Z05 phase: publish-redacted-evidence'
          mv z05-supplier-native-working z05-supplier-native-evidence
          cat z05-supplier-native-evidence/native.log
          rm -f "$GRIDEX_NATIVE_STATUS"
          exit "$native_exit"
      - name: Report the bounded Z05 replay failure location
        if: failure() && steps.z05_native.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_Z05_REPLAY_BOUNDARY'
          import json, os, stat

          # Read only the fixed cleanup receipt. The replay and status files stay private.
          try:
              directory = os.open(os.environ['RUNNER_TEMP'], os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              try:
                  descriptor = os.open('staff-schema-capture-error-boundary.json',
                                       os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=directory)
                  with os.fdopen(descriptor, 'rb') as stream:
                      info = os.fstat(stream.fileno())
                      if not stat.S_ISREG(info.st_mode) or not 0 < info.st_size <= 4096:
                          raise ValueError('invalid replay boundary file')
                      raw = stream.read(4097)
                      if len(raw) > 4096:
                          raise ValueError('oversized replay boundary file')
                      entries = json.loads(raw, object_pairs_hook=tuple)
              finally:
                  os.close(directory)
              if type(entries) is not tuple or len(entries) != 3:
                  raise ValueError('invalid replay boundary shape')
              boundary = dict(entries)
              script = 'scripts/gridex-aud-003-clean-replay.sh'
              if (set(boundary) != {'source', 'source_line', 'exit_code'}
                  or boundary['source'] != script
                  or type(boundary['source_line']) is not int or not 1 <= boundary['source_line'] <= 1000000
                  or type(boundary['exit_code']) is not int or not 1 <= boundary['exit_code'] <= 255):
                  raise ValueError('invalid replay boundary values')
              print(json.dumps({'phase': 'clean_replay', 'source': script,
                                'source_line': boundary['source_line'], 'exit_code': boundary['exit_code']}))
          except (OSError, KeyError, TypeError, ValueError, RecursionError):
              print('Z05 clean replay boundary unavailable.')
          PY_Z05_REPLAY_BOUNDARY
      - name: Upload redacted native feedback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ediel-z05-supplier-native-${{ github.event.pull_request.head.sha }}
          path: z05-supplier-native-evidence/
          if-no-files-found: warn
          retention-days: 14
