name: Ediel H05 H08 public reception native feedback

on:
  pull_request:
    paths:
      - 'scripts/ediel-at-z05h-z08h-supplier-native.test.ts'
      - 'scripts/ediel-z05h-z08h-supplier-native.config.ts'
      - '__tests__/ediel-supply-end-birth-profile.test.ts'
      - '__tests__/ediel-supply-end-field-omissions.test.ts'
      - 'scripts/ediel-source-owner-native.config.ts'
      - 'scripts/fixtures/**'
      - 'scripts/helpers/**'
      - 'scripts/gridex-aud-003-clean-replay.sh'
      - 'scripts/gridex-redact-native-evidence.py'
      - 'scripts/migration-history-manifest*.json'
      - 'lib/ediel/**'
      - 'lib/billing/**'
      - 'lib/events/**'
      - 'lib/platform/schemaReadiness.ts'
      - 'lib/integrations/**'
      - 'lib/time/stockholm.ts'
      - 'lib/inbound-mail/**'
      - 'lib/supabase/**'
      - 'supabase/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/ediel-z05h-z08h-supplier-native.yml'

permissions:
  contents: read

concurrency:
  group: ediel-z05h-z08h-supplier-native-owned
  cancel-in-progress: true

# Additional genuine feedback. Ordinary full-native, clean/upgrade, browser,
# tenant, parity and certificate gates remain mandatory. No receipt approves a whole contract.
jobs:
  h05h08-native:
    if: github.event.pull_request.head.ref == 'codex/c3-h-20261012' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      GRIDEX_H_INPUT_EPOCH: pr776-current-main2a-completion-20261017
      GRIDEX_H_SOURCE_RECEIPT: f878a672d65b9128ae0f3a7b937f82222ea088af
      GRIDEX_H_PRODUCER_RECEIPT: 651598eb7b8d679d0105d401c066a37b69802393
      GRIDEX_H_CONSTRUCTION_BRANCH: codex/pr776-completion-20261017
      GRIDEX_H_PUBLICATION_BRANCH: codex/c3-h-20261012
      GRIDEX_H_RESOURCE_CUSTODY: >-
        {
          "file_receipts": {
            ".github/workflows/ediel-z05h-z08h-supplier-native.yml": "f878a672d65b9128ae0f3a7b937f82222ea088af",
            "scripts/ediel-at-z05h-z08h-supplier-native.test.ts": "6e32bbb9604169aada9e64505410c1ef07e454f1",
            "scripts/ediel-z05h-z08h-supplier-native.config.ts": "2255742ce5a41aa5968ace2d99baec3dcf40defd",
            "scripts/helpers/ediel-h05h08-normal-switch-native-fixture.ts": "85202606c16dca1bb44ac1ecac324586c9f0cb12",
            "scripts/helpers/nationalRescissionNative.ts": "6e32bbb9604169aada9e64505410c1ef07e454f1",
            "scripts/helpers/ediel-supply-end-field-omissions.ts": "2255742ce5a41aa5968ace2d99baec3dcf40defd",
            "__tests__/ediel-h-native-sql-output-buffer-completeness-c-final.test.ts": "cadd91b975c4e4819ad07cdb5f1bc7c00926ac9f",
            "__tests__/ediel-supply-end-field-omissions.test.ts": "c0dee5caf7956673f2957bd7fb78093c09d9af83",
            "__tests__/ediel-z05-rejected-identity-runtime.test.ts": "c0dee5caf7956673f2957bd7fb78093c09d9af83",
            "lib/ediel/core/runtimeDecision.ts": "c0dee5caf7956673f2957bd7fb78093c09d9af83",
            "lib/ediel/flows/inboundProcessing.ts": "c0dee5caf7956673f2957bd7fb78093c09d9af83",
            "lib/ediel/prodat/receivedZ05RejectedIdentityRuntime.ts": "c0dee5caf7956673f2957bd7fb78093c09d9af83",
            "scripts/gridex-redact-native-evidence.py": "c0dee5caf7956673f2957bd7fb78093c09d9af83",
            "scripts/gridex-redact-native-evidence-selftest.py": "c0dee5caf7956673f2957bd7fb78093c09d9af83"
          },
          "retained_scope_receipts": {
            "slot-C3": "2255742ce5a41aa5968ace2d99baec3dcf40defd",
            "id-AT-Z05H-SUPPLIER": "2255742ce5a41aa5968ace2d99baec3dcf40defd",
            "id-AT-Z08H-SUPPLIER": "2255742ce5a41aa5968ace2d99baec3dcf40defd"
          },
          "receiving": {
            "resource": "slot-session-76174a45-114b-48a6-afb1-1a41f7b82836",
            "receipt": "f878a672d65b9128ae0f3a7b937f82222ea088af"
          },
          "producer": {
            "resource": "producer-h",
            "receipt": "651598eb7b8d679d0105d401c066a37b69802393"
          }
        }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Validate handed-off source and exact resource custody
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          git merge-base --is-ancestor 35ad0e6d9fd2e100d22bf5c27cd1958f77063e3c HEAD
          git merge-base --is-ancestor 2a9729ecd2191f77f3d2ff1c10d213686a8e8360 HEAD
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess
          repository=os.environ['GITHUB_REPOSITORY']
          if repository!='heke99/gridex-ops-platform': raise RuntimeError('h_repository_scope_mismatch')
          if os.environ['GRIDEX_H_INPUT_EPOCH']!='pr776-current-main2a-completion-20261017': raise RuntimeError('h_input_epoch_mismatch')
          if os.environ['GRIDEX_H_CONSTRUCTION_BRANCH']!='codex/pr776-completion-20261017' or os.environ['GRIDEX_H_PUBLICATION_BRANCH']!='codex/c3-h-20261012': raise RuntimeError('h_branch_metadata_mismatch')
          event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          if not isinstance(event,dict) or type(event.get('number')) is not int or event['number']!=776: raise RuntimeError('h_pull_request_scope_mismatch')
          head=event.get('pull_request',{}).get('head',{})
          if head.get('ref')!=os.environ['GRIDEX_H_PUBLICATION_BRANCH'] or head.get('repo',{}).get('full_name')!=repository: raise RuntimeError('h_publication_scope_mismatch')
          files=['lib/ediel/core/runtimeDecision.ts','lib/ediel/flows/inboundProcessing.ts',
                 'lib/ediel/prodat/receivedZ05RejectedIdentityRuntime.ts',
                 '__tests__/ediel-z05-rejected-identity-runtime.test.ts',
                 '.github/workflows/ediel-z05h-z08h-supplier-native.yml',
                 '__tests__/ediel-supply-end-field-omissions.test.ts',
                 'scripts/ediel-at-z05h-z08h-supplier-native.test.ts',
                 'scripts/ediel-z05h-z08h-supplier-native.config.ts',
                 'scripts/helpers/ediel-h05h08-normal-switch-native-fixture.ts',
                 'scripts/helpers/nationalRescissionNative.ts',
                 'scripts/helpers/ediel-supply-end-field-omissions.ts',
                 '__tests__/ediel-h-native-sql-output-buffer-completeness-c-final.test.ts',
                 'scripts/gridex-redact-native-evidence.py',
                 'scripts/gridex-redact-native-evidence-selftest.py']
          custody=json.loads(os.environ['GRIDEX_H_RESOURCE_CUSTODY'])
          if not isinstance(custody,dict) or set(custody)!={'file_receipts','retained_scope_receipts','receiving','producer'}: raise RuntimeError('h_custody_metadata_shape')
          file_receipts=custody['file_receipts'];retained=custody['retained_scope_receipts']
          if not isinstance(file_receipts,dict) or set(file_receipts)!=set(files): raise RuntimeError('h_exact_fourteen_file_receipts_required')
          if retained!={name:'2255742ce5a41aa5968ace2d99baec3dcf40defd' for name in ['slot-C3','id-AT-Z05H-SUPPLIER','id-AT-Z08H-SUPPLIER']}: raise RuntimeError('h_retained_scope_receipts_mismatch')
          receiving=custody['receiving'];producer=custody['producer']
          if receiving!={'resource':'slot-session-76174a45-114b-48a6-afb1-1a41f7b82836','receipt':os.environ['GRIDEX_H_SOURCE_RECEIPT']} or file_receipts['.github/workflows/ediel-z05h-z08h-supplier-native.yml']!=receiving['receipt']: raise RuntimeError('h_receiving_source_receipt_mismatch')
          if producer!={'resource':'producer-h','receipt':os.environ['GRIDEX_H_PRODUCER_RECEIPT']}: raise RuntimeError('h_producer_receipt_mismatch')
          expected={**retained,receiving['resource']:receiving['receipt'],producer['resource']:producer['receipt'],
                    **{'file-'+hashlib.sha256(path.encode()).hexdigest():sha for path,sha in file_receipts.items()}}
          if len(expected)!=19 or any(not isinstance(sha,str) or re.fullmatch('[0-9a-f]{40}',sha) is None for sha in expected.values()): raise RuntimeError('h_exact_nineteen_resource_receipts_required')
          root='repos/'+repository+'/git/ref/tags/agent-claims/masterplan/'
          for name,sha in sorted(expected.items()):
              actual=json.loads(subprocess.check_output(['gh','api',root+name]))
              if not isinstance(actual,dict) or actual.get('ref')!='refs/tags/agent-claims/masterplan/'+name or not isinstance(actual.get('object'),dict) or actual['object'].get('type')!='commit' or actual['object'].get('sha')!=sha: raise RuntimeError('h_custody_mismatch:'+name)
          print('H05H08_CUSTODY exact19refs verified; current per-resource source/inputepoch')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Record public runner preflight without native credit
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shutil,subprocess
          memory={}
          for line in pathlib.Path('/proc/meminfo').read_text().splitlines():
              key,_,value=line.partition(':')
              if key in {'MemTotal','MemAvailable'}: memory[key]=int(value.split()[0])
          disk=shutil.disk_usage('.')
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          receipt={'format':'gridex_h_runner_preflight_v1','source_head':source,'source_tree':tree,
                   'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
                   'runner_os':os.environ['RUNNER_OS'],'runner_arch':os.environ['RUNNER_ARCH'],
                   'cpu_count':os.cpu_count(),'memory_kib':memory,
                   'disk_bytes':{'total':disk.total,'used':disk.used,'free':disk.free},
                   'input_epoch':os.environ['GRIDEX_H_INPUT_EPOCH'],
                   'source_receipt':os.environ['GRIDEX_H_SOURCE_RECEIPT'],
                   'resource_custody':json.loads(os.environ['GRIDEX_H_RESOURCE_CUSTODY']),
                   'construction_branch':os.environ['GRIDEX_H_CONSTRUCTION_BRANCH'],
                   'publication_branch':os.environ['GRIDEX_H_PUBLICATION_BRANCH'],
                   'pull_request':776,
                   'base_source':'2a9729ecd2191f77f3d2ff1c10d213686a8e8360',
                   'immutable_source_origin':'d8a0abdcc55877fbee9e8841afb59bfc518fd771',
                   'producer_receipt':os.environ['GRIDEX_H_PRODUCER_RECEIPT'],
                   'native':'NOT_EXECUTED','whole_h05_h08':'NOT_APPROVED'}
          target=pathlib.Path('h05h08-native-preflight');target.mkdir()
          (target/'preflight.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Upload public runner preflight
        uses: actions/upload-artifact@v4
        with:
          name: ediel-z05h-z08h-supplier-preflight-${{ github.run_id }}
          path: h05h08-native-preflight
          if-no-files-found: error
          retention-days: 14
      - name: Run genuine public H04 predecessor and H05 H08 consumers
        shell: bash
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: |
          set -euo pipefail
          # Preserve the runner's HOME. Only the supported CLI cache is isolated.
          export SUPABASE_HOME="$RUNNER_TEMP/h05h08-supabase-home"
          export SUPABASE_TELEMETRY_DISABLED=true
          test -z "$(docker ps -aq)"
          mkdir -p h05h08-native-working
          export GRIDEX_H_GIT_INPUTS="$RUNNER_TEMP/h05h08-git-inputs.json"
          # Freeze original Git blobs before replay generates local types/schema.
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          entries=subprocess.check_output(['git','ls-tree','-rz','--full-tree','HEAD']).split(b'\0')
          source={}
          for entry in entries:
              if not entry: continue
              header,path=entry.split(b'\t',1)
              mode,kind,oid=header.decode().split()
              if kind!='blob': continue
              name=path.decode()
              blob=subprocess.check_output(['git','cat-file','blob',oid])
              source[name]={'mode':mode,'oid':oid,'sha256':hashlib.sha256(blob).hexdigest()}
          required=['scripts/ediel-at-z05h-z08h-supplier-native.test.ts',
                    'scripts/ediel-z05h-z08h-supplier-native.config.ts',
                    'lib/inbound-mail/supplyEndBirthProfile.ts',
                    '.github/workflows/ediel-z05h-z08h-supplier-native.yml']
          if not all(name in source for name in required): raise RuntimeError('native_input_missing_from_frozen_git')
          pathlib.Path(os.environ['GRIDEX_H_GIT_INPUTS']).write_text(json.dumps(dict(sorted(source.items())),indent=2)+'\n')
          PY
          printf '%s\n' 'H05H08_BOUNDARY INPUTS_FROZEN'
          # Replay owns its EXIT cleanup. Disposable status/credentials stay local.
          echo BOOTSTRAP > "$RUNNER_TEMP/h05h08-stage"
          # The previous runner lost communication before any log/artifact
          # survived. Stream only allowlisted phases and numeric host resources
          # so a later host incident can be located without exposing raw inputs.
          diagnostic_owner=$$
          (
            for sample in {1..180}; do
              kill -0 "$diagnostic_owner" 2>/dev/null || break
              phase=$(cat "$RUNNER_TEMP/h05h08-stage" 2>/dev/null || true)
              case "$phase" in
                BOOTSTRAP|STATUS|NATIVE|POST_NATIVE|SOURCE_IDENTITY|REDACTION) ;;
                *) phase=UNKNOWN ;;
              esac
              memory=$(awk '/^MemTotal:|^MemAvailable:/ {printf "%s ", $2}' /proc/meminfo)
              load=$(cut -d ' ' -f1-3 /proc/loadavg)
              disk=$(df -Pm "$GITHUB_WORKSPACE" | awk 'NR==2 {print $2, $3, $4}')
              printf 'H05H08_RESOURCE phase=%s memory_kib_total_available=%s load=%s disk_mib_total_used_available=%s\n' "$phase" "$memory" "$load" "$disk"
              sleep 30
            done
          ) &
          diagnostic_pid=$!
          source scripts/gridex-aud-003-clean-replay.sh > "$RUNNER_TEMP/h05h08-replay.log" 2>&1
          printf '%s\n' 'H05H08_BOUNDARY REPLAY_RETURNED'
          echo STATUS > "$RUNNER_TEMP/h05h08-stage"
          export GRIDEX_NATIVE_STATUS="$RUNNER_TEMP/h05h08-native-status.json"
          supabase status -o json > "$GRIDEX_NATIVE_STATUS"
          printf '%s\n' 'H05H08_BOUNDARY STATUS_RETURNED'
          native_exit=0
          echo NATIVE > "$RUNNER_TEMP/h05h08-stage"
          GRIDEX_NATIVE_STATUS="$GRIDEX_NATIVE_STATUS" npx vitest run \
            --config scripts/ediel-z05h-z08h-supplier-native.config.ts \
            > h05h08-native-working/native.log 2>&1 || native_exit=$?
          printf '%s\n' 'H05H08_BOUNDARY NATIVE_RETURNED'
          export GRIDEX_H_NATIVE_EXIT="$native_exit"
          echo "$native_exit" > "$RUNNER_TEMP/h05h08-native-exit"
          echo POST_NATIVE > "$RUNNER_TEMP/h05h08-stage"
          # Restore replay's original tracked migrations/seed before comparing
          # working files with their immutable pre-replay Git identities.
          cleanup
          printf '%s\n' 'H05H08_BOUNDARY CLEANUP_RETURNED'
          trap - EXIT
          set -euo pipefail
          test -z "$(docker ps -aq)"
          python3 - <<'PY'
          import os,pathlib
          marker='[GRIDEX-REM-002 replay] PASS: empty local Supabase'
          if marker not in (pathlib.Path(os.environ['RUNNER_TEMP'])/'h05h08-replay.log').read_text():
              raise RuntimeError('h_canonical_replay_pass_marker_missing')
          PY
          echo SOURCE_IDENTITY > "$RUNNER_TEMP/h05h08-stage"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,xml.etree.ElementTree as ET
          source=json.loads(pathlib.Path(os.environ['GRIDEX_H_GIT_INPUTS']).read_text())
          changed={}
          for name,identity in source.items():
              path=pathlib.Path(name)
              if not path.is_file(): raise RuntimeError('tracked_native_runtime_input_missing:'+name)
              actual=hashlib.sha256(path.read_bytes()).hexdigest()
              if actual!=identity['sha256']: changed[name]=actual
          allowed={'supabase/database.types.ts','supabase/schema.sql','supabase/schema.fingerprint.json',
                   'scripts/supabase-types-manifest.json'}
          if set(changed)-allowed: raise RuntimeError('unexpected_replay_runtime_source_change:'+','.join(sorted(set(changed)-allowed)))
          junit=ET.parse('h05h08-native-working/native-junit.xml').getroot()
          cases=junit.findall('.//testcase')
          if len(cases)!=101 or junit.findall('.//skipped') or int(junit.attrib.get('errors','0')):
              raise RuntimeError('h_native_complete_101_cases_required')
          counts=json.loads(pathlib.Path('h05h08-native-working/native-summary.json').read_text())['counts']
          failures=len(junit.findall('.//failure'))
          native_exit=int(os.environ['GRIDEX_H_NATIVE_EXIT'])
          if (counts['tests']!=101 or counts['failures']!=failures or counts['passed']!=101-failures
                  or counts['errors'] or counts['skipped']
                  or counts['reason']!=('failed' if failures else 'passed')
                  or (native_exit==0)!=(failures==0)):
              raise RuntimeError('h_native_outcome_receipt_mismatch')
          original={}
          for path in pathlib.Path('h05h08-native-working').iterdir():
              if path.is_file():
                  with path.open('rb') as stream: digest=hashlib.file_digest(stream,'sha256').hexdigest()
                  original[path.name]={'bytes':path.stat().st_size,'sha256':digest}
          pathlib.Path('h05h08-native-working/original-output-sha256.json').write_text(json.dumps(original,indent=2)+'\n')
          receipt={
              'purpose':'supplemental_actual_native_feedback',
              'checkout_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'checkout_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
              'repository':os.environ['GITHUB_REPOSITORY'],
              'repository_id':os.environ['GITHUB_REPOSITORY_ID'],
              'workflow_run_id':os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'native_exit_code':int(os.environ['GRIDEX_H_NATIVE_EXIT']),
              'native_case_count':len(cases),'native_skipped_count':0,
              'native_counts':counts,
              'canonical_replay':'PASSED','cleanup':'ZERO_CONTAINERS',
              'input_epoch':os.environ['GRIDEX_H_INPUT_EPOCH'],
              'source_receipt':os.environ['GRIDEX_H_SOURCE_RECEIPT'],
              'resource_custody':json.loads(os.environ['GRIDEX_H_RESOURCE_CUSTODY']),
              'construction_branch':os.environ['GRIDEX_H_CONSTRUCTION_BRANCH'],
              'publication_branch':os.environ['GRIDEX_H_PUBLICATION_BRANCH'],
              'pull_request':776,
              'base_source':'2a9729ecd2191f77f3d2ff1c10d213686a8e8360',
              'immutable_source_origin':'d8a0abdcc55877fbee9e8841afb59bfc518fd771',
              'producer_receipt':os.environ['GRIDEX_H_PRODUCER_RECEIPT'],
              'input_identity':'immutable_checkout_before_replay',
              'source_blobs':source,
              'input_sha256':{name:identity['sha256'] for name,identity in source.items()},
              'runtime_generated_input_sha256':changed,
              'test_scope':['scripts/ediel-at-z05h-z08h-supplier-native.test.ts'],
              'ordinary_required_gates':'NOT_REPLACED',
              'schema_capture':'NOT_RUN','upgrade_parity':'NOT_RUN','browser_tests':'NOT_RUN',
              'whole_h05_h08':'NOT_APPROVED_BY_RECEIPT_ALONE',
              'authentic_market_evidence':'NOT_PROVIDED',
          }
          pathlib.Path('h05h08-native-working/receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          printf '%s\n' 'H05H08_BOUNDARY SOURCE_IDENTITY_WRITTEN'
          echo REDACTION > "$RUNNER_TEMP/h05h08-stage"
          python3 scripts/gridex-redact-native-evidence.py \
            --local-secrets "$GRIDEX_NATIVE_STATUS" --root h05h08-native-working \
            --line-records h05h08-native-working/native.log \
            --line-records h05h08-native-working/native-junit.xml
          mv h05h08-native-working h05h08-native-evidence
          printf '%s\n' 'H05H08_BOUNDARY EVIDENCE_REDACTED'
          tail -n 160 h05h08-native-evidence/native.log
          rm -f "$GRIDEX_NATIVE_STATUS" "$GRIDEX_H_GIT_INPUTS"
          kill "$diagnostic_pid" 2>/dev/null || true
          wait "$diagnostic_pid" 2>/dev/null || true
          exit "$native_exit"
      - name: Preserve original failed stage without false execution credit
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d h05h08-native-evidence && -f "$RUNNER_TEMP/h05h08-replay.log" ]]; then
            mkdir -p h05h08-native-working
            cp "$RUNNER_TEMP/h05h08-replay.log" h05h08-native-working/bootstrap.log
            python3 - <<'PY'
          import json,os,pathlib,subprocess
          inputs=pathlib.Path(os.environ['RUNNER_TEMP'])/'h05h08-git-inputs.json'
          if not inputs.is_file(): raise RuntimeError('bootstrap_original_git_inputs_unavailable')
          stage=(pathlib.Path(os.environ['RUNNER_TEMP'])/'h05h08-stage').read_text().strip()
          stages={'BOOTSTRAP','STATUS','NATIVE','POST_NATIVE','SOURCE_IDENTITY','REDACTION'}
          if stage not in stages: raise RuntimeError('failed_native_stage_unknown')
          exit_file=pathlib.Path(os.environ['RUNNER_TEMP'])/'h05h08-native-exit'
          native_exit=int(exit_file.read_text()) if exit_file.is_file() else None
          native='NOT_REACHED' if stage in {'BOOTSTRAP','STATUS'} else 'EXECUTION_INCOMPLETE' if stage=='NATIVE' else 'EXECUTED_WITH_EVIDENCE_FAILURE'
          receipt={'purpose':'original_failed_stage',
                   'checkout_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                   'checkout_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
                   'repository':os.environ['GITHUB_REPOSITORY'],
                   'repository_id':os.environ['GITHUB_REPOSITORY_ID'],
                   'workflow_run_id':os.environ['GITHUB_RUN_ID'],
                   'workflow_run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
