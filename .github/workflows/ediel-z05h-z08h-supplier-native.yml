name: Ediel H05 H08 public reception native feedback

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'scripts/ediel-at-z05h-z08h-supplier-native.test.ts'
      - 'scripts/ediel-z05h-z08h-supplier-native.config.ts'
      - '__tests__/ediel-supply-end-birth-profile.test.ts'
      - '__tests__/ediel-supply-end-field-omissions.test.ts'
      - 'scripts/ediel-source-owner-native.config.ts'
      - 'scripts/fixtures/**'
      - 'scripts/helpers/**'
      - 'scripts/gridex-aud-003-clean-replay.sh'
      - 'scripts/gridex-redact-native-evidence.py'
      - 'scripts/migration-history-manifest*.json'
      - 'lib/ediel/**'
      - 'lib/billing/**'
      - 'lib/events/**'
      - 'lib/platform/schemaReadiness.ts'
      - 'lib/integrations/**'
      - 'lib/time/stockholm.ts'
      - 'lib/inbound-mail/**'
      - 'lib/supabase/**'
      - 'supabase/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/ediel-z05h-z08h-supplier-native.yml'

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: ${{ github.event.pull_request.head.ref == 'codex/agent1-h05h08-source-20261018' && 'ediel-z05h-z08h-supplier-native-admitted' || 'ediel-z05h-z08h-supplier-native-owned' }}
  cancel-in-progress: ${{ github.event.pull_request.head.ref != 'codex/agent1-h05h08-source-20261018' }}

# Additional genuine feedback. Ordinary full-native, clean/upgrade, browser,
# tenant, parity and certificate gates remain mandatory. No receipt approves a whole contract.
jobs:
  h05h08-native:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.pull_request.head.ref == 'codex/c3-h-20261012' && github.event.action != 'labeled') ||
        (
          github.event.pull_request.head.ref == 'codex/agent1-h05h08-source-20261018' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'ediel-h05h08-native-approved' &&
          github.event.sender.login == 'heke99' && github.actor == 'heke99' &&
          github.run_attempt == 1
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      GRIDEX_H_PULL_REQUEST: '776'
      GRIDEX_H_BASE_SOURCE: 2a9729ecd2191f77f3d2ff1c10d213686a8e8360
      GRIDEX_H_INPUT_EPOCH: pr776-current-main2a-completion-20261017
      GRIDEX_H_SOURCE_RECEIPT: f878a672d65b9128ae0f3a7b937f82222ea088af
      GRIDEX_H_PRODUCER_RECEIPT: 651598eb7b8d679d0105d401c066a37b69802393
      GRIDEX_H_CONSTRUCTION_BRANCH: codex/pr776-completion-20261017
      GRIDEX_H_PUBLICATION_BRANCH: codex/c3-h-20261012
      GRIDEX_H_RESOURCE_CUSTODY: >-
        {
          "file_receipts": {
            ".github/workflows/ediel-z05h-z08h-supplier-native.yml": "f878a672d65b9128ae0f3a7b937f82222ea088af",
            "scripts/ediel-at-z05h-z08h-supplier-native.test.ts": "6e32bbb9604169aada9e64505410c1ef07e454f1",
            "scripts/ediel-z05h-z08h-supplier-native.config.ts": "2255742ce5a41aa5968ace2d99baec3dcf40defd",
            "scripts/helpers/ediel-h05h08-normal-switch-native-fixture.ts": "85202606c16dca1bb44ac1ecac324586c9f0cb12",
            "scripts/helpers/nationalRescissionNative.ts": "6e32bbb9604169aada9e64505410c1ef07e454f1",
            "scripts/helpers/ediel-supply-end-field-omissions.ts": "2255742ce5a41aa5968ace2d99baec3dcf40defd",
            "__tests__/ediel-h-native-sql-output-buffer-completeness-c-final.test.ts": "cadd91b975c4e4819ad07cdb5f1bc7c00926ac9f",
            "__tests__/ediel-supply-end-field-omissions.test.ts": "c0dee5caf7956673f2957bd7fb78093c09d9af83",
            "__tests__/ediel-z05-rejected-identity-runtime.test.ts": "c0dee5caf7956673f2957bd7fb78093c09d9af83",
            "lib/ediel/core/runtimeDecision.ts": "c0dee5caf7956673f2957bd7fb78093c09d9af83",
            "lib/ediel/flows/inboundProcessing.ts": "c0dee5caf7956673f2957bd7fb78093c09d9af83",
            "lib/ediel/prodat/receivedZ05RejectedIdentityRuntime.ts": "c0dee5caf7956673f2957bd7fb78093c09d9af83",
            "scripts/gridex-redact-native-evidence.py": "c0dee5caf7956673f2957bd7fb78093c09d9af83",
            "scripts/gridex-redact-native-evidence-selftest.py": "c0dee5caf7956673f2957bd7fb78093c09d9af83"
          },
          "retained_scope_receipts": {
            "slot-C3": "2255742ce5a41aa5968ace2d99baec3dcf40defd",
            "id-AT-Z05H-SUPPLIER": "2255742ce5a41aa5968ace2d99baec3dcf40defd",
            "id-AT-Z08H-SUPPLIER": "2255742ce5a41aa5968ace2d99baec3dcf40defd"
          },
          "receiving": {
            "resource": "slot-session-76174a45-114b-48a6-afb1-1a41f7b82836",
            "receipt": "f878a672d65b9128ae0f3a7b937f82222ea088af"
          },
          "producer": {
            "resource": "producer-h",
            "receipt": "651598eb7b8d679d0105d401c066a37b69802393"
          }
        }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Authenticate exact source and postfreeze H runtime admission
        id: h_source_admission
        if: github.event.pull_request.head.ref == 'codex/agent1-h05h08-source-20261018'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/h-source-admission.py" <<'PY_H_ADMISSION'
          import base64, datetime, hashlib, json, os, pathlib, re, subprocess, sys, urllib.parse, urllib.request

          REPO='heke99/gridex-ops-platform'
          BRANCH='codex/agent1-h05h08-source-20261018'
          OWNER='heke99'
          LABEL='ediel-h05h08-native-approved'
          WORKFLOW='.github/workflows/ediel-z05h-z08h-supplier-native.yml'
          NATIVE='scripts/ediel-at-z05h-z08h-supplier-native.test.ts'
          NATIVE_SHA256='65d37f514fc2ee106a80404accb39a9b5d4b8a26777e9a63399b5cb80021d42d'
          SOURCE_CLAIM='2aa98827102eb00f100cea5486941bfe1d2c4048'
          CLAIM_BASE='9c8568e5242aec6a23371815f00031e6f30c57a9'
          SOURCE_OPERATION='Reserve source files and rule IDs; resources-sha256=7c4a22d27ca75fc532d7456cf944ef14ae6fca1b9503673ece73ab55920e4603'
          PRODUCER_REF='refs/tags/agent-claims/masterplan/producer-h'
          PREPARATION_RECEIPT='ca62f2af7643c69b310911ac4bd16a2cd6081f06'
          GO_PREFIX='GRIDEX_NATIVE_ADMISSION_V1\n'
          AUTHORITY_PREFIX='GRIDEX_H_SERVICE_DISPOSITION_V1\n'
          OUTPUT_INTENT='ediel-z05h-z08h-supplier-native-evidence-v1'
          SERVICE={'repository':REPO,'workflow':WORKFLOW,'job':'h05h08-native'}
          COLLECTOR={'actor':OWNER,'agent':'codex-agent1-8d439b61','exclusive':True}
          BACKEND={'kind':'fresh-github-hosted-loopback-supabase','apiURL':'http://127.0.0.1:54321','supabaseCLI':'2.101.0','replay':'scripts/gridex-aud-003-clean-replay.sh','config':'scripts/ediel-z05h-z08h-supplier-native.config.ts','sharedBackend':False}
          FILE_RECEIPTS={
              ".github/workflows/ediel-z05h-z08h-supplier-native.yml": "2aa98827102eb00f100cea5486941bfe1d2c4048",
              "scripts/ediel-at-z05h-z08h-supplier-native.test.ts": "2aa98827102eb00f100cea5486941bfe1d2c4048",
              "scripts/ediel-z05h-z08h-supplier-native.config.ts": "2255742ce5a41aa5968ace2d99baec3dcf40defd",
              "scripts/helpers/ediel-h05h08-normal-switch-native-fixture.ts": "931aed4a5a9d6b43ce449cc509eabd71c9307a58",
              "scripts/helpers/nationalRescissionNative.ts": "42a7af60db45ca8645699ce665232b6d4f0b68fe",
              "scripts/helpers/ediel-supply-end-field-omissions.ts": "2255742ce5a41aa5968ace2d99baec3dcf40defd",
              "__tests__/ediel-h-native-sql-output-buffer-completeness-c-final.test.ts": "2a1bcb94ffd2b7c0ec80d812d95bcd2e3190a2d3",
              "__tests__/ediel-supply-end-field-omissions.test.ts": "c0dee5caf7956673f2957bd7fb78093c09d9af83",
              "__tests__/ediel-z05-rejected-identity-runtime.test.ts": "c0dee5caf7956673f2957bd7fb78093c09d9af83",
              "lib/ediel/core/runtimeDecision.ts": "c0dee5caf7956673f2957bd7fb78093c09d9af83",
              "lib/ediel/flows/inboundProcessing.ts": "c0dee5caf7956673f2957bd7fb78093c09d9af83",
              "lib/ediel/prodat/receivedZ05RejectedIdentityRuntime.ts": "c0dee5caf7956673f2957bd7fb78093c09d9af83",
              "scripts/gridex-redact-native-evidence.py": "c0dee5caf7956673f2957bd7fb78093c09d9af83",
              "scripts/gridex-redact-native-evidence-selftest.py": "c0dee5caf7956673f2957bd7fb78093c09d9af83"
          }
          SOURCE_CUSTODY={'file_receipts':FILE_RECEIPTS,'retained_scope_receipts':{'slot-C3':'2255742ce5a41aa5968ace2d99baec3dcf40defd','id-AT-Z05H-SUPPLIER':SOURCE_CLAIM,'id-AT-Z08H-SUPPLIER':SOURCE_CLAIM},'receiving':{'resource':'slot-session-2b3d3025-92bc-47bb-ab92-3e8b9b3b25f0','receipt':SOURCE_CLAIM}}
          SOURCE_REFS={**{'file-'+hashlib.sha256(name.encode()).hexdigest():value for name,value in FILE_RECEIPTS.items()},**SOURCE_CUSTODY['retained_scope_receipts'],SOURCE_CUSTODY['receiving']['resource']:SOURCE_CLAIM}

          def need(ok, code):
              if not ok: raise AssertionError(code)
          def strict_json(text):
              def pairs(rows):
                  result={}
                  for key,value in rows:
                      need(key not in result,'h_duplicate_json_key');result[key]=value
                  return result
              def constant(_): raise AssertionError('h_non_json_constant')
              try: return json.loads(text,object_pairs_hook=pairs,parse_constant=constant)
              except (ValueError,TypeError): raise AssertionError('h_invalid_json') from None
          def canonical(value): return json.dumps(value,sort_keys=True,ensure_ascii=False,separators=(',',':')).encode()
          def digest(value): return hashlib.sha256(canonical(value)).hexdigest()
          def shape(value, names): return type(value) is dict and set(value)==set(names.split())
          def hexed(value,n): return type(value) is str and re.fullmatch('[0-9a-f]{'+str(n)+'}',value) is not None
          def instant(value):
              result=datetime.datetime.fromisoformat(value.replace('Z','+00:00'))
              need(result.tzinfo is not None,'h_unqualified_timestamp');return result
          def selected(event,env):
              return (event.get('action')=='labeled' and event.get('label',{}).get('name')==LABEL
                  and event.get('sender',{}).get('login')==OWNER and env.get('GITHUB_ACTOR')==OWNER
                  and env.get('GITHUB_RUN_ATTEMPT')=='1' and env.get('GITHUB_REPOSITORY')==REPO
                  and event.get('pull_request',{}).get('head',{}).get('ref')==BRANCH
                  and event.get('pull_request',{}).get('head',{}).get('repo',{}).get('full_name')==REPO)
          def history(api,path,key):
              rows=[];total=None
              for page in (1,2):
                  value=api(path+('&' if '?' in path else '?')+'per_page=50&page='+str(page))
                  count,batch=value.get('total_count'),value.get(key)
                  need(type(count) is int and 0<=count<=100,'h_history_bound')
                  if total is None: total=count
                  need(count==total and type(batch) is list and len(batch)==min(50,max(0,total-len(rows))),'h_history_incomplete')
                  rows.extend(batch)
              need(len(rows)==total and len({row['id'] for row in rows})==total,'h_history_incomplete')
              return rows
          def observe_main(api):
              try:
                  value=api('git/ref/heads/main')['object']['sha']
                  need(hexed(value,40),'h_receiving_observation_invalid')
                  return {'state':'OBSERVED','sha':value}
              except Exception: return {'state':'UNAVAILABLE'}

          def validate(event,env,api,git,inputs,workflow_bytes,saved=None,phase='admit'):
              need(selected(event,env),'h_owner_label_required')
              if phase!='admit': need(saved is not None,'h_allocated_admission_missing')
              number=event.get('number');head=event['pull_request']['head']['sha'];base=event['pull_request']['base']['sha']
              need(type(number) is int and number>0 and hexed(head,40) and hexed(base,40),'h_event_source_invalid')
              need(event['pull_request']['base']['ref']=='main','h_event_base_ref_changed')
              need(git('rev-parse','HEAD')==head,'h_checkout_changed')
              tree=git('rev-parse','HEAD^{tree}')
              need(hexed(tree,40) and api('git/commits/'+head)['tree']['sha']==tree,'h_checkout_tree_changed')
              for ancestor in ('35ad0e6d9fd2e100d22bf5c27cd1958f77063e3c','2a9729ecd2191f77f3d2ff1c10d213686a8e8360',base):
                  git('merge-base','--is-ancestor',ancestor,'HEAD')
              pr=api('pulls/'+str(number))
              need(pr.get('state')=='open' and pr.get('draft') is False and pr.get('number')==number
                  and pr.get('head',{}).get('sha')==head and pr.get('head',{}).get('ref')==BRANCH
                  and pr.get('head',{}).get('repo',{}).get('full_name')==REPO and pr.get('base',{}).get('ref')=='main','h_current_pr_changed')
              need(any(label.get('name')==LABEL for label in pr.get('labels',[])),'h_owner_label_removed')
              ref=api('git/ref/tags/agent-claims/masterplan/producer-h')
              need(ref.get('ref')==PRODUCER_REF and ref.get('object',{}).get('type')=='commit','h_producer_ref_invalid')
              producer=ref['object']['sha'];need(hexed(producer,40),'h_producer_ref_invalid')
              proper=api('git/commits/'+producer);p=strict_json(proper['message'])
              # A label or current ref cannot promote the old PREPARATION_ONLY appointment.
              need(type(p) is dict and p.get('preparationOnly') is False and p.get('runtimeAdmission')=='GRANTED','h_runtime_admission_not_granted')
              need(shape(p,'protocol epoch bindingVersion base agent resources preparationOnly runtimeAdmission authority service source sourceReviewSHA256 inputEpoch collector outputIntent resourceCustody singleUse oldServiceDisposition'),'h_producer_shape')
              need(p['protocol']=='masterplan-reservation-v1' and p['epoch']=='gridex-five-agent-20261012'
                  and p['bindingVersion']=='gridex-h-runtime-binding-full-v1' and p['resources']==[PRODUCER_REF]
                  and p['service']==SERVICE and p['singleUse'] is True,'h_full_producer_required')
              need(p['base']==base and [row['sha'] for row in proper.get('parents',[])]==[base]
                  and proper.get('tree',{}).get('sha')==api('git/commits/'+base)['tree']['sha'],'h_producer_proper_changed')
              source={'head':head,'tree':tree,'base':base,'branch':BRANCH,'claim':SOURCE_CLAIM,'pr':number}
              need(canonical(p['source'])==canonical(source),'h_producer_source_mismatch')
              need(canonical(p['collector'])==canonical(COLLECTOR),'h_collector_mismatch')
              need(p['outputIntent']==OUTPUT_INTENT,'h_output_intent_mismatch')
              peers=p['sourceReviewSHA256']
              need(type(peers) is list and len(peers)==2 and len(set(peers))==2 and all(hexed(v,64) for v in peers),'h_source_reviews_required')
              epoch=p['inputEpoch']
              need(shape(epoch,'id sourceInputsSHA256 workflowSHA256 nativeSHA256 backend') and type(epoch['id']) is str
                  and re.fullmatch('[A-Za-z0-9][A-Za-z0-9._:-]{0,127}',epoch['id']) is not None,'h_input_epoch_required')
              need(canonical(epoch['backend'])==canonical(BACKEND),'h_backend_scope_mismatch')
              need(epoch['nativeSHA256']==NATIVE_SHA256 and epoch['workflowSHA256']==hashlib.sha256(workflow_bytes).hexdigest(),'h_input_source_changed')
              need(hexed(epoch['sourceInputsSHA256'],64),'h_input_epoch_required')
              if phase!='terminal':
                  need(set(FILE_RECEIPTS)<=set(inputs) and digest(inputs)==epoch['sourceInputsSHA256']
                      and inputs[NATIVE]['sha256']==NATIVE_SHA256 and inputs[WORKFLOW]['sha256']==epoch['workflowSHA256'],'h_input_vector_changed')
              need(p['resourceCustody']==SOURCE_CUSTODY,'h_source_custody_map_changed')
              need(len(FILE_RECEIPTS)==14 and len(SOURCE_REFS)==18,'h_source_resource_count_changed')
              current={**SOURCE_REFS,'producer-h':producer};need(len(current)==19,'h_nineteen_resources_required')
              for name,value in sorted(current.items()):
                  row=api('git/ref/tags/agent-claims/masterplan/'+name)
                  need(row.get('ref')=='refs/tags/agent-claims/masterplan/'+name and row.get('object',{}).get('type')=='commit'
                      and row['object'].get('sha')==value,'h_current_resource_changed')
              claim=api('git/commits/'+SOURCE_CLAIM)
              need(strict_json(claim['message'])=={'base':CLAIM_BASE,'files':sorted([WORKFLOW,NATIVE]),'operation':SOURCE_OPERATION}
                  and [row['sha'] for row in claim.get('parents',[])]==[CLAIM_BASE]
                  and claim.get('tree',{}).get('sha')==api('git/commits/'+CLAIM_BASE)['tree']['sha'],'h_source_claim_mismatch')
              authority=p['authority']
              need(shape(authority,'actor controller dispositionCommentId dispositionSHA256 predecessorReceipt sameService')
                  and authority['actor']==OWNER and authority['controller']==p['agent']
                  and type(p['agent']) is str and re.fullmatch('[A-Za-z0-9][A-Za-z0-9._:-]{0,127}',p['agent']) is not None
                  and type(authority['dispositionCommentId']) is int and authority['dispositionCommentId']>0
                  and authority['predecessorReceipt']==PREPARATION_RECEIPT and authority['sameService'] is True,'h_service_authority_required')
              old=p['oldServiceDisposition']
              need(shape(old,'receipt lastNativeRun attempt job sourceHead rootObservedHistoryCount rootObservedActive privateProcessTerminationAttested')
                  and hexed(old['receipt'],64) and type(old['lastNativeRun']) is int and old['lastNativeRun']==39057092870
                  and type(old['attempt']) is int and old['attempt']==1 and type(old['job']) is int and old['job']==117467172983
                  and old['sourceHead']=='cd152e72f286f27bdb3d20f9f4eea9f8d40904a6'
                  and type(old['rootObservedHistoryCount']) is int and old['rootObservedHistoryCount']>=38
                  and type(old['rootObservedActive']) is int and old['rootObservedActive']==0
                  and old['privateProcessTerminationAttested'] is False,'h_old_service_disposition_required')
              disposition=api('issues/comments/'+str(authority['dispositionCommentId']))
              expected_authority={'version':'gridex-h-service-disposition-v1','state':'RUNTIME_CONTINUATION_GO','service':SERVICE,'source':source,
                  'controller':p['agent'],'collector':COLLECTOR,'predecessorReceipt':PREPARATION_RECEIPT,'oldServiceTerminal':True,
                  'oldServiceDispositionSHA256':digest(old),'inputEpochSHA256':digest(epoch)}
              need(disposition.get('user',{}).get('login')==OWNER and disposition.get('issue_url')=='https://api.github.com/repos/'+REPO+'/issues/766'
                  and disposition.get('created_at')==disposition.get('updated_at')
                  and disposition.get('body','').startswith(AUTHORITY_PREFIX)
                  and hashlib.sha256(disposition['body'].encode()).hexdigest()==authority['dispositionSHA256']
                  and canonical(strict_json(disposition['body'][len(AUTHORITY_PREFIX):]))==canonical(expected_authority),'h_service_disposition_mismatch')
              admissions=[]
              for page in range(1,21):
                  comments=api('issues/'+str(number)+'/comments?per_page=100&page='+str(page))
                  need(type(comments) is list,'h_comment_inventory_incomplete')
                  for comment in comments:
                      if comment.get('user',{}).get('login')!=OWNER or not comment.get('body','').startswith(GO_PREFIX): continue
                      a=strict_json(comment['body'][len(GO_PREFIX):]);need(type(a) is dict,'h_admission_shape')
                      if a.get('suite')=='h05h08' and a.get('sourceHead')==head and a.get('pr')==number: admissions.append((a,comment))
                  if len(comments)<100: break
              else: raise AssertionError('h_comment_inventory_incomplete')
              need(bool(admissions),'h_positive_admission_required');need(len(admissions)==1,'h_ambiguous_admission')
              a,comment=admissions[0]
              need(comment.get('created_at')==comment.get('updated_at'),'h_admission_edited')
              need(shape(a,'version suite state actor pr sourceHead sourceTree sourceBase sourceReceipt producerRef producerReceipt producerBindingSHA256 inputEpochSHA256 controllerDispositionCommentId collector outputIntent sourceReviewSHA256 singleUse'),'h_admission_shape')
              need(a['producerBindingSHA256']==digest(p),'h_producer_binding_changed')
              expected={'version':'gridex-native-admission-v1','suite':'h05h08','state':'GO','actor':OWNER,'pr':number,'sourceHead':head,'sourceTree':tree,
                  'sourceBase':base,'sourceReceipt':SOURCE_CLAIM,'producerRef':PRODUCER_REF,'producerReceipt':producer,'producerBindingSHA256':digest(p),
                  'inputEpochSHA256':digest(epoch),'controllerDispositionCommentId':authority['dispositionCommentId'],'collector':COLLECTOR,'outputIntent':OUTPUT_INTENT,'sourceReviewSHA256':peers,'singleUse':True}
              need(canonical(a)==canonical(expected),'h_admission_mismatch')
              need(env['GITHUB_WORKFLOW_REF']==REPO+'/'+WORKFLOW+'@refs/pull/'+str(number)+'/merge','h_executing_workflow_changed')
              executing=api('contents/'+WORKFLOW+'?ref='+urllib.parse.quote(env['GITHUB_WORKFLOW_SHA'],safe=''))
              blob=hashlib.sha1(b'blob '+str(len(workflow_bytes)).encode()+b'\0'+workflow_bytes).hexdigest()
              need(executing.get('type')=='file' and base64.b64decode(executing.get('content',''),validate=False)==workflow_bytes
                  and executing.get('sha')==blob,'h_executing_workflow_changed')
              if phase!='terminal':
                  current_run=api('actions/runs/'+env['GITHUB_RUN_ID'])
                  need(current_run['id']==int(env['GITHUB_RUN_ID']) and current_run['head_branch']==BRANCH
                      and current_run['event']=='pull_request' and (current_run['head_sha']==head
                      or any(row.get('head',{}).get('sha')==head for row in current_run.get('pull_requests',[]))),'h_current_run_changed')
                  began=instant(comment['created_at']);now=(instant(current_run['created_at']),current_run['id'])
