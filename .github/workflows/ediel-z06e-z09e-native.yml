name: Ediel Z06E Z09E native source feedback

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/ediel-z06e-z09e-native.yml'
      - 'lib/**'
      - 'supabase/**'
      - '__tests__/helpers/**'
      - '__tests__/fixtures/**'
      - 'e2e/production/helpers/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.scripts.json'

permissions:
  contents: read

concurrency:
  group: ediel-z06e-z09e-native-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Supplemental execution of preserved source proofs. Ordinary required gates
# remain mandatory; these source cases do not approve either whole E contract.
jobs:
  z06e-z09e-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Install a PostgreSQL client matching the replay server
        shell: bash
        run: |
          set -euo pipefail
          # supabase/config.toml pins major_version 17, and pg_dump refuses to
          # dump a server newer than itself. The runner ships an older client,
          # so the schema snapshot aborts on a version mismatch.
          server_major="$(python3 -c "import re,pathlib;print(re.search(r'^major_version\s*=\s*(\d+)', pathlib.Path('supabase/config.toml').read_text(), re.M).group(1))")"
          echo "replay server major version: $server_major"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-$server_major"
          # Name the matching binary explicitly. pg_wrapper does not reliably
          # resolve to the newest installed major, so relying on PATH here can
          # still pick an older pg_dump and abort on a version mismatch.
          echo "GRIDEX_PG_DUMP=/usr/lib/postgresql/$server_major/bin/pg_dump" >> "$GITHUB_ENV"
          psql --version
          "/usr/lib/postgresql/$server_major/bin/pg_dump" --version
      - name: Execute preserved customer source pipelines after clean replay
        shell: bash
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: |
          set -euo pipefail
          mkdir -p z06e-z09e-native-working
          native_tests=(
            scripts/ediel-confirmed-customer-bilateral-native.test.ts
            scripts/ediel-requested-customer-change-source-native.test.ts
            scripts/ediel-at-z06e-primary-effect-native.test.ts
            scripts/ediel-at-z06e-physical-intake-native.test.ts
            scripts/ediel-at-z09e-received-ack-native.test.ts
          )
          export Z06E_Z09E_NATIVE_TEST_SCOPE
          Z06E_Z09E_NATIVE_TEST_SCOPE="$(printf '%s\n' "${native_tests[@]}")"
          export Z06E_Z09E_NATIVE_INPUT_HASHES="$RUNNER_TEMP/z06e-z09e-input-hashes.json"
          # Hash tracked source inputs before replay temporarily moves migrations.
          # Only paths/digests are written; status and credentials stay in temp.
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          scope = os.environ['Z06E_Z09E_NATIVE_TEST_SCOPE'].splitlines()
          paths = subprocess.check_output([
              'git', 'ls-files', '-z', '--', 'lib', 'scripts', 'supabase',
              '__tests__/helpers', '__tests__/fixtures', 'e2e/production/helpers', 'package.json',
              'package-lock.json', 'tsconfig.json', 'tsconfig.scripts.json',
              '.github/workflows/ediel-z06e-z09e-native.yml',
          ]).decode().split('\0')
          paths = sorted(set(scope + [p for p in paths if p]))
          hashes = {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}
          pathlib.Path(os.environ['Z06E_Z09E_NATIVE_INPUT_HASHES']).write_text(json.dumps(hashes)+'\n')
          PY
          # Preserve the canonical replay's EXIT cleanup trap. Replay/status
          # output may contain disposable credentials and is never uploaded.
          source scripts/gridex-aud-003-clean-replay.sh > "$RUNNER_TEMP/z06e-z09e-replay.log" 2>&1
          export GRIDEX_NATIVE_STATUS="$RUNNER_TEMP/z06e-z09e-native-status.json"
          supabase status -o json > "$GRIDEX_NATIVE_STATUS"
          # Pure decoder regression and authentic generated evidence use the
          # same disposable replay DB, before business fixtures run. Capture
          # only schema/types, never data or credential/status output.
          export Z06E_Z09E_SHADOW_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          decoder_exit=0
          psql "$Z06E_Z09E_SHADOW_URL" -X -v ON_ERROR_STOP=1 \
            -f scripts/ediel-customer-wire-partition-regression.sql \
            > z06e-z09e-native-working/decoder-sql.log 2>&1 || decoder_exit=$?
          if [[ "$decoder_exit" == 0 ]]; then
            psql "$Z06E_Z09E_SHADOW_URL" -X -v ON_ERROR_STOP=1 \
              -f scripts/ediel-requested-customer-selected-facts-regression.sql \
              >> z06e-z09e-native-working/decoder-sql.log 2>&1 || decoder_exit=$?
          fi
          capture_exit=0
          export Z06E_Z09E_SCHEMA_QUERY="select string_agg(nspname,',' order by nspname) from pg_namespace where nspname='public' or starts_with(nspname,'gridex_');"
          bash -euo pipefail -c '
            mkdir -p z06e-z09e-schema-capture
            GRIDEX_SCHEMA_SNAPSHOT_SCHEMAS="$(psql "$Z06E_Z09E_SHADOW_URL" -XAtq -v ON_ERROR_STOP=1 -c "$Z06E_Z09E_SCHEMA_QUERY")"
            [[ -n "$GRIDEX_SCHEMA_SNAPSHOT_SCHEMAS" ]]
            export GRIDEX_SCHEMA_SNAPSHOT_SCHEMAS
            npm run db:schema:snapshot -- --url "$Z06E_Z09E_SHADOW_URL" --out-dir z06e-z09e-schema-capture
            supabase gen types typescript --local > z06e-z09e-schema-capture/database.types.ts
            node scripts/apply-supabase-types-nullability-overrides.cjs z06e-z09e-schema-capture/database.types.ts
          ' > "$RUNNER_TEMP/z06e-z09e-schema-capture.log" 2>&1 || capture_exit=$?
          export Z06E_Z09E_DECODER_EXIT="$decoder_exit" Z06E_Z09E_CAPTURE_EXIT="$capture_exit"
          native_exit=0
          GRIDEX_NATIVE_STATUS="$GRIDEX_NATIVE_STATUS" npx vitest run \
            --config scripts/ediel-at-z06e-z09e-supplier-native.config.ts \
            "${native_tests[@]}" \
            --reporter=default --reporter=junit \
            --outputFile=z06e-z09e-native-working/native-junit.xml \
            > z06e-z09e-native-working/native.log 2>&1 || native_exit=$?
          export Z06E_Z09E_NATIVE_EXIT="$native_exit"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          capture = pathlib.Path('z06e-z09e-schema-capture')
          capture_hashes = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(capture.glob('*')) if p.is_file()}
          receipt = {
              'purpose': 'supplemental_preserved_customer_source_native_feedback',
              'checkout_sha': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'checkout_tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'native_exit_code': int(os.environ['Z06E_Z09E_NATIVE_EXIT']),
              'input_sha256': json.loads(pathlib.Path(os.environ['Z06E_Z09E_NATIVE_INPUT_HASHES']).read_text()),
              'test_scope': os.environ['Z06E_Z09E_NATIVE_TEST_SCOPE'].splitlines(),
              'ordinary_required_gates': 'NOT_REPLACED',
              'whole_contract_approval': 'NOT_PROVIDED',
              'decoder_sql_scope': 'scripts/ediel-customer-wire-partition-regression.sql',
              'decoder_sql_exit_code': int(os.environ['Z06E_Z09E_DECODER_EXIT']),
              'schema_capture_exit_code': int(os.environ['Z06E_Z09E_CAPTURE_EXIT']),
              'schema_capture': 'EXECUTED', 'generated_output_sha256': capture_hashes,
              'browser_tests': 'NOT_RUN',
              'upgrade_parity': 'NOT_RUN', 'authentic_market_evidence': 'NOT_PROVIDED',
          }
          pathlib.Path('z06e-z09e-native-working/receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          if capture.exists():
              capture.joinpath('capture-receipt.json').write_text(json.dumps({k:receipt[k] for k in ['checkout_sha','checkout_tree','workflow_run_id','schema_capture_exit_code','generated_output_sha256']},indent=2)+'\n')
          PY
          python3 scripts/gridex-redact-native-evidence.py \
            --local-secrets "$GRIDEX_NATIVE_STATUS" --root z06e-z09e-native-working
          # No artifact directory exists unless receipt and redaction succeed.
          mv z06e-z09e-native-working z06e-z09e-native-evidence
          cat z06e-z09e-native-evidence/native.log
          rm -f "$GRIDEX_NATIVE_STATUS"
          [[ "$native_exit" == 0 && "$decoder_exit" == 0 && "$capture_exit" == 0 ]]
      - name: Upload redacted native feedback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ediel-z06e-z09e-native-${{ github.event.pull_request.head.sha }}
          path: z06e-z09e-native-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload authentic post-migration schema and types
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ediel-z06e-z09e-schema-${{ github.event.pull_request.head.sha }}
          path: z06e-z09e-schema-capture/
          if-no-files-found: warn
          retention-days: 14
