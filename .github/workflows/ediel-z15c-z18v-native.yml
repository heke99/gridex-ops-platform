name: Ediel Z15C Z18V native feedback

on:
  pull_request:
    paths:
      - '__tests__/ediel-at-z15c-z18v-esco-profile.test.ts'
      - 'scripts/ediel-at-z15c-z18v-esco-native.test.ts'
      - 'scripts/helpers/ediel-permission-field-omissions.ts'
      - 'scripts/fixtures/ediel-service-evidence-native.ts'
      - 'scripts/helpers/originalMailboxNative.ts'
      - 'scripts/helpers/utiltsConsumptionParties.ts'
      - 'scripts/ediel-source-owner-native.config.ts'
      - 'scripts/gridex-aud-003-clean-replay.sh'
      - 'scripts/migration-history-manifest*.json'
      - 'lib/ediel/services/**'
      - 'lib/ediel/permissions/**'
      - 'lib/ediel/flows/prodatServicePermission.ts'
      - 'lib/ediel/flows/inboundProcessing.ts'
      - 'lib/ediel/core/tenantResolver.ts'
      - 'lib/ediel/rulebook/canonicalPolicyFieldValidator.ts'
      - 'supabase/migrations/**'
      - '.github/workflows/ediel-z15c-z18v-native.yml'

permissions:
  contents: read

concurrency:
  group: ediel-z15c-z18v-native-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Supplemental feedback only. All ordinary OPS clean/upgrade/native/browser
# and parity gates remain mandatory; this does not approve any rule card.
jobs:
  z15c-z18v-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Execute the actual reserved permission pair after disposable clean replay
        shell: bash
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: |
          set -euo pipefail
          mkdir -p z15c-z18v-native-working
          # The existing owner keeps its EXIT cleanup trap. Replay/status
          # output can contain disposable credentials and is never uploaded.
          source scripts/gridex-aud-003-clean-replay.sh > "$RUNNER_TEMP/z15c-z18v-replay.log" 2>&1
          export GRIDEX_NATIVE_STATUS="$RUNNER_TEMP/z15c-z18v-native-status.json"
          supabase status -o json > "$GRIDEX_NATIVE_STATUS"
          native_tests=(scripts/ediel-at-z15c-z18v-esco-native.test.ts)
          export Z15C_Z18V_NATIVE_TEST_SCOPE
          Z15C_Z18V_NATIVE_TEST_SCOPE="$(printf '%s\n' "${native_tests[@]}")"
          native_exit=0
          GRIDEX_NATIVE_STATUS="$GRIDEX_NATIVE_STATUS" npx vitest run \
            --config scripts/ediel-source-owner-native.config.ts \
            "${native_tests[@]}" \
            --reporter=default --reporter=junit \
            --outputFile=z15c-z18v-native-working/native-junit.xml \
            > z15c-z18v-native-working/native.log 2>&1 || native_exit=$?
          export Z15C_Z18V_NATIVE_EXIT="$native_exit"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          test_scope = os.environ['Z15C_Z18V_NATIVE_TEST_SCOPE'].splitlines()
          paths = test_scope + ['.github/workflows/ediel-z15c-z18v-native.yml',
                   'scripts/fixtures/ediel-service-evidence-native.ts',
                   'scripts/helpers/ediel-permission-field-omissions.ts',
                   'scripts/helpers/originalMailboxNative.ts',
                   'scripts/helpers/utiltsConsumptionParties.ts',
                   'scripts/helpers/ediel-native-permission-catalog.setup.ts',
                   'scripts/gridex-redact-native-evidence.py',
                   'scripts/ediel-source-owner-native.config.ts',
                   'scripts/gridex-aud-003-clean-replay.sh',
                   'lib/ediel/services/administration.ts',
                   'lib/ediel/services/projection.ts',
                   'lib/ediel/flows/prodatServicePermission.ts',
                   'lib/ediel/flows/inboundProcessing.ts',
                   'lib/ediel/core/tenantResolver.ts',
                   'lib/ediel/rulebook/canonicalPolicyFieldValidator.ts',
                   'lib/ediel/core/receivedProdatFinalResponsePlan.ts',
                   'lib/ediel/ack/committedInboundAck.ts',
                   'lib/ediel/utilts/transactionPersistence.ts',
                   'scripts/migration-history-manifest.json',
                   'scripts/migration-history-manifest.additions.json',
                   'scripts/migration-history-manifest.runtime.additions.json']
          receipt = {
              'purpose': 'supplemental_actual_native_feedback',
              'checkout_sha': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'checkout_tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'native_exit_code': int(os.environ['Z15C_Z18V_NATIVE_EXIT']),
              'input_sha256': {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths},
              'test_scope': test_scope,
              'ordinary_required_gates': 'NOT_REPLACED',
              'schema_capture': 'NOT_RUN', 'browser_tests': 'NOT_RUN',
              'upgrade_parity': 'NOT_RUN', 'authentic_market_evidence': 'NOT_PROVIDED',
          }
          pathlib.Path('z15c-z18v-native-working/receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          python3 scripts/gridex-redact-native-evidence.py \
            --local-secrets "$GRIDEX_NATIVE_STATUS" --root z15c-z18v-native-working
          # Only successfully redacted files enter the uploaded directory.
          # Receipt/redaction failure leaves no artifact directory to upload.
          mv z15c-z18v-native-working z15c-z18v-native-evidence
          cat z15c-z18v-native-evidence/native.log
          rm -f "$GRIDEX_NATIVE_STATUS"
          exit "$native_exit"
      - name: Upload redacted native feedback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ediel-z15c-z18v-native-${{ github.event.pull_request.head.sha }}
          path: z15c-z18v-native-evidence/
          if-no-files-found: warn
          retention-days: 14
