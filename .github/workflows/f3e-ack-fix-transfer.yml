name: F3-E ACK boundary fix qualification
on:
  push:
    branches: [codex/f3e-ack-fix-transfer-20260917]
    paths: ['transfer/ack-fix.patch', '.github/workflows/f3e-ack-fix-transfer.yml']
permissions:
  contents: write
concurrency:
  group: f3e-ack-fix-transfer-20260917
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore only the reviewed four-file correction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f3e-ack-fix"
          cp transfer/ack-fix.patch "$RUNNER_TEMP/f3e-ack-fix/reviewed.patch"
          echo '9b059e21330322496f8d4d7b2476832d7430fee144433eb9c1a36d54786bb98b  transfer/ack-fix.patch' | sha256sum -c -
          git checkout --detach 70f5632d9ab8706f90b87837c44e43f516f424db
          git apply --check "$RUNNER_TEMP/f3e-ack-fix/reviewed.patch"
          git apply --index "$RUNNER_TEMP/f3e-ack-fix/reviewed.patch"
          test "$(git write-tree)" = fc13822822a7b905e77b9b14663c70488d75097e
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- supabase .github/workflows docs/ediel/masterplan-v2)"
      - run: npm ci
      - name: Run all actual application tests without changing assertions
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/f3e-ack-fix/vitest.json" 2>&1 | tee "$RUNNER_TEMP/f3e-ack-fix/vitest.log"
      - name: Verify source regressions and types
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-vm-modules --test scripts/test-ediel-prodat-document-fields.cjs
          npm run typecheck
          npm run typecheck:tests
          npm run typecheck:scripts
      - name: Publish exact qualified tree to the existing PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = fc13822822a7b905e77b9b14663c70488d75097e
          test "$(git ls-remote origin refs/heads/codex/ediel-v2-prodat-document-fields-20260917 | cut -f1)" = 70f5632d9ab8706f90b87837c44e43f516f424db
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ediel): preserve source document escapes through real ACK preflight'
          git archive --format=tar.gz --output="$RUNNER_TEMP/f3e-ack-fix/source.tar.gz" HEAD
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/f3e-ack-fix/provenance.txt"
          git push origin HEAD:refs/heads/codex/ediel-v2-prodat-document-fields-20260917
          cat "$RUNNER_TEMP/f3e-ack-fix/provenance.txt"
      - name: Retain qualification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f3e-ack-fix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/f3e-ack-fix/
          if-no-files-found: error
          retention-days: 14
