name: F3-F offline reproduction dependencies (not qualification)
on:
  push:
    branches: [codex/f3f-source-transfer-20260917-e3b2a640]
    paths: [.github/workflows/f3f-dependency-evidence.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aadcd597ba59817d6396900f5e8409ed1efeaa09
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact locked dependencies without lifecycle scripts
        run: |
          set -euo pipefail
          printf '88f4f36c97b4896442c3ce9cb837ea7f93a0fee55e6b63b477421b33b4b73d6b  package-lock.json\n' | sha256sum -c -
          npm ci --ignore-scripts
      - name: Retain dependency bytes and provenance only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f3f-deps"
          tar -czf "$RUNNER_TEMP/f3f-deps/node_modules.tar.gz" node_modules
          cp package-lock.json "$RUNNER_TEMP/f3f-deps/package-lock.json"
          {
            printf 'source=aadcd597ba59817d6396900f5e8409ed1efeaa09\n'
            node -p 'JSON.stringify({node:process.version,platform:process.platform,arch:process.arch})'
            printf 'install=npm ci --ignore-scripts\nscope=offline reproduction dependencies, not executed tests or release qualification\n'
          } > "$RUNNER_TEMP/f3f-deps/provenance.txt"
          (cd "$RUNNER_TEMP/f3f-deps" && sha256sum node_modules.tar.gz package-lock.json > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: f3f-deps-${{ github.run_id }}
          path: ${{ runner.temp }}/f3f-deps/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
