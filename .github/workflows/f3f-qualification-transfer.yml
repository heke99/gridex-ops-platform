name: F3-F source correction transfer (not release qualification)
on:
  push:
    branches: [codex/f3f-source-transfer-20260917-e3b2a640]
    paths: [.github/workflows/f3f-qualification-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify reviewed correction bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f3f-qualified-source"
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          patch = lzma.decompress(base64.b64decode(Path('.agent-transfer/f3f-qualification.b64').read_bytes(), validate=True))
          assert len(patch) == 32994
          assert hashlib.sha256(patch).hexdigest() == '045d9653b9ab602d2ed78670f6eb149d232a65f76ce9a508c44e812d2651abda'
          Path(os.environ['RUNNER_TEMP'], 'f3f-qualified-source', 'reviewed.patch').write_bytes(patch)
          PY
      - name: Publish reviewed source to a new isolated branch only
        shell: bash
        env:
          BASE: aadcd597ba59817d6396900f5e8409ed1efeaa09
          EXPECTED_TREE: 3ab14547025af2310e3f68ff7a2f9f6185aa3011
          TARGET: codex/f3f-qualified-code-20260917-3ab14547
        run: |
          set -euo pipefail
          test -z "$(git ls-remote --heads origin "refs/heads/$TARGET")"
          git fetch --no-tags --depth=1 origin "$BASE"
          git checkout --detach "$BASE"
          test "$(git rev-parse 'HEAD^{tree}')" = e3b2a640bc65ce492109ebcba714149e9ff95aa5
          git apply --check "$RUNNER_TEMP/f3f-qualified-source/reviewed.patch"
          git apply --index "$RUNNER_TEMP/f3f-qualified-source/reviewed.patch"
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 15
          test "$(git write-tree)" = "$EXPECTED_TREE"
          test -z "$(git diff --cached --name-only -- .github/workflows supabase)"
          if git ls-files | grep -E '^\.agent-transfer/f3f|^\.github/workflows/f3f-'; then
            echo 'Transfer helpers must not enter candidate'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ediel): retain UNA technical party context through NAD policy qualification' -m 'Exact reviewed tree3ab14547 from PR326 head aadcd597. Full1347/1347 local Vitest,848 source cases, all3TS groups and changed lint pass. Document source-backed synthetic fixture corrections; ordinary final-head CI/review still mandatory. No PR310/SQL/production changes.'
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          git push origin "HEAD:refs/heads/$TARGET"
          {
            printf 'base=%s\nbranch=%s\ncommit=%s\ntree=%s\n' "$BASE" "$TARGET" "$(git rev-parse HEAD)" "$EXPECTED_TREE"
            printf 'scope=source bytes only; no ordinary PR qualification or main merge asserted\n'
          } > "$RUNNER_TEMP/f3f-qualified-source/provenance.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/f3f-qualified-source/source.tar.gz" HEAD
          (cd "$RUNNER_TEMP/f3f-qualified-source" && sha256sum source.tar.gz reviewed.patch > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f3f-qualified-source-${{ github.run_id }}
          path: ${{ runner.temp }}/f3f-qualified-source/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
