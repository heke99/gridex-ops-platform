name: Fix billing contract date coverage

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[billing-contract-date-fix-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply Stockholm civil-date contract coverage fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/billing/billingGate.ts')
          text = path.read_text()

          marker = """function covers(\n  startValue: unknown,\n  endValue: unknown,\n  periodStart: number,\n  periodEnd: number,\n): boolean {"""
          helper = """function contractCivilDate(value: unknown): string | null {\n  const raw = text(value);\n  if (!raw) return null;\n  const datePart = raw.slice(0, 10);\n  return /^\\d{4}-\\d{2}-\\d{2}$/.test(datePart) ? datePart : raw;\n}\n\nfunction covers(\n  startValue: unknown,\n  endValue: unknown,\n  periodStart: number,\n  periodEnd: number,\n): boolean {"""
          if marker not in text:
            raise SystemExit('covers marker not found')
          text = text.replace(marker, helper, 1)

          old = """      !covers(\n        contract.starts_at ?? contract.start_date,\n        contract.ends_at ?? contract.end_date,\n        periodStart,\n        periodEnd,\n      )"""
          new = """      !covers(\n        contractCivilDate(contract.starts_at ?? contract.start_date),\n        contractCivilDate(contract.ends_at ?? contract.end_date),\n        periodStart,\n        periodEnd,\n      )"""
          if old not in text:
            raise SystemExit('contract coverage block not found')
          path.write_text(text.replace(old, new, 1))

          regression = Path('scripts/gridex-billing-contract-date-coverage-regression.cjs')
          regression.write_text(r'''const fs = require('node:fs')
          const assert = require('node:assert/strict')
          const source = fs.readFileSync('lib/billing/billingGate.ts', 'utf8')
          assert(source.includes('function contractCivilDate(value: unknown)'), 'billing gate must normalize contract validity to civil date')
          assert(source.includes('contractCivilDate(contract.starts_at ?? contract.start_date)'), 'contract start must use civil-date semantics')
          assert(source.includes('contractCivilDate(contract.ends_at ?? contract.end_date)'), 'contract end must use civil-date semantics')
          assert(source.includes('stockholmLocalToUtc'), 'civil dates must continue to resolve through Stockholm timezone')
          console.log('gridex-billing-contract-date-coverage-regression: PASS')
          ''')
      - run: npm ci
      - run: node scripts/gridex-billing-contract-date-coverage-regression.cjs
      - run: node scripts/pricing-billing-source-regression.cjs
      - run: node scripts/gridex-open-ended-contract-lifecycle-regression.cjs
      - run: npm run typecheck
      - name: Commit verified fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/billing/billingGate.ts scripts/gridex-billing-contract-date-coverage-regression.cjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix Stockholm contract coverage in billing gate [billing-contract-date-fix-bot]'
          git push origin HEAD:main
