name: fix-canonical-ack-evidence
on:
  push:
    branches: [fix/canonical-ack-evidence]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-ack-evidence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch canonical outbound ACK persistence evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/ediel/types.ts'); s=p.read_text()
          a="  communication_route_id: string | null;\n  rule_profile_key?: string | null;"; b="  communication_route_id: string | null;\n  route_profile_id?: string | null;\n  canonical_rule_pack_id?: string | null;\n  source_operation_id?: string | null;\n  rule_profile_key?: string | null;"
          if a not in s: raise SystemExit('row anchor missing')
          s=s.replace(a,b,1)
          a="  communicationRouteId?: string | null;\n  ruleProfileKey?: string | null;"; b="  communicationRouteId?: string | null;\n  routeProfileId?: string | null;\n  canonicalRulePackId?: string | null;\n  sourceOperationId?: string | null;\n  ruleProfileKey?: string | null;"
          if a not in s: raise SystemExit('input anchor missing')
          p.write_text(s.replace(a,b,1))
          p=Path('lib/ediel/db.ts'); s=p.read_text(); a="    communication_route_id: input.communicationRouteId ?? null,\n    rule_profile_key: input.ruleProfileKey ?? null,"; b="    communication_route_id: input.communicationRouteId ?? null,\n    route_profile_id: input.routeProfileId ?? null,\n    canonical_rule_pack_id: input.canonicalRulePackId ?? null,\n    source_operation_id: input.sourceOperationId ?? null,\n    rule_profile_key: input.ruleProfileKey ?? null,"
          if a not in s: raise SystemExit('db anchor missing')
          p.write_text(s.replace(a,b,1))
          p=Path('lib/ediel/core/kernel.ts'); s=p.read_text(); a="  const actorUserId = ensureActorUserId(params.actorUserId)\n  const sourceSnapshot = inheritedSourceRulePackSnapshot(params.sourceMessage)\n\n  const draftWithSourceSnapshot: CreateEdielMessageInput = {"; b="  const actorUserId = ensureActorUserId(params.actorUserId)\n  const sourceSnapshot = inheritedSourceRulePackSnapshot(params.sourceMessage)\n  const companyId = params.draft.companyId ?? params.sourceMessage.company_id ?? null\n  if (!companyId) throw new Error('canonical_ack_company_required')\n  const canonicalRulePackId = params.sourceMessage.canonical_rule_pack_id ?? null\n  if (!canonicalRulePackId) throw new Error(`canonical_ack_source_rule_pack_id_missing:${params.sourceMessage.id}`)\n  const environment = params.draft.environment ?? params.sourceMessage.environment\n  const routeContext = await resolveCanonicalOutboundContext({ requestType: 'ediel_ack', companyId, environment, messageStandard: params.draft.messageStandard ?? 'edifact' })\n  const routeProfileId = routeContext.routeRuntime?.route_profile_id ?? null\n  if (!routeProfileId) throw new Error(`canonical_ack_route_profile_required:${routeContext.route.id}`)\n\n  const draftWithSourceSnapshot: CreateEdielMessageInput = {"
          if a not in s: raise SystemExit('kernel prelude missing')
          s=s.replace(a,b,1); a="    companyId: draftWithSourceSnapshot.companyId ?? params.sourceMessage.company_id ?? null,\n    externalReference: refs.externalReference,"; b="    companyId,\n    communicationRouteId: routeContext.route.id,\n    routeProfileId,\n    canonicalRulePackId,\n    sourceOperationId: `ediel_ack:${params.sourceMessage.id}:${params.ackFamily}:${sequenceToken ?? 'message'}`,\n    externalReference: refs.externalReference,"
          if a not in s: raise SystemExit('kernel input missing')
          p.write_text(s.replace(a,b,1))
          Path('scripts/gridex-canonical-ack-persistence-regression.cjs').write_text("const fs=require('node:fs'),a=require('node:assert/strict');const t=fs.readFileSync('lib/ediel/types.ts','utf8'),d=fs.readFileSync('lib/ediel/db.ts','utf8'),k=fs.readFileSync('lib/ediel/core/kernel.ts','utf8');for(const x of ['canonicalRulePackId?: string | null','routeProfileId?: string | null','sourceOperationId?: string | null'])a.ok(t.includes(x),x);for(const x of ['canonical_rule_pack_id: input.canonicalRulePackId ?? null','route_profile_id: input.routeProfileId ?? null','source_operation_id: input.sourceOperationId ?? null'])a.ok(d.includes(x),x);for(const x of [\"requestType: 'ediel_ack'\",'params.sourceMessage.canonical_rule_pack_id','communicationRouteId: routeContext.route.id','canonicalRulePackId,','sourceOperationId: `ediel_ack:'])a.ok(k.includes(x),x);console.log('canonical ACK persistence regression: PASS');\n")
          PY
      - run: npm ci
      - run: node scripts/gridex-canonical-ack-persistence-regression.cjs
      - run: npm run typecheck
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ediel/types.ts lib/ediel/db.ts lib/ediel/core/kernel.ts scripts/gridex-canonical-ack-persistence-regression.cjs
          git commit -m "Fix canonical outbound ACK persistence evidence"
          git push origin HEAD:fix/canonical-ack-evidence
