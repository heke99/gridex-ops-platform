name: Fix canonical transport security convergence one-shot

on:
  push:
    branches:
      - fix/canonical-transport-security-convergence-20260903

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Converge transport security resolution
        shell: python
        run: |
          from pathlib import Path
          import re

          party = Path('lib/ediel/partyRegistry.ts')
          text = party.read_text()
          anchor = "export function transportSecurityModeToEncryptionMode(mode?: string | null): 'smime' | 'none' | null {"
          helper = """export function resolveRouteTransportSecurityMode(params: {\n  transportSecurityMode?: unknown\n  encryptionMode?: unknown\n}): EdielTransportSecurityMode {\n  const explicit = String(params.transportSecurityMode ?? '').trim()\n  if (explicit) return normalizeTransportSecurityMode(explicit)\n\n  // transport_mode is a protocol (for example smtp_imap), never a security policy.\n  // Legacy/materialized routes persist the effective security decision in encryption_mode.\n  const encryption = String(params.encryptionMode ?? '').trim().toLowerCase()\n  if (encryption === 'encrypted' || encryption === 'smime' || encryption === 's/mime') return 'encrypted'\n  if (encryption === 'unencrypted' || encryption === 'none' || encryption === 'plain') return 'unencrypted'\n  return 'needs_verification'\n}\n\n"""
          if 'export function resolveRouteTransportSecurityMode' not in text:
              if anchor not in text: raise SystemExit('partyRegistry anchor missing')
              text = text.replace(anchor, helper + anchor)
          party.write_text(text)

          send = Path('lib/ediel/sendContextConsistency.ts')
          text = send.read_text()
          text = text.replace("  normalizeTransportSecurityMode,\n", "  resolveRouteTransportSecurityMode,\n")
          text, count = re.subn(
              r"export function resolveRouteTransportSecurityMode\(params: \{[\s\S]*?\n\}\n\nfunction expectedMessageEnvironment",
              "function expectedMessageEnvironment",
              text,
              count=1,
          )
          if count != 1: raise SystemExit(f'sendContext resolver removal count={count}')
          send.write_text(text)

          config = Path('lib/ediel/config.ts')
          text = config.read_text()
          text = text.replace(
              "import { normalizeTransportSecurityMode } from '@/lib/ediel/partyRegistry'",
              "import { resolveRouteTransportSecurityMode } from '@/lib/ediel/partyRegistry'",
          )
          old = "const transportSecurityMode = normalizeTransportSecurityMode(runtime.transport_security_mode)"
          new = """const transportSecurityMode = resolveRouteTransportSecurityMode({\n    transportSecurityMode: runtime.transport_security_mode,\n    encryptionMode: runtime.encryption_mode,\n  })"""
          if old not in text: raise SystemExit('config resolver anchor missing')
          text = text.replace(old, new, 1)
          config.write_text(text)

          transport = Path('lib/ediel/transport/index.part-1.ts')
          text = transport.read_text()
          text = text.replace(
              "import { isAgtPortalProdatAddress, normalizeTransportSecurityMode } from '@/lib/ediel/partyRegistry'",
              "import { isAgtPortalProdatAddress, resolveRouteTransportSecurityMode } from '@/lib/ediel/partyRegistry'",
          )
          old = """  const rawTransportSecurityMode = routeProfile?.transport_security_mode ?? routeProfile?.transport_mode ?? null\n  const transportSecurityMode = rawTransportSecurityMode\n    ? normalizeTransportSecurityMode(rawTransportSecurityMode)\n    : null"""
          new = """  const transportSecurityMode = resolveRouteTransportSecurityMode({\n    transportSecurityMode: routeProfile?.transport_security_mode,\n    encryptionMode: effectiveEncryptionMode,\n  })"""
          if old not in text: raise SystemExit('transport resolver anchor missing')
          text = text.replace(old, new, 1)
          transport.write_text(text)

          test = Path('__tests__/ediel-transport-security-resolution.test.ts')
          test.write_text("""import { describe, expect, it } from 'vitest'\nimport { evaluateProductionTransportSecurity } from '@/lib/ediel/config'\nimport { resolveRouteTransportSecurityMode } from '@/lib/ediel/partyRegistry'\n\ndescribe('Ediel route transport security resolution', () => {\n  it('prefers an explicit verified transport-security policy', () => {\n    expect(resolveRouteTransportSecurityMode({ transportSecurityMode: 'required_encrypted', encryptionMode: 'none' })).toBe('required_encrypted')\n  })\n\n  it('uses persisted S/MIME encryption as the safe legacy/materialized fallback', () => {\n    expect(resolveRouteTransportSecurityMode({ transportSecurityMode: null, encryptionMode: 'smime' })).toBe('encrypted')\n  })\n\n  it('uses explicit unencrypted encryption state as the legacy/materialized fallback', () => {\n    expect(resolveRouteTransportSecurityMode({ transportSecurityMode: null, encryptionMode: 'none' })).toBe('unencrypted')\n  })\n\n  it('does not treat a transport protocol such as smtp_imap as a security policy', () => {\n    expect(resolveRouteTransportSecurityMode({ transportSecurityMode: null, encryptionMode: null })).toBe('needs_verification')\n  })\n\n  it('fails closed for an unknown explicit security policy instead of falling through to encryption', () => {\n    expect(resolveRouteTransportSecurityMode({ transportSecurityMode: 'smtp_imap', encryptionMode: 'smime' })).toBe('needs_verification')\n  })\n\n  it('accepts Mariam-style materialized production PRODAT S/MIME runtime', () => {\n    const result = evaluateProductionTransportSecurity({\n      runtime: {\n        environment: 'production',\n        message_standard: 'edifact',\n        message_family: 'PRODAT',\n        transport_security_mode: null,\n        encryption_mode: 'smime',\n        certificate_id: '469468a2-ce02-4f7f-8c28-db04ad22e300',\n        allow_unencrypted_production: false,\n        allow_unencrypted_production_expires_at: null,\n        allow_unencrypted_production_reason: null,\n      },\n      messageFamily: 'PRODAT',\n    })\n    expect(result.ok).toBe(true)\n    expect(result.issues).toEqual([])\n  })\n})\n""")
      - name: Verify focused transport regression and types
        run: |
          npx vitest run __tests__/ediel-transport-security-resolution.test.ts
          npm run typecheck
      - name: Ensure old protocol fallback is gone
        run: |
          ! grep -R "transport_security_mode ?? routeProfile?.transport_mode" lib/ediel
          ! grep -R "normalizeTransportSecurityMode(runtime.transport_security_mode)" lib/ediel/config.ts
      - name: Commit convergence fix and remove one-shot runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-canonical-transport-security-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/ediel/partyRegistry.ts lib/ediel/sendContextConsistency.ts lib/ediel/config.ts lib/ediel/transport/index.part-1.ts __tests__/ediel-transport-security-resolution.test.ts .github/workflows/fix-canonical-transport-security-one-shot.yml
          git commit -m 'Converge canonical Ediel transport security resolution'
          git push origin HEAD:fix/canonical-transport-security-convergence-20260903
