name: Fix open-ended contract lifecycle

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[open-ended-contract-fix-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply open-ended contract lifecycle fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/customer-contracts/lifecycle.ts')
          text = path.read_text()

          old = """  const boundUntil = startsAt\n    ? addMonths(startsAt, input.bindingMonths ?? 0)\n    : null\n\n  const noticeEffectiveEndDate = terminationNoticeDate\n    ? addMonths(terminationNoticeDate, input.noticeMonths ?? 0)\n    : null\n\n  return maxDate(boundUntil, noticeEffectiveEndDate)"""
          new = """  const bindingMonths =\n    typeof input.bindingMonths === 'number' && Number.isFinite(input.bindingMonths) && input.bindingMonths > 0\n      ? input.bindingMonths\n      : null\n  const boundUntil = startsAt && bindingMonths\n    ? addMonths(startsAt, bindingMonths)\n    : null\n\n  const noticeEffectiveEndDate = terminationNoticeDate\n    ? addMonths(terminationNoticeDate, input.noticeMonths ?? 0)\n    : null\n\n  return maxDate(boundUntil, noticeEffectiveEndDate)"""
          if old not in text:
            raise SystemExit('deriveContractEndsAt block not found')
          text = text.replace(old, new, 1)

          old = """  const boundUntil = startsAt ? addMonths(startsAt, input.bindingMonths ?? 0) : null\n  const noticeEffectiveEndDate = terminationNoticeDate"""
          new = """  const bindingMonths =\n    typeof input.bindingMonths === 'number' && Number.isFinite(input.bindingMonths) && input.bindingMonths > 0\n      ? input.bindingMonths\n      : null\n  const boundUntil = startsAt && bindingMonths ? addMonths(startsAt, bindingMonths) : null\n  const noticeEffectiveEndDate = terminationNoticeDate"""
          if old not in text:
            raise SystemExit('summary boundUntil block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          regression = Path('scripts/gridex-open-ended-contract-lifecycle-regression.cjs')
          regression.write_text(r'''const fs = require('node:fs')
          const assert = require('node:assert/strict')
          const source = fs.readFileSync('lib/customer-contracts/lifecycle.ts', 'utf8')

          assert(source.includes("input.bindingMonths > 0"), 'binding must only create a contractual end when strictly positive')
          assert(source.includes("const boundUntil = startsAt && bindingMonths"), 'open-ended contracts must not derive end from start date')
          assert(!source.includes("addMonths(startsAt, input.bindingMonths ?? 0)"), 'zero/null binding must not collapse ends_at to starts_at')
          console.log('gridex-open-ended-contract-lifecycle-regression: PASS')
          ''')
      - run: npm ci
      - run: node scripts/gridex-open-ended-contract-lifecycle-regression.cjs
      - run: node scripts/pricing-billing-source-regression.cjs
      - run: npm run typecheck
      - name: Commit verified fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/customer-contracts/lifecycle.ts scripts/gridex-open-ended-contract-lifecycle-regression.cjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix open-ended contract lifecycle for billing [open-ended-contract-fix-bot]'
          git push origin HEAD:main
