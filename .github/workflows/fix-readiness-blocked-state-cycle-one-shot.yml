name: Fix readiness blocked-state cycle one-shot

on:
  push:
    branches:
      - fix/readiness-blocked-state-cycle-20260903
    paths:
      - .github/workflows/fix-readiness-blocked-state-cycle-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/readiness-blocked-state-cycle-20260903
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Decouple readiness from fail-closed production lifecycle state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/ediel/productionReadiness.part-1.ts')
          text = path.read_text()
          old = '''  if (\n    !isActiveCompanyStatus(input.companyStatus) ||\n    productionStatus === "blocked"\n  )\n    return "blocked";\n  if (input.productionEnabled && input.liveApprovedAt) return "live";\n'''
          new = '''  if (!isActiveCompanyStatus(input.companyStatus)) return "blocked";\n  if (\n    productionStatus === "live" &&\n    input.productionEnabled &&\n    input.liveApprovedAt\n  )\n    return "live";\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one circular lifecycle gate, found={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          cat > __tests__/ediel-readiness-blocked-state-cycle.test.ts <<'TS'
          import { describe, expect, it } from 'vitest'
          import { deriveProductionReadinessStatus } from '@/lib/ediel/productionReadiness'

          const blockingIssue = {
            code: 'actual_blocker',
            label: 'Actual blocker',
            message: 'A real readiness blocker exists.',
            severity: 'blocking' as const,
            area: 'safety' as const,
          }

          const warning = {
            code: 'warning_only',
            label: 'Warning only',
            message: 'A non-blocking warning exists.',
            severity: 'warning' as const,
            area: 'safety' as const,
          }

          describe('production readiness lifecycle separation', () => {
            it('allows fresh readiness to become ready while production is fail-closed blocked', () => {
              expect(deriveProductionReadinessStatus({
                blockingIssues: [],
                warnings: [],
                companyStatus: 'active',
                productionStatus: 'blocked',
                productionEnabled: false,
                liveApprovedAt: '2026-09-03T12:50:52.938Z',
              })).toBe('ready')
            })

            it('returns warning rather than blocked when only warnings remain', () => {
              expect(deriveProductionReadinessStatus({
                blockingIssues: [],
                warnings: [warning],
                companyStatus: 'active',
                productionStatus: 'blocked',
                productionEnabled: false,
              })).toBe('warning')
            })

            it('still fails readiness when a real blocker exists', () => {
              expect(deriveProductionReadinessStatus({
                blockingIssues: [blockingIssue],
                warnings: [],
                companyStatus: 'active',
                productionStatus: 'blocked',
                productionEnabled: false,
              })).toBe('not_ready')
            })

            it('does not report live from stale approval flags while lifecycle state is blocked', () => {
              expect(deriveProductionReadinessStatus({
                blockingIssues: [],
                warnings: [],
                companyStatus: 'active',
                productionStatus: 'blocked',
                productionEnabled: true,
                liveApprovedAt: '2026-09-03T12:50:52.938Z',
              })).toBe('ready')
            })

            it('keeps paused and inactive tenants fail-closed', () => {
              expect(deriveProductionReadinessStatus({
                blockingIssues: [],
                warnings: [],
                companyStatus: 'active',
                productionStatus: 'paused',
                productionEnabled: false,
              })).toBe('paused')

              expect(deriveProductionReadinessStatus({
                blockingIssues: [],
                warnings: [],
                companyStatus: 'suspended',
                productionStatus: 'blocked',
                productionEnabled: false,
              })).toBe('blocked')
            })
          })
          TS

      - name: Verify lifecycle regression and types
        run: |
          npx vitest run __tests__/ediel-readiness-blocked-state-cycle.test.ts __tests__/ediel-production-readiness-test-authority.test.ts
          node scripts/ediel-production-readiness-regression.cjs
          npm run typecheck
      - name: Commit lifecycle fix and remove one-shot runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-readiness-blocked-state-cycle-one-shot.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/ediel/productionReadiness.part-1.ts __tests__/ediel-readiness-blocked-state-cycle.test.ts .github/workflows/fix-readiness-blocked-state-cycle-one-shot.yml
          git diff --cached --check
          git commit -m "Decouple Ediel readiness from blocked production state"
          git push origin HEAD:fix/readiness-blocked-state-cycle-20260903
