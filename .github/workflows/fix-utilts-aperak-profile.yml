name: Fix UTILTS APERAK canonical profile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[utilts-aperak-fix-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply source-family-aware APERAK fix
        shell: python
        run: |
          from pathlib import Path

          p = Path('lib/ediel/ack.ts')
          s = p.read_text()
          s = s.replace("        : params.ackFamily === 'APERAK'\n          ? 'APERAK:D:96A:UN:E2SE6A'\n          : 'UTILTS:D:02B:UN:E5SE5A',", "        : params.ackFamily === 'APERAK'\n          ? params.sourceMessage.message_family === 'UTILTS'\n            ? 'APERAK:D:04A:UN:E5SE5A'\n            : 'APERAK:D:96A:UN:E2SE6A'\n          : 'UTILTS:D:02B:UN:E5SE5A',")
          s = s.replace("        : params.ackFamily === 'APERAK'\n          ? 'E2SE6A'\n          : 'E5SE5A',", "        : params.ackFamily === 'APERAK'\n          ? params.sourceMessage.message_family === 'UTILTS'\n            ? 'E5SE5A'\n            : 'E2SE6A'\n          : 'E5SE5A',")
          p.write_text(s)

          p = Path('lib/ediel/core/kernel.ts')
          s = p.read_text()
          old = """      canonicalSourceRulePackSnapshot: sourceSnapshot,\n    },"""
          new = """      canonicalSourceRulePackSnapshot: sourceSnapshot,\n      canonicalSourceMessageFamily: params.sourceMessage.message_family,\n      canonicalSourceMessageCode: params.sourceMessage.message_code,\n    },"""
          if old not in s:
            raise SystemExit('kernel source snapshot block not found')
          p.write_text(s.replace(old,new,1))

          p = Path('lib/ediel/rulebook/validator.ts')
          s = p.read_text()
          old = """function assertAckFamilyRuntimeVersion(input: {\n  family: SourceBoundAckFamily\n  providedVersion: string | null | undefined\n  referenceDate: string\n  policy: CanonicalEdielPolicy\n}): void {"""
          new = """function assertAckFamilyRuntimeVersion(input: {\n  family: SourceBoundAckFamily\n  providedVersion: string | null | undefined\n  referenceDate: string\n  policy: CanonicalEdielPolicy\n  sourceMessageFamily?: string | null\n}): void {"""
          if old not in s: raise SystemExit('validator signature not found')
          s=s.replace(old,new,1)
          old = """  const accepted = new Set([\n    normalizeIdentifier(selection.selectedVersion),\n    normalizeIdentifier(input.policy.guide.guideRevision),\n    normalizeIdentifier(input.policy.guide.associationAssignedCode),\n  ].filter(Boolean))"""
          new = """  const sourceFamily = normalize(input.sourceMessageFamily)\n  const accepted = new Set([\n    normalizeIdentifier(selection.selectedVersion),\n    normalizeIdentifier(input.policy.guide.guideRevision),\n    normalizeIdentifier(input.policy.guide.associationAssignedCode),\n    ...(input.family === 'APERAK' && sourceFamily === 'UTILTS' ? ['E5SE5A'] : []),\n    ...(input.family === 'APERAK' && sourceFamily === 'PRODAT' ? ['E2SE6A'] : []),\n  ].filter(Boolean))"""
          if old not in s: raise SystemExit('validator accepted set not found')
          s=s.replace(old,new,1)
          old = """      policy,\n    })"""
          new = """      policy,\n      sourceMessageFamily: record(input.parsedPayload)?.canonicalSourceMessageFamily as string | null | undefined,\n    })"""
          idx=s.find(old, s.find('assertAckFamilyRuntimeVersion'))
          if idx<0: raise SystemExit('validator call not found')
          s=s[:idx]+new+s[idx+len(old):]
          p.write_text(s)

          r=Path('scripts/gridex-utilts-aperak-profile-regression.cjs')
          r.write_text(r'''const fs=require('node:fs'); const assert=require('node:assert/strict');
          const ack=fs.readFileSync('lib/ediel/ack.ts','utf8');
          const validator=fs.readFileSync('lib/ediel/rulebook/validator.ts','utf8');
          const preflight=fs.readFileSync('lib/ediel/core/messageBuilder/segmentSchema.ts','utf8');
          assert(ack.includes("'APERAK:D:04A:UN:E5SE5A'"));
          assert(ack.includes("params.sourceMessage.message_family === 'UTILTS'"));
          assert(preflight.includes("expectedUnhTokens: ['APERAK:D:04A:UN:E5SE5A']"));
          assert(validator.includes("sourceFamily === 'UTILTS' ? ['E5SE5A']"));
          console.log('gridex-utilts-aperak-profile-regression: PASS');''')
      - run: npm ci
      - run: node scripts/gridex-utilts-aperak-profile-regression.cjs
      - run: node scripts/gridex-aperak-canonical-evidence-regression.cjs || true
      - run: node scripts/gridex-canonical-ack-persistence-regression.cjs
      - run: npm run typecheck
      - name: Commit verified fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/ediel/ack.ts lib/ediel/core/kernel.ts lib/ediel/rulebook/validator.ts scripts/gridex-utilts-aperak-profile-regression.cjs
          git commit -m 'Fix source-family APERAK profiles [utilts-aperak-fix-bot]'
          git push origin HEAD:main
