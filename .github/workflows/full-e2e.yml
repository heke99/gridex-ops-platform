name: Gridex full E2E

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: E2E suite to run
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full
          - runtime
          - real
          - all

permissions:
  contents: read

concurrency:
  group: gridex-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  smoke:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify executable PROJECT_E2E P0 contract
        run: node scripts/gridex-p0-executor.cjs
      - name: Run tenant-wide smoke certificate
        run: node scripts/gridex-full-production-e2e.cjs --mode=smoke
      - name: Build sanitized AI verification handoff
        if: always()
        run: node scripts/gridex-ai-verification-handoff.cjs
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gridex-e2e-smoke-${{ github.run_id }}
          path: e2e-artifacts/
          if-no-files-found: error
          retention-days: 14

  coverage:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Vitest V8 coverage
        run: npm run test:coverage -- --reporter=default --reporter=junit --outputFile=coverage/ediel-unit-junit.xml
      - name: Record immutable Ediel document coverage separately
        run: |
          mkdir -p coverage
          node scripts/check-ediel-masterplan-v2.cjs > coverage/ediel-document-integrity.json
      - name: Enforce measured coverage ratchet when baseline exists
        shell: bash
        run: |
          if [[ -f config/coverage-baseline.json ]]; then
            node scripts/check-coverage-ratchet.cjs
          else
            echo '::notice::Coverage baseline not committed yet; this run is the baseline measurement pass.'
          fi
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gridex-coverage-${{ github.run_id }}
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
            coverage/ediel-document-integrity.json
            coverage/ediel-unit-junit.xml
          if-no-files-found: error
          retention-days: 30

  pr-certificate:
    if: always() && github.event_name == 'pull_request'
    needs: [smoke, coverage]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Download executed smoke evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gridex-e2e-smoke-${{ github.run_id }}
          path: e2e-artifacts/inputs/smoke
      - name: Await the existing native producer at this exact checkout
        id: native_producer_wait
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_sha="$(git --no-replace-objects rev-parse HEAD)"
          native_run_id="$(
            gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${head_sha}&per_page=100" |
            node -e '
              const assert = require("node:assert/strict");
              const inventory = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
              const [repository, head] = process.argv.slice(1);
              assert(/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository));
              assert(/^[0-9a-f]{40}$/.test(head));
              assert(Array.isArray(inventory.workflow_runs) && Number.isSafeInteger(inventory.total_count)
                && inventory.total_count <= inventory.workflow_runs.length, "native_run_inventory_incomplete");
              const runs = inventory.workflow_runs.filter(run => run.head_sha === head
                && run.path === ".github/workflows/ops-hardening.yml"
                && run.repository?.full_name === repository && run.head_repository?.full_name === repository
                && ["pull_request", "push"].includes(run.event));
              assert(runs.length && runs.every(run => Number.isSafeInteger(run.run_number) && run.run_number > 0), "native_run_missing");
              const latest = runs.filter(run => run.run_number === Math.max(...runs.map(row => row.run_number)));
              assert(latest.length === 1 && Number.isSafeInteger(latest[0].id) && latest[0].id > 0, "native_run_not_unique");
              process.stdout.write(String(latest[0].id));
            ' "$GITHUB_REPOSITORY" "$head_sha"
          )"
          printf 'run_id=%s\n' "$native_run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$native_run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
      - name: Record the failed exact native gate
        if: failure() && steps.native_producer_wait.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ steps.native_producer_wait.outputs.run_id }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const positiveId = /^[1-9][0-9]*$/;
          const repository = process.env.GITHUB_REPOSITORY || '';
          const source = execFileSync('git', ['--no-replace-objects', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const workflowRun = process.env.GITHUB_RUN_ID || '';
          const workflowAttempt = process.env.GITHUB_RUN_ATTEMPT || '';
          if (!/^[0-9a-f]{40}$/.test(source) || !positiveId.test(workflowRun) || !positiveId.test(workflowAttempt)) {
            throw new Error('native_gate_failure_checkout_unqualified');
          }
          const id = process.env.NATIVE_RUN_ID || '';
          let producer = null;
          let reason = 'producer_not_selected';
          if (positiveId.test(id) && /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository)) {
            reason = 'producer_readback_unavailable';
            let run;
            try {
              run = JSON.parse(execFileSync('gh', ['api', 'repos/' + repository + '/actions/runs/' + id],
                { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'], timeout: 20000 }));
            } catch {}
            if (run) {
              reason = 'producer_readback_unqualified';
              if (String(run.id) === id && run.head_sha === source && run.path === '.github/workflows/ops-hardening.yml'
                && run.repository?.full_name === repository && run.head_repository?.full_name === repository
                && ['pull_request', 'push'].includes(run.event) && Number.isSafeInteger(run.run_attempt) && run.run_attempt > 0
                && run.status === 'completed'
                && ['success', 'failure', 'cancelled', 'timed_out', 'action_required', 'neutral', 'skipped', 'stale', 'startup_failure'].includes(run.conclusion)) {
                producer = { run_id: id, run_attempt: run.run_attempt, conclusion: run.conclusion };
                reason = run.conclusion === 'success' ? 'producer_wait_failed' : 'producer_failed';
              }
            }
          }
          fs.mkdirSync('e2e-artifacts', { recursive: true });
          fs.writeFileSync('e2e-artifacts/pr-native-gate-failure.json', JSON.stringify({
            schema_version: 1, verdict: 'RED', candidate_sha: source, workflow_run_id: workflowRun,
            workflow_run_attempt: workflowAttempt, reason, native_producer: producer,
          }, null, 2) + '\n');
          NODE
      - name: Upload failed native gate diagnosis
        if: failure() && steps.native_producer_wait.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gridex-pr-native-gate-failure-${{ github.run_id }}
          path: e2e-artifacts/pr-native-gate-failure.json
          if-no-files-found: error
          retention-days: 30
      - name: Require deterministic PR gates to execute and pass
        shell: bash
        env:
          SMOKE_RESULT: ${{ needs.smoke.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/gridex-full-production-e2e.cjs --certificate=pr
      - uses: actions/upload-artifact@v4
        if: always() && steps.native_producer_wait.outcome == 'success'
        with:
          name: gridex-pr-release-certificate-${{ github.run_id }}
          path: e2e-artifacts/pr-release-certificate.json
          if-no-files-found: error
          retention-days: 30

  full:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'full' || inputs.mode == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify executable PROJECT_E2E P0 contract
        run: node scripts/gridex-p0-executor.cjs
      - name: Run full production release certificate
        env:
          NODE_OPTIONS: --max-old-space-size=8192 --require=${{ github.workspace }}/scripts/lib/refactor-safe-static-read.cjs
        run: node scripts/gridex-full-production-e2e.cjs --mode=full
      - name: Build sanitized AI verification handoff
        if: always()
        run: node scripts/gridex-ai-verification-handoff.cjs
      - name: Upload full E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'all' && format('gridex-e2e-full-{0}-{1}', github.run_id, github.run_attempt) || format('gridex-e2e-full-{0}', github.run_id) }}
          path: e2e-artifacts/
          if-no-files-found: error
          retention-days: 30

  runtime-staging:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'runtime' || inputs.mode == 'all'))
    environment: staging-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRIDEX_E2E_SUPABASE_URL: ${{ secrets.GRIDEX_E2E_SUPABASE_URL }}
      GRIDEX_E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.GRIDEX_E2E_SUPABASE_SERVICE_ROLE_KEY }}
      GRIDEX_E2E_ACTOR_USER_ID: ${{ secrets.GRIDEX_E2E_ACTOR_USER_ID }}
      GRIDEX_E2E_STAGING_PROJECT_REF: ${{ vars.GRIDEX_E2E_STAGING_PROJECT_REF }}
      GRIDEX_E2E_TARGET: staging
      GRIDEX_E2E_CONFIRM_STAGING: 'YES'
      GRIDEX_E2E_ALLOW_MUTATION: 'YES'
      GRIDEX_E2E_ALLOW_OUTBOUND: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require isolated staging configuration
        run: node scripts/gridex-full-production-e2e.cjs --staging-preflight=runtime
      - name: Run fresh-tenant runtime certificate
        run: node scripts/gridex-full-production-e2e.cjs --mode=runtime
      - name: Build sanitized AI verification handoff
        if: always()
        run: node scripts/gridex-ai-verification-handoff.cjs
      - name: Upload runtime E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'all' && format('gridex-e2e-runtime-{0}-{1}', github.run_id, github.run_attempt) || format('gridex-e2e-runtime-{0}', github.run_id) }}
          path: e2e-artifacts/
          if-no-files-found: error
          retention-days: 30

  real-customer-staging:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'real' || inputs.mode == 'all'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRIDEX_E2E_SUPABASE_URL: ${{ secrets.GRIDEX_E2E_SUPABASE_URL }}
      GRIDEX_E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.GRIDEX_E2E_SUPABASE_SERVICE_ROLE_KEY }}
      GRIDEX_E2E_REAL_COMPANY_ID: ${{ secrets.GRIDEX_E2E_REAL_COMPANY_ID }}
      GRIDEX_E2E_REAL_CUSTOMER_ID: ${{ secrets.GRIDEX_E2E_REAL_CUSTOMER_ID }}
      GRIDEX_E2E_REAL_SITE_ID: ${{ secrets.GRIDEX_E2E_REAL_SITE_ID }}
      GRIDEX_E2E_REAL_CONTRACT_ID: ${{ secrets.GRIDEX_E2E_REAL_CONTRACT_ID }}
      GRIDEX_E2E_REAL_CUSTOMER_NUMBER: ${{ secrets.GRIDEX_E2E_REAL_CUSTOMER_NUMBER }}
      GRIDEX_E2E_REAL_REQUIRE_LEGAL: ${{ vars.GRIDEX_E2E_REAL_REQUIRE_LEGAL }}
      GRIDEX_E2E_REAL_REQUIRE_BILLING: ${{ vars.GRIDEX_E2E_REAL_REQUIRE_BILLING }}
      GRIDEX_E2E_TARGET: staging
      GRIDEX_E2E_REAL_CUSTOMER_CONFIRM: 'YES'
      GRIDEX_E2E_ALLOW_OUTBOUND: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require protected real-customer staging fixture
        shell: bash
        run: |
          set -euo pipefail
          for name in GRIDEX_E2E_SUPABASE_URL GRIDEX_E2E_SUPABASE_SERVICE_ROLE_KEY GRIDEX_E2E_REAL_COMPANY_ID GRIDEX_E2E_REAL_CUSTOMER_ID; do
            [[ -n "${!name:-}" ]] || { echo "Missing required protected staging fixture: $name" >&2; exit 1; }
          done
      - name: Run persistent real-customer certificate
        run: node scripts/gridex-full-production-e2e.cjs --mode=real
      - name: Build sanitized AI verification handoff
        if: always()
        run: node scripts/gridex-ai-verification-handoff.cjs
      - name: Upload real-customer E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'all' && format('gridex-e2e-real-customer-{0}-{1}', github.run_id, github.run_attempt) || format('gridex-e2e-real-customer-{0}', github.run_id) }}
          path: e2e-artifacts/
          if-no-files-found: error
          retention-days: 30

  nightly-release-certificate:
    if: always() && github.event_name == 'schedule'
    needs: [full, runtime-staging, real-customer-staging]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Download executed full evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gridex-e2e-full-${{ github.run_id }}
          path: e2e-artifacts/inputs/full
      - name: Download executed runtime evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gridex-e2e-runtime-${{ github.run_id }}
          path: e2e-artifacts/inputs/runtime
      - name: Download executed real evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gridex-e2e-real-customer-${{ github.run_id }}
          path: e2e-artifacts/inputs/real
      - name: Require all nightly release gates to execute and pass
        shell: bash
        env:
          FULL_RESULT: ${{ needs.full.result }}
          RUNTIME_RESULT: ${{ needs.runtime-staging.result }}
          REAL_RESULT: ${{ needs.real-customer-staging.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/gridex-full-production-e2e.cjs --certificate=nightly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gridex-nightly-release-certificate-${{ github.run_id }}
          path: e2e-artifacts/nightly-release-certificate.json
          if-no-files-found: error
          retention-days: 30

  manual-all-evidence:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'all'
    needs: [full, runtime-staging, real-customer-staging]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download current attempt full evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gridex-e2e-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-artifacts/inputs/full
      - name: Download current attempt runtime evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gridex-e2e-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-artifacts/inputs/runtime
      - name: Download current attempt real evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gridex-e2e-real-customer-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-artifacts/inputs/real
      - name: Require the three manual all gates and their execution receipts
        env:
          FULL_RESULT: ${{ needs.full.result }}
          RUNTIME_RESULT: ${{ needs.runtime-staging.result }}
          REAL_RESULT: ${{ needs.real-customer-staging.result }}
        run: node scripts/gridex-full-production-e2e.cjs --certificate=manual-all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gridex-manual-all-run-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-artifacts/manual-all-run-evidence.json
          if-no-files-found: error
          retention-days: 30
