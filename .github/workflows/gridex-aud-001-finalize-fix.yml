name: GRIDEX AUD-001 final review fix

on:
  push:
    branches:
      - remediation/gridex-aud-001-document-storage-isolation

permissions:
  contents: write

concurrency:
  group: gridex-aud-001-final-review-fix
  cancel-in-progress: true

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/gridex-aud-001-document-storage-isolation
          fetch-depth: 0
      - name: Apply exact site-scope fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/website/customerApplications.ts')
          text = path.read_text()
          start_marker = 'async function ensureWebsiteAuthorizationChainFromPowerOfAttorney'
          end_marker = '\ntype CustomerRow = {'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not isolate website authorization function')
          segment = text[start:end]
          old = '      siteId: null,'
          new = '      siteId: input.customerSiteId,'
          count = segment.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one siteId:null in authorization function, found {count}')
          segment = segment.replace(old, new, 1)
          path.write_text(text[:start] + segment + text[end:])
          PY
          python3 - <<'PY'
          from pathlib import Path
          text = Path('lib/website/customerApplications.ts').read_text()
          start = text.index('async function ensureWebsiteAuthorizationChainFromPowerOfAttorney')
          end = text.index('\ntype CustomerRow = {', start)
          segment = text[start:end]
          if segment.count('siteId: input.customerSiteId,') != 1:
              raise SystemExit('Site-scope verification failed')
          if 'siteId: null,' in segment:
              raise SystemExit('Legacy null site scope still present')
          PY
      - name: Commit exact fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gridex-aud-001-finalize-fix.yml
          git add lib/website/customerApplications.ts
          git diff --cached --check
          git diff --cached -- lib/website/customerApplications.ts
          git commit -m "fix(aud-001): align website POA storage site scope"
          git push origin HEAD:remediation/gridex-aud-001-document-storage-isolation
