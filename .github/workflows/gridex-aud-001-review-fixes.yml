name: GRIDEX AUD-001 review fixes

on:
  push:
    branches:
      - remediation/gridex-aud-001-document-storage-isolation

permissions:
  contents: write

concurrency:
  group: gridex-aud-001-review-fixes
  cancel-in-progress: true

jobs:
  patch-review-findings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/gridex-aud-001-document-storage-isolation
          fetch-depth: 0
      - name: Apply final focused review fix
        run: python3 .github/scripts/apply-gridex-aud-001-review-fixes.py
      - name: Commit fix and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gridex-aud-001-review-fixes.yml
          git rm .github/scripts/apply-gridex-aud-001-review-fixes.py
          git add lib/website/customerApplications.ts
          git add quality/remediation/gridex-aud-001-document-storage-isolation/REMEDIATION_REPORT.md
          git commit -m "fix(aud-001): address ready-for-review findings"
          git push origin HEAD:remediation/gridex-aud-001-document-storage-isolation
