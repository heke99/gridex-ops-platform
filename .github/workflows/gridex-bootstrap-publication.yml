name: Gridex reviewed bootstrap publication
on:
  pull_request:
    paths:
      - '.github/workflows/gridex-bootstrap-publication.yml'
permissions:
  contents: write
concurrency:
  group: gridex-bootstrap-publication-310
  cancel-in-progress: false
jobs:
  publish-reviewed-bootstrap:
    if: github.event.pull_request.number == 310 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/gridex-parity-remediation-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify and publish the exact reviewed non-workflow diff
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B - <<'PY'
          import base64, gzip, hashlib, json, os, re, subprocess, tempfile
          from pathlib import Path
          BASE = 'd87f56518f5f9d20b6675c2dd763f85814051054'
          BASE_TREE = '8d0406f6180c402a1ebedc38136825c7921e3348'
          CODE_TREE = '913394eab15dec40946a0ca6008a395b4cdd3c95'
          PATCH_HASH = 'd21287671ed37b469c643a61a2f733302eace15719d4942a6241bc751ca3cfc8'
          TEMP = '.github/workflows/gridex-bootstrap-publication.yml'
          BRANCH = 'codex/gridex-parity-remediation-20260905'
          def run(args, env=None):
              p = subprocess.run(args, capture_output=True, text=True, env=env, timeout=180)
              if p.returncode:
                  raise RuntimeError('EXACT_PUBLICATION_CHECK_FAILED')
              return p.stdout.strip()
          def projection():
              with tempfile.TemporaryDirectory() as directory:
                  env = {**os.environ, 'GIT_INDEX_FILE': directory+'/index'}
                  run(['git', 'read-tree', run(['git', 'write-tree'])], env)
                  run(['git', 'update-index', '--force-remove', '--', TEMP], env)
                  return run(['git', 'write-tree'], env)
          def decode():
              # Correct four transcription errors in the previous transport,
              # never in SQL or test expectations. Both encodings and the final
              # patch are independently hash-locked to the reviewed local diff.
              document = run(['git', 'show', BASE+':'+TEMP])
              found = re.findall(r'^          PAYLOAD = "([^"]+)"$', document, re.M)
              if len(found) != 1:
                  raise RuntimeError('PINNED_TRANSPORT_REQUIRED')
              encoded = found[0]
              if hashlib.sha256(encoded.encode()).hexdigest() != '7d95a90cca455cc2832a7c703e3f5be8473bb76cba105136d82461b55e027c39':
                  raise RuntimeError('PINNED_TRANSPORT_REQUIRED')
              parts = []; cursor = 0
              for start, end, before, after in [(3022,3024,'Np',''),(3313,3316,'Nbs',''),(6092,6093,'3',''),(11266,11266,'','/')]:
                  if encoded[start:end] != before:
                      raise RuntimeError('EXACT_TRANSPORT_SITE_REQUIRED')
                  parts.extend((encoded[cursor:start],after)); cursor=end
              parts.append(encoded[cursor:]); encoded=''.join(parts)
              if hashlib.sha256(encoded.encode()).hexdigest() != '1780df6c0bbd16f44fad4c3731380c211c56e77025c6c7119bff4d1709a99959':
                  raise RuntimeError('CORRECTED_TRANSPORT_HASH_REQUIRED')
              raw = gzip.decompress(base64.b64decode(encoded,validate=True))
              if len(raw) != 32497 or hashlib.sha256(raw).hexdigest() != PATCH_HASH:
                  raise RuntimeError('EXACT_PATCH_REQUIRED')
              return raw
          def main():
              event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              pr = event['pull_request']; head = pr['head']['sha']
              if (os.environ.get('GITHUB_EVENT_NAME') != 'pull_request' or event['number'] != 310
                  or pr['head']['ref'] != BRANCH or pr['head']['repo']['full_name'] != 'heke99/gridex-ops-platform'
                  or run(['git', 'rev-parse', 'HEAD']) != head or run(['git', 'rev-parse', 'HEAD^']) != BASE
                  or run(['git', 'status', '--porcelain']) or projection() != BASE_TREE):
                  raise RuntimeError('EXACT_PUBLICATION_BASE_REQUIRED')
              with tempfile.TemporaryDirectory() as directory:
                  path = Path(directory)/'source.patch'; path.write_bytes(decode())
                  run(['git', 'apply', '--check', '--index', str(path)])
                  run(['git', 'apply', '--index', str(path)])
              files = run(['git', 'diff', '--cached', '--name-only']).splitlines()
              if len(files) != 8 or any(p.startswith('.github/') for p in files) or projection() != CODE_TREE:
                  raise RuntimeError('EXACT_REVIEWED_SOURCE_TREE_REQUIRED')
              checks = [['python3', '-B', 'scripts/'+name] for name in (
                  'canonical-native-bootstrap-contract-selftest.py', 'canonical-native-supabase-lifecycle-selftest.py',
                  'test-canonical-permission-native-admission.py', 'test-canonical-permission-native-fixture.py',
                  'test-canonical-permission-native-runner.py', 'gridex-aud-003-clean-replay-selftest.py',
                  'canonical-full-schema-reference-selftest.py')]
              checks += [['python3', '-B', 'scripts/canonical-permission-native-runner.py', '--check'], ['node', 'scripts/check-migration-versions.cjs']]
              env = {k: v for k,v in os.environ.items() if k not in ('GH_TOKEN', 'GITHUB_TOKEN')}
              for check in checks:
                  print('Verify '+check[2 if check[0] == 'python3' else 1], flush=True)
                  run(check, env)
              run(['git', 'diff', '--cached', '--check']); run(['git', 'diff', '--exit-code'])
              if projection() != CODE_TREE:
                  raise RuntimeError('POST_TEST_TREE_CHANGED')
              auth = base64.b64encode(('x-access-token:'+os.environ['GH_TOKEN']).encode()).decode()
              git = ['git', '-c', 'credential.helper=', '-c', 'http.https://github.com/.extraheader=AUTHORIZATION: basic '+auth]
              if run([*git, 'ls-remote', 'origin', 'refs/heads/'+BRANCH]).split()[0] != head:
                  raise RuntimeError('BRANCH_MOVED')
              run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '--no-gpg-sign', '-m', 'fix(db): match native initial table and sequence grants in replay bootstrap'])
              commit = run(['git', 'rev-parse', 'HEAD'])
              run([*git, 'push', 'origin', 'HEAD:refs/heads/'+BRANCH])
              if run([*git, 'ls-remote', 'origin', 'refs/heads/'+BRANCH]).split()[0] != commit:
                  raise RuntimeError('PUBLICATION_READBACK_FAILED')
              print(json.dumps({'codeCommit':commit,'codeTree':CODE_TREE,'files':files,'offlineChecksPassed':len(checks),'nativeBootstrapVerified':False,'mainMerged':False,'hostedDatabaseModified':False}),flush=True)
          try:
              main()
          except Exception:
              print('FAIL exact bootstrap publication; no raw diagnostics, forced ref or acceptance override',flush=True)
              raise SystemExit(1) from None
          PY
