name: Gridex final 11 residual source probe
on:
  pull_request:
    paths:
      - '.github/workflows/gridex-db-final11-once.yml'
permissions:
  contents: write
jobs:
  probe-final11:
    if: github.event.pull_request.number == 310 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/gridex-parity-remediation-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRIDEX_LEGACY_CONTAINER_NAME: gridex-auth-legacy-continuation-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Bind verification harness to the 140 + 512 selection and exact final 11
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          exact = {
            'scripts/canonical-auth-provisioning-replay.py': [
              ("'full':118", "'full':140"),
              ("FOUNDATION_SHA256='bf29ab9457e5f9b7d9720582bc8900f7661415c268a44bbb4039e3cb8b227c1b'", "FOUNDATION_SHA256='d0651aa367a9ec198ed2d7152f57f8d0d706bfbf251c2346caeef39c9f39dfa0'"),
              ('len(self.order)!=118', 'len(self.order)!=140'),
            ],
            'scripts/canonical-foundation-frontier-diagnostic.py': [
              ('len(order) != 118', 'len(order) != 140'),
              ("'foundationInputs': 118", "'foundationInputs': 140"),
            ],
            'scripts/canonical-foundation-frontier-selftest.py': [
              ('self.assertEqual(len(order), 118)', 'self.assertEqual(len(order), 140)'),
              ("self.assertEqual(report['counts']['SUBSTITUTED'], 19)", "self.assertEqual(report['counts']['SUBSTITUTED'], 5)"),
              ("self.assertEqual(report['counts']['UNCLASSIFIED'], 14)", "self.assertEqual(report['counts']['UNCLASSIFIED'], 6)"),
            ],
            'scripts/canonical-timestamp-frontier-selftest.py': [
              ("self.assertEqual(self.report['counts']['UNCLASSIFIED'], 14)", "self.assertEqual(self.report['counts']['UNCLASSIFIED'], 6)"),
              ("self.assertEqual(self.report['counts']['SUBSTITUTED'], 19)", "self.assertEqual(self.report['counts']['SUBSTITUTED'], 5)"),
            ],
            'scripts/canonical-timestamp-source-selftest.py': [
              ("{'FULL_FILE_SELECTED':562,'SUBSTITUTED':19,'UNCLASSIFIED':14,'EXPLICITLY_EXCLUDED':5}", "{'FULL_FILE_SELECTED':584,'SUBSTITUTED':5,'UNCLASSIFIED':6,'EXPLICITLY_EXCLUDED':5}"),
              ('test_full_effects_still_has_33_blocking_original_dispositions', 'test_full_effects_still_has_11_blocking_original_dispositions'),
              ("self.report['counts']['SUBSTITUTED']+self.report['counts']['UNCLASSIFIED'],33", "self.report['counts']['SUBSTITUTED']+self.report['counts']['UNCLASSIFIED'],11"),
            ],
            'scripts/canonical-residual-migration-selftest.py': [
              ('self.assertEqual(len(sources), 37)', 'self.assertEqual(len(sources), 11)'),
              ('self.assertEqual(len(set(sources)), 37)', 'self.assertEqual(len(set(sources)), 11)'),
              ("self.assertEqual(self.report['counts']['SUBSTITUTED'], 19)", "self.assertEqual(self.report['counts']['SUBSTITUTED'], 5)"),
              ("self.assertEqual(self.report['counts']['UNCLASSIFIED'], 14)", "self.assertEqual(self.report['counts']['UNCLASSIFIED'], 6)"),
              ("'foundation118'", "'foundation140'"),
            ],
          }
          for file, replacements in exact.items():
            p=Path(file); s=p.read_text()
            for old,new in replacements:
              if s.count(old) != 1:
                raise SystemExit(f'EXACT_REPLACEMENT_MISMATCH:{file}:{old}')
              s=s.replace(old,new)
            p.write_text(s)
          p=Path('scripts/canonical-residual-migration-probe.py'); s=p.read_text()
          old_start=s.index('BASELINE_PATHS = ('); old_end=s.index(')\n\n\ndef load', old_start)+1
          paths=(
            'migrations/01_db2_full_view_preflight_schema_and_functions.sql',
            'migrations/03_db2_validation_and_finish.sql',
            'migrations/20260521_batch_1_2_live_readiness_and_automation_hardening.sql',
            'migrations/20260521_batch_customer_intake_batch2_completion.sql',
            'migrations/20260522_db1_schema_repair_backfill_foundation.sql',
            'migrations/20260525_debug_fix_batch_1b_schema_code_alignment.sql',
            'migrations/20260528_batch_2_completion_rulebook_actions_regression.sql',
            'migrations/20260528_batch_7a1_inbound_hardening.sql',
            'migrations/20260529_batch_2_rulebook_hardening_and_systemtest_ui.sql',
            'migrations/20260601070000_ediel_production_readiness_hardening.sql',
            'migrations/20260615_multitenant_integrity_and_claim_locks.sql',
          )
          new='BASELINE_PATHS = ('+', '.join(repr(x) for x in paths)+')'
          s=s[:old_start]+new+s[old_end:]
          repl=(
            ('Characterize the 37 baseline unresolved sources','Characterize the current 11 unresolved sources'),
            ("RESIDUAL_PIN = 'f646322e447fedd33a17cbc373a13229f4e5ff736ec9015fd8fc129fa4987ede'", "RESIDUAL_PIN = '964d512ddf8975fe96a004a1d82b93d7b33ebc77207c9e8d5c320135c81328e9'"),
            ("CHECKPOINTS = ('foundation118', 'selected_tail')", "CHECKPOINTS = ('foundation140', 'selected_tail')"),
            ('len(sources) != 37', 'len(sources) != 11'),
            ("'foundation118'", "'foundation140'"),
          )
          for old,new in repl:
            if s.count(old) != 1: raise SystemExit('RESIDUAL_EXACT_REPLACEMENT_MISMATCH:'+old)
            s=s.replace(old,new)
          p.write_text(s)
          PY
          python3 scripts/canonical-foundation-frontier-selftest.py
          python3 scripts/canonical-timestamp-frontier-selftest.py
          python3 scripts/canonical-timestamp-source-selftest.py
          python3 scripts/canonical-residual-migration-selftest.py
      - name: Probe all final 11 originals at both owned checkpoints
        id: probe
        shell: bash
        run: |
          set +e
          python3 scripts/canonical-residual-migration-probe.py 2>&1 | tee "$RUNNER_TEMP/final11.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "probe_exit=$rc" >> "$GITHUB_OUTPUT"
          test "$rc" -eq 0 -o "$rc" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: gridex-final11-residual-probe
          path: ${{ runner.temp }}/final11.log
          retention-days: 2
          if-no-files-found: error
      - name: Commit only reviewed harness rebinding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/canonical-auth-provisioning-replay.py scripts/canonical-foundation-frontier-diagnostic.py scripts/canonical-foundation-frontier-selftest.py scripts/canonical-timestamp-frontier-selftest.py scripts/canonical-timestamp-source-selftest.py scripts/canonical-residual-migration-probe.py scripts/canonical-residual-migration-selftest.py
          git diff --cached --check
          git commit -m 'test(db): bind final 11 residual probe to current replay selection'
          git push origin HEAD:codex/gridex-parity-remediation-20260905
      - name: Remove only this diagnostic's owned container
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path=Path('scripts/canonical-foundation-frontier-diagnostic.py').resolve()
          spec=importlib.util.spec_from_file_location('cleanup',path)
          module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          module.load_controller().load_batch().cleanup_workflow_owned()
          PY
