name: Gridex database frontier diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/gridex-db-frontier.yml'
      - 'scripts/canonical-foundation-frontier-*.py'
      - 'scripts/canonical-timestamp-frontier*.py'
      - 'scripts/canonical-auth-provisioning-legacy-batch.py'
      - 'scripts/canonical-live-sync-*.py'
      - 'scripts/canonical-timestamp-source-*.py'
      - 'scripts/gridex-aud-003-legacy-foundation.additions.json'

permissions:
  contents: read

jobs:
  selected-chain-diagnostic:
    if: github.event.pull_request.number == 310 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRIDEX_LEGACY_CONTAINER_NAME: gridex-auth-legacy-continuation-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate source selection and private diagnostic receipts
        run: |
          python3 scripts/canonical-foundation-frontier-selftest.py
          python3 scripts/canonical-timestamp-frontier-selftest.py
          python3 scripts/canonical-live-sync-selftest.py
          python3 scripts/canonical-timestamp-source-selftest.py
      - name: Execute selected chain on an owned network-disabled database
        run: python3 scripts/canonical-foundation-frontier-diagnostic.py
      - name: Remove only this diagnostic's owned container
        if: always()
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('scripts/canonical-foundation-frontier-diagnostic.py').resolve()
          spec = importlib.util.spec_from_file_location('frontier_cleanup', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.load_controller().load_batch().cleanup_workflow_owned()
          PY
