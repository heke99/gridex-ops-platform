name: Gridex diagnose final 11 residual sources
on:
  pull_request:
    paths:
      - '.github/workflows/gridex-db-native-runtime-once.yml'
permissions:
  contents: read
jobs:
  final11-diagnostic:
    if: github.event.pull_request.number == 310 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRIDEX_LEGACY_CONTAINER_NAME: gridex-auth-legacy-continuation-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify current selection harness
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/canonical-foundation-frontier-selftest.py
          python3 scripts/canonical-timestamp-frontier-selftest.py
          python3 scripts/canonical-timestamp-source-selftest.py
          python3 scripts/canonical-residual-migration-selftest.py
          python3 scripts/gridex-replay-input-accounting.py --require-full-effects > "$RUNNER_TEMP/accounting.json" || test "$?" -eq 1
      - name: Execute current selected chain with safe phase receipt
        id: frontier
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/canonical-foundation-frontier-diagnostic.py 2>&1 | tee "$RUNNER_TEMP/frontier.log"
          printf '%s\n' "${PIPESTATUS[0]}" > "$RUNNER_TEMP/frontier-exit.txt"
      - name: Probe exact final 11 originals on both owned checkpoints
        id: residual
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/canonical-residual-migration-probe.py 2>&1 | tee "$RUNNER_TEMP/final11.log"
          printf '%s\n' "${PIPESTATUS[0]}" > "$RUNNER_TEMP/final11-exit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gridex-final11-diagnostic
          path: |
            ${{ runner.temp }}/accounting.json
            ${{ runner.temp }}/frontier.log
            ${{ runner.temp }}/frontier-exit.txt
            ${{ runner.temp }}/final11.log
            ${{ runner.temp }}/final11-exit.txt
          retention-days: 2
          if-no-files-found: warn
      - name: Assert diagnostics produced bounded outcomes
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/frontier.log"
          test -s "$RUNNER_TEMP/final11.log"
      - name: Cleanup owned database
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('scripts/canonical-foundation-frontier-diagnostic.py').resolve()
          s=importlib.util.spec_from_file_location('cleanup',p)
          m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          m.load_controller().load_batch().cleanup_workflow_owned()
          PY
