name: Gridex persist Supabase privileged replay role
on:
  pull_request:
    paths:
      - '.github/workflows/gridex-db-native-runtime-once.yml'
permissions:
  contents: write
jobs:
  persist-bootstrap-role:
    if: github.event.pull_request.number == 310 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Add managed Supabase privileged role to clean-replay bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/sql/gridex-supabase-compatible-bootstrap.sql')
          s=p.read_text()
          old="""  if not exists (select 1 from pg_roles where rolname = 'supabase_storage_admin') then
    create role supabase_storage_admin nologin noinherit createrole;
  end if;
  if not exists (select 1 from pg_roles where rolname = 'dashboard_user') then
"""
          new="""  if not exists (select 1 from pg_roles where rolname = 'supabase_storage_admin') then
    create role supabase_storage_admin nologin noinherit createrole;
  end if;
  if not exists (select 1 from pg_roles where rolname = 'supabase_privileged_role') then
    create role supabase_privileged_role nologin inherit nocreaterole nocreatedb noreplication nobypassrls;
  end if;
  if not exists (select 1 from pg_roles where rolname = 'dashboard_user') then
"""
          if s.count(old)!=1:
            raise SystemExit('BOOTSTRAP_ROLE_INSERTION_PREIMAGE_MISMATCH')
          p.write_text(s.replace(old,new))
          PY
          git diff --check
      - name: Commit exact bootstrap compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/sql/gridex-supabase-compatible-bootstrap.sql
          git diff --cached --check
          git commit -m 'fix(db): mirror Supabase privileged role in clean replay bootstrap'
          git push origin HEAD:codex/gridex-parity-remediation-20260905
