name: Gridex persist expanded foundation reference oracle
on:
  pull_request:
    paths:
      - '.github/workflows/gridex-db-native-runtime-once.yml'
permissions:
  contents: write
jobs:
  persist-reference-oracle:
    if: github.event.pull_request.number == 310 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Patch exact expanded-foundation oracle pins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/canonical-auth-provisioning-diagnostics-selftest.py')
          s=p.read_text()
          replacements=(
            ("assert len(order) == 118, 'selected diagnostics stage requires foundation118'", "assert len(order) == 140, 'selected diagnostics stage requires foundation140'"),
            ("path_digest(order[77:]) == SUFFIX_SHA", "path_digest(order[77:118]) == SUFFIX_SHA"),
            ("assert len(order)==118 and order[41:43]==[G,R]", "assert len(order)==140 and order[41:43]==[G,R]"),
            ("path_digest(order[77:])==SUFFIX_SHA", "path_digest(order[77:118])==SUFFIX_SHA"),
            ("OLD_ADDITIONS_FOUNDATION_SHA = '753a7813c9a9ff49f927c5b3c1633aafbaea185c42ae95e1400cbc7b7c8ffe09'", "OLD_ADDITIONS_FOUNDATION_SHA = '5e6d43d00160bb4b91bbf6a15ac8ed6ecb0b06902f4fc60d0d0f2b848bb0abe0'"),
            ("ADDITIONS_DERIVED_SHA = '11e6ef86224ba62349491835eb5faa0ff74f3dfe3df8619fdd83a9b966de5dc5'", "ADDITIONS_DERIVED_SHA = '2049baa72dfb4028a28adb6ecf428eb89d854283c31867422d9a8be72ac5e7b7'"),
            ("{'FULL_FILE_SELECTED':311,'SUBSTITUTED':20,'UNCLASSIFIED':10,'EXPLICITLY_EXCLUDED':5}", "{'FULL_FILE_SELECTED':331,'SUBSTITUTED':4,'UNCLASSIFIED':6,'EXPLICITLY_EXCLUDED':5}"),
          )
          for old,new in replacements:
            if s.count(old)!=1:
              raise SystemExit('REFERENCE_ORACLE_EXACT_REPLACEMENT_MISMATCH:'+old)
            s=s.replace(old,new)
          p.write_text(s)
          PY
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('scripts/canonical-auth-provisioning-diagnostics-selftest.py').resolve()
          s=importlib.util.spec_from_file_location('diagnostics_constructor',p)
          m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          m.constructor_checks()
          print('PASS diagnostics constructor checks')
          PY
          git diff --check
      - name: Commit exact oracle update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/canonical-auth-provisioning-diagnostics-selftest.py
          git diff --cached --check
          git commit -m 'test(db): rebind diagnostics oracle to expanded foundation'
          git push origin HEAD:codex/gridex-parity-remediation-20260905
