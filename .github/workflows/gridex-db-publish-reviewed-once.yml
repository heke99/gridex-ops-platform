name: Gridex publish verified residual source batch
on:
  pull_request:
    paths:
      - '.github/workflows/gridex-db-publish-reviewed-once.yml'
permissions:
  contents: write
jobs:
  publish-residual-batch:
    if: github.event.pull_request.number == 310 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/gridex-parity-remediation-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Add only native-probed whole sources to canonical foundation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/gridex-aud-003-legacy-foundation.additions.json)" = "35ffe3d87cf6eff42987258c90896962d6488257"
          test "$(git hash-object scripts/gridex-aud-003-foundation-order.json)" = "bd5fc0ca642fec08f05282b3f407c1873454bd22"
          python3 - <<'PY'
          import json
          from pathlib import Path

          sources = [
            'migrations/01_db2b_preflight_views.sql',
            'migrations/03_db2b_validation_views.sql',
            'migrations/20260520_batch_3_4_onboarding_pricing_billing_engine.sql',
            'migrations/20260520_batch_5_cases_audit_email_ux.sql',
            'migrations/20260520_batch_5_final_quality_handbook_alignment.sql',
            'migrations/20260521_actor_testing_go_live_module.sql',
            'migrations/20260521_batch3_pricing_billing_audit_roles_completion.sql',
            'migrations/20260521_batch_2b_full_automation_and_live_ops.sql',
            'migrations/20260521_batch_2c_end_to_end_operations.sql',
            'migrations/20260521_batch_customer_intake_batch2_hardening.sql',
            'migrations/20260522_batch4_multisite_duplicate_billing_hardening.sql',
            'migrations/20260522_batch4c_billing_export_audit_quality_ai.sql',
            'migrations/20260522_batch4d_merge_poa_lifecycle_hardening.sql',
            'migrations/20260522_batch4e_switch_pdf_audit_rbac_completion.sql',
            'migrations/20260522_batch4f_rbac_database_lint_hardening.sql',
            'migrations/20260522_customer_flow_access_repair.sql',
            'migrations/20260523_db3_tenant_isolation_rbac_enforcement.sql',
            'migrations/20260525_db4b_customer_registry_ediel_test_cleanup.sql',
            'migrations/20260526_batch_3a_3b_customer_intake_blockers_documents.sql',
            'migrations/20260528_batch_1_customer_flow_masterdata_preflight.sql',
            'migrations/20260528_batch_7a_route_inbound_mail_platform_ui.sql',
            'migrations/20260528_debug_post_repair_schema_guardrails.sql',
          ]
          additions_path = Path('scripts/gridex-aud-003-legacy-foundation.additions.json')
          order_path = Path('scripts/gridex-aud-003-foundation-order.json')
          additions = json.loads(additions_path.read_text())
          order = json.loads(order_path.read_text())
          for source in sources:
              if source in additions['foundation'] or source in order['foundation']:
                  raise SystemExit('source unexpectedly already selected: ' + source)
              additions['foundation'].append(source)
              order['foundation'].append(source)
          additions_path.write_text(json.dumps(additions, indent=2) + '\n')
          order_path.write_text(json.dumps(order, indent=2) + '\n')
          PY
          python3 scripts/gridex-replay-input-accounting.py > /tmp/accounting.json || test $? -eq 1
          python3 - <<'PY'
          import json
          report=json.load(open('/tmp/accounting.json'))
          expected={'FULL_FILE_SELECTED':584,'SUBSTITUTED':5,'UNCLASSIFIED':6,'EXPLICITLY_EXCLUDED':5}
          if report['counts'] != expected or report['selectedInputCounts'] != {'foundation':140,'timestamp':512}:
              raise SystemExit('unexpected residual accounting: '+json.dumps(report['counts']))
          PY
          git diff --check
      - name: Commit exact residual-selection batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/gridex-aud-003-legacy-foundation.additions.json scripts/gridex-aud-003-foundation-order.json
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "fix(db): replay 22 verified residual migrations as whole sources"
          git push origin HEAD:codex/gridex-parity-remediation-20260905
