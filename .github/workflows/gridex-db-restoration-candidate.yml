name: Gridex reviewed whole-source restoration

on:
  pull_request:
    paths:
      - '.github/workflows/gridex-db-restoration-candidate.yml'
      - 'quality/paused/db-restoration.part*'

permissions:
  contents: read

concurrency:
  group: db-source-restoration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-reviewed-tree:
    if: github.event.pull_request.number == 310 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/gridex-parity-remediation-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GRIDEX_LEGACY_CONTAINER_NAME: gridex-auth-legacy-continuation-${{ github.run_id }}-${{ github.run_attempt }}
      EXPECTED_CANDIDATE_TREE: da5da4142e8a8adf94b3617a860fede116ddc83c
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Materialize and verify the exact reviewed source diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, hashlib, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          parent = '54914f5116a07749b7b684fa174e3e24731f2589'
          assert git('rev-parse', 'HEAD^') == parent, 'Unexpected candidate parent'
          parts = [f'quality/paused/db-restoration.part{i:02d}' for i in range(6)]
          temporary = parts + ['.github/workflows/gridex-db-restoration-candidate.yml']
          changed = git('diff', '--name-only', parent, 'HEAD').splitlines()
          assert sorted(changed) == sorted(temporary), 'Unexpected transport changes'
          pins = ['94aa7f551546167af42730584b165bf6aeb5d257', 'a76609a6f7f886bc40a82cf3651db2558219f845',
                  '31bb0341e97d7cba47a79aea36c6cbbcdf73f1fd', '99ecafa8dbe4d475cee27c1368d7e0cd035c9b3c',
                  '645908b1d58c74e7d07f614c73bba9aaee605db7', '5f4030025332addd0aec160feec15aee81940658']
          chunks = []
          for path, pin in zip(parts, pins):
              assert git('hash-object', path) == pin, 'Transport checksum mismatch'
              chunks.append(pathlib.Path(path).read_bytes())
          raw = gzip.decompress(b''.join(chunks))
          assert len(raw) == 67156
          assert hashlib.sha256(raw).hexdigest() == '7483c670e4e7fc715ba554d1a3bbd9b3115befeec57f633124348f33ee572840'
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed-restoration.patch'
          patch.write_bytes(raw)
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          subprocess.run(['git', 'rm', '--', *temporary], check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          assert git('write-tree') == os.environ['EXPECTED_CANDIDATE_TREE'], 'Candidate tree mismatch'
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          print('PASS exact reviewed candidate tree; no branch, ledger or production change')
          PY
      - name: Verify source admission, fail-closed metadata and session regressions
        run: |
          python3 scripts/canonical-foundation-frontier-selftest.py
          python3 scripts/canonical-timestamp-frontier-selftest.py
          python3 scripts/canonical-live-sync-selftest.py
          python3 scripts/canonical-residual-migration-selftest.py
          python3 scripts/canonical-timestamp-source-selftest.py
      - name: Verify whole-source restoration on a fresh isolated database
        run: |
          mkdir -p "$RUNNER_TEMP/restoration-proof"
          python3 scripts/canonical-foundation-frontier-diagnostic.py > "$RUNNER_TEMP/restoration-proof/native-metadata.jsonl"
      - name: Store verified immutable Git objects without updating any ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          expected = os.environ['EXPECTED_CANDIDATE_TREE']
          assert git('write-tree') == expected
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'restoration-proof'
          rows = [json.loads(x) for x in (out/'native-metadata.jsonl').read_text().splitlines() if x.startswith('{')]
          final = next(x for x in reversed(rows) if x.get('scope') == 'SELECTED_CHAIN_DIAGNOSTIC_ONLY')
          assert final['outcome'] == 'SELECTED_CHAIN_EXECUTED_NOT_CERTIFIED'
          assert final['foundationInputs'] == 118 and final['timestampInputs'] == 512
          assert final['details']['timestampApplied'] == 512
          restored = [x for x in rows if x.get('scope') == 'RESTORED_WHOLE_SOURCE']
          assert len(restored) == 4 and all(x['negativeControlVerified'] for x in restored)
          assert sum(x['boundedPostconditions'] for x in restored) == 32
          assert final['completeReplayVerified'] is False and final['productionModified'] is False
          token = os.environ['GH_TOKEN']
          root = 'https://api.github.com/repos/heke99/gridex-ops-platform/git/'
          def post(endpoint, body):
              assert endpoint in ('blobs', 'trees')
              request = urllib.request.Request(root+endpoint, data=json.dumps(body).encode(), method='POST',
                  headers={'Authorization':'Bearer '+token, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          paths = subprocess.check_output(['git','diff','--cached','--name-only','-z']).split(b'\0')
          elements = []
          for raw in paths:
              if not raw: continue
              path = raw.decode()
              entry = subprocess.check_output(['git','ls-files','--stage','--',path]).decode().strip()
              if not entry:
                  elements.append({'path':path,'sha':None})
                  continue
              mode, oid, _stagepath = entry.split(' ',2)
              assert mode in ('100644','100755')
              data = pathlib.Path(path).read_bytes()
              blob = post('blobs', {'content':base64.b64encode(data).decode(),'encoding':'base64'})
              assert blob['sha'] == oid, 'Git blob readback mismatch'
              elements.append({'path':path,'mode':mode,'type':'blob','sha':oid})
          tree = post('trees', {'base_tree':git('rev-parse','HEAD^{tree}'),'tree':elements})
          assert tree['sha'] == expected, 'Git tree readback mismatch'
          receipt = {'scope':'VERIFIED_IMMUTABLE_TREE_ONLY','candidateTree':expected,
              'transportCommit':git('rev-parse','HEAD'),'sourceParent':'54914f5116a07749b7b684fa174e3e24731f2589',
              'patchSha256':'7483c670e4e7fc715ba554d1a3bbd9b3115befeec57f633124348f33ee572840',
              'nativeMetadataSha256':hashlib.sha256((out/'native-metadata.jsonl').read_bytes()).hexdigest(),
              'restoredWholeSources':restored,'refUpdated':False,'completeReplayAccepted':False,
              'generatedTypesAccepted':False,'productionModified':False}
          (out/'verified-tree.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps({'candidateTree':expected,'refUpdated':False,'productionModified':False}))
          PY
      - name: Remove only this workflow's owned test database
        if: always()
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          p = Path('scripts/canonical-foundation-frontier-diagnostic.py').resolve()
          s = importlib.util.spec_from_file_location('restoration_cleanup', p)
          m = importlib.util.module_from_spec(s); s.loader.exec_module(m)
          m.load_controller().load_batch().cleanup_workflow_owned()
          PY
      - name: Upload sanitized native result and immutable tree receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-restoration-proof
          path: ${{ runner.temp }}/restoration-proof/
          retention-days: 2
          if-no-files-found: warn
