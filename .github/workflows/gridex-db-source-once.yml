name: Gridex exact source for database remediation
on:
  pull_request:
    paths:
      - '.github/workflows/gridex-db-source-once.yml'
permissions:
  contents: read
jobs:
  exact-source:
    if: github.event.pull_request.number == 310 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive tracked source without credentials or runtime data
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/gridex-db-source"
          mkdir -p "$out"
          git archive --format=tar.gz HEAD > "$out/source.tar.gz"
          printf 'source_commit=%s\nsource_tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > "$out/receipt.txt"
          sha256sum "$out/source.tar.gz" >> "$out/receipt.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: gridex-db-source
          path: ${{ runner.temp }}/gridex-db-source/
          retention-days: 1
          if-no-files-found: error
