name: Gridex Ediel customer FK qualification
on:
  pull_request:
    paths:
      - '.github/workflows/gridex-ediel-customer-fk-qualification.yml'
      - 'scripts/canonical-ediel-customer-fk-qualification.py'
      - 'scripts/sql/forward-candidates/ediel-intent-customer-company-fk.sql'
permissions:
  contents: read
jobs:
  native-fk-qualification:
    if: github.event.pull_request.number == 310 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/gridex-parity-remediation-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GRIDEX_LEGACY_CONTAINER_NAME: gridex-auth-legacy-fk-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prove historical omission and safe customer deletion on owned PostgreSQL 17
        run: python3 scripts/canonical-ediel-customer-fk-qualification.py
      - name: Remove only the owned FK qualification database
        if: always()
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('scripts/canonical-ediel-customer-fk-qualification.py').resolve()
          s=importlib.util.spec_from_file_location('fk_cleanup',p)
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          m.load_legacy().cleanup_workflow_owned()
          PY
  cli-generated-forward-file:
    needs: native-fk-qualification
    if: github.event.pull_request.number == 310 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Generate a migration identity with the pinned official CLI, without a database
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD"
          out="$RUNNER_TEMP/gridex-fk-forward"
          scratch="$RUNNER_TEMP/gridex-fk-cli"
          mkdir -p "$out" "$scratch"
          supabase --help > "$out/cli-help.txt"
          supabase migration --help > "$out/migration-help.txt"
          supabase migration new --help > "$out/migration-new-help.txt"
          supabase --version > "$out/cli-version.txt"
          cd "$scratch"
          supabase init
          supabase migration new ediel_intent_customer_company_integrity
          cd "$root"
          python3 - "$scratch" "$out" <<'PY'
          import hashlib, json, pathlib, re, shutil, subprocess, sys
          scratch,out=map(pathlib.Path,sys.argv[1:])
          paths=list((scratch/'supabase/migrations').glob('*_ediel_intent_customer_company_integrity.sql'))
          assert len(paths)==1 and re.fullmatch(r'\d{14}_ediel_intent_customer_company_integrity.sql',paths[0].name)
          raw=pathlib.Path('scripts/sql/forward-candidates/ediel-intent-customer-company-fk.sql').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='da2d3d288d69038b4c9767fe22b2a1ae4293d3196d88b5d129089337594392b9'
          paths[0].write_bytes(raw);shutil.copy2(paths[0],out/paths[0].name)
          receipt={'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'migration':paths[0].name,'sha256':hashlib.sha256(raw).hexdigest(),
            'cli':(out/'cli-version.txt').read_text().strip(),'databaseConnected':False,'productionModified':False}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          gzip -c "$(command -v supabase)" > "$out/supabase-cli-linux-amd64.gz"
          sha256sum "$out/supabase-cli-linux-amd64.gz" > "$out/cli-archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: gridex-qualified-fk-forward
          path: ${{ runner.temp }}/gridex-fk-forward/
          retention-days: 1
          if-no-files-found: error
