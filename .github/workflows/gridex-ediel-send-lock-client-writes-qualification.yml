name: Gridex send-lock client-write qualification
on:
  pull_request:
    paths:
      - '.github/workflows/gridex-ediel-send-lock-client-writes-qualification.yml'
      - 'scripts/canonical-ediel-send-lock-client-writes-selftest.py'
      - 'scripts/test_canonical_ediel_send_lock_client_writes.py'
      - 'scripts/canonical-composite-customer-fk-selftest.py'
      - 'scripts/sql/forward-candidates/restrict-ediel-send-lock-client-writes.sql'
      - 'supabase/migrations/**'
      - 'scripts/test_canonical_composite_customer_fk_selftest.py'
permissions:
  contents: read
jobs:
  send-lock-client-writes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gridex_auth_test
        ports:
          - 55440:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gridex_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify offline admission and preservation oracle
        run: |
          python3 -B -m unittest discover -s scripts -p test_canonical_ediel_send_lock_client_writes.py
          python3 -B -m unittest discover -s scripts -p test_canonical_composite_customer_fk_selftest.py
      - name: Qualify the exact candidate in owned PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          psql 'postgresql://postgres:postgres@127.0.0.1:55440/gridex_auth_test' -X -v ON_ERROR_STOP=1 -c 'CREATE ROLE authenticated NOLOGIN NOBYPASSRLS; CREATE ROLE service_role NOLOGIN NOBYPASSRLS; CREATE ROLE anon NOLOGIN NOBYPASSRLS;'
          mkdir -p artifacts/ediel-send-lock-client-writes-candidate
          python3 -B scripts/canonical-ediel-send-lock-client-writes-selftest.py > artifacts/ediel-send-lock-client-writes-candidate/sql-proof.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Create a genuine CLI migration identity after successful SQL qualification
        shell: bash
        env:
          QUALIFICATION_RUN_ID: ${{ github.run_id }}
          QUALIFICATION_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$(supabase --version)" == '2.101.0' ]]
          python3 - <<'PY'
          import json,pathlib
          proof=json.loads(pathlib.Path('artifacts/ediel-send-lock-client-writes-candidate/sql-proof.json').read_text())
          assert proof['scope']=='LIMITED_PG17_SEND_LOCK_CLIENT_WRITE_FIXTURE'
          assert proof['candidateSha256']=='411df92fc01f8b84dd9a83600464594e76a4841d48928d52dfadfd97b3177705'
          assert proof['tables']==1 and proof['fixedSqlstate']=='42501'
          assert proof['revokedPrivileges']==['INSERT','UPDATE','DELETE','TRUNCATE','REFERENCES','TRIGGER','MAINTAIN']
          for key in ('originalReferenceInsertUpdateVerified','actualPredicateInsertUpdateVerified','originalDeleteInertVerified',
                      'originalTruncateBypassesRls','readBoundaryPreserved','syntheticDefinerBoundaryVerified','realRestoreRpcSourcePinned',
                      'serviceOperationsVerified','exactAclDeltaVerified',
                      'rowsAndCatalogPreserved','shapeRejectionsVerified','atomicityVerified','repeatVerified','cleanupVerified'):
            assert proof[key] is True
          for key in ('actualAuthHelpersVerified','realRestoreRpcExecuted','applicationGraphVerified','schemaAccepted','productionModified'):
            assert proof[key] is False
          PY
          candidate_root="$(mktemp -d)"
          trap 'rm -rf -- "$candidate_root"' EXIT
          supabase --workdir "$candidate_root" init
          supabase migration new --help > /dev/null
          supabase --workdir "$candidate_root" migration new restrict_ediel_send_lock_client_writes
          migration_files=("$candidate_root"/supabase/migrations/*_restrict_ediel_send_lock_client_writes.sql)
          [[ "${#migration_files[@]}" == 1 && -f "${migration_files[0]}" ]]
          python3 - "${migration_files[0]}" <<'PY'
          import hashlib,json,os,pathlib,re,subprocess,sys
          original=pathlib.Path(sys.argv[1])
          assert not original.is_symlink() and re.fullmatch(r'[0-9]{14}_restrict_ediel_send_lock_client_writes.sql',original.name)
          skeleton=original.read_bytes()
          assert skeleton==b''
          source=pathlib.Path('scripts/sql/forward-candidates/restrict-ediel-send-lock-client-writes.sql')
          assert not source.is_symlink()
          data=source.read_bytes()
          digest=hashlib.sha256(data).hexdigest()
          assert digest=='411df92fc01f8b84dd9a83600464594e76a4841d48928d52dfadfd97b3177705'
          original.write_bytes(data)
          output=pathlib.Path('artifacts/ediel-send-lock-client-writes-candidate')
          (output/original.name).write_bytes(original.read_bytes())
          receipt=dict(scope='CLI_FILENAME_AND_ISOLATED_SQL_NOT_SCHEMA_ACCEPTANCE',cliVersion='2.101.0',
            sourceHead=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            sourceTree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
            file=original.name,sha256=digest,cliCreatedEmptySha256=hashlib.sha256(skeleton).hexdigest(),
            sqlProofSha256=hashlib.sha256((output/'sql-proof.json').read_bytes()).hexdigest(),
            runId=os.environ['QUALIFICATION_RUN_ID'],runAttempt=os.environ['QUALIFICATION_RUN_ATTEMPT'],
            isolatedPostgresVerified=True,selectedMigration=False,schemaAccepted=False,productionModified=False)
          (output/'cli-creation.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gridex-ediel-send-lock-client-writes-candidate
          path: artifacts/ediel-send-lock-client-writes-candidate/
          if-no-files-found: error
          retention-days: 7
