name: Gridex exact historical group delta
on:
  pull_request:
    paths:
      - '.github/workflows/gridex-exact-group-delta.yml'
permissions:
  contents: write
jobs:
  publish-exact-test-correction:
    if: github.event.pull_request.number == 310 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/gridex-parity-remediation-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Admit only the exact three reviewed test deltas
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B - <<'PY'
          import base64, hashlib, importlib.util, json, os, subprocess
          from pathlib import Path

          def run(args, environment=None):
              p = subprocess.run(args, capture_output=True, text=True, env=environment, timeout=180)
              if p.returncode:
                  raise RuntimeError('EXACT_GROUP_DELTA_CHECK_FAILED')
              return p.stdout.strip()

          pins = {
              'scripts/canonical-governance-selftest.py': ('526c43bbeb20db2479c1cfa1f694d72b7e94079afa28f29c3fd776b78c5c2015', 'e970269e09e400f88a2f3e4691255ecd64b296ead9b94a0cde3d76f4481787ba'),
              'scripts/canonical-operations-sync-selftest.py': ('eebbd0874d4e9f5c0a2bac1118c1e443bc71ca1caa76d034b676c6e7ee8bae6e', '76f77f484563c3a08e252669f61c5724e7244b173f28fa2d571bde22adab9357'),
              'scripts/canonical-auth-provisioning-diagnostics-selftest.py': ('508669c419c7ae50d2ce11a20084f19dd962abc55c450a19601aeb8b09de75f4', '1102137234c3fd4c9c4db01fc0e5a451677f9f4ead51d69af2ee4006fe545c5e'),
          }
          extra = """    # Admit exactly the new timestamp input, without changing this historical prefix.
              forward = [item for item in group['inputs'] if item['path'] ==
                         'migrations/20260913211625_ediel_intent_customer_company_integrity.sql']
              assert len(forward) == 1 and forward[0]['sha256'] == '2b9cc5e9cb7fad14aa4b30e0bc98274a4a957f47379f456ed0d3c9663ef5f39b'
              assert forward[0]['classification'] == 'FULL_FILE_SELECTED'
              assert forward[0]['execution'] == [{'ordinal': 514, 'stage': 'timestamp'}]
          """

          def transform(text):
              if text.count('346') != 1:
                  raise RuntimeError('EXACT_COUNT_SITE_REQUIRED')
              for old, new in [('== 346', '== 347'), ('==346', '==347'), ("'FULL_FILE_SELECTED':334", "'FULL_FILE_SELECTED':335"), ("'FULL_FILE_SELECTED': 334", "'FULL_FILE_SELECTED': 335")]:
                  text = text.replace(old, new)
              lines = text.splitlines(keepends=True)
              sites = [i for i, line in enumerate(lines) if line.startswith('    group = json.loads(group')]
              if len(sites) != 1:
                  raise RuntimeError('EXACT_GROUP_SITE_REQUIRED')
              lines.insert(sites[0] + 1, extra)
              return ''.join(lines)

          def main():
              base = '9b6720a0b0e193ddb16e03ffaab63f0dd58d59eb'
              branch = 'codex/gridex-parity-remediation-20260905'
              event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              pr = event['pull_request']; head = pr['head']['sha']
              if (os.environ.get('GITHUB_EVENT_NAME') != 'pull_request' or event['number'] != 310
                  or pr['head']['ref'] != branch or pr['head']['repo']['full_name'] != 'heke99/gridex-ops-platform'
                  or os.environ.get('GITHUB_REPOSITORY') != 'heke99/gridex-ops-platform'
                  or run(['git', 'rev-parse', 'HEAD']) != head or run(['git', 'rev-parse', 'HEAD^']) != base
                  or run(['git', 'status', '--porcelain'])):
                  raise RuntimeError('EXACT_BASE_REQUIRED')
              for name, (before, after) in pins.items():
                  path = Path(name)
                  if path.is_symlink() or hashlib.sha256(path.read_bytes()).hexdigest() != before:
                      raise RuntimeError('EXACT_PREDECESSOR_REQUIRED')
                  result = transform(path.read_text())
                  if hashlib.sha256(result.encode()).hexdigest() != after:
                      raise RuntimeError('EXACT_RESULT_REQUIRED')
                  path.write_text(result)
              if sorted(run(['git', 'diff', '--name-only']).splitlines()) != sorted(pins):
                  raise RuntimeError('EXACT_THREE_FILES_REQUIRED')
              for name, count in [('canonical-governance-selftest', 30), ('canonical-operations-sync-selftest', 31)]:
                  spec = importlib.util.spec_from_file_location(name, Path('scripts') / (name + '.py'))
                  module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
                  if len(module.selection()) != count:
                      raise RuntimeError('HISTORICAL_PREFIX_CHANGED')
              environment = {k: v for k, v in os.environ.items() if k not in ('GH_TOKEN', 'GITHUB_TOKEN')}
              for name in ['canonical-ediel-customer-fk-admission-selftest.py', 'canonical-timestamp-frontier-selftest.py']:
                  run(['python3', '-B', 'scripts/' + name], environment)
              for name, (_, after) in pins.items():
                  if hashlib.sha256(Path(name).read_bytes()).hexdigest() != after:
                      raise RuntimeError('TEST_CHANGED_SOURCE')
              run(['git', 'diff', '--check'])
              authorization = base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
              git = ['git', '-c', 'credential.helper=', '-c', 'http.https://github.com/.extraheader=AUTHORIZATION: basic ' + authorization]
              if run([*git, 'ls-remote', 'origin', 'refs/heads/' + branch]).split()[0] != head:
                  raise RuntimeError('BRANCH_MOVED')
              run(['git', 'add', '--', *pins])
              run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '--no-gpg-sign', '-m', 'test(db): admit exact forward delta in historical auth group inventories'])
              commit = run(['git', 'rev-parse', 'HEAD'])
              run([*git, 'push', 'origin', 'HEAD:refs/heads/' + branch])
              if run([*git, 'ls-remote', 'origin', 'refs/heads/' + branch]).split()[0] != commit:
                  raise RuntimeError('PUBLISHED_HEAD_READBACK_FAILED')
              print(json.dumps({'codeCommit': commit, 'files': pins, 'historicalPrefixAdmission': 'PASS', 'forwardAdmissionTests': 6, 'timestampTests': 13, 'fullReplayAccepted': False, 'mainChanged': False, 'productionModified': False}))

          if __name__ == '__main__':
              main()
          PY
