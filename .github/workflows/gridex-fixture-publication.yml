name: Gridex reviewed native ACL fixture publication
on:
  pull_request:
    paths:
      - '.github/workflows/gridex-fixture-publication.yml'
      - 'scripts/gridex-fixture-publication.py'
permissions:
  contents: write
concurrency:
  group: gridex-fixture-publication-310
  cancel-in-progress: false
jobs:
  publish-reviewed-fixtures:
    if: github.event.pull_request.number == 310 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/gridex-parity-remediation-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Check the exact fixture delta before branch publication
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B scripts/gridex-fixture-publication.py
