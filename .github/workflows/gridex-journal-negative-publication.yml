name: Gridex exact journal negative correction
on:
  pull_request:
    paths:
      - '.github/workflows/gridex-journal-negative-publication.yml'
permissions:
  contents: write
concurrency:
  group: gridex-journal-negative-publication-310
  cancel-in-progress: false
jobs:
  publish-exact-journal-correction:
    if: github.event.pull_request.number == 310 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/gridex-parity-remediation-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Apply only the exact reviewed test delta and verify before push
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          BASE = '76dd251461f5e86e93c379bf63172a493df99119'
          BRANCH = 'codex/gridex-parity-remediation-20260905'
          def run(args, env=None):
              result = subprocess.run(args, capture_output=True, text=True, env=env, timeout=90)
              if result.returncode:
                  raise RuntimeError('EXACT_JOURNAL_CHECK_FAILED')
              return result.stdout.strip()
          def replace(path, before, after, old, new):
              target = Path(path); text = target.read_text()
              if target.is_symlink() or hashlib.sha256(target.read_bytes()).hexdigest() != before or text.count(old) != 1:
                  raise RuntimeError('EXACT_PREIMAGE_REQUIRED')
              result = text.replace(old, new)
              if hashlib.sha256(result.encode()).hexdigest() != after:
                  raise RuntimeError('EXACT_RESULT_REQUIRED')
              target.write_text(result)
          def main():
              event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              pr = event['pull_request']; head = pr['head']['sha']
              if (os.environ.get('GITHUB_EVENT_NAME') != 'pull_request' or event['number'] != 310
                  or pr['head']['ref'] != BRANCH or pr['head']['repo']['full_name'] != 'heke99/gridex-ops-platform'
                  or run(['git','rev-parse','HEAD']) != head or run(['git','rev-parse','HEAD^']) != BASE
                  or run(['git','status','--porcelain'])):
                  raise RuntimeError('EXACT_BASE_REQUIRED')
              old = '''BEGIN;
          REVOKE SELECT ON public.customer_sync_events FROM authenticated;
          select test_assert(not ({journal_metadata_unchanged()}), 'JOURNAL_ACL_NEGATIVE_CONTROL');'''
              new = '''BEGIN;
          -- Toggle a direct grant, not effective access: PUBLIC/inherited grants must
          -- not make the mutation a no-op. Both native and no-grant fixture preimages
          -- must exercise a real catalog change before the exact rollback comparison.
          DO $journal_acl_negative$
          BEGIN
            IF EXISTS (
              SELECT 1 FROM pg_class c
              CROSS JOIN LATERAL aclexplode(coalesce(c.relacl, acldefault('r',c.relowner))) a
              JOIN pg_roles r ON r.oid=a.grantee
              WHERE c.oid='public.customer_sync_events'::regclass
                AND r.rolname='authenticated' AND a.privilege_type='SELECT'
            ) THEN
              REVOKE SELECT ON public.customer_sync_events FROM authenticated;
            ELSE
              GRANT SELECT ON public.customer_sync_events TO authenticated;
            END IF;
          END
          $journal_acl_negative$;
          select test_assert(not ({journal_metadata_unchanged()}), 'JOURNAL_ACL_NEGATIVE_CONTROL');'''
              replace('scripts/canonical-rbac-prefix-selftest.py',
                  'a7f893f49e67f964b35c8b8bb914ca17f0296e994aa265daaf264a4d7631bcbe',
                  '257d3c89a031feb35a5603a7afe9399332678f8839ae44d3299b9780cf9774a4',old,new)
              old = "        self.assertIn('REVOKE SELECT ON public.customer_sync_events FROM authenticated', check)\n        self.assertIn('ROLLBACK', check)"
              new = '''        self.assertIn('REVOKE SELECT ON public.customer_sync_events FROM authenticated', check)
                  self.assertIn('GRANT SELECT ON public.customer_sync_events TO authenticated', check)
                  negative = check.split('-- A real ACL mutation must be detected,', 1)[1].split('JOURNAL_ACL_NEGATIVE_ROLLBACK_PRESERVED', 1)[0]
                  self.assertIn("aclexplode(coalesce(c.relacl, acldefault('r',c.relowner)))", negative)
                  self.assertIn("r.rolname='authenticated' AND a.privilege_type='SELECT'", negative)
                  self.assertIn('JOIN pg_roles r ON r.oid=a.grantee', negative)
                  self.assertNotIn('has_table_privilege', negative)
                  self.assertLess(negative.index('BEGIN;'), negative.index('DO $journal_acl_negative$'))
                  self.assertLess(negative.index('REVOKE SELECT'), negative.index('ELSE'))
                  self.assertLess(negative.index('ELSE'), negative.index('GRANT SELECT'))
                  self.assertLess(negative.index('JOURNAL_ACL_NEGATIVE_CONTROL'), negative.index('ROLLBACK;'))
                  self.assertIn('ROLLBACK', check)'''
              replace('scripts/canonical-native-grant-fixtures-selftest.py',
                  'a403ff4935cc24b1a5eebd52b0ea892fb662ea59ac8258602c98f632723d89d4',
                  '9cbeabb20898935d9bbd6c1c9350f4e2cafa92fb4676fd13e850f0ebd1ab241a',old,new)
              files = ['scripts/canonical-rbac-prefix-selftest.py','scripts/canonical-native-grant-fixtures-selftest.py']
              if sorted(run(['git','diff','--name-only']).splitlines()) != sorted(files):
                  raise RuntimeError('EXACT_TWO_FILES_REQUIRED')
              environment = {k:v for k,v in os.environ.items() if k not in ('GH_TOKEN','GITHUB_TOKEN')}
              run(['python3','-B','scripts/canonical-native-grant-fixtures-selftest.py'],environment)
              run(['node','scripts/check-migration-versions.cjs'],environment)
              run(['git','diff','--check'])
              auth = base64.b64encode(('x-access-token:'+os.environ['GH_TOKEN']).encode()).decode()
              git = ['git','-c','credential.helper=','-c','http.https://github.com/.extraheader=AUTHORIZATION: basic '+auth]
              if run([*git,'ls-remote','origin','refs/heads/'+BRANCH]).split()[0] != head:
                  raise RuntimeError('BRANCH_MOVED')
              run(['git','add','--',*files])
              run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','--no-gpg-sign','-m','test(db): guarantee a real journal ACL negative mutation for every preimage'])
              commit = run(['git','rev-parse','HEAD'])
              run([*git,'push','origin','HEAD:refs/heads/'+BRANCH])
              if run([*git,'ls-remote','origin','refs/heads/'+BRANCH]).split()[0] != commit:
                  raise RuntimeError('PUBLICATION_READBACK_FAILED')
              print(json.dumps({'codeCommit':commit,'files':files,'offlineProbeTests':5,'migrationFilesVerified':601,'nativeSqlAccepted':False,'mainMerged':False,'hostedDatabaseModified':False}),flush=True)
          try:
              main()
          except Exception:
              print('FAIL exact journal publication; no raw output or acceptance override',flush=True)
              raise SystemExit(1) from None
          PY
