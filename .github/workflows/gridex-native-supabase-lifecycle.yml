name: Gridex native Supabase lifecycle qualification
on:
  pull_request:
    paths:
      - '.github/workflows/gridex-native-supabase-lifecycle.yml'
      - 'scripts/canonical-native-supabase-lifecycle*.py'
permissions:
  contents: read
concurrency:
  group: gridex-native-supabase-lifecycle-310
  cancel-in-progress: false
jobs:
  native-cli-lifecycle:
    if: github.event.pull_request.number == 310 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/gridex-parity-remediation-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Verify local ownership, genuine-ledger and failure controls
        run: python3 -B scripts/canonical-native-supabase-lifecycle-selftest.py
      - name: Qualify an empty native Supabase and real CLI migration ledger
        run: python3 -B scripts/canonical-native-supabase-lifecycle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gridex-native-supabase-lifecycle
          path: artifacts/native-supabase-lifecycle.json
          retention-days: 2
          if-no-files-found: error
