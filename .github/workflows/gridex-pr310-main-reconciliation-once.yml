name: Gridex PR310 pinned main reconciliation
on:
  push:
    branches:
      - codex/gridex-parity-remediation-20260905
    paths:
      - '.github/workflows/gridex-pr310-main-reconciliation-once.yml'
permissions:
  contents: read
concurrency:
  group: gridex-pr310-pinned-main-reconciliation
  cancel-in-progress: false
jobs:
  reconcile-feature-only:
    if: github.repository == 'heke99/gridex-ops-platform' && github.ref == 'refs/heads/codex/gridex-parity-remediation-20260905' && github.actor == 'heke99'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      PR310_SOURCE_SHA: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact inputs and reconcile main into feature only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/gridex-parity-remediation-20260905 | cut -f1)" = "$PR310_SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = de098106c26d90069758cf1f753a94b073789ef2
          printf '%s  %s\n' 67706250605bb30177b3b26aa8272458591263a3ece0f4ec4eb330e3681eedaf scripts/pr310-reconcile-main.py | sha256sum -c -
          git config user.name 'heke99'
          git config user.email '129280077+heke99@users.noreply.github.com'
          python3 -B scripts/pr310-reconcile-main.py | tee "$RUNNER_TEMP/pr310-main-reconciliation.jsonl"
          test "$(git ls-remote origin refs/heads/codex/gridex-parity-remediation-20260905 | cut -f1)" = "$PR310_SOURCE_SHA"
          git push origin HEAD:refs/heads/codex/gridex-parity-remediation-20260905
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr310-main-reconciliation
          path: ${{ runner.temp }}/pr310-main-reconciliation.jsonl
          retention-days: 3
          if-no-files-found: warn
