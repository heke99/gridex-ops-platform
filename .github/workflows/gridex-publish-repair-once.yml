name: Gridex exact reviewed repair publication
on:
  pull_request:
    paths:
      - '.github/workflows/gridex-publish-repair-once.yml'
      - 'quality/paused/repair-proof-followup-20260913.patch'
permissions:
  contents: read
jobs:
  publish-reviewed-repair:
    if: github.event.pull_request.number == 310 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/gridex-parity-remediation-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Apply only the exact two-file reviewed patch
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          if git('rev-parse','HEAD^') != '64018125a720e6149cab153dcb8176f095be0308':
              raise SystemExit('One-time publication parent changed; no writes')
          files={
            'scripts/canonical-user-rbac-repair-selftest.py':('84af6039fdfe5501b5580cd6635e29727e77fbfaad4a22a2ae5ddd07bffffc11','aba99617be1cf4e594b617e978f1e28cd18c75458cdce7b4d4f9e14faff87a1c'),
            '.agent-memory/current-state.md':('66a9a94af5ca301a5ed7de17f3b4022be374de7f44fd16e6130866d06611e8d8','20d75383f7fd03ef1e667cdedb3c264dd1594c4bdf1b47328a62f395368dd083')}
          patch=pathlib.Path('quality/paused/repair-proof-followup-20260913.patch')
          if patch.is_symlink() or hashlib.sha256(patch.read_bytes()).hexdigest()!='e22866b70a00f85b03368950646fa0888e7f7c4871610afc97240690484d6d03':
              raise SystemExit('Reviewed patch mismatch')
          for name,(before,after) in files.items():
              p=pathlib.Path(name)
              if p.is_symlink() or hashlib.sha256(p.read_bytes()).hexdigest()!=before:
                  raise SystemExit('Source preimage mismatch')
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          for name,(before,after) in files.items():
              if hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()!=after:
                  raise SystemExit('Source postimage mismatch')
          if set(git('diff','--name-only').splitlines())!=set(files):
              raise SystemExit('Unexpected changed paths')
          subprocess.run(['git','diff','--check'],check=True)
          print('PASS exact source preimages, patch, postimages and two-file boundary')
          PY
      - name: Verify fixed constructors and unchanged membership contract
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/canonical-user-rbac-repair-selftest.py --selection-only
          python3 scripts/canonical-auth-membership-group-selftest.py
          python3 scripts/gridex-replay-required-checks-selftest.py
      - name: Publish non-force to the same PR branch only
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import base64, os, subprocess
          branch='codex/gridex-parity-remediation-20260905'
          def git(*args,**kwargs):
              return subprocess.check_output(['git',*args],text=True,**kwargs).strip()
          if git('rev-parse','HEAD')!=os.environ['EXPECTED_HEAD']:
              raise SystemExit('Checkout changed')
          expected={'.agent-memory/current-state.md','scripts/canonical-user-rbac-repair-selftest.py'}
          if set(git('diff','--name-only').splitlines())!=expected:
              raise SystemExit('Unexpected publication paths')
          env=dict(os.environ)
          token=env.pop('GH_TOKEN')
          env.update(GIT_CONFIG_COUNT='1',GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+token).encode()).decode())
          remote=git('ls-remote','origin','refs/heads/'+branch,env=env).split()[0]
          if remote!=os.environ['EXPECTED_HEAD']:
              raise SystemExit('Branch moved; refusing overwrite')
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('add','--',*sorted(expected))
          git('commit','-m','fix(db): repair residual constructor recorder and status contract')
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],env=env,check=True)
          print('published_commit='+git('rev-parse','HEAD'))
          PY
