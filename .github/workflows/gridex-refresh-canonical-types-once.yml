name: Gridex Refresh Canonical Types Once

on:
  push:
    branches:
      - agent/gridex-ops-production-remediation-v5-20260812
    paths:
      - .github/workflows/gridex-refresh-canonical-types-once.yml

permissions:
  contents: write
  actions: read

jobs:
  refresh-canonical-types:
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/gridex-ops-production-remediation-v5-20260812
          fetch-depth: 0

      - name: Download canonical clean-replay artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "9143612028"
          EXPECTED_SHA256: "590d065257082f37062d1d6a2e0fcaf5a2ccfc1aa8117aa23b937d6ce4d23af7"
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gridex-rem002 /tmp/gridex-rem002.zip
          mkdir -p /tmp/gridex-rem002
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output /tmp/gridex-rem002.zip
          unzip -q /tmp/gridex-rem002.zip -d /tmp/gridex-rem002
          test -s /tmp/gridex-rem002/rem002-database.types.ts
          ACTUAL_SHA256="$(sha256sum /tmp/gridex-rem002/rem002-database.types.ts | awk '{print $1}')"
          test "${ACTUAL_SHA256}" = "${EXPECTED_SHA256}"
          cp /tmp/gridex-rem002/rem002-database.types.ts supabase/database.types.ts

      - name: Pin generated-types manifest to canonical migration tail
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const path = 'scripts/supabase-types-manifest.json';
          const typesPath = 'supabase/database.types.ts';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          const types = fs.readFileSync(typesPath);
          manifest.generated_at = new Date().toISOString();
          manifest.latest_migration = '20260812143000_gridex_ops_grid_owner_invariants_v2.sql';
          manifest.sha256 = crypto.createHash('sha256').update(types).digest('hex');
          if (manifest.sha256 !== '590d065257082f37062d1d6a2e0fcaf5a2ccfc1aa8117aa23b937d6ce4d23af7') {
            throw new Error(`Unexpected canonical types hash: ${manifest.sha256}`);
          }
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          NODE
          node scripts/check-supabase-generated-types.cjs

      - name: Commit canonical generated types
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/database.types.ts scripts/supabase-types-manifest.json; then
            echo "Canonical generated types are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/database.types.ts scripts/supabase-types-manifest.json
          git commit -m "chore: refresh canonical Supabase generated types"
          git push origin HEAD:agent/gridex-ops-production-remediation-v5-20260812
