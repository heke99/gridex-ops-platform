name: Gridex residual early-boundary diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/gridex-residual-prefix77-probe.yml'
permissions:
  contents: read
jobs:
  prefix77:
    if: github.event.pull_request.number == 310 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/gridex-parity-remediation-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GRIDEX_LEGACY_CONTAINER_NAME: gridex-auth-legacy-continuation-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b8ee0281149a695857126e88b0d4d2f182b89a21
          persist-credentials: false
      - name: Probe only seven checksum-bound originals on owned early clones
        shell: bash
        run: |
          python3 - <<'PY'
          import contextlib,hashlib,importlib.util,io,json,os,shutil,signal
          from pathlib import Path
          root=Path.cwd().resolve()
          path=root/'scripts/canonical-foundation-frontier-diagnostic.py'
          spec=importlib.util.spec_from_file_location('prefix77_frontier',path)
          frontier=importlib.util.module_from_spec(spec);spec.loader.exec_module(frontier)
          controller=frontier.load_controller();legacy=controller.load_batch()
          order,report=frontier.verify_selection(controller)
          wanted=('migrations/01_db2_full_view_preflight_schema_and_functions.sql','migrations/03_db2_validation_and_finish.sql','migrations/20260521_batch_1_2_live_readiness_and_automation_hardening.sql','migrations/20260521_batch_customer_intake_batch2_completion.sql','migrations/20260522_db1_schema_repair_backfill_foundation.sql','migrations/20260525_debug_fix_batch_1b_schema_code_alignment.sql','migrations/20260601070000_ediel_production_readiness_hardening.sql')
          sources=[row for row in report['migrations'] if row['classification'] in ('UNCLASSIFIED','SUBSTITUTED')]
          if tuple(row['path'] for row in sources)!=wanted or len(order)!=144:
              raise RuntimeError('EXACT_RESIDUAL_SELECTION_REQUIRED')
          before=controller.originals_snapshot();output=Path(os.environ['RUNNER_TEMP'])/'prefix77-diagnostic';output.mkdir(mode=0o700)
          def interrupted(*_): raise RuntimeError('OWNED_DIAGNOSTIC_INTERRUPTED')
          signal.signal(signal.SIGTERM,interrupted);signal.signal(signal.SIGINT,interrupted)
          rows=[]
          with legacy.OwnedPostgres(postgis=True) as target:
              runtime=frontier.load_timestamp().verify_spatial_runtime(target)
              with controller.load_private().AcceptedInputs(target):
                  controller.load_dedupe().prepare_reference(target,'intake77')
                  controller.load_dedupe().fresh_target(target)
                  hold=Path(target.directory.name)/'prefix77-hold';hold.mkdir(mode=0o700)
                  for source in (root/'supabase/migrations').iterdir():
                      if source.is_symlink(): raise RuntimeError('SYMLINK_SOURCE_REJECTED')
                      if source.is_file() and source.suffix=='.sql': shutil.copy2(source,hold/source.name)
                  paths=[str(hold/Path(rel).name if rel.startswith('migrations/') else root/'supabase'/rel) for rel in order]
                  loop=controller.FoundationLoop(legacy,target,'intake77');loop.validate(str(hold),paths)
                  target.sql(controller.DATABASE,(root/'scripts/sql/gridex-supabase-compatible-bootstrap.sql').read_text(),'prefix77_bootstrap',transaction=False)
                  loop.run(str(hold),paths)
                  target.sql(controller.DATABASE,"DO $$ BEGIN IF EXISTS(SELECT 1 FROM auth.users) OR EXISTS(SELECT 1 FROM vault.secrets) THEN RAISE EXCEPTION 'SOURCE_ONLY_EXPECTS_EMPTY_IDENTITIES_AND_VAULT'; END IF; END $$;",'prefix77_source_only')
                  data=target.docker(['exec',target.name,'pg_dump','-U','postgres','-Fc','-d',controller.DATABASE])
                  (output/'source-only-prefix77.dump').write_bytes(data)
                  parent=target.catalog(controller.DATABASE)
                  for index,source in enumerate(sources,1):
                      raw=(root/'supabase'/source['path']).read_bytes()
                      if hashlib.sha256(raw).hexdigest()!=source['sha256']: raise RuntimeError('SOURCE_HASH_CHANGED')
                      clone='gridex_auth_legacy_atomic'
                      target.docker(['exec',target.name,'dropdb','-U','postgres','--if-exists','--force',clone])
                      target.docker(['exec',target.name,'createdb','-U','postgres','-T',controller.DATABASE,clone])
                      capture=io.StringIO();success=True;error_metadata={}
                      try:
                          with contextlib.redirect_stdout(capture):
                              try: target.sql(clone,raw.decode(),'early_residual_'+str(index),transaction=False)
                              except legacy.BoundaryError as error:
                                  if error.args!=('UNEXPECTED_SQL_RESULT',): raise
                                  success=False
                                  error_metadata=frontier.safe_error_identifiers((Path(target.directory.name)/'client-last.out').read_bytes())
                          rows.append({'path':source['path'],'sha256':source['sha256'],'checkpoint':'owned_actual77','sqlSucceeded':success,**error_metadata,'sourceEffectsAccepted':False})
                      finally:
                          capture.close();target.docker(['exec',target.name,'dropdb','-U','postgres','--if-exists','--force',clone])
                  if target.catalog(controller.DATABASE)!=parent or controller.originals_snapshot()!=before: raise RuntimeError('PARENT_OR_SOURCE_CHANGED')
              (output/'receipt.json').write_text(json.dumps({'scope':'EARLY_BOUNDARY_DIAGNOSIS_ONLY_NOT_ACCEPTANCE','sourceCommit':'b8ee0281149a695857126e88b0d4d2f182b89a21','foundationExecuted':77,'dumpSha256':hashlib.sha256(data).hexdigest(),'runtime':runtime,'authUsersEmpty':True,'vaultSecretsEmpty':True,'probes':rows,'completeReplayVerified':False,'generatedTypesVerified':False,'productionModified':False},indent=2)+'\n')
          if target.active: raise RuntimeError('OWNED_CLEANUP_REQUIRED')
          print(json.dumps({'scope':'EARLY_BOUNDARY_DIAGNOSIS_ONLY_NOT_ACCEPTANCE','probes':rows,'cleanup':'PASS'}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gridex-source-only-prefix77-diagnostic
          path: ${{ runner.temp }}/prefix77-diagnostic/
          retention-days: 1
          if-no-files-found: error
      - name: Remove only owned diagnostic database
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('scripts/canonical-foundation-frontier-diagnostic.py').resolve();s=importlib.util.spec_from_file_location('cleanup',p);m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          m.load_controller().load_batch().cleanup_workflow_owned()
          PY
