name: Gridex residual source transitions
on:
  pull_request:
    paths:
      - '.github/workflows/gridex-residual-prefix77-probe.yml'
      - 'scripts/canonical-residual-*.py'
      - 'scripts/canonical-db2-*.py'
      - 'scripts/canonical-auth-provisioning-replay.py'
permissions:
  contents: read
jobs:
  residual-transitions:
    if: github.event.pull_request.number == 310 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/gridex-parity-remediation-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GRIDEX_LEGACY_CONTAINER_NAME: gridex-auth-legacy-continuation-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check exact source transformations and rejection controls
        run: |
          python3 scripts/canonical-residual-transition-selftest.py
          python3 scripts/canonical-db2-reconstruction-selftest.py
          python3 scripts/canonical-residual-integration-selftest.py
          python3 scripts/canonical-timestamp-retained-selftest.py
      - name: Verify residual migrations and complete selected continuation
        run: python3 scripts/canonical-residual-transition-native.py
      - name: Verify foundation and timestamp tail with original SQL absent
        run: python3 scripts/canonical-residual-staging-native.py
      - name: Remove only this workflow's owned database
        if: always()
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('scripts/canonical-foundation-frontier-diagnostic.py').resolve()
          s=importlib.util.spec_from_file_location('cleanup',p);m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          m.load_controller().load_batch().cleanup_workflow_owned()
          PY
