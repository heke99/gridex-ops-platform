name: Gridex isolated test tooling

on:
  pull_request:
    paths:
      - '.github/workflows/gridex-test-tooling.yml'

permissions:
  contents: read

jobs:
  dependency-report:
    if: github.event.pull_request.number == 310 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/gridex-parity-remediation-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect audit reports and a non-force lockfile proposal
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/gridex-dependency-report"
          mkdir -p "$out"
          printf 'source=%s\nnode=%s\nnpm=%s\n' "$(git rev-parse HEAD)" "$(node --version)" "$(npm --version)" > "$out/receipt.txt"
          npm audit --json > "$out/before.json"
          echo "audit_before_exit=$?" >> "$out/receipt.txt"
          npm audit --omit=dev --json > "$out/production-before.json"
          echo "production_before_exit=$?" >> "$out/receipt.txt"
          npm audit fix --package-lock-only --ignore-scripts --json > "$out/proposal.json"
          echo "proposal_exit=$?" >> "$out/receipt.txt"
          npm audit --json > "$out/after.json"
          echo "audit_after_exit=$?" >> "$out/receipt.txt"
          npm view next dist-tags --json > "$out/next-tags.json"
          cp package.json package-lock.json "$out/"
          git diff -- package.json package-lock.json > "$out/proposed.patch"
          sha256sum "$out"/*.json >> "$out/receipt.txt"
          echo 'Diagnostic reports only; no dependency acceptance or repository write.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gridex-dependency-report
          path: ${{ runner.temp }}/gridex-dependency-report/
          retention-days: 1
          if-no-files-found: error
  postgres-tools:
    if: github.event.pull_request.number == 310 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/gridex-parity-remediation-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Export an unstarted official PostgreSQL image for isolated native tests
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/gridex-postgres-tools"
          mkdir -p "$out"
          name="gridex-test-tools-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker pull postgres:17-bookworm
          docker image inspect postgres:17-bookworm --format '{{json .RepoDigests}}' > "$out/receipt.txt"
          docker create --name "$name" postgres:17-bookworm >/dev/null
          docker export "$name" | gzip -1 > "$out/postgres-rootfs.tar.gz"
          sha256sum "$out/postgres-rootfs.tar.gz" >> "$out/receipt.txt"
          echo 'Unstarted vendor image only; no database, secrets or user data.' >> "$out/receipt.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: gridex-postgres-test-tools
          path: ${{ runner.temp }}/gridex-postgres-tools/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
