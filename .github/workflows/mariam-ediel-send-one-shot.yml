name: Mariam canonical Ediel send one-shot

on:
  push:
    branches:
      - ops/mariam-go-live-20260903

permissions:
  contents: read

concurrency:
  group: mariam-canonical-ediel-send
  cancel-in-progress: true

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-e2e
    steps:
      - name: Trigger canonical production outbox worker
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          [[ -n "$CRON_SECRET" ]] || { echo "CRON_SECRET is not available in production-e2e" >&2; exit 1; }
          response="$(curl --fail-with-body --silent --show-error \
            -X POST 'https://app.gridex.se/api/ediel/outbox/process' \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H 'Content-Type: application/json' \
            --data '{"environment":"production","limit":1}')"
          printf '%s\n' "$response"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.ok!==true) process.exit(1)' "$response"
