name: Mobile OPS isolated replay
on:
  pull_request:
    branches: [codex/mobile-ops-replay-baseline]
    paths: [.github/workflows/mobile-ops-isolated-replay.yml]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_TELEMETRY_DISABLED: 'true'
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 2.101.0
      - name: Replay canonical OPS schema on the runner
        shell: bash
        run: |
          unset GRIDEX_REPLAY_DB_URL
          bash scripts/gridex-aud-003-clean-replay.sh
