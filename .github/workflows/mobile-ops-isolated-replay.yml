name: Mobile OPS isolated replay
on:
  pull_request:
    branches: [codex/mobile-ops-replay-baseline]
    paths: [.github/workflows/mobile-ops-isolated-replay.yml]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_TELEMETRY_DISABLED: 'true'
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 2.101.0
      - name: Replay OPS schema and verify customer claim isolation
        shell: bash
        run: |
          unset GRIDEX_REPLAY_DB_URL
          set -eo pipefail
          source scripts/gridex-aud-003-clean-replay.sh
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f scripts/portal-claim-atomic-regression.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f scripts/staff-api-integration-auth-regression.sql
      - uses: actions/checkout@v4
        with:
          repository: heke99/gridex-web
          ref: 81e1323ca271ec330498e3f1d8757cbfdeb0cae1
          path: gridex-web
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Gridex Web dependencies
        working-directory: gridex-web
        run: npm ci --no-audit --no-fund
      - name: Verify pinned Gridex Web portal and mobile boundaries
        working-directory: gridex-web
        run: |
          npm run test:portal
          node --experimental-strip-types --experimental-loader ./tests/mobile-read-loader.mjs --test tests/mobile-contracts-handler.test.mjs tests/mobile-customer-data.test.mjs tests/mobile-customer-resources.test.mjs tests/mobile-detail-routes.test.mjs
