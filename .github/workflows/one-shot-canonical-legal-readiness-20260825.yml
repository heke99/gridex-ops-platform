name: One-shot canonical legal readiness hotfix

on:
  push:
    branches:
      - fix/canonical-legal-readiness-20260825

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-legal-readiness-20260825
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch canonical legal readiness
        shell: python
        run: |
          from pathlib import Path

          process_path = Path('lib/website/customerApplicationProcess.ts')
          source = process_path.read_text()
          old = '''    body = energyResolution.body;
    readiness = assessWebsiteApplicationReadiness(body);
'''
          new = '''    body = energyResolution.body;

    // `assertWebsiteLegalAcceptances` above is the canonical, tenant-scoped
    // legal verification. Once it succeeds, readiness must consume that
    // verified evidence instead of re-deriving legal state only from the raw
    // website payload. Otherwise a valid signed application can retain stale
    // `terms_accepted`/privacy/withdrawal/price blockers in OPS.
    const verifiedLegalTypes = new Set(
      legalAcceptanceVersions
        .map((version) => clean(version.type)?.toLowerCase())
        .filter((value): value is string => Boolean(value)),
    );
    body = {
      ...body,
      consents: {
        ...(body.consents ?? {}),
        ...(verifiedLegalTypes.has("terms")
          ? { terms: true, terms_accepted: true }
          : {}),
        ...(verifiedLegalTypes.has("privacy_policy")
          ? { privacy_policy: true, privacy_policy_accepted: true }
          : {}),
        ...(verifiedLegalTypes.has("withdrawal")
          ? { withdrawal: true, withdrawal_accepted: true }
          : {}),
        ...(verifiedLegalTypes.has("power_of_attorney")
          ? { power_of_attorney: true, power_of_attorney_accepted: true }
          : {}),
        ...(verifiedLegalTypes.has("price_terms")
          ? { price_terms: true, price_terms_accepted: true }
          : {}),
      },
    };
    readiness = assessWebsiteApplicationReadiness(body);
'''
          if source.count(old) != 1:
              raise SystemExit(f'Expected exactly one post-resolution readiness block, found {source.count(old)}')
          process_path.write_text(source.replace(old, new, 1))

          regression_path = Path('scripts/gridex-customer-application-review-regression.cjs')
          regression = regression_path.read_text()
          marker = "assert(applicationShared.includes('customer_contracts_status_check') && applicationPage.includes('customer_contracts_status_check'), 'contract status constraint errors are classified separately from source_type errors')\n"
          addition = marker + "assert(applicationProcess.includes('verifiedLegalTypes') && applicationProcess.includes('terms_accepted: true') && applicationProcess.includes('price_terms_accepted: true'), 'canonical verified legal evidence overrides stale raw consent flags before persisted readiness')\n"
          if regression.count(marker) != 1:
              raise SystemExit(f'Expected regression marker once, found {regression.count(marker)}')
          regression_path.write_text(regression.replace(marker, addition, 1))
      - run: npm ci
      - run: npm run gridex:customer-application-review-regression
      - run: npm run typecheck
      - name: Commit verified hotfix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-canonical-legal-readiness-20260825.yml
          git add lib/website/customerApplicationProcess.ts scripts/gridex-customer-application-review-regression.cjs
          git commit -m "fix: use canonical legal evidence for website readiness"
          git push origin HEAD:fix/canonical-legal-readiness-20260825
