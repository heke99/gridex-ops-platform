name: One-shot inbound review binding forward-port

on:
  push:
    branches:
      - remediation/inbound-review-binding-forward-port-2026-08-14

permissions:
  contents: write

concurrency:
  group: one-shot-inbound-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply narrow inbound review forward-port
        shell: bash
        run: |
          set -euo pipefail
          MIGRATION=supabase/migrations/20260814190000_inbound_manual_review_status_and_binding.sql
          EXPECTED_MIGRATION_HASH=433339563c48e24e3f9fd102b10705616b69431712c97a9dfa834515f5af66b1
          test "$(sha256sum "$MIGRATION" | awk '{print $1}')" = "$EXPECTED_MIGRATION_HASH"

          node <<'NODE'
          const fs = require('node:fs')

          function replaceOnce(path, before, after, label) {
            let source = fs.readFileSync(path, 'utf8')
            if (source.includes(after)) return
            if (!source.includes(before)) throw new Error(`${label} anchor missing in ${path}`)
            source = source.replace(before, after)
            fs.writeFileSync(path, source)
          }

          replaceOnce(
            'app/admin/inbound-mail/[id]/InboundManualReviewForm.tsx',
            '<option value="completed">Markera klar</option>',
            '<option value="done">Markera klar</option>',
            'manual review done option',
          )

          {
            const path = 'app/admin/inbound-mail/actions.ts'
            let source = fs.readFileSync(path, 'utf8')
            const before = `  const nextStatus = requiredText(formData, "next_status", "Nästa status");\n  if (!['queued', 'completed', 'failed'].includes(nextStatus)) {\n    throw new Error("Nästa status är ogiltig.");\n  }\n\n  const { error } = await supabaseService.rpc("canonical_resolve_inbound_manual_review", {\n    p_job_id: jobId,\n    p_resolution: resolution,`
            const after = `  const nextStatusRaw = requiredText(formData, "next_status", "Nästa status");\n  // Accept legacy "completed" from older UI builds, but persist canonical "done".\n  const nextStatus = nextStatusRaw === "completed" ? "done" : nextStatusRaw;\n  if (!["queued", "done", "failed"].includes(nextStatus)) {\n    throw new Error("Nästa status är ogiltig.");\n  }\n\n  const jobLookup = await supabaseService\n    .from("inbound_processing_jobs")\n    .select("id, inbound_email_message_id, status, review_resolved_at")\n    .eq("id", jobId)\n    .maybeSingle();\n  if (jobLookup.error) throw jobLookup.error;\n  if (!jobLookup.data) {\n    throw new Error("inbound_processing_job_not_found");\n  }\n  if (jobLookup.data.inbound_email_message_id !== inboundEmailMessageId) {\n    throw new Error("inbound_processing_job_message_mismatch");\n  }\n\n  const { error } = await supabaseService.rpc("canonical_resolve_inbound_manual_review", {\n    p_job_id: jobId,\n    p_inbound_email_message_id: inboundEmailMessageId,\n    p_resolution: resolution,`
            if (!source.includes('p_inbound_email_message_id: inboundEmailMessageId')) {
              if (!source.includes(before)) throw new Error('manual review action anchor missing')
              source = source.replace(before, after)
            }
            fs.writeFileSync(path, source)
          }

          {
            const path = 'app/admin/inbound-mail/[id]/reviewActions.ts'
            let source = fs.readFileSync(path, 'utf8')
            const anchor = `    if (message.includes('manual_review_resolution_required')) {\n      return { error: 'Beskriv vad som verifierades eller korrigerades.' }\n    }`
            const replacement = `    if (message.includes('inbound_processing_job_message_mismatch')) {\n      return { error: 'Jobbet hör inte till detta inbound-mail. Ladda om sidan.' }\n    }\n    if (message.includes('manual_review_resolution_required')) {\n      return { error: 'Beskriv vad som verifierades eller korrigerades.' }\n    }\n    if (message.includes('manual_review_next_status_invalid')) {\n      return { error: 'Nästa status är ogiltig.' }\n    }`
            if (!source.includes('inbound_processing_job_message_mismatch')) {
              if (!source.includes(anchor)) throw new Error('review action error anchor missing')
              source = source.replace(anchor, replacement)
            }
            fs.writeFileSync(path, source)
          }

          {
            const path = 'supabase/database.types.ts'
            let source = fs.readFileSync(path, 'utf8')
            const anchor = `      canonical_resolve_inbound_manual_review: {\n        Args: {\n          p_actor_user_id: string\n          p_job_id: string`
            const replacement = `      canonical_resolve_inbound_manual_review: {\n        Args: {\n          p_actor_user_id: string\n          p_inbound_email_message_id: string\n          p_job_id: string`
            if (!source.includes('p_inbound_email_message_id: string\n          p_job_id: string')) {
              if (!source.includes(anchor)) throw new Error('database types RPC anchor missing')
              source = source.replace(anchor, replacement)
            }
            fs.writeFileSync(path, source)
          }

          const migrationManifestPath = 'scripts/migration-history-manifest.additions.json'
          const migrationManifest = JSON.parse(fs.readFileSync(migrationManifestPath, 'utf8'))
          migrationManifest.files['20260814190000_inbound_manual_review_status_and_binding.sql'] = '433339563c48e24e3f9fd102b10705616b69431712c97a9dfa834515f5af66b1'
          fs.writeFileSync(migrationManifestPath, JSON.stringify(migrationManifest, null, 2) + '\n')

          const typesManifestPath = 'scripts/supabase-types-manifest.json'
          const typesManifest = JSON.parse(fs.readFileSync(typesManifestPath, 'utf8'))
          typesManifest.generated_at = '2026-08-14T19:05:43.000Z'
          typesManifest.sha256 = 'c0917477d048d65cbedb826a38780795be11a18150503171087dd672e9e1984e'
          typesManifest.latest_migration = '20260814190000_inbound_manual_review_status_and_binding.sql'
          fs.writeFileSync(typesManifestPath, JSON.stringify(typesManifest, null, 2) + '\n')

          const test = `import { readFileSync } from 'node:fs'\nimport { describe, expect, it } from 'vitest'\n\nconst residualMigration = readFileSync('supabase/migrations/20260814190000_inbound_manual_review_status_and_binding.sql', 'utf8')\nconst actions = readFileSync('app/admin/inbound-mail/actions.ts', 'utf8')\nconst form = readFileSync('app/admin/inbound-mail/[id]/InboundManualReviewForm.tsx', 'utf8')\nconst poller = readFileSync('lib/inbound-mail/edielMailboxPoller.ts', 'utf8')\n\ndescribe('post-#139 inbound manual review residuals', () => {\n  it('uses canonical inbound job terminal status done, not completed', () => {\n    expect(poller).toContain('status: outcome.status === "processed" ? "done" : "manual_review"')\n    expect(form).toContain('value="done"')\n    expect(form).not.toMatch(/value=["']completed["']/)\n    expect(actions).toContain('["queued", "done", "failed"]')\n    expect(residualMigration).toContain("when lower(btrim(p_next_status)) = 'completed' then 'done'")\n    expect(residualMigration).toContain("v_next_status not in ('queued', 'done', 'failed')")\n  })\n\n  it('binds review resolution to the inbound email message on the page', () => {\n    expect(actions).toContain('inbound_processing_job_message_mismatch')\n    expect(actions).toMatch(/from\\(["']inbound_processing_jobs["']\\)[\\s\\S]*?inbound_email_message_id[\\s\\S]*?eq\\(["']id["'],\\s*jobId\\)/)\n    expect(residualMigration).toContain('p_inbound_email_message_id')\n    expect(residualMigration).toContain('inbound_processing_job_message_mismatch')\n  })\n})\n`
          fs.writeFileSync('__tests__/post-139-inbound-manual-review-residuals.test.ts', test)
          NODE

          test "$(sha256sum supabase/database.types.ts | awk '{print $1}')" = "c0917477d048d65cbedb826a38780795be11a18150503171087dd672e9e1984e"
      - name: Verify focused change
        run: |
          npm run db:migrations:check
          npm run db:types:check
          npx vitest run __tests__/post-139-inbound-manual-review-residuals.test.ts
          npm run typecheck
          npm run security:audit-production
      - name: Commit forward-port
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/admin/inbound-mail/actions.ts \
            app/admin/inbound-mail/[id]/InboundManualReviewForm.tsx \
            app/admin/inbound-mail/[id]/reviewActions.ts \
            __tests__/post-139-inbound-manual-review-residuals.test.ts \
            scripts/migration-history-manifest.additions.json \
            scripts/supabase-types-manifest.json \
            supabase/database.types.ts \
            supabase/migrations/20260814190000_inbound_manual_review_status_and_binding.sql
          git diff --cached --quiet && { echo "No changes."; exit 0; }
          git commit -m "fix(inbound): enforce canonical manual review status and message binding"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"
