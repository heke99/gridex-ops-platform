name: one-shot-inbound-z02-canonical-convergence

on:
  push:
    branches: [fix/inbound-z02-canonical-convergence-20260903]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/inbound-z02-canonical-convergence-20260903
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply canonical inbound patch
        run: python3 scripts/one-shot-inbound-z02-convergence.py
      - name: Focused verification
        run: |
          npx vitest run __tests__/ediel-inbound-route-business-response.test.ts __tests__/z02-atomic-worker-convergence.test.ts __tests__/z02-raw-receipt-before-verification.test.ts
          npm run typecheck
      - name: Commit final patch
        run: |
          rm scripts/one-shot-inbound-z02-convergence.py
          rm .github/workflows/one-shot-inbound-z02-convergence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Converge inbound Z02 validation and atomic apply"
          git push origin HEAD:fix/inbound-z02-canonical-convergence-20260903
