name: One-shot repair legacy settlement replay projection

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/non-expiring-customer-web-prices-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/non-expiring-customer-web-prices-20260822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add deterministic legacy settlement projection
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'lib/pricing/publicWebsiteQuote.ts'
          let source = fs.readFileSync(path, 'utf8')
          const importAnchor = "import { assertPublicResponsePayload } from '@/lib/api/publicPayloadSafety'\n"
          if (!source.includes(importAnchor)) throw new Error('publicWebsiteQuote import anchor missing')
          if (!source.includes("from '@/lib/pricing/websiteSettlement'")) {
            source = source.replace(
              importAnchor,
              `${importAnchor}import { websiteSettlementForContract } from '@/lib/pricing/websiteSettlement'\n`,
            )
          }
          const oldLine = '  const settlement = publicSettlement(source.settlement)'
          const replacement = `  const contractType = text(offer.contract_type)\n  const settlement = publicSettlement(source.settlement)\n    ?? (contractType\n      ? websiteSettlementForContract({\n          contractType,\n          pricingInterval: text(source.pricing_interval),\n        })\n      : null)`
          if (!source.includes(oldLine)) throw new Error('publicWebsiteQuote settlement anchor missing')
          source = source.replace(oldLine, replacement)
          fs.writeFileSync(path, source)
          NODE
      - name: Verify legacy replay and typing
        run: |
          npx vitest run __tests__/public-website-quote.test.ts __tests__/website-settlement-model.test.ts
          npm run typecheck
      - name: Commit repair
        run: |
          rm .github/workflows/one-shot-legacy-settlement-replay.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/pricing/publicWebsiteQuote.ts .github/workflows/one-shot-legacy-settlement-replay.yml
          git diff --cached --check
          git commit -m 'fix(pricing): derive settlement for legacy quote replay'
          git push origin HEAD:fix/non-expiring-customer-web-prices-20260822
