name: One-shot OpenAPI operationId repair

on:
  push:
    branches:
      - remediation/openapi-portal-scope-parity-2026-08-14

permissions:
  contents: write

concurrency:
  group: one-shot-operation-id-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Normalize immutable OpenAPI operation metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'scripts/finalize-openapi-release.cjs'
          let source = fs.readFileSync(path, 'utf8')

          const operationAnchor = `    const operation = document.paths?.[path]?.get\n    if (!operation) continue\n    operation.security = []`
          const operationInsertion = `    const operation = document.paths?.[path]?.get\n    if (!operation) continue\n    const immutableMatch = path.match(/^\\/api\\/v1\\/openapi\\/(\\d{4}-\\d{2}-\\d{2}\\.\\d+)\\/(website-integration-v1|customer-portal-v1)\\.json$/)\n    if (immutableMatch) {\n      const versionToken = immutableMatch[1].replace(/[^0-9A-Za-z]/g, '')\n      const documentToken = immutableMatch[2] === 'website-integration-v1'\n        ? 'WebsiteIntegrationV1Json'\n        : 'CustomerPortalV1Json'\n      operation.operationId = \`getApiV1Openapi\${versionToken}\${documentToken}\`\n    }\n    operation.security = []`
          if (!source.includes('const immutableMatch = path.match(')) {
            if (!source.includes(operationAnchor)) {
              throw new Error('normalizePublicOpenApiDocumentOperations operationId anchor missing')
            }
            source = source.replace(operationAnchor, operationInsertion)
          }

          const metadataAnchor = `    operation.security = []\n    operation['x-required-scopes'] = []\n    const response200 = operation.responses?.['200']`
          const metadataReplacement = `    operation.security = []\n    operation['x-required-scopes'] = []\n    operation['x-scope-mode'] = 'all'\n    operation['x-rate-limit-class'] = 'read'\n    operation['x-idempotency-required'] = false\n    operation['x-cache-policy'] = immutableMatch ? 'public-immutable' : 'private-revalidate'\n    operation['x-public-id-policy'] = 'none'\n    if (path === '/api/v1/openapi/release-manifest.json') {\n      operation.operationId = 'getApiV1OpenapiReleaseManifestJson'\n    }\n    const response200 = operation.responses?.['200']`
          if (!source.includes("operation['x-cache-policy'] = immutableMatch ? 'public-immutable' : 'private-revalidate'")) {
            if (!source.includes(metadataAnchor)) {
              throw new Error('normalizePublicOpenApiDocumentOperations metadata anchor missing')
            }
            source = source.replace(metadataAnchor, metadataReplacement)
          }

          fs.writeFileSync(path, source)
          NODE
      - name: Regenerate unpublished release and verify
        shell: bash
        run: |
          npm run api:finalize
          # 2026-08-14.1 exists only on this unmerged remediation branch. Remove
          # that unpublished materialized copy so it can be regenerated from the
          # corrected canonical source; older published releases remain untouched.
          rm -rf docs/openapi/releases/2026-08-14.1
          npm run api:materialize
          bash quality/mechanical/verify.sh
          npm run api:compatibility
          npm run api:release:verify
          npm run api:runtime:parity
      - name: Commit verified generator and artifacts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/finalize-openapi-release.cjs docs/openapi app/api/v1/openapi/2026-08-14.1
          git diff --cached --quiet && { echo "No changes."; exit 0; }
          git commit -m "fix(api): normalize OpenAPI runtime metadata"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"
