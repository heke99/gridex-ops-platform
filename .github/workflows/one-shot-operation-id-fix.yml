name: OpenAPI contract verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify OpenAPI contracts
        run: |
          bash quality/mechanical/verify.sh
          node scripts/check-openapi-runtime-parity.cjs
          npm run api:compatibility
          npm run api:release:verify
          npm run api:runtime:parity
