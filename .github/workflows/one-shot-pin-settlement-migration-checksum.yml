name: One-shot pin settlement migration checksum

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  pin:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/non-expiring-customer-web-prices-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/non-expiring-customer-web-prices-20260822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin migration checksum
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'scripts/migration-history-manifest.additions.json'
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'))
          manifest.files ||= {}
          manifest.files['20260822103821_non_expiring_website_quotes.sql'] = '0e7999289464d362c232ec811dabc5ea146c4be5c5cf902b3126dd01e43f5a1d'
          const sorted = Object.fromEntries(Object.entries(manifest.files).sort(([a],[b]) => a.localeCompare(b)))
          manifest.files = sorted
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`)
          NODE
          rm .github/workflows/one-shot-pin-settlement-migration-checksum.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/migration-history-manifest.additions.json .github/workflows/one-shot-pin-settlement-migration-checksum.yml
          git diff --cached --check
          git commit -m 'chore(db): pin non-expiring quote migration checksum'
          git push origin HEAD:fix/non-expiring-customer-web-prices-20260822
