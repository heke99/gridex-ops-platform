name: One-shot PR247 manifest repair
on:
  push:
    branches: [test/zero-admin-production-crawler]
    paths:
      - .github/workflows/one-shot-pr247-manifest-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/zero-admin-production-crawler
      - name: Refresh migration checksum and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const crypto = require('node:crypto')
          const migration = '20260829194612_white_label_membership_rls_recursion_fix.sql'
          const bytes = fs.readFileSync(`supabase/migrations/${migration}`)
          const hash = crypto.createHash('sha256').update(bytes).digest('hex')
          const path = 'scripts/migration-history-manifest.additions.json'
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'))
          manifest.files[migration] = hash
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`)
          console.log(`updated ${migration} => ${hash}`)
          NODE
          rm .github/workflows/one-shot-pr247-manifest-repair.yml
          git config user.name 'gridex-ci-repair'
          git config user.email 'gridex-ci-repair@users.noreply.github.com'
          git add scripts/migration-history-manifest.additions.json .github/workflows/one-shot-pr247-manifest-repair.yml
          git commit -m 'chore(db): refresh PR247 migration checksum'
          git push origin HEAD:test/zero-admin-production-crawler
