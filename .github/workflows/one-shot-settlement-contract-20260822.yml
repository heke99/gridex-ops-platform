name: One-shot settlement contract 2026-08-22.1

on:
  push:
    branches:
      - fix/non-expiring-customer-web-prices-20260822

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/non-expiring-customer-web-prices-20260822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply settlement/API patch
        run: node scripts/one-shot-settlement-contract-20260822.cjs
      - name: Finalize and materialize OpenAPI release
        run: |
          npm run api:finalize
          npm run api:materialize
      - name: Verify targeted contract and pricing gates
        run: |
          npm run typecheck
          npx vitest run __tests__/website-settlement-model.test.ts __tests__/non-expiring-website-quotes.test.ts __tests__/pricing-settlement-semantics.test.ts __tests__/website-quote-validate-contract-parity.test.ts
          npm run api:compatibility
          npm run api:release:verify
          npm run db:types:check
      - name: Remove one-shot tooling and commit result
        run: |
          rm .github/workflows/one-shot-settlement-contract-20260822.yml
          rm scripts/one-shot-settlement-contract-20260822.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(pricing): publish multitenant settlement semantics"
          git push origin HEAD:fix/non-expiring-customer-web-prices-20260822
