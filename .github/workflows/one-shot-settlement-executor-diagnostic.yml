name: One-shot settlement patch diagnostic executor
on:
  push:
    branches: [fix/non-expiring-customer-web-prices-20260822]
permissions:
  contents: write
jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/non-expiring-customer-web-prices-20260822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Execute patch and capture diagnostics
        shell: bash
        run: |
          set +e
          LOG=/tmp/settlement-patch.log
          {
            echo '=== apply patch ==='
            node scripts/one-shot-settlement-contract-20260822.cjs
            S1=$?
            echo "apply_status=$S1"
            if [ "$S1" -eq 0 ]; then
              echo '=== finalize ==='
              npm run api:finalize
              S2=$?
              echo "finalize_status=$S2"
            else S2=99; fi
            if [ "$S1" -eq 0 ] && [ "$S2" -eq 0 ]; then
              echo '=== materialize ==='
              npm run api:materialize
              S3=$?
              echo "materialize_status=$S3"
            else S3=99; fi
            if [ "$S1" -eq 0 ] && [ "$S2" -eq 0 ] && [ "$S3" -eq 0 ]; then
              echo '=== typecheck ==='
              npm run typecheck
              S4=$?
              echo "typecheck_status=$S4"
            else S4=99; fi
            if [ "$S1" -eq 0 ] && [ "$S2" -eq 0 ] && [ "$S3" -eq 0 ] && [ "$S4" -eq 0 ]; then
              echo '=== targeted tests ==='
              npx vitest run __tests__/website-settlement-model.test.ts __tests__/non-expiring-website-quotes.test.ts __tests__/pricing-settlement-semantics.test.ts __tests__/website-quote-validate-contract-parity.test.ts
              S5=$?
              echo "tests_status=$S5"
            else S5=99; fi
            if [ "$S1" -eq 0 ] && [ "$S2" -eq 0 ] && [ "$S3" -eq 0 ] && [ "$S4" -eq 0 ] && [ "$S5" -eq 0 ]; then
              npm run api:compatibility
              S6=$?
              echo "api_compat_status=$S6"
              npm run api:release:verify
              S7=$?
              echo "api_release_status=$S7"
              npm run db:types:check
              S8=$?
              echo "types_manifest_status=$S8"
            else S6=99; S7=99; S8=99; fi
          } >"$LOG" 2>&1
          if [ "${S1:-99}" -eq 0 ] && [ "${S2:-99}" -eq 0 ] && [ "${S3:-99}" -eq 0 ] && [ "${S4:-99}" -eq 0 ] && [ "${S5:-99}" -eq 0 ] && [ "${S6:-99}" -eq 0 ] && [ "${S7:-99}" -eq 0 ] && [ "${S8:-99}" -eq 0 ]; then
            rm -f .github/workflows/one-shot-settlement-contract-20260822.yml
            rm -f .github/workflows/one-shot-settlement-executor-diagnostic.yml
            rm -f scripts/one-shot-settlement-contract-20260822.cjs
            rm -f ONE_SHOT_SETTLEMENT_DIAGNOSTIC.log
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'feat(pricing): publish multitenant settlement semantics'
            git push origin HEAD:fix/non-expiring-customer-web-prices-20260822
          else
            git reset --hard HEAD
            cp "$LOG" ONE_SHOT_SETTLEMENT_DIAGNOSTIC.log
            rm -f .github/workflows/one-shot-settlement-executor-diagnostic.yml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+heke99@users.noreply.github.com'
            git add -A
            git commit -m 'chore: capture settlement patch diagnostic'
            git push origin HEAD:fix/non-expiring-customer-web-prices-20260822
          fi
