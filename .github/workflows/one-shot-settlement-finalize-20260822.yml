name: One-shot finalize settlement release 2026-08-22.1

on:
  push:
    branches:
      - fix/non-expiring-customer-web-prices-20260822

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/non-expiring-customer-web-prices-20260822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate canonical settlement release
        run: |
          node scripts/one-shot-settlement-contract-20260822.cjs
          npm run api:finalize
          npm run api:materialize
      - name: Verify release
        run: |
          npm run typecheck
          npx vitest run __tests__/website-settlement-model.test.ts __tests__/non-expiring-website-quotes.test.ts __tests__/pricing-settlement-semantics.test.ts __tests__/website-quote-validate-contract-parity.test.ts
          npm run api:compatibility
          npm run api:release:verify
          npm run db:types:check
      - name: Commit canonical generated state
        run: |
          rm -f .github/workflows/one-shot-settlement-contract-20260822.yml
          rm -f .github/workflows/one-shot-settlement-finalize-20260822.yml
          rm -f .github/workflows/one-shot-settlement-executor-diagnostic.yml
          rm -f scripts/one-shot-settlement-contract-20260822.cjs
          rm -f ONE_SHOT_SETTLEMENT_DIAGNOSTIC.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(pricing): publish multitenant settlement semantics'
          git push origin HEAD:fix/non-expiring-customer-web-prices-20260822
