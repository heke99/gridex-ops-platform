name: Remove completed one-shot website application repair

on:
  push:
    branches:
      - test/zero-admin-production-crawler

permissions:
  contents: write

jobs:
  remove-self:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/zero-admin-production-crawler
          fetch-depth: 0
      - name: Remove completed one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-website-app-relationship-fix.yml
          git commit -m 'chore(ci): remove completed one-shot repair'
          git push origin HEAD:test/zero-admin-production-crawler
