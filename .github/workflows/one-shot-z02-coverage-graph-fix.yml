name: one-shot Z02 coverage graph fix

on:
  push:
    branches:
      - fix/inbound-z02-canonical-convergence-20260903

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/inbound-z02-canonical-convergence-20260903
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Isolate pure Z02 decision logic from runtime dependency graphs
        shell: bash
        run: |
          cat > lib/ediel/tenant/inboundRouteSemantics.ts <<'EOF'
          import { canonicalBusinessResponsesForFamilyCode } from '@/lib/ediel/rulebook/canonicalAckFacade'

          function upper(value: unknown): string {
            return String(value ?? '').trim().toUpperCase()
          }

          /**
           * Exact route codes match directly. A configured request code may also
           * match its canonical business response; unknown families fail closed.
           */
          export function inboundRouteMessageCodeMatches(input: {
            family: string | null | undefined
            configuredCode: string | null | undefined
            inboundCode: string | null | undefined
          }): boolean {
            const family = upper(input.family)
            const configuredCode = upper(input.configuredCode)
            const inboundCode = upper(input.inboundCode)

            if (!configuredCode || !inboundCode) return true
            if (configuredCode === inboundCode) return true
            if (!family) return false

            try {
              return canonicalBusinessResponsesForFamilyCode({ family, code: configuredCode })
                .map(upper)
                .includes(inboundCode)
            } catch {
              return false
            }
          }
          EOF

          cat > lib/customer-operations/z02AtomicEvidence.ts <<'EOF'
          export type Z02AtomicRecord = Record<string, unknown>

          function record(value: unknown): Z02AtomicRecord {
            return value && typeof value === 'object' && !Array.isArray(value)
              ? value as Z02AtomicRecord
              : {}
          }

          /**
           * Accept DB-owned Z02 masterdata only when every canonical gate left
           * explicit proof on the durable job result.
           */
          export function canonicalAtomicZ02JobResult(result: Z02AtomicRecord | null): Z02AtomicRecord | null {
            const root = record(result)
            const core = record(root.z02_atomic_core)
            if (
              root.z02_correlation_status !== 'exact' ||
              root.z02_payload_validation_status !== 'valid' ||
              root.z02_snapshot_freshness_status !== 'valid' ||
              root.z02_atomic_core_applied !== true ||
              core.ok !== true
            ) return null
            return core
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {s.count(old)} for {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          resolver = Path('lib/ediel/tenant/resolveInboundTenant.ts')
          s = resolver.read_text()
          s = s.replace("import { canonicalAckRequirementsForFamilyCode } from '@/lib/ediel/rulebook/canonicalEdielFacade'\n", "import { inboundRouteMessageCodeMatches } from '@/lib/ediel/tenant/inboundRouteSemantics'\n", 1)
          start = s.index('/**\n * Route profiles are normally message-code specific')
          end = s.index('\nfunction routeMessageCodeMatchKind', start)
          s = s[:start] + s[end+1:]
          resolver.write_text(s)

          auto = Path('lib/customer-operations/automation.part-2.ts')
          s = auto.read_text()
          import_anchor = "import { makeCustomerOperationBlocker, routeIssueCodeToCustomerBlocker, type CustomerOperationBlocker } from '@/lib/customer-operations/blockers'\n"
          if s.count(import_anchor) != 1:
              raise SystemExit('automation import anchor mismatch')
          s = s.replace(import_anchor, import_anchor + "import { canonicalAtomicZ02JobResult } from '@/lib/customer-operations/z02AtomicEvidence'\n", 1)
          start = s.index('export function canonicalAtomicZ02JobResult(')
          end = s.index('\nexport async function processInboundResponse', start)
          s = s[:start] + s[end+1:]
          auto.write_text(s)

          replace_once(
              '__tests__/ediel-inbound-route-business-response.test.ts',
              "import { inboundRouteMessageCodeMatches } from '@/lib/ediel/tenant/resolveInboundTenant'",
              "import { inboundRouteMessageCodeMatches } from '@/lib/ediel/tenant/inboundRouteSemantics'",
          )
          replace_once(
              '__tests__/z02-atomic-worker-convergence.test.ts',
              "import { canonicalAtomicZ02JobResult } from '@/lib/customer-operations/automation.part-2'",
              "import { canonicalAtomicZ02JobResult } from '@/lib/customer-operations/z02AtomicEvidence'",
          )
          PY
      - name: Verify focused behavior architecture typecheck and historical coverage floor
        run: |
          npx vitest run __tests__/ediel-normative-authority-boundary.test.ts __tests__/ediel-inbound-route-business-response.test.ts __tests__/z02-atomic-worker-convergence.test.ts __tests__/z02-raw-receipt-before-verification.test.ts
          npm run typecheck
          npm run test:coverage
          node scripts/check-coverage-ratchet.cjs
      - name: Commit clean dependency-light regression structure
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-z02-narrow-facade.yml
          rm -f .github/workflows/one-shot-measure-main-coverage.yml
          rm -f .github/workflows/one-shot-z02-coverage-graph-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Keep Z02 regressions dependency-light without weakening coverage"
          git push origin HEAD:fix/inbound-z02-canonical-convergence-20260903
