name: One-shot zero-admin manifest repair

on:
  push:
    branches:
      - test/zero-admin-production-crawler
    paths:
      - .github/workflows/one-shot-zero-admin-manifest-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/zero-admin-production-crawler
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add exact migration checksum
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'scripts/migration-history-manifest.additions.json'
          const key = '20260829194612_white_label_membership_rls_recursion_fix.sql'
          const value = 'f814229f15045079ccbdcb4156577e9812c1b50d17e0318adfd02ae0031a6afe'
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'))
          manifest.files ||= {}
          if (manifest.files[key] && manifest.files[key] !== value) {
            throw new Error(`Refusing to overwrite conflicting checksum for ${key}`)
          }
          manifest.files[key] = value
          manifest.files = Object.fromEntries(Object.entries(manifest.files).sort(([a], [b]) => a.localeCompare(b)))
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`)
          NODE
          git diff --check
          git diff -- scripts/migration-history-manifest.additions.json
          node scripts/check-migration-versions.cjs
          if git diff --quiet -- scripts/migration-history-manifest.additions.json; then
            echo 'Manifest already correct.'
            exit 0
          fi
          git config user.name 'gridex-ci-repair'
          git config user.email 'gridex-ci-repair@users.noreply.github.com'
          git add scripts/migration-history-manifest.additions.json
          git commit -m 'chore(db): register white-label RLS migration checksum'
          git push origin HEAD:test/zero-admin-production-crawler
