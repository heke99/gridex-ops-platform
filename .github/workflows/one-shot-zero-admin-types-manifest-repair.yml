name: One-shot zero-admin types manifest repair

on:
  push:
    branches:
      - test/zero-admin-production-crawler
    paths:
      - .github/workflows/one-shot-zero-admin-types-manifest-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/zero-admin-production-crawler
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh generated Supabase manifest tail
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-supabase-types.cjs
          git diff --check
          if git diff --quiet -- types/supabase.ts; then
            echo 'Supabase types manifest already current.'
            exit 0
          fi
          git diff -- types/supabase.ts
          node <<'NODE'
          const fs = require('node:fs')
          const text = fs.readFileSync('types/supabase.ts', 'utf8')
          const expectedSha = '8167dd06f0dec7e1c52eb5375c2e97692cf548790872ffe0611cf2fcbe59ee097'
          const expectedMigration = '20260829194612_white_label_membership_rls_recursion_fix.sql'
          if (!text.includes(`\"generated_sha256\": \"${expectedSha}\"`)) throw new Error('Unexpected generated_sha256')
          if (!text.includes(`\"latest_migration\": \"${expectedMigration}\"`)) throw new Error('Unexpected latest_migration')
          NODE
          git config user.name 'gridex-ci-repair'
          git config user.email 'gridex-ci-repair@users.noreply.github.com'
          git add types/supabase.ts
          git commit -m 'chore(types): refresh Supabase schema manifest'
          git push origin HEAD:test/zero-admin-production-crawler

# Existing-before-push trigger marker.
