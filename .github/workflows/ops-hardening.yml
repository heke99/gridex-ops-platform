name: OPS hardening
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrations:check
      # F-15: service_role bypasses RLS, so every direct call site carries tenant
      # isolation on its own. The count may fall but never rise; new tenant-scoped
      # queries use tenantDb(companyId) from lib/supabase/tenantDb.
      - run: npm run tenant:service-role-ratchet
      - run: npm run gridex:contract-channel-publication-regression
      - run: node scripts/check-agent-memory-git-state.cjs
      - run: node scripts/gridex-aud-003-migration-provenance-regression.cjs
      - run: node scripts/gridex-ops-health-regression.cjs
      - run: npm run gridex:api-billing-tenant-hardening-regression
      - run: npm run typecheck
      - name: Canonical quote runtime regression matrix
        run: npx vitest run __tests__/canonical-contract-runtime-adapter.test.ts __tests__/contract-commercial-selection.test.ts __tests__/website-quote-persistence-invariant.test.ts __tests__/public-website-quote.test.ts
      - run: node scripts/gridex-quote-idempotency-multitenant-regression.cjs
      - run: node scripts/gridex-partner-api-business-contract-regression.cjs
      - run: node scripts/gridex-papilite-centroid-regression.cjs
      - run: npx vitest run __tests__/papilite-postal-centroid-hardening.test.ts
      - run: npx vitest run __tests__/usage-event-and-integration-idempotency.test.ts __tests__/logging-redaction.test.ts
      - run: npx vitest run __tests__/runtime-contract-resilience.test.ts __tests__/platform-schema-readiness.test.ts __tests__/dependency-circuit.test.ts
      - run: npm run ops:hardening-regression
      - run: npm run ops:hardening-behavior-regression
      - name: Integrated remaining-masterpoints golden path
        run: node scripts/gridex-remaining-masterpoints-golden-path-regression.cjs
      - run: npm run gridex:canonical-architecture-57-regression
      - run: npm run gridex:post-108-health-residuals-regression
      - run: npm run gridex:post-332-field-511-health-residuals-regression
      - run: npx vitest run __tests__/ediel-utilts-transaction-disposition.test.ts __tests__/ediel-utilts-transaction-persistence.test.ts
      - run: npm run ops:final-contract-regression
      - run: npm run api:error-boundaries
      - run: npm run security:audit-production

  quality-release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck:scripts
      - run: npm run typecheck:tests
      - run: bash quality/mechanical/verify.sh
      - run: npx vitest run --config quality/vitest.config.ts
      - run: npm test
      - run: npm run api:docs
      - run: npm run api:compatibility
      - run: npm run api:release:verify
      - run: npm run security:rbac
      - run: npm run quality:large-file-budget
      - run: npm run quality:performance
      - run: npm run build
      - run: npm run quality:bundle-budget

  clean-migration-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Install a PostgreSQL client matching the replay server
        shell: bash
        run: |
          set -euo pipefail
          # supabase/config.toml pins major_version 17, and pg_dump refuses to
          # dump a server newer than itself. The runner ships an older client,
          # so the schema snapshot aborts on a version mismatch.
          server_major="$(python3 -c "import re,pathlib;print(re.search(r'^major_version\s*=\s*(\d+)', pathlib.Path('supabase/config.toml').read_text(), re.M).group(1))")"
          echo "replay server major version: $server_major"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-$server_major"
          # Name the matching binary explicitly. pg_wrapper does not reliably
          # resolve to the newest installed major, so relying on PATH here can
          # still pick an older pg_dump and abort on a version mismatch.
          echo "GRIDEX_PG_DUMP=/usr/lib/postgresql/$server_major/bin/pg_dump" >> "$GITHUB_ENV"
          psql --version
          "/usr/lib/postgresql/$server_major/bin/pg_dump" --version
      - name: Clean empty-database replay and verify generated types
        shell: bash
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: |
          set -o pipefail
          exec > >(tee rem002-clean-replay.log) 2>&1
          source scripts/gridex-aud-003-clean-replay.sh
          # Preserve authentic post-migration schema evidence even when a later
          # native fixture fails. The stack remains alive in this sourced step.
          SHADOW_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          npm run db:schema:snapshot -- --url "$SHADOW_URL" --out-dir rem002-schema-snapshot
          # Preserve generated types even if a later native/browser fixture
          # fails; the artifact can then identify genuine schema drift.
          supabase gen types typescript --local > rem002-database.types.ts
          node scripts/apply-supabase-types-nullability-overrides.cjs rem002-database.types.ts
          # Originals stay in HOLD until the sourced replay's EXIT trap. Keep
          # the verified original input available to both native case passes.
          export GRIDEX_EDIEL_CASE_RESTORATION_SQL="$(cd "$HOLD" && pwd)/20260923180557_restore_customer_case_events_atomic_status.sql"
          [[ -f "$GRIDEX_EDIEL_CASE_RESTORATION_SQL" ]] || exit 1
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f scripts/manual-inbound-tenant-graph-regression.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f scripts/gridex-canonical-provision-request-hash-regression.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f scripts/pr164-review-remediation-regression.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f scripts/portal-revocation-native-regression.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f scripts/portal-event-v2-native.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f scripts/customer-contact-command-native.sql
          # Exercise the actual canonical registry, business writes and owner
          # RPCs over the local Data API. No keys enter uploaded evidence.
          supabase status --help
          supabase status -o json > "$RUNNER_TEMP/e035-native-status.json"
          export GRIDEX_NATIVE_STATUS="$RUNNER_TEMP/e035-native-status.json"
          # Fairness owns an initially empty due queue and cleans its own rows.
          npx vitest run --config scripts/webhook-fair-claim-continuation-native.config.ts
          npx vitest run --config scripts/residual-tenant-queues-20260930-native.config.ts
          npx vitest run --config scripts/partner-queue-continuation-20260930-native.config.ts
          # This proof owns an initially empty eligible Ediel resume queue.
          # Run it after the other global fair-queue proofs and before producers.
          npx vitest run --config scripts/ediel-resume-tenant-progress-20261001-native.config.ts --reporter=verbose
          npx vitest run --config scripts/contract-authority-continuation-native.config.ts
          npx vitest run --config scripts/customer-operation-lifecycle-atomic-20260930.native.config.ts
          npx vitest run --config scripts/ediel-source-owner-native.config.ts
          # Atomic notifier command faults/concurrency use independent fixtures.
          npx vitest run --config scripts/customer-notification-read-native.config.ts
          npx vitest run --config scripts/customer-notification-read-concurrency-native.config.ts
          npx vitest run --config scripts/customer-profile-commands-native.config.ts
          npx vitest run --config scripts/customer-address-command-native.config.ts
          npx vitest run --config scripts/ediel-portal-address-command-native.config.ts
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f scripts/customer-site-command-native.sql
          npx vitest run --config scripts/customer-site-command-native.config.ts
          npx vitest run --config scripts/customer-site-continuation-20260930.native.config.ts
          # Actual signed legal/PDF/POA and canonical held-route prerequisites;
          # no sender is called by the positive continuation proof.
          npx vitest run --config scripts/customer-site-positive-continuation-20260930.native.config.ts
          # Only the outer SMTP transport is controlled. Canonical preparation,
          # dispatch witness, CONTRL/APERAK classification and atomic ACK owners
          # execute against this actual local reconstructed database.
          npx vitest run --config scripts/customer-inbound-lifecycle-atomic-20261001.native.config.ts
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f scripts/customer-ops-capabilities-native.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f scripts/customer-authoritative-writer-fences-native.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f scripts/customer-support-command-native.sql
          npx vitest run --config scripts/customer-support-continuation-20260930-native.config.ts
          npx vitest run --config scripts/support-sensitive-contact-20260930-native.config.ts
          # Actual intake/Storage lineage and signed controlled verdicts remain
          # quarantined: an approved release provider is absent by default.
          npx vitest run --config scripts/support-attachment-scan-20260930-native.config.ts
          npx vitest run --config scripts/support-attachment-consumer-20261001-native.config.ts
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f scripts/customer-billing-command-native.sql
          npx vitest run --config scripts/customer-billing-concurrency-native.config.ts
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f scripts/invoice-redelivery-decision-20260930-native.sql
          npx vitest run --config scripts/invoice-redelivery-concurrency-20260930-native.config.ts
          export NEXT_PUBLIC_SUPABASE_URL="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.env.GRIDEX_NATIVE_STATUS,"utf8")).API_URL')"
          [[ "$NEXT_PUBLIC_SUPABASE_URL" == 'http://127.0.0.1:54321' ]] || exit 1
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.env.GRIDEX_NATIVE_STATUS,"utf8")).ANON_KEY')"
          export SUPABASE_SERVICE_ROLE_KEY="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.env.GRIDEX_NATIVE_STATUS,"utf8")).SERVICE_ROLE_KEY')"
          [[ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" && -n "$SUPABASE_SERVICE_ROLE_KEY" ]] || exit 1
          npx vitest run --config scripts/billing-recipient-revision-continuation-20260930-native.config.ts
          npx vitest run --config scripts/customer-contact-concurrency-native.config.ts
          # Exercise the contact browser/API path before the independent case
          # publication browser fixture, so its own replay result is observable.
          unset GRIDEX_E2E_BROWSER_BASE_URL
          export GRIDEX_CONTACT_LOCAL_E2E=1
          export GRIDEX_CONTACT_FIXTURE_PATH="$RUNNER_TEMP/customer-contact-browser-fixture.json"
          export GRIDEX_CONTACT_TEST_PASSWORD="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(24).toString("base64url"))')"
          npx vitest run --config scripts/customer-contact-browser-native.config.ts
          [[ -s "$GRIDEX_CONTACT_FIXTURE_PATH" ]] || exit 1
          export GRIDEX_CUSTOMER_DELEGATION_TRUST_JSON="$(node -p 'JSON.stringify(JSON.parse(require("node:fs").readFileSync(process.env.GRIDEX_CONTACT_FIXTURE_PATH,"utf8")).trust)')"
          npx playwright install --with-deps chromium
          npx playwright test e2e/browser/api-release-local.spec.mjs --config=playwright.config.mjs --project=chromium
          npx playwright test e2e/browser/customer-contact-local.spec.mjs --config=playwright.config.mjs --project=chromium
          # Real forms, conflict/retry, navigation, mobile and zoom interactions
          # use an independent customer, then verify persisted state natively.
          npx playwright test e2e/browser/tenantservice-customer-ui-local.spec.mjs --config=playwright.config.mjs --project=chromium
          GRIDEX_TENANTSERVICE_UI_VERIFY_AFTER_BROWSER=1 npx vitest run --config scripts/customer-contact-browser-native.config.ts
          GRIDEX_CONTACT_VERIFY_AFTER_BROWSER=1 npx vitest run --config scripts/customer-contact-browser-native.config.ts
          rm -f "$GRIDEX_CONTACT_FIXTURE_PATH"
          unset GRIDEX_CONTACT_TEST_PASSWORD GRIDEX_CONTACT_LOCAL_E2E GRIDEX_CUSTOMER_DELEGATION_TRUST_JSON
          # Independent real reference client, current credentials, and a
          # downstream response loss after an observed committed mutation.
          # Each Playwright invocation starts a new server in CI with this trust.
          export GRIDEX_REFERENCE_RUNTIME_LOCAL_E2E=1
          export GRIDEX_REFERENCE_RUNTIME_FIXTURE_PATH="$RUNNER_TEMP/customer-reference-runtime-fixture.json"
          npx vitest run --config scripts/customer-reference-runtime-20260930.native.config.ts
          [[ -s "$GRIDEX_REFERENCE_RUNTIME_FIXTURE_PATH" ]] || exit 1
          export GRIDEX_CUSTOMER_DELEGATION_TRUST_JSON="$(node -p 'JSON.stringify(JSON.parse(require("node:fs").readFileSync(process.env.GRIDEX_REFERENCE_RUNTIME_FIXTURE_PATH,"utf8")).trust)')"
          npx playwright test e2e/browser/customer-reference-runtime-local.spec.mjs --config=playwright.config.mjs --project=chromium
          GRIDEX_REFERENCE_RUNTIME_VERIFY_AFTER_HTTP=1 npx vitest run --config scripts/customer-reference-runtime-20260930.native.config.ts
          rm -f "$GRIDEX_REFERENCE_RUNTIME_FIXTURE_PATH"
          unset GRIDEX_REFERENCE_RUNTIME_LOCAL_E2E GRIDEX_REFERENCE_RUNTIME_FIXTURE_PATH GRIDEX_CUSTOMER_DELEGATION_TRUST_JSON
          # Anonymous intake and independent configured issuers use their own
          # current local accounts and private trust, then verify zero foreign effects.
          export GRIDEX_INTAKE_IDENTITY_SECURITY_FIXTURE_PATH="$RUNNER_TEMP/customer-intake-identity-security-20260930.json"
          npx vitest run --config scripts/customer-intake-identity-security-20260930.native.config.ts
          [[ -s "$GRIDEX_INTAKE_IDENTITY_SECURITY_FIXTURE_PATH" ]] || exit 1
          export GRIDEX_CUSTOMER_DELEGATION_TRUST_JSON="$(node -e 'const fs=require("fs"); const f=JSON.parse(fs.readFileSync(process.env.GRIDEX_INTAKE_IDENTITY_SECURITY_FIXTURE_PATH,"utf8")); process.stdout.write(JSON.stringify(f.trust))')"
          GRIDEX_INTAKE_IDENTITY_SECURITY_LOCAL_E2E=1 npx playwright test e2e/browser/customer-intake-identity-security-20260930.spec.mjs --config=playwright.config.mjs --project=chromium
          GRIDEX_INTAKE_IDENTITY_SECURITY_VERIFY_AFTER_HTTP=1 npx vitest run --config scripts/customer-intake-identity-security-20260930.native.config.ts
          unset GRIDEX_CUSTOMER_DELEGATION_TRUST_JSON
          rm -f "$GRIDEX_INTAKE_IDENTITY_SECURITY_FIXTURE_PATH"
          unset GRIDEX_INTAKE_IDENTITY_SECURITY_FIXTURE_PATH
          # Company settings use independent disposable Auth/company fixtures.
          export GRIDEX_SETTINGS_LOCAL_E2E=1
          export GRIDEX_SETTINGS_FIXTURE_PATH="$RUNNER_TEMP/company-settings-browser-fixture.json"
          export GRIDEX_SETTINGS_TEST_PASSWORD="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(24).toString("base64url"))')"
          npx vitest run --config scripts/company-settings-browser-native.config.ts
          [[ -s "$GRIDEX_SETTINGS_FIXTURE_PATH" ]] || exit 1
          npx playwright test e2e/browser/tenantservice-company-settings-local.spec.mjs --config=playwright.config.mjs --project=chromium
          GRIDEX_SETTINGS_VERIFY_AFTER_BROWSER=1 npx vitest run --config scripts/company-settings-browser-native.config.ts
          rm -f "$GRIDEX_SETTINGS_FIXTURE_PATH"
          unset GRIDEX_SETTINGS_TEST_PASSWORD GRIDEX_SETTINGS_LOCAL_E2E GRIDEX_SETTINGS_FIXTURE_PATH
          # Actual OPS integration outcomes and attachment download bytes use
          # isolated local Auth/tenant rows. Missing mandatory connection
          # configuration rejects before any provider network operation.
          export GRIDEX_OPS_EFFECT_LOCAL_E2E=1
          export GRIDEX_OPS_EFFECT_FIXTURE_PATH="$RUNNER_TEMP/ops-effect-browser-fixture.json"
          export GRIDEX_OPS_EFFECT_PASSWORD="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(24).toString("base64url"))')"
          npx vitest run --config scripts/ops-effect-browser-native.config.ts
          [[ -s "$GRIDEX_OPS_EFFECT_FIXTURE_PATH" ]] || exit 1
          npx playwright test e2e/browser/ops-effect-download-local.spec.mjs --config=playwright.config.mjs --project=chromium
          GRIDEX_OPS_EFFECT_VERIFY_AFTER_BROWSER=1 npx vitest run --config scripts/ops-effect-browser-native.config.ts
          rm -f "$GRIDEX_OPS_EFFECT_FIXTURE_PATH"
          unset GRIDEX_OPS_EFFECT_LOCAL_E2E GRIDEX_OPS_EFFECT_FIXTURE_PATH GRIDEX_OPS_EFFECT_PASSWORD
          # The real billing forms own a fresh local fixture. Readiness,
          # immutable invoices and both sender paths are separately tested above.
          export GRIDEX_BILLING_RECIPIENT_LOCAL_E2E=1
          export GRIDEX_BILLING_RECIPIENT_FIXTURE_PATH="$RUNNER_TEMP/billing-recipient-revision-fixture.json"
          export GRIDEX_BILLING_RECIPIENT_PASSWORD="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(24).toString("base64url"))')"
          GRIDEX_BILLING_RECIPIENT_PHASE=browser-seed npx vitest run --config scripts/billing-recipient-revision-continuation-20260930-native.config.ts
          [[ -s "$GRIDEX_BILLING_RECIPIENT_FIXTURE_PATH" ]] || exit 1
          npx playwright test e2e/browser/billing-recipient-revision-runtime-local.spec.mjs --config=playwright.config.mjs --project=chromium
          GRIDEX_BILLING_RECIPIENT_PHASE=browser-postcheck npx vitest run --config scripts/billing-recipient-revision-continuation-20260930-native.config.ts
          # Read current customer revision and immutable saved invoice revision
          # in the actual list/card/invoice pages after the real form journey.
          export GRIDEX_BILLING_REVISION_VIEWS_FIXTURE_PATH="$RUNNER_TEMP/billing-revision-views-fixture.json"
          npx vitest run --config scripts/billing-revision-views-continuation-20261001-native.config.ts
          [[ -s "$GRIDEX_BILLING_REVISION_VIEWS_FIXTURE_PATH" ]] || exit 1
          GRIDEX_BILLING_REVISION_VIEWS_LOCAL_E2E=1 npx playwright test e2e/browser/billing-revision-views-runtime-local.spec.mjs --config=playwright.config.mjs --project=chromium
          GRIDEX_BILLING_REVISION_VIEWS_POSTCHECK=1 npx vitest run --config scripts/billing-revision-views-continuation-20261001-native.config.ts
          rm -f "$GRIDEX_BILLING_REVISION_VIEWS_FIXTURE_PATH"
          unset GRIDEX_BILLING_REVISION_VIEWS_FIXTURE_PATH
          rm -f "$GRIDEX_BILLING_RECIPIENT_FIXTURE_PATH"
          unset GRIDEX_BILLING_RECIPIENT_LOCAL_E2E GRIDEX_BILLING_RECIPIENT_FIXTURE_PATH GRIDEX_BILLING_RECIPIENT_PASSWORD
          # Real GoTrue and isolated Next attachment denial journey, after both
          # issued billing fixtures; private trust/session material is never uploaded.
          export GRIDEX_SUPPORT_NEXT_FIXTURE="$RUNNER_TEMP/support-attachment-next-denial-20261001.json"
          GRIDEX_SUPPORT_NEXT_PHASE=seed npx vitest run --config scripts/support-attachment-next-denial-20261001.native.config.ts
          GRIDEX_SUPPORT_NEXT_BROWSER=1 npx playwright test --config=e2e/browser/support-attachment-next-denial-20261001.config.mjs --project=chromium
          GRIDEX_SUPPORT_NEXT_PHASE=postcheck npx vitest run --config scripts/support-attachment-next-denial-20261001.native.config.ts
          rm -f "$GRIDEX_SUPPORT_NEXT_FIXTURE"
          unset GRIDEX_SUPPORT_NEXT_FIXTURE
          # Independent real OPS redelivery form and qualified saved decision;
          # every browser phase verifies its own persisted financial boundaries.
          export GRIDEX_REDELIVERY_NAVIGATION_FIXTURE_PATH="$RUNNER_TEMP/invoice-redelivery-navigation-fixture.json"
          export GRIDEX_REDELIVERY_NAVIGATION_PASSWORD="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(24).toString("base64url"))')"
          GRIDEX_REDELIVERY_NAVIGATION_PHASE=browser-seed npx vitest run --config scripts/invoice-redelivery-unsaved-navigation-20261001-native.config.ts
          [[ -s "$GRIDEX_REDELIVERY_NAVIGATION_FIXTURE_PATH" ]] || exit 1
          GRIDEX_REDELIVERY_NAVIGATION_LOCAL_E2E=1 npx playwright test e2e/browser/invoice-redelivery-unsaved-navigation-20261001.spec.mjs --config=playwright.config.mjs --project=chromium
          GRIDEX_REDELIVERY_NAVIGATION_PHASE=browser-postcheck npx vitest run --config scripts/invoice-redelivery-unsaved-navigation-20261001-native.config.ts
          rm -f "$GRIDEX_REDELIVERY_NAVIGATION_FIXTURE_PATH"
          unset GRIDEX_REDELIVERY_NAVIGATION_FIXTURE_PATH GRIDEX_REDELIVERY_NAVIGATION_PASSWORD
          # Actual customer events HTTP -> v2 RPC on this same disposable stack.
          export GRIDEX_EVENT_V2_LOCAL_E2E=1
          export GRIDEX_EVENT_V2_FIXTURE_PATH="$RUNNER_TEMP/customer-event-v2-fixture.json"
          npx vitest run --config scripts/customer-event-v2-native.config.ts
          [[ -s "$GRIDEX_EVENT_V2_FIXTURE_PATH" ]] || exit 1
          export GRIDEX_CUSTOMER_DELEGATION_TRUST_JSON="$(node -p 'JSON.stringify(JSON.parse(require("node:fs").readFileSync(process.env.GRIDEX_EVENT_V2_FIXTURE_PATH,"utf8")).trust)')"
          npx playwright test e2e/browser/customer-event-v2-local.spec.mjs --config=playwright.config.mjs --project=chromium
          GRIDEX_EVENT_V2_VERIFY_AFTER_HTTP=1 npx vitest run --config scripts/customer-event-v2-native.config.ts
          rm -f "$GRIDEX_EVENT_V2_FIXTURE_PATH"
          unset GRIDEX_EVENT_V2_LOCAL_E2E GRIDEX_EVENT_V2_FIXTURE_PATH GRIDEX_CUSTOMER_DELEGATION_TRUST_JSON
          export GRIDEX_NOTIFICATION_READ_LOCAL_E2E=1
          export GRIDEX_NOTIFICATION_READ_FIXTURE_PATH="$RUNNER_TEMP/customer-notification-read-fixture.json"
          npx vitest run --config scripts/customer-notification-http-native.config.ts
          [[ -s "$GRIDEX_NOTIFICATION_READ_FIXTURE_PATH" ]] || exit 1
          export GRIDEX_CUSTOMER_DELEGATION_TRUST_JSON="$(node -p 'JSON.stringify(JSON.parse(require("node:fs").readFileSync(process.env.GRIDEX_NOTIFICATION_READ_FIXTURE_PATH,"utf8")).trust)')"
          npx playwright test e2e/browser/customer-notification-read-local.spec.mjs --config=playwright.config.mjs --project=chromium
          GRIDEX_NOTIFICATION_READ_VERIFY_AFTER_HTTP=1 npx vitest run --config scripts/customer-notification-http-native.config.ts
          rm -f "$GRIDEX_NOTIFICATION_READ_FIXTURE_PATH"
          unset GRIDEX_NOTIFICATION_READ_LOCAL_E2E GRIDEX_NOTIFICATION_READ_FIXTURE_PATH GRIDEX_CUSTOMER_DELEGATION_TRUST_JSON
          # A current operator reviews one uncertain local delivery and its
          # tenant-scoped alarm, with an independent quiet tenant retained.
          export GRIDEX_ANALYTICS_INCIDENT_FIXTURE_PATH="$RUNNER_TEMP/analytics-incident-fixture.json"
          npx vitest run --config scripts/analytics-incident-20261001.native.config.ts
          [[ -s "$GRIDEX_ANALYTICS_INCIDENT_FIXTURE_PATH" ]] || exit 1
          export OPS_HEALTH_CRON_SECRET="$(node -e 'const fs=require("fs"); const f=JSON.parse(fs.readFileSync(process.env.GRIDEX_ANALYTICS_INCIDENT_FIXTURE_PATH,"utf8")); process.stdout.write(f.secret)')"
          GRIDEX_ANALYTICS_INCIDENT_LOCAL_E2E=1 npx playwright test e2e/browser/analytics-incident-20261001.spec.mjs --config=playwright.config.mjs --project=chromium
          GRIDEX_ANALYTICS_INCIDENT_PHASE=verify_after_http npx vitest run --config scripts/analytics-incident-20261001.native.config.ts
          GRIDEX_ANALYTICS_INCIDENT_PHASE=cleanup npx vitest run --config scripts/analytics-incident-20261001.native.config.ts
          rm -f "$GRIDEX_ANALYTICS_INCIDENT_FIXTURE_PATH"
          unset OPS_HEALTH_CRON_SECRET GRIDEX_ANALYTICS_INCIDENT_FIXTURE_PATH
          # Genuine HTTP/Data API qualification; these request specs are not
          # counted as interactive UI evidence. Every proof owns its fixtures.
          export GRIDEX_LEGAL_READ_LOCAL_E2E=1
          export GRIDEX_LEGAL_READ_FIXTURE_PATH="$RUNNER_TEMP/customer-legal-read-fixture.json"
          npx vitest run --config scripts/customer-legal-read-native.config.ts
          [[ -s "$GRIDEX_LEGAL_READ_FIXTURE_PATH" ]] || exit 1
          export GRIDEX_CUSTOMER_DELEGATION_TRUST_JSON="$(node -p 'JSON.stringify(JSON.parse(require("node:fs").readFileSync(process.env.GRIDEX_LEGAL_READ_FIXTURE_PATH,"utf8")).trust)')"
          npx playwright test e2e/browser/customer-legal-read-local.spec.mjs --config=playwright.config.mjs --project=chromium
          GRIDEX_LEGAL_READ_VERIFY_AFTER_HTTP=1 npx vitest run --config scripts/customer-legal-read-native.config.ts
          rm -f "$GRIDEX_LEGAL_READ_FIXTURE_PATH"
          unset GRIDEX_LEGAL_READ_LOCAL_E2E GRIDEX_LEGAL_READ_FIXTURE_PATH GRIDEX_CUSTOMER_DELEGATION_TRUST_JSON
          npx vitest run --config scripts/customer-legal-read-native.legacy.config.ts
          export GRIDEX_METERING_READ_LOCAL_E2E=1
          export GRIDEX_METERING_READ_FIXTURE_PATH="$RUNNER_TEMP/customer-metering-read-fixture.json"
          npx vitest run --config scripts/customer-metering-read-native.config.ts
          [[ -s "$GRIDEX_METERING_READ_FIXTURE_PATH" ]] || exit 1
          export GRIDEX_CUSTOMER_DELEGATION_TRUST_JSON="$(node -p 'JSON.stringify(JSON.parse(require("node:fs").readFileSync(process.env.GRIDEX_METERING_READ_FIXTURE_PATH,"utf8")).trust)')"
          npx playwright test e2e/browser/customer-metering-read-local.spec.mjs --config=playwright.config.mjs --project=chromium
          GRIDEX_METERING_READ_VERIFY_AFTER_HTTP=1 npx vitest run --config scripts/customer-metering-read-native.config.ts
          rm -f "$GRIDEX_METERING_READ_FIXTURE_PATH"
          unset GRIDEX_METERING_READ_LOCAL_E2E GRIDEX_METERING_READ_FIXTURE_PATH GRIDEX_CUSTOMER_DELEGATION_TRUST_JSON
          npx vitest run --config scripts/customer-metering-read-native.legacy.config.ts
          export GRIDEX_SUPPORT_HTTP_LOCAL_E2E=1
          export GRIDEX_SUPPORT_HTTP_FIXTURE_PATH="$RUNNER_TEMP/customer-support-http-fixture.json"
          npx vitest run --config scripts/customer-support-http-native.config.ts
          [[ -s "$GRIDEX_SUPPORT_HTTP_FIXTURE_PATH" ]] || exit 1
          export GRIDEX_CUSTOMER_DELEGATION_TRUST_JSON="$(node -p 'JSON.stringify(JSON.parse(require("node:fs").readFileSync(process.env.GRIDEX_SUPPORT_HTTP_FIXTURE_PATH,"utf8")).trust)')"
          npx playwright test e2e/browser/customer-support-local.spec.mjs --config=playwright.config.mjs --project=chromium
          GRIDEX_SUPPORT_HTTP_VERIFY_AFTER_HTTP=1 npx vitest run --config scripts/customer-support-http-native.config.ts
          rm -f "$GRIDEX_SUPPORT_HTTP_FIXTURE_PATH"
          unset GRIDEX_SUPPORT_HTTP_LOCAL_E2E GRIDEX_SUPPORT_HTTP_FIXTURE_PATH GRIDEX_CUSTOMER_DELEGATION_TRUST_JSON
          unset GRIDEX_E2E_BROWSER_BASE_URL
          export GRIDEX_EDIEL_CASE_LOCAL_E2E=1
          export GRIDEX_EDIEL_CASE_FIXTURE_PATH="$RUNNER_TEMP/ediel-case-browser-fixture.json"
          export GRIDEX_EDIEL_CASE_TEST_PASSWORD="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(24).toString("base64url"))')"
          npx vitest run --config scripts/ediel-case-view-native.config.ts
          [[ -s "$GRIDEX_EDIEL_CASE_FIXTURE_PATH" ]] || exit 1
          npx playwright test e2e/browser/ediel-case-local.spec.mjs --config=playwright.config.mjs --project=chromium
          GRIDEX_EDIEL_CASE_VERIFY_AFTER_BROWSER=1 npx vitest run --config scripts/ediel-case-view-native.config.ts
          rm -f "$GRIDEX_EDIEL_CASE_FIXTURE_PATH"
          unset GRIDEX_EDIEL_CASE_TEST_PASSWORD
          unset SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_SUPABASE_ANON_KEY
          rm -f "$RUNNER_TEMP/e035-native-status.json"
          GENERATED_HASH="$(sha256sum rem002-database.types.ts | awk '{print $1}')"
          MANIFEST_HASH="$(node -p "require('./scripts/supabase-types-manifest.json').sha256")"
          echo "generated_types_sha256=$GENERATED_HASH"
          if [[ "$GENERATED_HASH" != "$MANIFEST_HASH" ]]; then
            echo "Generated Supabase types hash differs from manifest: $GENERATED_HASH != $MANIFEST_HASH" >&2
            exit 1
          fi
          if ! cmp -s rem002-database.types.ts supabase/database.types.ts; then
            echo "Generated Supabase types differ from committed supabase/database.types.ts" >&2
            exit 1
          fi

          # Everything below runs in THIS step on purpose. The replay script is
          # sourced, so its EXIT trap stops the local Supabase stack when this
          # step's shell exits; a later step would find no database.
          SHADOW_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"

          # The tenant isolation gate must hold for a system rebuilt from the
          # repository, not only for the live database it was written against.
          DATABASE_URL="$SHADOW_URL" npm run tenant:invariants

          # A parity engine that stops detecting drift would make a green run
          # read as proven parity, so it is checked against injected drift.
          npm run db:parity:selftest -- "$SHADOW_URL"

          npm run db:schema:snapshot -- --url "$SHADOW_URL" --out-dir rem002-schema-snapshot

          # Activates by itself once a canonical baseline captured from this
          # replay is committed to supabase/. Until then there is nothing to
          # compare against.
          if [[ -f supabase/schema.fingerprint.json ]]; then
            npm run db:schema:check -- --url "$SHADOW_URL"
          else
            echo "no committed canonical schema baseline yet; snapshot uploaded as evidence"
          fi
      - name: Upload clean-replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gridex-rem-002-clean-replay
          path: |
            rem002-clean-replay.log
            rem002-database.types.ts
            rem002-schema-snapshot/
            e2e-artifacts/customer-contact-saved.png
            e2e-artifacts/playwright-results/**/tenantservice-*.png
            e2e-artifacts/playwright-results/**/support-interactive-*.png
          if-no-files-found: error

  upgrade-backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Install matching PostgreSQL backup and restore clients
        shell: bash
        run: |
          set -euo pipefail
          server_major="$(python3 -c "import re,pathlib;print(re.search(r'^major_version\s*=\s*(\d+)', pathlib.Path('supabase/config.toml').read_text(), re.M).group(1))")"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-$server_major"
          echo "GRIDEX_PG_DUMP=/usr/lib/postgresql/$server_major/bin/pg_dump" >> "$GITHUB_ENV"
          echo "GRIDEX_PG_RESTORE=/usr/lib/postgresql/$server_major/bin/pg_restore" >> "$GITHUB_ENV"
      - name: Upgrade real older schema and restore an actual isolated backup
        shell: bash
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: |
          set -euo pipefail
          bash scripts/tenantservice-upgrade-restore.sh 2>&1 | tee tenantservice-upgrade-restore.log
      - name: Restore the pre-forward backup and qualify baseline rollback
        if: always() && !cancelled()
        shell: bash
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: |
          set -euo pipefail
          bash scripts/tenantservice-baseline-rollback-20261001.sh 2>&1 | tee tenantservice-baseline-rollback.log
      - name: Qualify backfill against a separate fresh pinned old schema
        if: always() && !cancelled()
        shell: bash
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
          CI: 'true'
          GRIDEX_BACKFILL_NATIVE_ALLOW_NEW_STACK: '1'
        run: |
          set -euo pipefail
          # Both prior restore wrappers have disposed their own stacks. The
          # backfill wrapper refuses any existing project/port before creation.
          node node_modules/vitest/vitest.mjs run --config scripts/canonical-multitenant-backfill-20261001-native.config.ts --reporter=verbose 2>&1 | tee tenantservice-backfill-native.log
      - name: Upload sanitized upgrade and restore proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenantservice-upgrade-restore-proof
          path: |
            tenantservice-upgrade-restore.log
            tenantservice-baseline-rollback.log
            tenantservice-backfill-native.log
          if-no-files-found: error
