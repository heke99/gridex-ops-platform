name: OPS hardening
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrations:check
      - run: node scripts/check-agent-memory-git-state.cjs
      - run: node scripts/gridex-aud-003-migration-provenance-regression.cjs
      - run: node scripts/gridex-ops-health-regression.cjs
      - run: npm run gridex:api-billing-tenant-hardening-regression
      - run: npm run typecheck
      - run: node scripts/gridex-quote-idempotency-multitenant-regression.cjs
      - run: npx vitest run __tests__/usage-event-and-integration-idempotency.test.ts __tests__/logging-redaction.test.ts
      - run: npm run ops:hardening-regression
      - run: npm run ops:hardening-behavior-regression
      - name: Integrated remaining-masterpoints golden path
        run: node scripts/gridex-remaining-masterpoints-golden-path-regression.cjs
      - run: npm run ops:final-contract-regression
      - run: npm run api:error-boundaries
      - run: npm run security:audit-production

  quality-release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck:scripts
      - run: npm run typecheck:tests
      - run: bash quality/mechanical/verify.sh
      - run: npx vitest run --config quality/vitest.config.ts
      - run: npm test
      - run: npm run api:docs
      - run: npm run api:compatibility
      - run: npm run api:release:verify
      - run: npm run security:rbac
      - run: npm run build

  clean-migration-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Clean empty-database replay and generate types
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee rem002-clean-replay.log) 2>&1
          source scripts/gridex-aud-003-clean-replay.sh
          supabase gen types typescript --local > rem002-database.types.ts
          sha256sum rem002-database.types.ts
      - name: Persist exact generated Supabase types on remediation branch
        if: github.event_name == 'pull_request' && github.head_ref == 'remediation/gridex-remaining-masterpoints-2026-08-11'
        shell: bash
        run: |
          set -euo pipefail
          GENERATED_HASH="$(sha256sum rem002-database.types.ts | awk '{print $1}')"
          NEEDS_UPDATE=0
          if ! cmp -s rem002-database.types.ts supabase/database.types.ts; then
            NEEDS_UPDATE=1
          fi
          CURRENT_HASH="$(node -p "require('./scripts/supabase-types-manifest.json').sha256")"
          CURRENT_TAIL="$(node -p "require('./scripts/supabase-types-manifest.json').latest_migration")"
          if [[ "$CURRENT_HASH" != "$GENERATED_HASH" || "$CURRENT_TAIL" != "20260811080000_remaining_masterpoint_convergence.sql" ]]; then
            NEEDS_UPDATE=1
          fi
          if [[ "$NEEDS_UPDATE" == "0" ]]; then
            echo "Supabase generated types already synchronized."
            exit 0
          fi
          cp rem002-database.types.ts supabase/database.types.ts
          GENERATED_HASH="$GENERATED_HASH" node <<'NODE'
          const fs = require('node:fs')
          const path = 'scripts/supabase-types-manifest.json'
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'))
          manifest.generated_at = new Date().toISOString()
          manifest.sha256 = process.env.GENERATED_HASH
          manifest.latest_migration = '20260811080000_remaining_masterpoint_convergence.sql'
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`)
          NODE
          git config user.name "gridex-ci"
          git config user.email "gridex-ci@users.noreply.github.com"
          git add supabase/database.types.ts scripts/supabase-types-manifest.json
          git commit -m "Regenerate Supabase types for remaining masterpoints"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Upload clean-replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gridex-rem-002-clean-replay
          path: |
            rem002-clean-replay.log
            rem002-database.types.ts
          if-no-files-found: error
