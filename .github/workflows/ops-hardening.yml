name: OPS hardening
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrations:check
      - run: node scripts/check-agent-memory-git-state.cjs
      - run: node scripts/gridex-aud-003-migration-provenance-regression.cjs
      - run: node scripts/gridex-remaining-production-gaps-regression.cjs
      - run: node scripts/gridex-ops-health-regression.cjs
      - run: npm run gridex:api-billing-tenant-hardening-regression
      - run: npm run typecheck
      - run: node scripts/gridex-quote-idempotency-multitenant-regression.cjs
      - run: npx vitest run __tests__/usage-event-and-integration-idempotency.test.ts __tests__/logging-redaction.test.ts
      - run: npm run ops:hardening-regression
      - run: npm run ops:hardening-behavior-regression
      - run: npm run ops:final-contract-regression
      - run: npm run api:error-boundaries
      - run: npm run security:audit-production

  quality-release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck:scripts
      - run: npm run typecheck:tests
      - run: bash quality/mechanical/verify.sh
      - run: npx vitest run --config quality/vitest.config.ts
      - run: npm test
      - run: node scripts/gridex-composed-golden-path-regression.cjs
      - run: npm run api:docs
      - run: npm run api:compatibility
      - run: npm run api:release:verify
      - run: npm run security:rbac
      - run: npm run build

  clean-migration-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Capture generated types before replay cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/gridex-aud-003-clean-replay.sh')
          text = path.read_text()
          marker = "echo '[GRIDEX-REM-002 replay] PASS:"
          idx = text.rfind(marker)
          if idx < 0:
              raise SystemExit('clean replay PASS marker not found')
          capture = "supabase gen types typescript --local > \"$ROOT/replay-database.types.ts\"\n"
          path.write_text(text[:idx] + capture + text[idx:])
          PY
      - name: Clean empty-database replay
        shell: bash
        run: |
          set -o pipefail
          bash scripts/gridex-aud-003-clean-replay.sh 2>&1 | tee rem002-clean-replay.log
      - name: Commit replay-generated types to remediation branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/gridex-remaining-production-gaps-2026-08-11'
        shell: bash
        run: |
          set -euo pipefail
          cp replay-database.types.ts /tmp/gridex-replay-database.types.ts
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          cp /tmp/gridex-replay-database.types.ts supabase/database.types.ts
          TYPES_SHA="$(sha256sum supabase/database.types.ts | awk '{print $1}')"
          GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          python3 - "$TYPES_SHA" "$GENERATED_AT" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path('scripts/supabase-types-manifest.json')
          data = json.loads(path.read_text())
          data['project_id'] = 'piidsfebjqjmnepdpnas'
          data['generated_at'] = sys.argv[2]
          data['generated_types'] = 'supabase/database.types.ts'
          data['sha256'] = sys.argv[1]
          data['latest_migration'] = '20260811073500_gridex_release_identity_completion.sql'
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
          git config user.name "gridex-ci"
          git config user.email "gridex-ci@users.noreply.github.com"
          git add supabase/database.types.ts scripts/supabase-types-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate Supabase types from clean replay"
            git push origin "HEAD:$GITHUB_HEAD_REF"
          fi
      - name: Upload clean-replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gridex-rem-002-clean-replay
          path: |
            rem002-clean-replay.log
            replay-database.types.ts
          if-no-files-found: error
