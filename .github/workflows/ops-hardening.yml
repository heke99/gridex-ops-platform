name: OPS hardening
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ops-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrations:check
      - run: python3 scripts/gridex-ediel-upgrade-inputs-selftest.py
      - run: python3 scripts/gridex-redact-native-evidence-selftest.py
      - run: node --test scripts/bounded-child-process.test.mjs
      # F-15: service_role bypasses RLS, so every direct call site carries tenant
      # isolation on its own. The count may fall but never rise; new tenant-scoped
      # queries use tenantDb(companyId) from lib/supabase/tenantDb.
      - run: npm run tenant:service-role-ratchet
      - run: npm run gridex:contract-channel-publication-regression
      - run: node scripts/check-agent-memory-git-state.cjs
      - run: node scripts/gridex-aud-003-migration-provenance-regression.cjs
      - run: node scripts/gridex-ops-health-regression.cjs
      - run: npm run gridex:api-billing-tenant-hardening-regression
      - run: npm run typecheck
      - name: Canonical quote runtime regression matrix
        run: NODE_OPTIONS="$NODE_OPTIONS --require=./scripts/lib/unit-loopback-network-boundary.cjs" npx vitest run __tests__/canonical-contract-runtime-adapter.test.ts __tests__/contract-commercial-selection.test.ts __tests__/website-quote-persistence-invariant.test.ts __tests__/public-website-quote.test.ts
      - run: node scripts/gridex-quote-idempotency-multitenant-regression.cjs
      - run: node scripts/gridex-partner-api-business-contract-regression.cjs
      - run: node scripts/gridex-papilite-centroid-regression.cjs
      - run: NODE_OPTIONS="$NODE_OPTIONS --require=./scripts/lib/unit-loopback-network-boundary.cjs" npx vitest run __tests__/papilite-postal-centroid-hardening.test.ts
      - run: NODE_OPTIONS="$NODE_OPTIONS --require=./scripts/lib/unit-loopback-network-boundary.cjs" npx vitest run __tests__/usage-event-and-integration-idempotency.test.ts __tests__/logging-redaction.test.ts
      - run: NODE_OPTIONS="$NODE_OPTIONS --require=./scripts/lib/unit-loopback-network-boundary.cjs" npx vitest run __tests__/runtime-contract-resilience.test.ts __tests__/platform-schema-readiness.test.ts __tests__/dependency-circuit.test.ts
      - run: npm run ops:hardening-regression
      - run: npm run ops:hardening-behavior-regression
      - name: Integrated remaining-masterpoints golden path
        run: node scripts/gridex-remaining-masterpoints-golden-path-regression.cjs
      - run: npm run gridex:canonical-architecture-57-regression
      - run: npm run gridex:post-108-health-residuals-regression
      - run: npm run gridex:post-332-field-511-health-residuals-regression
      - run: NODE_OPTIONS="$NODE_OPTIONS --require=./scripts/lib/unit-loopback-network-boundary.cjs" npx vitest run __tests__/ediel-utilts-transaction-disposition.test.ts __tests__/ediel-utilts-transaction-persistence.test.ts
      - run: npm run ops:final-contract-regression
      - run: npm run api:error-boundaries
      - run: npm run security:audit-production

  quality-release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck:scripts
      - run: npm run typecheck:tests
      - run: bash quality/mechanical/verify.sh
      - run: NODE_OPTIONS="$NODE_OPTIONS --require=./scripts/lib/unit-loopback-network-boundary.cjs" npx vitest run --config quality/vitest.config.ts
      - run: NODE_OPTIONS="$NODE_OPTIONS --require=./scripts/lib/unit-loopback-network-boundary.cjs" npm test
      - run: npm run api:docs
      - run: npm run api:compatibility
      - run: npm run api:release:verify
      - run: npm run security:rbac
      - run: npm run quality:large-file-budget
      - run: npm run quality:performance
      - run: npm run build
        if: ${{ !cancelled() }}
      - run: npm run quality:bundle-budget

  clean-migration-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Install a PostgreSQL client matching the replay server
        shell: bash
        run: |
          set -euo pipefail
          # supabase/config.toml pins major_version 17, and pg_dump refuses to
          # dump a server newer than itself. The runner ships an older client,
          # so the schema snapshot aborts on a version mismatch.
          server_major="$(python3 -c "import re,pathlib;print(re.search(r'^major_version\s*=\s*(\d+)', pathlib.Path('supabase/config.toml').read_text(), re.M).group(1))")"
          echo "replay server major version: $server_major"
          sudo install -d /usr/share/postgresql-common/pgdg
          # Retry transient DNS/transfer faults; retain HTTPS verification and final failure.
          sudo curl -fsS --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 30 --retry-max-time 90 \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-$server_major"
          # Name the matching binary explicitly. pg_wrapper does not reliably
          # resolve to the newest installed major, so relying on PATH here can
          # still pick an older pg_dump and abort on a version mismatch.
          echo "GRIDEX_PG_DUMP=/usr/lib/postgresql/$server_major/bin/pg_dump" >> "$GITHUB_ENV"
          psql --version
          "/usr/lib/postgresql/$server_major/bin/pg_dump" --version
      - name: Clean empty-database replay and verify generated types
        shell: bash
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: |
          set -o pipefail
          exec > >(tee rem002-clean-replay.log) 2>&1
          native_phase() { printf '[CI-PHASE] %s %s\n' "$(date -u +%FT%TZ)" "$1"; }
          native_phase clean_replay_start
          source scripts/gridex-aud-003-clean-replay.sh
          native_phase clean_replay_complete
          native_phase artifact_generation_start
          # Preserve authentic post-migration schema evidence even when a later
          # native fixture fails. The stack remains alive in this sourced step.
          SHADOW_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          GRIDEX_SCHEMA_SNAPSHOT_SCHEMAS="$(psql "$SHADOW_URL" -XAtq -v ON_ERROR_STOP=1 -c "select string_agg(nspname,',' order by nspname) from pg_namespace where nspname='public' or starts_with(nspname,'gridex_');")"
          [[ -n "$GRIDEX_SCHEMA_SNAPSHOT_SCHEMAS" ]] || exit 1
          export GRIDEX_SCHEMA_SNAPSHOT_SCHEMAS
          npm run db:schema:snapshot -- --url "$SHADOW_URL" --out-dir rem002-schema-snapshot
          # Materialize authentic artifacts before any fixture/browser can
          # fail. These comparators remain blocking and use the replay DB.
          supabase gen types typescript --local > rem002-database.types.ts
          # Typegen emits non-null Returns for nullable SQL columns on the
          # field-511 resolver; apply the same durable override used on tip.
          node scripts/apply-supabase-types-nullability-overrides.cjs rem002-database.types.ts
          GENERATED_HASH="$(sha256sum rem002-database.types.ts | awk '{print $1}')"
          MANIFEST_HASH="$(node -p "require('./scripts/supabase-types-manifest.json').sha256")"
          echo "generated_types_sha256=$GENERATED_HASH"
          TYPE_COMPARISON_FAILED=0
          NATIVE_SUITE_FAILED=0
          if [[ "$GENERATED_HASH" != "$MANIFEST_HASH" ]]; then
            echo "Generated Supabase types hash differs from manifest: $GENERATED_HASH != $MANIFEST_HASH" >&2
            { TYPE_COMPARISON_FAILED=1; echo "::error::TYPE_COMPARISON_FAILED set at step line $LINENO"; }
          fi
          if ! cmp -s rem002-database.types.ts supabase/database.types.ts; then
            echo "Generated Supabase types differ from committed supabase/database.types.ts" >&2
            { TYPE_COMPARISON_FAILED=1; echo "::error::TYPE_COMPARISON_FAILED set at step line $LINENO"; }
          fi

          native_phase artifact_generation_complete
          native_phase sql_regressions_start
          if ! python3 scripts/ediel-received-context-upgrade-regression.py; then
            { NATIVE_SUITE_FAILED=1; echo "::error::NATIVE_SUITE_FAILED set at step line $LINENO"; }
          fi
          # Originals stay in HOLD until the sourced replay's EXIT trap. Keep
          # the verified original input available to both native case passes.
          export GRIDEX_EDIEL_CASE_RESTORATION_SQL="$(cd "$HOLD" && pwd)/20260923180557_restore_customer_case_events_atomic_status.sql"
          [[ -f "$GRIDEX_EDIEL_CASE_RESTORATION_SQL" ]] || exit 1
          export GRIDEX_STAFF_REPLAY_ACL_SQL="$(cd "$HOLD" && pwd)/20261004100320_staff_assertion_replay_least_privilege.sql"
          [[ -f "$GRIDEX_STAFF_REPLAY_ACL_SQL" ]] || exit 1
          export GRIDEX_STAFF_CUSTOMER_RETENTION_READ_SQL="$(cd "$HOLD" && pwd)/20261004205603_staff_customer_retention_read_prerequisite.sql"
          export GRIDEX_STAFF_ATTACHMENT_CARRIER_SQL="$(cd "$HOLD" && pwd)/20261004205816_support_attachment_quarantine_carrier.sql"
          [[ -f "$GRIDEX_STAFF_CUSTOMER_RETENTION_READ_SQL" && -f "$GRIDEX_STAFF_ATTACHMENT_CARRIER_SQL" ]] || exit 1
          if ! psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f scripts/manual-inbound-tenant-graph-regression.sql; then
