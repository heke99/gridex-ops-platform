name: OPS hardening
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ediel-source-effects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gridex_ediel_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gridex_ediel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete Ediel source effects on isolated PostgreSQL 17
        run: python3 scripts/canonical-ediel-environment-selftest.py

  auth-email-source-effects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gridex_auth_test
        ports:
          - 55440:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gridex_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify fixed auth and membership group on isolated PostgreSQL 17
        run: python3 scripts/canonical-auth-membership-group.py --partition original16

  auth-provisioning-legacy-proof:
    runs-on: ubuntu-latest
    # Original16 retain their own10min job. This separate owned-container lane
    # budgets bootstrap/reference plus deterministic <=10s contention bounds.
    timeout-minutes: 20
    env:
      GRIDEX_LEGACY_CONTAINER_NAME: gridex-auth-legacy-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify command17 whole legacy and actual staged replay on owned PostgreSQL 17
        run: python3 scripts/canonical-auth-membership-group.py --partition legacy17
      - name: Remove only the owned legacy container
        if: always()
        run: python3 scripts/canonical-auth-provisioning-legacy-selftest.py --cleanup-owned

  user-rbac-repair-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRIDEX_LEGACY_CONTAINER_NAME: gridex-auth-legacy-repair-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify command18 standalone and actual staged repair56 on private owned PostgreSQL 17
        run: python3 scripts/canonical-auth-membership-group.py --partition repair18
      - name: Remove only the owned repair proof container
        if: always()
        run: python3 scripts/canonical-user-rbac-repair-selftest.py --cleanup-owned

  user-rbac-dedupe-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRIDEX_LEGACY_CONTAINER_NAME: gridex-auth-legacy-dedupe-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify command19 full standalone H2 and actual staged dedupe57 on private owned PostgreSQL 17
        run: python3 scripts/canonical-auth-membership-group.py --partition dedupe19
      - name: Remove only the owned dedupe proof container
        if: always()
        run: python3 scripts/canonical-user-rbac-dedupe-selftest.py --cleanup-owned

  user-rbac-fixed-target-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRIDEX_LEGACY_CONTAINER_NAME: gridex-auth-legacy-fixed-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Characterize complete fixed-target sources on private owned PostgreSQL 17
        run: python3 scripts/canonical-user-rbac-fixed-target-selftest.py
      - name: Remove only the owned fixed-target proof container
        if: always()
        run: python3 scripts/canonical-user-rbac-fixed-target-selftest.py --cleanup-owned

  user-rbac-fixed-target-continuation-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRIDEX_LEGACY_CONTAINER_NAME: gridex-auth-legacy-continuation-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify once-only lossless group and actual staged fixed-target continuation
        run: python3 scripts/canonical-user-rbac-fixed-target-continuation-selftest.py
      - name: Remove only the owned continuation proof container
        if: always()
        run: python3 scripts/canonical-user-rbac-fixed-target-continuation-selftest.py --cleanup-owned

  customer-operations-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRIDEX_LEGACY_CONTAINER_NAME: gridex-auth-legacy-continuation-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Characterize complete customer and Ediel operations sources at owned actual68
        run: python3 scripts/canonical-customer-operations-selftest.py
      - name: Remove only the owned customer operations proof container
        if: always()
        run: python3 scripts/canonical-customer-operations-selftest.py --cleanup-owned

  readiness-operations-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRIDEX_LEGACY_CONTAINER_NAME: gridex-auth-legacy-continuation-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Characterize complete metering and readiness sources at owned actual71
        run: python3 scripts/canonical-readiness-operations-selftest.py
      - name: Remove only the owned readiness source proof container
        if: always()
        run: python3 scripts/canonical-readiness-operations-selftest.py --cleanup-owned

  readiness-operations-continuation-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRIDEX_LEGACY_CONTAINER_NAME: gridex-auth-legacy-continuation-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual74 metering and readiness continuation on owned PostgreSQL 17
        run: python3 scripts/canonical-readiness-operations-continuation-selftest.py
      - name: Remove only the owned readiness continuation container
        if: always()
        run: python3 scripts/canonical-readiness-operations-continuation-selftest.py --cleanup-owned

  customer-operations-continuation-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRIDEX_LEGACY_CONTAINER_NAME: gridex-auth-legacy-continuation-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual71 customer and Ediel continuation on owned PostgreSQL 17
        run: python3 scripts/canonical-customer-operations-continuation-selftest.py
      - name: Remove only the owned operations continuation container
        if: always()
        run: python3 scripts/canonical-customer-operations-continuation-selftest.py --cleanup-owned

  user-rbac-alignment-continuation-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRIDEX_LEGACY_CONTAINER_NAME: gridex-auth-legacy-continuation-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual68 staged alignment continuation on owned PostgreSQL 17
        run: python3 scripts/canonical-user-rbac-alignment-continuation-selftest.py
      - name: Remove only the owned alignment continuation container
        if: always()
        run: python3 scripts/canonical-user-rbac-alignment-continuation-selftest.py --cleanup-owned

  user-rbac-customer-alignment-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRIDEX_LEGACY_CONTAINER_NAME: gridex-auth-legacy-continuation-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Characterize whole customer alignment on a private owned actual63 PostgreSQL 17 prefix
        run: |
          python3 scripts/canonical-alignment-diagnostics-selftest.py
          python3 scripts/canonical-user-rbac-customer-alignment-selftest.py
      - name: Remove only the owned customer alignment proof container
        if: always()
        run: python3 scripts/canonical-user-rbac-customer-alignment-selftest.py --cleanup-owned

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify migration inventory and replay recovery regressions
        run: |
          node scripts/canonical-migration-inventory-selftest.cjs
          python3 scripts/gridex-aud-003-clean-replay-selftest.py
          node scripts/gridex-schema-document-selftest.cjs
          python3 scripts/gridex-replay-input-accounting-selftest.py
          python3 scripts/gridex-replay-review-groups-selftest.py
          python3 scripts/canonical-auth-membership-group-selftest.py
          npm run db:migrations:production-readiness
      - name: Verify reconstruction and parity in isolated SQL fixtures
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/gridex-guard-test" --no-save --ignore-scripts @electric-sql/pglite@0.3.14
          GRIDEX_PGLITE_MODULE="$RUNNER_TEMP/gridex-guard-test/node_modules/@electric-sql/pglite/dist/index.js" node scripts/canonical-tenant-guard-selftest.mjs
          GRIDEX_PGLITE_MODULE="$RUNNER_TEMP/gridex-guard-test/node_modules/@electric-sql/pglite/dist/index.js" node scripts/gridex-db-parity-semantics-selftest.mjs
          GRIDEX_PGLITE_MODULE="$RUNNER_TEMP/gridex-guard-test/node_modules/@electric-sql/pglite/dist/index.js" node scripts/canonical-portal-origin-replay-selftest.mjs
          GRIDEX_PGLITE_MODULE="$RUNNER_TEMP/gridex-guard-test/node_modules/@electric-sql/pglite/dist/index.js" node scripts/canonical-customer-flow-replay-selftest.mjs
          GRIDEX_PGLITE_MODULE="$RUNNER_TEMP/gridex-guard-test/node_modules/@electric-sql/pglite/dist/index.js" node scripts/canonical-actor-testing-replay-selftest.mjs
          GRIDEX_PGLITE_MODULE="$RUNNER_TEMP/gridex-guard-test/node_modules/@electric-sql/pglite/dist/index.js" node scripts/canonical-billing-completion-replay-selftest.mjs
          GRIDEX_PGLITE_MODULE="$RUNNER_TEMP/gridex-guard-test/node_modules/@electric-sql/pglite/dist/index.js" node scripts/canonical-request-status-replay-selftest.mjs
          GRIDEX_PGLITE_MODULE="$RUNNER_TEMP/gridex-guard-test/node_modules/@electric-sql/pglite/dist/index.js" node scripts/canonical-profile-action-replay-selftest.mjs
          GRIDEX_PGLITE_MODULE="$RUNNER_TEMP/gridex-guard-test/node_modules/@electric-sql/pglite/dist/index.js" node quality/audits/invitation-replay-effects-selftest.mjs
      - run: npm run db:migrations:check
      # F-15: service_role bypasses RLS, so every direct call site carries tenant
      # isolation on its own. The count may fall but never rise; new tenant-scoped
      # queries use tenantDb(companyId) from lib/supabase/tenantDb.
      - run: npm run tenant:service-role-ratchet
      - run: npm run gridex:contract-channel-publication-regression
      - run: node scripts/check-agent-memory-git-state.cjs
      - run: node scripts/gridex-aud-003-migration-provenance-regression.cjs
      - run: node scripts/gridex-ops-health-regression.cjs
      - run: npm run gridex:api-billing-tenant-hardening-regression
      - run: npm run typecheck
      - name: Canonical quote runtime regression matrix
        run: npx vitest run __tests__/canonical-contract-runtime-adapter.test.ts __tests__/contract-commercial-selection.test.ts __tests__/website-quote-persistence-invariant.test.ts __tests__/public-website-quote.test.ts
      - run: node scripts/gridex-quote-idempotency-multitenant-regression.cjs
      - run: node scripts/gridex-partner-api-business-contract-regression.cjs
      - run: node scripts/gridex-papilite-centroid-regression.cjs
      - run: npx vitest run __tests__/papilite-postal-centroid-hardening.test.ts
      - run: npx vitest run __tests__/usage-event-and-integration-idempotency.test.ts __tests__/logging-redaction.test.ts
      - run: npx vitest run __tests__/runtime-contract-resilience.test.ts __tests__/platform-schema-readiness.test.ts __tests__/dependency-circuit.test.ts
      - run: npm run ops:hardening-regression
      - run: npm run ops:hardening-behavior-regression
      - name: Integrated remaining-masterpoints golden path
        run: node scripts/gridex-remaining-masterpoints-golden-path-regression.cjs
      - run: npm run gridex:canonical-architecture-57-regression
      - run: npm run gridex:post-108-health-residuals-regression
      - run: npm run gridex:post-332-field-511-health-residuals-regression
      - run: npx vitest run __tests__/ediel-utilts-transaction-disposition.test.ts __tests__/ediel-utilts-transaction-persistence.test.ts
      - run: npm run ops:final-contract-regression
      - run: npm run api:error-boundaries
      - run: npm run security:audit-production

  quality-release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck:scripts
      - run: npm run typecheck:tests
      - run: bash quality/mechanical/verify.sh
      - run: npx vitest run --config quality/vitest.config.ts
      - run: npm test
      - run: npm run api:docs
      - run: npm run api:compatibility
      - run: npm run api:release:verify
      - run: npm run security:rbac
      - run: npm run quality:large-file-budget
      - run: npm run quality:performance
      - run: npm run build
      - run: npm run quality:bundle-budget

  clean-migration-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Install a PostgreSQL client matching the replay server
        shell: bash
        run: |
          set -euo pipefail
          # supabase/config.toml pins major_version 17, and pg_dump refuses to
          # dump a server newer than itself. The runner ships an older client,
          # so the schema snapshot aborts on a version mismatch.
          server_major="$(python3 -c "import re,pathlib;print(re.search(r'^major_version\s*=\s*(\d+)', pathlib.Path('supabase/config.toml').read_text(), re.M).group(1))")"
          echo "replay server major version: $server_major"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-$server_major"
          # Name the matching binary explicitly. pg_wrapper does not reliably
          # resolve to the newest installed major, so relying on PATH here can
          # still pick an older pg_dump and abort on a version mismatch.
          echo "GRIDEX_PG_DUMP=/usr/lib/postgresql/$server_major/bin/pg_dump" >> "$GITHUB_ENV"
          psql --version
          "/usr/lib/postgresql/$server_major/bin/pg_dump" --version
      - name: Clean empty-database replay and verify generated types
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee rem002-clean-replay.log) 2>&1
          source scripts/gridex-aud-003-clean-replay.sh
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f scripts/sql/canonical-tenant-guard-catalog.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f scripts/manual-inbound-tenant-graph-regression.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f scripts/gridex-canonical-provision-request-hash-regression.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f scripts/pr164-review-remediation-regression.sql
          supabase gen types typescript --local > rem002-database.types.ts
          # Typegen emits non-null Returns for nullable SQL columns on the
          # field-511 resolver; apply the same durable override used on tip.
          node scripts/apply-supabase-types-nullability-overrides.cjs rem002-database.types.ts
          GENERATED_HASH="$(sha256sum rem002-database.types.ts | awk '{print $1}')"
          MANIFEST_HASH="$(node -p "require('./scripts/supabase-types-manifest.json').sha256")"
          echo "generated_types_sha256=$GENERATED_HASH"
          if [[ "$GENERATED_HASH" != "$MANIFEST_HASH" ]]; then
            echo "Generated Supabase types hash differs from manifest: $GENERATED_HASH != $MANIFEST_HASH" >&2
            exit 1
          fi
          if ! cmp -s rem002-database.types.ts supabase/database.types.ts; then
            echo "Generated Supabase types differ from committed supabase/database.types.ts" >&2
            exit 1
          fi

          # Everything below runs in THIS step on purpose. The replay script is
          # sourced, so its EXIT trap stops the local Supabase stack when this
          # step's shell exits; a later step would find no database.
          SHADOW_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"

          # The tenant isolation gate must hold for a system rebuilt from the
          # repository, not only for the live database it was written against.
          DATABASE_URL="$SHADOW_URL" npm run tenant:invariants

          # A parity engine that stops detecting drift would make a green run
          # read as proven parity, so it is checked against injected drift.
          npm run db:parity:selftest -- "$SHADOW_URL"

          npm run db:schema:snapshot -- --url "$SHADOW_URL" --out-dir rem002-schema-snapshot

          # Activates by itself once a canonical baseline captured from this
          # replay is committed to supabase/. Until then there is nothing to
          # compare against.
          if [[ -f supabase/schema.fingerprint.json ]]; then
            npm run db:schema:check -- --url "$SHADOW_URL"
          else
            echo "no committed canonical schema baseline yet; snapshot uploaded as evidence"
          fi
      - name: Upload clean-replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gridex-rem-002-clean-replay
          path: |
            rem002-clean-replay.log
            artifacts/replay-input-accounting.json
            rem002-database.types.ts
            rem002-schema-snapshot/
          if-no-files-found: error
