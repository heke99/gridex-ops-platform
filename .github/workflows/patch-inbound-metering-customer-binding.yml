name: Patch inbound metering customer binding

on:
  push:
    branches:
      - fix/inbound-metering-customer-binding

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/inbound-metering-customer-binding
          fetch-depth: 0
      - name: Persist customer and site from exact metering match
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/inbound-mail/inboundStatusUpdater.ts')
          source = path.read_text()

          old = "  const matchedMeteringPointId = input.meteringPointMatch?.status === 'matched' ? input.meteringPointMatch.entityId : null\n  const matchedOutbound = input.outboundMatch?.candidates?.[0] ?? {}\n"
          new = "  const matchedMeteringPointId = input.meteringPointMatch?.status === 'matched' ? input.meteringPointMatch.entityId : null\n  const matchedOutbound = input.outboundMatch?.candidates?.[0] ?? {}\n  const matchedMetering = input.meteringPointMatch?.status === 'matched'\n    ? input.meteringPointMatch.candidates?.[0] ?? {}\n    : {}\n"
          if source.count(old) != 1:
              raise SystemExit('Could not find unique matched metering insertion point')
          source = source.replace(old, new, 1)

          replacements = {
            "    customer_id: typeof matchedOutbound.customer_id === 'string' ? matchedOutbound.customer_id : null,": "    customer_id: typeof matchedOutbound.customer_id === 'string'\n      ? matchedOutbound.customer_id\n      : typeof matchedMetering.customer_id === 'string'\n        ? matchedMetering.customer_id\n        : null,",
            "    site_id: typeof matchedOutbound.site_id === 'string' ? matchedOutbound.site_id : null,": "    site_id: typeof matchedOutbound.site_id === 'string'\n      ? matchedOutbound.site_id\n      : typeof matchedMetering.site_id === 'string'\n        ? matchedMetering.site_id\n        : null,",
            "    grid_owner_id: typeof matchedOutbound.grid_owner_id === 'string' ? matchedOutbound.grid_owner_id : null,": "    grid_owner_id: typeof matchedOutbound.grid_owner_id === 'string'\n      ? matchedOutbound.grid_owner_id\n      : typeof matchedMetering.grid_owner_id === 'string'\n        ? matchedMetering.grid_owner_id\n        : null,",
          }
          for old_line, new_line in replacements.items():
              if source.count(old_line) != 1:
                  raise SystemExit(f'Could not find unique binding line: {old_line}')
              source = source.replace(old_line, new_line, 1)

          path.write_text(source)

          test = Path('__tests__/inbound-ediel-metering-customer-binding.test.ts')
          test.write_text("""import { readFileSync } from 'node:fs'\nimport { resolve } from 'node:path'\nimport { describe, expect, it } from 'vitest'\n\nconst source = readFileSync(resolve(process.cwd(), 'lib/inbound-mail/inboundStatusUpdater.ts'), 'utf8')\n\ndescribe('inbound Ediel metering customer binding', () => {\n  it('persists customer/site ownership from an exact matched metering point when outbound correlation is missing', () => {\n    expect(source).toContain(\"const matchedMetering = input.meteringPointMatch?.status === 'matched'\")\n    expect(source).toContain(\"typeof matchedMetering.customer_id === 'string'\")\n    expect(source).toContain(\"typeof matchedMetering.site_id === 'string'\")\n    expect(source).toContain(\"typeof matchedMetering.grid_owner_id === 'string'\")\n  })\n\n  it('only trusts metering candidate ownership when meteringPointMatch is explicitly matched', () => {\n    const guard = source.indexOf(\"const matchedMetering = input.meteringPointMatch?.status === 'matched'\")\n    const customerFallback = source.indexOf(\"typeof matchedMetering.customer_id === 'string'\")\n    expect(guard).toBeGreaterThan(-1)\n    expect(customerFallback).toBeGreaterThan(guard)\n  })\n})\n""")
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/inbound-mail/inboundStatusUpdater.ts __tests__/inbound-ediel-metering-customer-binding.test.ts
          git commit -m 'Bind inbound Ediel messages from exact metering matches'
          git push origin HEAD:fix/inbound-metering-customer-binding
