name: Patch PR302 certificate subaddress scope

on:
  push:
    branches:
      - fix/ediel-certificate-subaddress-scope-20260903
    paths:
      - .github/workflows/patch-pr302-certificate-subaddress.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ediel-certificate-subaddress-scope-20260903
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply canonical subaddress scope patch
        run: python3 scripts/tmp-pr302-certificate-subaddress-patch.py
      - name: Run focused regression and typecheck
        run: |
          npx vitest run __tests__/ediel-transport-security-resolution.test.ts
          npm run typecheck
      - name: Commit production patch
        run: |
          rm .github/workflows/patch-pr302-certificate-subaddress.yml
          rm scripts/tmp-pr302-certificate-subaddress-patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align recipient certificate subaddress scope'
          git push origin HEAD:fix/ediel-certificate-subaddress-scope-20260903
