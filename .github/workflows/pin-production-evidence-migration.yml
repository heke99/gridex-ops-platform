name: Pin production evidence migration checksum

on:
  push:
    branches:
      - fix/production-lifecycle-request-hash-20260814

permissions:
  contents: write

jobs:
  pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/production-lifecycle-request-hash-20260814
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Register exact checksum
        run: node scripts/register-migration-checksum.cjs 20260814234000_certification_evidence_passed_integrity.sql
      - name: Commit generated manifest update
        run: |
          if git diff --quiet -- scripts/migration-history-manifest.json; then
            echo 'Manifest already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/migration-history-manifest.json
          git commit -m 'chore: register evidence integrity migration checksum'
          git push origin HEAD:fix/production-lifecycle-request-hash-20260814
