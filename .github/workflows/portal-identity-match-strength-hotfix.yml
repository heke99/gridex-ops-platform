name: Portal identity match strength hotfix

on:
  push:
    branches:
      - fix/portal-identity-match-strength-20260823

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portal-identity-match-strength-20260823
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch canonical match strength and add regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/website/customerApplicationCommunication.ts')
          text = path.read_text()
          old = '''    match_strength:\n      input.applicationId && (input.authUserId || input.customerPortalUserId)\n        ? "strong"\n        : "medium",'''
          new = '''    match_strength:\n      input.applicationId && (input.authUserId || input.customerPortalUserId)\n        ? "strong"\n        : "weak",'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale portal match-strength block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          regression = Path('scripts/gridex-portal-identity-match-strength-regression.cjs')
          regression.write_text(r'''const fs = require("node:fs");
const assert = require("node:assert/strict");

const source = fs.readFileSync("lib/website/customerApplicationCommunication.ts", "utf8");
const start = source.indexOf("    match_strength:");
const end = source.indexOf("    match_method:", start);
assert.ok(start >= 0 && end > start, "portal identity match_strength block must exist");
const block = source.slice(start, end);
assert.match(block, /\? "strong"/);
assert.match(block, /: "weak",/);
assert.doesNotMatch(block, /"medium"/);

const migrationFiles = fs.readdirSync("supabase/migrations").filter((name) => name.endsWith(".sql"));
const canonicalConstraint = migrationFiles
  .map((name) => fs.readFileSync(`supabase/migrations/${name}`, "utf8"))
  .find((text) => text.includes("customer_portal_identities_match_strength_check"));
assert.ok(canonicalConstraint, "match_strength constraint must be represented in migrations");
assert.match(canonicalConstraint, /'strong'/);
assert.match(canonicalConstraint, /'weak'/);
assert.match(canonicalConstraint, /'manual'/);

console.log("portal identity match strength regression passed");
''')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify targeted regression
        run: node scripts/gridex-portal-identity-match-strength-regression.cjs

      - name: Verify website foundation regression
        run: npm run gridex:batch-7-website-foundation-regression

      - name: Typecheck
        run: npm run typecheck

      - name: Remove one-shot workflow and commit fix
        shell: bash
        run: |
          rm -f .github/workflows/portal-identity-match-strength-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/website/customerApplicationCommunication.ts scripts/gridex-portal-identity-match-strength-regression.cjs .github/workflows/portal-identity-match-strength-hotfix.yml
          git commit -m "fix: align website portal identity match strength"
          git push origin HEAD:fix/portal-identity-match-strength-20260823
