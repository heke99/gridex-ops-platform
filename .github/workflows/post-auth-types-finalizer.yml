name: post-auth-types-finalizer

on:
  push:
    branches:
      - fix/tenant-scoped-post-auth-applications-20260820
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tenant-scoped-post-auth-applications-20260820
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - run: npm ci
      - name: Regenerate canonical Supabase types from clean replay
        shell: bash
        run: |
          set -euo pipefail
          source scripts/gridex-aud-003-clean-replay.sh
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f scripts/gridex-canonical-provision-request-hash-regression.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f scripts/pr164-review-remediation-regression.sql
          supabase gen types typescript --local > supabase/database.types.ts
          node scripts/apply-supabase-types-nullability-overrides.cjs supabase/database.types.ts
          GENERATED_HASH="$(sha256sum supabase/database.types.ts | awk '{print $1}')"
          node - "$GENERATED_HASH" <<'NODE'
          const fs = require('fs')
          const hash = process.argv[2]
          const path = 'scripts/supabase-types-manifest.json'
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'))
          manifest.generated_at = new Date().toISOString()
          manifest.generated_with = 'supabase-cli-2.101.0-clean-replay'
          manifest.sha256 = hash
          manifest.latest_migration = '20260820213000_tenant_scoped_post_auth_website_applications.sql'
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n')
          console.log(`generated_types_sha256=${hash}`)
          NODE
      - name: Align canonical release tests with tenant-scoped post-auth contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('__tests__/api-canonical-release.test.ts')
          s = p.read_text()
          s = s.replace(
              "it('aligns the public Website API guide, runtime and database on mandatory pre-authentication', () => {",
              "it('aligns the public Website API guide, runtime and database on tenant-scoped portal authentication', () => {",
          )
          anchor = """    const migration = readFileSync(\n      'supabase/migrations/20260804151500_website_application_pre_auth_contract_alignment.sql',\n      'utf8',\n    )\n    const application = websiteOpenApi.components.schemas.CustomerApplicationRequest\n\n    expect(application.required).toEqual(\n      expect.arrayContaining(['auth_user_id', 'customer_portal_user_id']),\n    )"""
          replacement = """    const migration = readFileSync(\n      'supabase/migrations/20260804151500_website_application_pre_auth_contract_alignment.sql',\n      'utf8',\n    )\n    const postAuthMigration = readFileSync(\n      'supabase/migrations/20260820213000_tenant_scoped_post_auth_website_applications.sql',\n      'utf8',\n    )\n    const application = websiteOpenApi.components.schemas.CustomerApplicationRequest\n\n    expect(application.required ?? []).not.toContain('auth_user_id')\n    expect(application.required ?? []).not.toContain('customer_portal_user_id')\n    expect(application.dependentRequired?.auth_user_id).toContain('customer_portal_user_id')\n    expect(application.dependentRequired?.customer_portal_user_id).toContain('auth_user_id')"""
          if anchor not in s:
              raise SystemExit('api canonical pre-auth assertion anchor missing')
          s = s.replace(anchor, replacement)
          runtime_anchor = """    expect(runtime).toContain('portal_auth_identity_required')\n    expect((runtime.match(/portal_identity_required: true/g) ?? []).length).toBeGreaterThanOrEqual(2)\n    expect(migration).toContain('alter column portal_identity_required set default true')\n    expect(migration).toContain(\"tg_op = 'INSERT'\")"""
          runtime_replacement = """    expect(runtime).toContain('portal_auth_identity_required')\n    expect(runtime).toContain('portalIdentitySubmissionMode')\n    expect(runtime).toContain('post_auth_allowed')\n    expect((runtime.match(/portal_identity_required: true/g) ?? []).length).toBeGreaterThanOrEqual(2)\n    expect(migration).toContain('alter column portal_identity_required set default true')\n    expect(migration).toContain(\"tg_op = 'INSERT'\")\n    expect(postAuthMigration).toContain('website_portal_identity_mode')\n    expect(postAuthMigration).toContain('post_auth_allowed')\n    expect(postAuthMigration).toContain('pre_auth_required')"""
          if runtime_anchor not in s:
              raise SystemExit('api canonical runtime assertion anchor missing')
          p.write_text(s.replace(runtime_anchor, runtime_replacement))

          p = Path('__tests__/post-128-openapi-tip-residuals.test.ts')
          s = p.read_text()
          s = s.replace('contract release 2026-08-20.1', 'contract release 2026-08-20.2')
          s = s.replace("expect(WEBSITE_INTEGRATION_CONTRACT_VERSION).toBe('2026-08-20.1')", "expect(WEBSITE_INTEGRATION_CONTRACT_VERSION).toBe('2026-08-20.2')")
          p.write_text(s)

          p = Path('__tests__/tenant-website-go-live-hardening.test.ts')
          s = p.read_text()
          old = "expect(docs).toContain('2026-08-20.1')"
          if old not in s:
              raise SystemExit('tenant docs version assertion anchor missing')
          p.write_text(s.replace(old, "expect(docs).toContain('2026-08-20.2')"))
          PY
      - name: Verify regenerated schema and corrected release tests
        run: |
          npm run db:migrations:check
          npx vitest run __tests__/api-canonical-release.test.ts __tests__/post-128-openapi-tip-residuals.test.ts __tests__/tenant-website-go-live-hardening.test.ts
          npm run typecheck
      - name: Persist verified artifacts
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No generated type or test drift remains."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            supabase/database.types.ts \
            scripts/supabase-types-manifest.json \
            __tests__/api-canonical-release.test.ts \
            __tests__/post-128-openapi-tip-residuals.test.ts \
            __tests__/tenant-website-go-live-hardening.test.ts
          git commit -m "fix(checkout): align generated schema and release tests"
          git push origin HEAD:fix/tenant-scoped-post-auth-applications-20260820
