name: One-shot PR Supabase type sync

on:
  push:
    branches:
      - agent/api-docs-prod-remediation-2026-08-16

permissions:
  contents: write

jobs:
  sync-generated-types:
    if: github.repository == 'heke99/gridex-ops-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/api-docs-prod-remediation-2026-08-16
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Regenerate and pin clean-replay Supabase contract
        shell: bash
        run: |
          set -euo pipefail
          source scripts/gridex-aud-003-clean-replay.sh
          supabase gen types typescript --local > supabase/database.types.ts
          node scripts/apply-supabase-types-nullability-overrides.cjs supabase/database.types.ts
          HASH="$(sha256sum supabase/database.types.ts | awk '{print $1}')"
          node - "$HASH" <<'NODE'
          const fs = require('fs');
          const path = 'scripts/supabase-types-manifest.json';
          const hash = process.argv[2];
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.generated_at = new Date().toISOString();
          manifest.sha256 = hash;
          manifest.latest_migration = '20260816101505_partner_api_v1_multicompany_foundation.sql';
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          NODE
          test "$HASH" = "7281cee366faaad9f9d9e7674eb69521bed028c1b2e1b475aaf99558d5dfe818"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/database.types.ts scripts/supabase-types-manifest.json
          if git diff --cached --quiet; then
            echo "Supabase generated contract already synchronized."
            exit 0
          fi
          git commit -m "chore: regenerate Supabase types for Partner API schema"
          git push origin HEAD:agent/api-docs-prod-remediation-2026-08-16
