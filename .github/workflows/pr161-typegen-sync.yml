name: PR 161 canonical Supabase type sync

on:
  push:
    branches:
      - fix/canonical-provision-request-hash-20260817

permissions:
  contents: write

jobs:
  sync-types:
    if: github.repository == 'heke99/gridex-ops-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Generate canonical types and commit them
        shell: bash
        run: |
          set -euo pipefail
          source scripts/gridex-aud-003-clean-replay.sh
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f scripts/gridex-canonical-provision-request-hash-regression.sql
          supabase gen types typescript --local > supabase/database.types.ts
          node scripts/apply-supabase-types-nullability-overrides.cjs supabase/database.types.ts
          GENERATED_HASH="$(sha256sum supabase/database.types.ts | awk '{print $1}')"
          node - "$GENERATED_HASH" <<'NODE'
          const fs = require('fs')
          const path = 'scripts/supabase-types-manifest.json'
          const hash = process.argv[2]
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'))
          manifest.generated_at = new Date().toISOString()
          manifest.sha256 = hash
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`)
          NODE
          MANIFEST_HASH="$(node -p "require('./scripts/supabase-types-manifest.json').sha256")"
          test "$GENERATED_HASH" = "$MANIFEST_HASH"
          echo "generated_types_sha256=$GENERATED_HASH"
          git config user.name "gridex-ci"
          git config user.email "gridex-ci@users.noreply.github.com"
          git add supabase/database.types.ts scripts/supabase-types-manifest.json
          if git diff --cached --quiet; then
            echo "Canonical types already synchronized."
            exit 0
          fi
          git commit -m "chore(db): sync canonical Supabase types"
          git push origin HEAD:fix/canonical-provision-request-hash-20260817
