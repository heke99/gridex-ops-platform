name: PR165 CI contract fix

on:
  push:
    branches:
      - codex/tenant-website-checkout-contract-20260819

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/tenant-website-checkout-contract-20260819
          fetch-depth: 0
      - name: Apply regression alignment
        run: node scripts/pr165-ci-contract-fix.cjs
      - name: Commit fix
        run: |
          set -euo pipefail
          rm scripts/pr165-ci-contract-fix.cjs
          rm .github/workflows/pr165-ci-contract-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: align API regressions with unified developer contract"
          git push origin HEAD:codex/tenant-website-checkout-contract-20260819
