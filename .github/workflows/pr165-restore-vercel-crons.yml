name: PR165 restore Vercel cron config

on:
  push:
    branches:
      - codex/tenant-website-checkout-contract-20260819

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/tenant-website-checkout-contract-20260819
          fetch-depth: 0
      - name: Restore proven cron configuration
        run: |
          set -euo pipefail
          git show 0322233c211374894f55d29d64fd6e4de9f800ac:vercel.json > vercel.json
          rm .github/workflows/pr165-restore-vercel-crons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: restore proven Vercel cron configuration"
          git push origin HEAD:codex/tenant-website-checkout-contract-20260819
