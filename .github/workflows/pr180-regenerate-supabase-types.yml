name: PR180 regenerate Supabase types

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr180-regenerate-supabase-types.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Install dependencies
        run: npm ci
      - name: Replay canonical schema and regenerate types
        shell: bash
        run: |
          set -euo pipefail
          source scripts/gridex-aud-003-clean-replay.sh
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f scripts/gridex-canonical-provision-request-hash-regression.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f scripts/pr164-review-remediation-regression.sql
          supabase gen types typescript --local > rem002-database.types.ts
          node scripts/apply-supabase-types-nullability-overrides.cjs rem002-database.types.ts
          GENERATED_HASH="$(sha256sum rem002-database.types.ts | awk '{print $1}')"
          test "$GENERATED_HASH" = "2c044c8734776fa5ffa981a0db9aaaad1f0e8a3eaec1f6abca89e37f23f1e7e9"
          cp rem002-database.types.ts supabase/database.types.ts
          GENERATED_HASH="$GENERATED_HASH" node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/supabase-types-manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.generated_at = new Date().toISOString();
          manifest.generated_with = 'supabase-cli-2.101.0-clean-replay';
          manifest.generated_types = 'supabase/database.types.ts';
          manifest.sha256 = process.env.GENERATED_HASH;
          manifest.latest_migration = '20260821151000_restrict_site_scoped_z02_definers.sql';
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          # The sourced replay script temporarily replaces supabase/migrations
          # and restores it from an EXIT trap. The generated-types checker reads
          # the real migration tail, so restore the canonical tree exactly once
          # before running that checker. Disable the trap first to prevent a
          # second cleanup from emptying the directory when this step exits.
          trap - EXIT
          cleanup
          node scripts/check-supabase-generated-types.cjs
      - name: Commit canonical generated artifacts
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/database.types.ts scripts/supabase-types-manifest.json
          if git diff --cached --quiet; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git commit -m "chore(db): regenerate canonical Supabase types"
          git push origin HEAD:"${PR_HEAD_REF}"
