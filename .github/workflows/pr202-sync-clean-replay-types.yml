name: PR202 sync clean-replay types

on:
  push:
    branches:
      - fix/provisional-grid-owner-routing-20260824
    paths:
      - .github/workflows/pr202-sync-clean-replay-types.yml

permissions:
  contents: write
  actions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download verified clean-replay artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr202-replay
          gh run download 32716344142 \
            --repo "$GITHUB_REPOSITORY" \
            --name gridex-rem-002-clean-replay \
            --dir /tmp/pr202-replay
          test -s /tmp/pr202-replay/rem002-database.types.ts
          ACTUAL="$(sha256sum /tmp/pr202-replay/rem002-database.types.ts | awk '{print $1}')"
          EXPECTED="61613fe06e6dff7a85b6f9ea0839c9d3f73bd885c532ad5dc13d9465d6b89062"
          echo "artifact_sha256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - name: Sync generated types and manifest
        run: |
          set -euo pipefail
          cp /tmp/pr202-replay/rem002-database.types.ts supabase/database.types.ts
          node <<'NODE'
          const fs = require('fs');
          const path = 'scripts/supabase-types-manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.sha256 = '61613fe06e6dff7a85b6f9ea0839c9d3f73bd885c532ad5dc13d9465d6b89062';
          manifest.latest_migration = '20260824080448_unique_postal_city_provisional_grid_owner.sql';
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          NODE
          test "$(sha256sum supabase/database.types.ts | awk '{print $1}')" = "61613fe06e6dff7a85b6f9ea0839c9d3f73bd885c532ad5dc13d9465d6b89062"
      - name: Commit verified generated types
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/database.types.ts scripts/supabase-types-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync clean-replay Supabase types"
          git push origin "HEAD:${GITHUB_REF_NAME}"
