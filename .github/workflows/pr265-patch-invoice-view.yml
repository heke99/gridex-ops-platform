name: PR265 patch invoice view

on:
  push:
    branches:
      - fix/invoice-test-tenant-binding-and-view

permissions:
  contents: write

jobs:
  patch-invoice-view:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/invoice-test-tenant-binding-and-view
          fetch-depth: 0
      - name: Add explicit invoice navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/admin/ediel/test-center/invoice-test/page.tsx')
          source = path.read_text()

          replacements = [
              (
                  "                const points = meteringPoints.filter((point) => text(point.customer_id) === id)\n                return (",
                  "                const points = meteringPoints.filter((point) => text(point.customer_id) === id)\n                const customerInvoiceItems = invoiceItems.filter((item) => text(item.customer_id) === id)\n                return (",
              ),
              (
                  '            {safeTraceHref ? <Link href={safeTraceHref} className="ml-3 font-black underline">Öppna komplett trace</Link> : null}',
                  '            {safeTraceHref ? <Link href={safeTraceHref} className="ml-3 font-black underline">Öppna komplett trace</Link> : null}\n            {selectedItems.length > 0 ? <Link href="#invoice-test-invoices" className="ml-3 font-black underline">Visa faktura</Link> : null}',
              ),
              (
                  "                      <form action={archiveInvoiceTestCustomerAction}>",
                  "                      {customerInvoiceItems.length > 0 ? (\n                        <Link href={`${WORKSPACE_LINK}?companyId=${encodeURIComponent(String(customer.company_id))}&customerId=${encodeURIComponent(id)}#invoice-test-invoices`} className=\"rounded-xl border border-emerald-300 bg-emerald-50 px-3 py-2 text-xs font-black text-emerald-900\">Visa faktura</Link>\n                      ) : null}\n                      <form action={archiveInvoiceTestCustomerAction}>",
              ),
              (
                  '        <section className="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">\n          <div className="flex flex-wrap items-start justify-between gap-3">\n            <div>\n              <p className="text-xs font-black uppercase tracking-[0.18em] text-emerald-800">3 · Faktura & leverantör</p>',
                  '        <section id="invoice-test-invoices" className="scroll-mt-6 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">\n          <div className="flex flex-wrap items-start justify-between gap-3">\n            <div>\n              <p className="text-xs font-black uppercase tracking-[0.18em] text-emerald-800">3 · Faktura & leverantör</p>',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one invoice-view patch target, got {count}: {old[:80]}')
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/admin/ediel/test-center/invoice-test/page.tsx
          git commit -m 'Add explicit Fakturatest invoice navigation'
          git push origin HEAD:fix/invoice-test-tenant-binding-and-view
