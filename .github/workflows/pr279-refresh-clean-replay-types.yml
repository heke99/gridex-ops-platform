name: PR279 refresh clean replay types

on:
  push:
    branches:
      - fix/arbel-poa-grid-area-20260902

permissions:
  contents: write
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    if: github.repository == 'heke99/gridex-ops-platform'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/arbel-poa-grid-area-20260902
          fetch-depth: 0
      - name: Restore verified clean-replay generated types
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: '33634099242'
          EXPECTED_SHA256: '22d5ce450bd53f9333236ce69862e2fb03d7e94f08c27381139fd01880f1bc19'
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name gridex-rem-002-clean-replay \
            --dir "$tmp"
          source_file="$tmp/rem002-database.types.ts"
          test -f "$source_file"
          actual="$(sha256sum "$source_file" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          cp "$source_file" supabase/database.types.ts
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'scripts/supabase-types-manifest.json'
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'))
          manifest.generated_at = '2026-09-02T13:12:35Z'
          manifest.generated_with = 'supabase-cli-2.101.0-clean-replay'
          manifest.sha256 = '22d5ce450bd53f9333236ce69862e2fb03d7e94f08c27381139fd01880f1bc19'
          manifest.latest_migration = '20260902100500_close_remaining_advisor_hygiene.sql'
          manifest.latest_migration_schema_effect = 'canonical_forward_replay_through_tenant_integrity_poa_alias_and_advisor_hygiene'
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n')
          NODE
          git config user.name 'gridex-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/database.types.ts scripts/supabase-types-manifest.json
          if git diff --cached --quiet; then
            echo 'Generated types already synchronized.'
            exit 0
          fi
          git commit -m 'Regenerate Supabase types from clean replay'
          git push origin HEAD:fix/arbel-poa-grid-area-20260902
