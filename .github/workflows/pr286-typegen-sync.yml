name: PR286 Supabase typegen sync

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  sync-generated-types:
    if: github.event.pull_request.number == 286 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Reconstruct canonical schema and regenerate committed Supabase types
        shell: bash
        run: |
          set -euo pipefail
          source scripts/gridex-aud-003-clean-replay.sh
          supabase gen types typescript --local > supabase/database.types.ts
          node scripts/apply-supabase-types-nullability-overrides.cjs supabase/database.types.ts
          HASH="$(sha256sum supabase/database.types.ts | awk '{print $1}')"
          GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          HASH="$HASH" GENERATED_AT="$GENERATED_AT" node <<'NODE'
          const fs = require('fs')
          const path = 'scripts/supabase-types-manifest.json'
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'))
          manifest.generated_at = process.env.GENERATED_AT
          manifest.generated_with = 'supabase-cli-2.101.0-clean-replay-schema-equivalent-tail'
          manifest.sha256 = process.env.HASH
          manifest.latest_migration = '20260903090000_atomic_supplier_switch_activation_sweep.sql'
          manifest.latest_migration_schema_effect = 'tenant_scoped_z04_and_effective_date_gated_atomic_supplier_activation_rpc_surface'
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`)
          NODE
          test "$HASH" = "$(node -p "require('./scripts/supabase-types-manifest.json').sha256")"
      - name: Commit exact generated artifact to PR branch
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/database.types.ts scripts/supabase-types-manifest.json
          if git diff --cached --quiet; then
            echo 'Generated types already current.'
            exit 0
          fi
          git commit -m 'Regenerate Supabase types for supplier activation'
          git push origin "HEAD:${BRANCH}"
