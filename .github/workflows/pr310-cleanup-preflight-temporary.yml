name: PR310 exact cleanup native preflight
on:
  push:
    branches: ['work/pr310-native-type-adoption-20260916']
    paths: ['.github/workflows/pr310-cleanup-preflight-temporary.yml']
permissions:
  contents: read
jobs:
  exact-cleanup-cli-program:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 874aed02bd4fec72c95a773b2fcc0c51c136673e
          persist-credentials: false
      - name: Retain exact test inputs outside the source checkout
        run: python3 -B .github/pr310-prepare-final-preflight.py
      - uses: actions/checkout@v4
        with:
          ref: c6f7702a0214504bc44027d0526734e3adecf728
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Apply and verify exact bounded repair files
        run: |
          git apply --check "$RUNNER_TEMP/native-final-guards.patch"
          git apply "$RUNNER_TEMP/native-final-guards.patch"
          echo '771f3f163f4c8870d738c28b08fd5ee86bbf72d1cb93fc912d1421a034ac84ef  scripts/canonical_native_forward_runtime.py' | sha256sum --check
          echo 'e5c23fe4f11f3d9ef47750d340956ae3242a43c7d5299a183e4e765c6a2635a7  scripts/canonical_native_probe_cleanup.py' | sha256sum --check
          echo '718545889254c6634fccdf528541f658916b30244f7bb608b839e305763e544f  scripts/test-canonical-native-forward-runtime.py' | sha256sum --check
          echo '9ae8edf14318936700ccef48a087503b6f9cbbd3352be7b478ba1ba3092ea719  scripts/test-canonical-native-probe-cleanup.py' | sha256sum --check
          python3 -B scripts/test-canonical-native-forward-runtime.py
          python3 -B scripts/test-canonical-native-probe-cleanup.py
          python3 -B scripts/test-canonical-permission-forward-contract.py
          python3 -B scripts/test-canonical-native-final-sql.py
      - name: Prove original rejections, complete corrected programs and exact rollback
        run: python3 -B "$RUNNER_TEMP/cleanup-native-preflight.py"
      - name: Confirm no additional tracked sources changed
        if: always()
        run: |
          git diff --check
          test "$(git rev-parse HEAD)" = c6f7702a0214504bc44027d0526734e3adecf728
          python3 -B - <<'PY'
          import subprocess
          expected={'scripts/canonical_native_forward_runtime.py','scripts/canonical_native_probe_cleanup.py','scripts/test-canonical-native-forward-runtime.py','scripts/test-canonical-native-probe-cleanup.py'}
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())==expected
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr310-exact-cleanup-preflight
          path: artifacts/cleanup-native-preflight.json
          if-no-files-found: error
          retention-days: 2
