name: PR310 production dependency advisory evidence
on:
  push:
    branches: ['work/pr310-complete-verification-20260916']
    paths: ['.github/workflows/pr310-production-audit-temporary.yml']
permissions:
  contents: read
jobs:
  audit-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 58dfddba6905ed797cb273e92e25d45893f08b64
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect exact audit JSON without changing package versions
        shell: bash
        run: |
          python3 -B - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          protected=('package.json','package-lock.json')
          before={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in protected}
          out=Path('artifacts/production-audit');out.mkdir(parents=True)
          p=subprocess.run(['npm','audit','--omit=dev','--json'],capture_output=True,text=True,timeout=180)
          report=json.loads(p.stdout)
          assert not report.get('error') and 'vulnerabilities' in report and 'vulnerabilities' in report.get('metadata',{}),report.get('error')
          (out/'audit.json').write_text(p.stdout)
          for name,v in report['vulnerabilities'].items():
              print(json.dumps(dict(package=name,severity=v['severity'],direct=v['isDirect'],range=v['range'],fix=v['fixAvailable'],via=v['via']),sort_keys=True))
          after={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in protected}
          assert before==after and not subprocess.check_output(['git','diff','--name-only'])
          (out/'provenance.json').write_text(json.dumps(dict(sourceHead='58dfddba6905ed797cb273e92e25d45893f08b64',packageHashes=before,sourceUnchanged=True,auditExitCode=p.returncode,scope='ADVISORY_COLLECTION_NOT_CLEAN_AUDIT'),indent=2)+'\n')
          raise SystemExit(p.returncode)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr310-production-audit-evidence
          path: artifacts/production-audit/
          if-no-files-found: error
          retention-days: 7
