name: PR310 exact journal ACL publication
on:
  push:
    branches: [codex/pr310-publish-journal-acl-20260915]
permissions:
  contents: write
jobs:
  verify-and-publish-candidate:
    if: github.repository == 'heke99/gridex-ops-platform' && github.ref == 'refs/heads/codex/pr310-publish-journal-acl-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gridex_auth_test
        ports: ['55440:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d gridex_auth_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
