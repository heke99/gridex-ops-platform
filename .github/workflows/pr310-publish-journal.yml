      - name: Verify exact ACL and rejection controls on actual PostgreSQL17
        run: python3 -B scripts/canonical-journal-acl-selftest.py
      - name: Verify the complete unchanged governance fixture
        run: python3 -B scripts/canonical-blocker-diagnostics.py auth
      - name: Publish only the exact verified candidate, never main
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add scripts/canonical_full_governance_sql.py scripts/canonical_journal_acl.py scripts/canonical-journal-acl-selftest.py
          test "$(git write-tree)" = 3d6fafc0d2bda182641a0b747b18505e28f3f698
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(db): verify journal against exact managed PG17 ACL'
          git push origin HEAD:refs/heads/codex/pr310-journal-acl-verified-20260915
          printf 'commit=%s\ntree=%s\nparent=a59e0ce6aae821955cf5b07eb1e32598addd4144\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > artifacts/journal-publication.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gridex-journal-acl-publication
          path: |
            artifacts/blocker-auth.json
            artifacts/journal-publication.txt
          if-no-files-found: error
          retention-days: 7
