name: PR310 routine reference repair qualification
on:
  push:
    branches: ['codex/pr310-routine-reference-qualification-20260916']
permissions:
  contents: read
jobs:
  isolated-index-witness:
    if: github.repository == 'heke99/gridex-ops-platform' && github.ref == 'refs/heads/codex/pr310-routine-reference-qualification-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PG_CONTAINER: gridex-pr310-index-syntax-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 767966d35bc3bc1df391bfa51bc9657123ccfb15
          persist-credentials: false
      - name: Reproduce exact index witness on a new network-disabled empty database
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{tree}')" = 164c5bb0cb6e438e5c19543351b6f60c12c207c0
          docker run --detach --name "$PG_CONTAINER" --network none --label gridex.pr310-index-proof="$GITHUB_RUN_ID" -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73 > /dev/null
          for i in $(seq 1 40); do
            if docker exec "$PG_CONTAINER" pg_isready -U postgres > /dev/null; then break; fi
            sleep 1
          done
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess,sys
          sys.path.insert(0,'scripts')
          import canonical_changed_index_witness as w
          specs=w.contract(w.retain(w.ROOT))
          synthetic='CREATE TABLE public.customers(company_id uuid,customer_number text,email text,intake_status text,created_at timestamptz);\nCREATE TABLE public.user_roles(company_id uuid,user_id uuid,role_id uuid,status text,is_active boolean);\n'
          synthetic+='\n'.join(s['statement'] for s in specs)+'\n'
          args=['docker','exec','-i',os.environ['PG_CONTAINER'],'psql','-X','-q','-At','-U','postgres','-d','postgres','-v','ON_ERROR_STOP=1','-v','VERBOSITY=verbose','-f','-']
          setup=subprocess.run(args,input=synthetic.encode(),capture_output=True,timeout=60)
          assert setup.returncode==0,'SYNTHETIC_INDEX_SETUP_FAILED'
          results={}
          source=w.render(specs)
          for label,sql in [('original',source),('parenthesized_case',source.replace('<>CASE WHEN included THEN 1 ELSE 2 END\n','<>(CASE WHEN included THEN 1 ELSE 2 END)\n'))]:
              result=subprocess.run(args,input=sql.encode(),capture_output=True,timeout=60)
              error=result.stderr.decode(errors='replace')
              state=re.search(r'ERROR:\s+([A-Z0-9]{5}):',error)
              entry={'exitCode':result.returncode,'sqlstate':state[1] if state else ('00000' if result.returncode==0 else 'UNKNOWN'),'syntaxError':'syntax error' in error,'sourceSha256':hashlib.sha256(sql.encode()).hexdigest(),'stderrSha256':hashlib.sha256(result.stderr).hexdigest(),'allFiveCatalogRowsAnd12PredicateCasesPassed':False}
              results[label]=entry
              if result.returncode==0:
                  rows=json.loads(result.stdout)
                  # This database has only the two new explicitly synthetic tables,
                  # with public source-defined indexes. Never read business data.
                  entry['syntheticCatalogRows']=rows
                  try:
                      w.verify_rows(rows,specs)
                      entry['allFiveCatalogRowsAnd12PredicateCasesPassed']=True
                  except ValueError:
                      entry['catalogMismatch']=True
          output=pathlib.Path('artifacts/pr310-isolated-index-reproduction.json');output.parent.mkdir(exist_ok=True)
          output.write_text(json.dumps({'scope':'SYNTHETIC_EMPTY_INDEX_REPRODUCTION_NOT_FULL_REPLAY','results':results,'productionModified':False,'schemaAccepted':False},sort_keys=True,indent=2)+'\n')
          print(output.read_text())
          if any(entry['allFiveCatalogRowsAnd12PredicateCasesPassed'] for entry in results.values()):
              print('ONE_SYNTHETIC_VARIANT_PASSED_NOT_FULL_REPLAY')
          else:
              raise SystemExit('SYNTHETIC_INDEX_WITNESS_STILL_FAILS')
          PY
      - name: Remove only this job's test container
        if: always()
        run: |
          set -euo pipefail
          if docker inspect "$PG_CONTAINER" > /dev/null 2>&1; then
            test "$(docker inspect --format '{{index .Config.Labels "gridex.pr310-index-proof"}}' "$PG_CONTAINER")" = "$GITHUB_RUN_ID"
            docker rm -f "$PG_CONTAINER" > /dev/null
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr310-isolated-index-reproduction
          path: artifacts/pr310-isolated-index-reproduction.json
          retention-days: 2
          if-no-files-found: error
