name: PR310 routine reference repair qualification
on:
  push:
    branches: ['codex/pr310-routine-reference-qualification-20260916']
permissions:
  contents: read
jobs:
  native-transport-source-qualification:
    if: github.repository == 'heke99/gridex-ops-platform' && github.ref == 'refs/heads/codex/pr310-routine-reference-qualification-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize exact three-file native admission repair
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib,os,pathlib
          raw=pathlib.Path('pr310-native-forward-transport.patch').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='c34c3096e0c0119a891ce9b711c31994d8809dcf415c572a1b498480c815d707'
          pathlib.Path(os.environ['RUNNER_TEMP'],'native-forward.patch').write_bytes(raw)
          PY
          git checkout --detach 4702d0360873aad7d7971a93c04163113a1fe333
          git apply --check --index "$RUNNER_TEMP/native-forward.patch"
          git apply --index "$RUNNER_TEMP/native-forward.patch"
          test "$(git write-tree)" = 7c6ea085ee6028fea96a11d65b20be3bac00adeb
          git diff --cached --check
      - name: Verify actual twelve compiled forward names and unchanged boundary controls
        run: |
          set -euo pipefail
          python3 -B scripts/canonical-native-supabase-lifecycle-selftest.py
          python3 -B scripts/test-canonical-native-forward-runtime.py
          python3 -B scripts/test-canonical-native-application-typegen.py
          python3 -B scripts/test-canonical-native-schema-reference.py
          python3 -B scripts/test-canonical-schema-source-decisions.py
          python3 -B scripts/canonical-owned-timestamp-selftest.py
          python3 -B scripts/test-canonical-promoted-routine-reference.py
          python3 -B scripts/test-canonical-changed-index-witness.py
      - name: Publish tested source descendant without moving PR310
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          base=4702d0360873aad7d7971a93c04163113a1fe333
          tree=7c6ea085ee6028fea96a11d65b20be3bac00adeb
          target=refs/heads/codex/pr310-routine-reference-qualified-20260916
          test "$(git write-tree)" = "$tree"
          git diff-files --quiet
          test -z "$(git diff --cached --name-only "$base" -- .github/workflows)"
          test "$(git ls-remote https://github.com/heke99/gridex-ops-platform.git "$target" | cut -f1)" = "$base"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit="$(printf '%s\n' 'fix: admit all twelve source-bound native forward migrations' | git commit-tree "$tree" -p "$base")"
          git -c credential.helper= -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' push https://github.com/heke99/gridex-ops-platform.git "$commit:$target"
          printf 'sha=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'candidate_commit=%s\ncandidate_tree=%s\npr310_updated=false\n' "$commit" "$tree"
  native-release-qualification:
    needs: native-transport-source-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.native-transport-source-qualification.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Require exact tested source and matching PostgreSQL client
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{tree}')" = 7c6ea085ee6028fea96a11d65b20be3bac00adeb
          git diff-files --quiet
          server_major="$(python3 -c "import re,pathlib;print(re.search(r'^major_version\s*=\s*(\d+)', pathlib.Path('supabase/config.toml').read_text(), re.M).group(1))")"
          test "$server_major" = 17
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-$server_major"
          echo "GRIDEX_PG_DUMP=/usr/lib/postgresql/$server_major/bin/pg_dump" >> "$GITHUB_ENV"
          "/usr/lib/postgresql/$server_major/bin/pg_dump" --version
      - name: Execute every command from the exact ordinary native CI step
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,pathlib
          raw=pathlib.Path('.github/workflows/ops-hardening.yml').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='5a5be1253f91a3b5e6ed8b58e110596fdd590149'
          text=raw.decode()
          start='      - name: Clean empty-database replay and verify generated types\n        shell: bash\n        run: |\n'
          end='      - name: Upload clean-replay evidence\n'
          assert text.count(start)==text.count(end)==1
          body=text.split(start)[1].split(end)[0]
          assert all(line.startswith('          ') or not line for line in body.splitlines())
          script='\n'.join(line[10:] if line else '' for line in body.splitlines())+'\n'
          assert script.count('python3 -B scripts/canonical-auth-provisioning-replay.py')==1
          pathlib.Path(os.environ['RUNNER_TEMP'],'ordinary-native-step.sh').write_text(script)
          PY
          bash -e -o pipefail "$RUNNER_TEMP/ordinary-native-step.sh"
      - name: Upload genuine native results without changing acceptance
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr310-twelve-forward-native-release
          path: |
            rem002-clean-replay.log
            artifacts/replay-input-accounting.json
            artifacts/native-supabase-lifecycle.json
            artifacts/native-full-schema-reference-diff.json
            artifacts/native-application-database.types.candidate.ts
            artifacts/native-release-verification.json
          retention-days: 2
          if-no-files-found: error
