name: PR310 routine reference repair qualification
on:
  push:
    branches: ['codex/pr310-routine-reference-qualification-20260916']
permissions:
  contents: read
jobs:
  qualify-source:
    if: github.repository == 'heke99/gridex-ops-platform' && github.ref == 'refs/heads/codex/pr310-routine-reference-qualification-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize only the reviewed five-file repair
        env:
          PATCH_PAYLOAD: ''
        shell: bash
        run: |
          set -euo pipefail
          base=4c7b3a1a5be0d5c9bb499876c0f573411ec17f76
          test "$(git diff --name-only "$base" HEAD)" = '.github/workflows/pr310-routine-reference-qualification.yml'
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, zlib
          raw = zlib.decompress(base64.b64decode(os.environ['PATCH_PAYLOAD'], validate=True))
          assert hashlib.sha256(raw).hexdigest() == '1ceb0631761cfbb2fc37f4c4f225a4f60138a4f10c3a70a78a1cc21492e91042'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'reviewed.patch').write_bytes(raw)
          PY
          git read-tree "$base"
          git apply --check --index "$RUNNER_TEMP/reviewed.patch"
          git apply --index "$RUNNER_TEMP/reviewed.patch"
          test "$(git write-tree)" = '164c5bb0cb6e438e5c19543351b6f60c12c207c0'
          git diff --cached --check "$base"
      - name: Run new regressions and unchanged adjacent acceptance tests
        run: |
          set -euo pipefail
          python3 -B scripts/test-canonical-promoted-routine-reference.py
          python3 -B scripts/test_canonical_removed_policy_qualification.py
          python3 -B scripts/test_canonical_removed_policy_formulas.py
          python3 -B scripts/test-canonical-native-application-typegen.py
          python3 -B scripts/test-canonical-native-schema-reference.py
          python3 -B scripts/test-canonical-schema-source-decisions.py
          python3 -B scripts/canonical-owned-timestamp-selftest.py
          python3 -B scripts/canonical-full-schema-reference-selftest.py
      - name: Publish exact tested tree to a new qualification branch only
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          base=4c7b3a1a5be0d5c9bb499876c0f573411ec17f76
          tree=164c5bb0cb6e438e5c19543351b6f60c12c207c0
          test "$(git write-tree)" = "$tree"
          git diff-files --quiet
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit="$(printf '%s\n' 'fix: bind removed-policy RPC witness to qualified forward source' | git commit-tree "$tree" -p "$base")"
          git -c credential.helper= -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' push https://github.com/heke99/gridex-ops-platform.git "$commit:refs/heads/codex/pr310-routine-reference-qualified-20260916"
          printf 'sha=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'candidate_commit=%s\ncandidate_tree=%s\npr310_updated=false\n' "$commit" "$tree"
  independent-schema-diagnostic:
    needs: qualify-source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GRIDEX_LEGACY_CONTAINER_NAME: gridex-auth-legacy-continuation-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.qualify-source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute unchanged full owned source replay and independent schema comparison
        run: |
          set -o pipefail
          python3 -B scripts/canonical-full-schema-reference.py 2>&1 | tee "$RUNNER_TEMP/routine-schema-diagnostic.log"
      - name: Remove only the owned qualification database
        if: always()
        run: |
          python3 -B - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('scripts/canonical-foundation-frontier-diagnostic.py').resolve()
          s=importlib.util.spec_from_file_location('cleanup',p)
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          m.load_controller().load_batch().cleanup_workflow_owned()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr310-routine-schema-diagnostic
          path: |
            artifacts/full-schema-reference-diff.json
            ${{ runner.temp }}/routine-schema-diagnostic.log
          retention-days: 2
          if-no-files-found: error
