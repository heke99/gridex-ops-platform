name: PR310 focused native type pipeline tests
on:
  push:
    branches: ['work/pr310-native-type-adoption-20260916']
    paths: ['.github/workflows/pr310-type-adoption-temporary.yml']
permissions:
  contents: write
jobs:
  focused-type-pipeline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retain the exact reviewed patch outside the source checkout
        run: |
          cp .github/pr310-type-wiring-temporary.patch "$RUNNER_TEMP/type-wiring.patch"
          echo "2a791b00f7669eb115f38ea0df295e066c0413536c01f1bbd827f67b8a0ac075  $RUNNER_TEMP/type-wiring.patch" | sha256sum --check
      - uses: actions/checkout@v4
        with:
          ref: c6f7702a0214504bc44027d0526734e3adecf728
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply exactly the two reviewed regression changes
        run: |
          test "$(git rev-parse HEAD)" = c6f7702a0214504bc44027d0526734e3adecf728
          test -z "$(git status --porcelain --untracked-files=no)"
          git apply --check "$RUNNER_TEMP/type-wiring.patch"
          git apply "$RUNNER_TEMP/type-wiring.patch"
          echo 'dec285a406e39d5c56f6b0ecd36973c4a8279ae87bb2da0a3f0aaa4d3da22486  scripts/gridex-ops-post-332-field-511-health-residuals-regression.cjs' | sha256sum --check
          echo 'c825d8be2303058322b371778bda8b75d67fdd782e08bc65e9ea839b2bf5f88a  scripts/test-canonical-native-application-typegen.py' | sha256sum --check
          git diff --check
      - name: Verify private type transport and unchanged release gates
        run: |
          python3 -B scripts/test-canonical-native-application-typegen.py
          python3 -B scripts/test-canonical-native-release-verify.py
          python3 -B scripts/test-canonical-native-release-entry.py
      - run: npm ci
      - run: npm run typecheck
      - name: Confirm stale types remain rejected and missing overrides fail
        shell: bash
        run: |
          python3 -B - <<'PY'
          from pathlib import Path
          import json,subprocess
          before={p:Path(p).read_bytes() for p in ('supabase/database.types.ts','scripts/supabase-types-manifest.json')}
          result=subprocess.run(['node','scripts/gridex-ops-post-332-field-511-health-residuals-regression.cjs'],capture_output=True,text=True)
          assert result.returncode==1
          failures=[s for s in result.stderr.splitlines() if s.startswith('- ')]
          assert len(failures)==1 and failures[0].startswith('- generated-types tip must match the latest timestamped migration'),failures
          path=Path('scripts/canonical_native_application_typegen.py');raw=path.read_bytes()
          try:
              assert raw.count(b'candidate=apply_override(outputs[0])')==1
              path.write_bytes(raw.replace(b'candidate=apply_override(outputs[0])',b'candidate=outputs[0]'))
              mutated=subprocess.run(['python3','-B','scripts/test-canonical-native-application-typegen.py'],capture_output=True)
              assert mutated.returncode!=0,'missing override must fail the regression'
          finally:
              path.write_bytes(raw)
          assert all(Path(p).read_bytes()==r for p,r in before.items())
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())=={'scripts/gridex-ops-post-332-field-511-health-residuals-regression.cjs','scripts/test-canonical-native-application-typegen.py'}
          Path('focused-type-wiring.patch').write_bytes(subprocess.check_output(['git','diff','--binary']))
          Path('focused-type-wiring.json').write_text(json.dumps(dict(scope='FOCUSED_UNIT_AND_WIRING_TESTS_NOT_GENERATED_TYPES_OR_SCHEMA_ACCEPTANCE',source='c6f7702a0214504bc44027d0526734e3adecf728',overrideRemovalRejected=True,staleManifestStillRejected=True,committedTypeBytesUnchanged=True,mainModified=False),indent=2)+'\n')
          PY
      - name: Publish the tested two-file descendant without changing PR310 or main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = heke99/gridex-ops-platform
          test "$GITHUB_REF" = refs/heads/work/pr310-native-type-adoption-20260916
          test "$(git rev-parse HEAD)" = c6f7702a0214504bc44027d0526734e3adecf728
          test ! -e .github/workflows/pr310-type-adoption-temporary.yml
          test ! -e .github/pr310-type-wiring-temporary.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/gridex-ops-post-332-field-511-health-residuals-regression.cjs scripts/test-canonical-native-application-typegen.py
          python3 -B - <<'PY'
          import subprocess
          expected={'scripts/gridex-ops-post-332-field-511-health-residuals-regression.cjs','scripts/test-canonical-native-application-typegen.py'}
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==expected
          PY
          git diff --cached --check
          git commit -m 'test: align native typegen wiring and enforce nullable candidate bytes'
          test "$(git rev-parse HEAD^)" = c6f7702a0214504bc44027d0526734e3adecf728
          branch="work/pr310-type-wiring-verified-${GITHUB_RUN_ID}"
          test -z "$(git ls-remote --heads origin "refs/heads/$branch")"
          git push origin "HEAD:refs/heads/$branch"
          test "$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)" = "$(git rev-parse HEAD)"
          python3 -B - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          get=lambda *args:subprocess.check_output(['git',*args],text=True).strip()
          Path('verified-publication.json').write_text(json.dumps(dict(scope='TESTED_TWO_FILE_DESCENDANT_NOT_TYPE_OR_SCHEMA_ACCEPTANCE',head=get('rev-parse','HEAD'),tree=get('rev-parse','HEAD^{tree}'),parent=get('rev-parse','HEAD^'),branch='work/pr310-type-wiring-verified-'+os.environ['GITHUB_RUN_ID'],mainModified=False,pr310Modified=False),indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr310-focused-type-wiring
          path: |
            focused-type-wiring.patch
            focused-type-wiring.json
            verified-publication.json
          if-no-files-found: error
          retention-days: 2
