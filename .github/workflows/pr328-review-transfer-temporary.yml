name: PR328 review source transport (temporary)
on:
  push:
    branches: [codex/pr328-review-transfer-20260918]
    paths: [.github/workflows/pr328-review-transfer-temporary.yml]
permissions:
  contents: write
jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: transfer
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 97f7505153fc268551d16112428cc9eaf0581b0d
          path: candidate
      - name: Verify null-rejection patch and exact tree (transport only)
        shell: bash
        run: |
          set -euo pipefail
          cp transfer/.source-transfer/pr328-null-rejection.patch.xz "$RUNNER_TEMP/review.patch.xz"
          echo "65d12c5752cfd8807daad96616269322cb2720b34c2bb42550259373acc008b4  $RUNNER_TEMP/review.patch.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/review.patch.xz" > "$RUNNER_TEMP/review.patch"
          echo "e5a541a8193ad8c9cf30ce663aedc568bcd07d7f50c64fd7feeef97fd7d51f73  $RUNNER_TEMP/review.patch" | sha256sum -c -
          cd candidate
          test "$(git rev-parse HEAD)" = 97f7505153fc268551d16112428cc9eaf0581b0d
          test "$(git rev-parse HEAD^{tree})" = c83c6b489bda82d12a34a07c8f3ad8cc7421ab10
          git apply --check "$RUNNER_TEMP/review.patch"
          git apply --index "$RUNNER_TEMP/review.patch"
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          assert len(paths) == 13, paths
          allowed = {'lib/ediel/inboundCases.ts','__tests__/ediel-prodat-register-batch-application.test.ts','quality/audits/ediel-masterplan-v2/f3-register-null-rejection-review-20260918.json'}
          for path in paths:
              assert path.startswith('.agent-memory/') or path in allowed, path
          PY
          test "$(git write-tree)" = 54f9cf4fe56e42768ef132a23f6a79baea0632d5
      - name: Save source-only candidate (not acceptance or merge)
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'heke99'
          git config user.email '129280077+heke99@users.noreply.github.com'
          git commit -m 'fix(ediel): complete nullable-company rejection CAS and rereview evidence'
          test "$(git rev-parse HEAD^{tree})" = 54f9cf4fe56e42768ef132a23f6a79baea0632d5
          git push origin HEAD:refs/heads/codex/pr328-null-rejection-candidate-20260918
          mkdir -p ../receipt
          git rev-parse HEAD > ../receipt/candidate-commit.txt
          git rev-parse HEAD^{tree} > ../receipt/candidate-tree.txt
          git diff --name-only 97f7505153fc268551d16112428cc9eaf0581b0d HEAD > ../receipt/changed-files.txt
          git archive HEAD | gzip -n > ../receipt/source.tar.gz
          printf '%s\n' 'scope=source transport only; ordinary CI and substantive rereview required before merge' > ../receipt/provenance.txt
          cd ../receipt
          sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr328-null-rejection-source-transport-receipt
          path: receipt/
          if-no-files-found: error
          retention-days: 14
