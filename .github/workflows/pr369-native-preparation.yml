name: PR369 isolated native context preparation
on:
  push:
    branches: [codex/ediel-pr369-native-preparation-20260922]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'heke99/gridex-ops-platform' && github.ref == 'refs/heads/codex/ediel-pr369-native-preparation-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Install matching PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          server_major="$(python3 -c "import re,pathlib;print(re.search(r'^major_version\s*=\s*(\d+)', pathlib.Path('supabase/config.toml').read_text(), re.M).group(1))")"
          test "$server_major" = 17
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-$server_major"
          echo "GRIDEX_PG_DUMP=/usr/lib/postgresql/$server_major/bin/pg_dump" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Real CLI migration identity and exact finite code patch
        run: python3 scripts/pr369-native-preparation.py prepare
      - name: Isolated replay, physical source and migration-time tests, repeated generation
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee pr369-generation/native-replay.log) 2>&1
          source scripts/gridex-aud-003-clean-replay.sh
          SHADOW_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$SHADOW_URL" -X -v ON_ERROR_STOP=1 -f scripts/manual-inbound-tenant-graph-regression.sql
          psql "$SHADOW_URL" -X -v ON_ERROR_STOP=1 -f scripts/gridex-canonical-provision-request-hash-regression.sql
          psql "$SHADOW_URL" -X -v ON_ERROR_STOP=1 -f scripts/pr164-review-remediation-regression.sql
          supabase gen types typescript --local > pr369-generation/types-first.ts
          node scripts/apply-supabase-types-nullability-overrides.cjs pr369-generation/types-first.ts
          supabase gen types typescript --local > pr369-generation/types-second.ts
          node scripts/apply-supabase-types-nullability-overrides.cjs pr369-generation/types-second.ts
          npm run db:schema:snapshot -- --url "$SHADOW_URL" --out-dir pr369-generation/schema-first
          npm run db:schema:snapshot -- --url "$SHADOW_URL" --out-dir pr369-generation/schema-second
          python3 scripts/pr369-native-preparation.py finish
          DATABASE_URL="$SHADOW_URL" npm run tenant:invariants
          npm run db:parity:selftest -- "$SHADOW_URL"
          npm run db:schema:check -- --url "$SHADOW_URL"
      - name: Validate exact restored history and real TypeScript callers
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee pr369-generation/targeted-validation.log) 2>&1
          npm run db:migrations:check
          npm run typecheck
          npm run typecheck:tests
          npx vitest run __tests__/ediel-inbound-received-context.test.ts __tests__/ediel-received-context-reader.test.ts __tests__/ediel-received-context-outcomes.test.ts
          git diff --check
      - name: Transport allowlisted immutable Git blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pr369-native-preparation.py transport
      - name: Preserve exact generated bytes and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr369-native-generation-${{ github.run_id }}
          path: pr369-generation/
          if-no-files-found: warn
          retention-days: 90
