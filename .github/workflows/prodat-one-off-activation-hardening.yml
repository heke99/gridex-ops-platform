name: PRODAT one-off activation hardening

on:
  push:
    branches:
      - fix/prodat-26a-semantic-hardening-20260822
    paths:
      - .github/workflows/prodat-one-off-activation-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prodat-26a-semantic-hardening-20260822
          fetch-depth: 0

      - name: Apply PRODAT activation hardening
        run: python3 scripts/prodat-one-off-activation-hardening.py

      - name: Commit hardening and remove one-off files
        shell: bash
        run: |
          rm -f .github/workflows/prodat-one-off-activation-hardening.yml scripts/prodat-one-off-activation-hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hardening changes needed."
            exit 0
          fi
          git commit -m "fix(ediel): gate supplier activation on Z04 and effective date"
          git push origin HEAD:fix/prodat-26a-semantic-hardening-20260822

      - name: Show resulting commit
        run: git log -1 --oneline
