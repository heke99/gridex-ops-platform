name: PRODAT one-off source cleanup

on:
  push:
    branches:
      - fix/prodat-26a-semantic-hardening-20260822
    paths:
      - .github/workflows/prodat-one-off-source-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prodat-26a-semantic-hardening-20260822
          fetch-depth: 0

      - name: Apply final PRODAT semantic cleanup
        run: python3 scripts/prodat-one-off-source-cleanup.py

      - name: Commit cleanup and remove one-off files
        shell: bash
        run: |
          rm -f .github/workflows/prodat-one-off-source-cleanup.yml scripts/prodat-one-off-source-cleanup.py
          if git diff --quiet; then
            echo "No source cleanup changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ediel): remove legacy PRODAT acceptance paths"
          git push origin HEAD:fix/prodat-26a-semantic-hardening-20260822
