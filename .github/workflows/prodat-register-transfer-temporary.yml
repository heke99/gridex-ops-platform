name: PRODAT register checkpoint transport (temporary)
on:
  push:
    branches: [codex/prodat-register-transfer-20260917]
    paths: [.github/workflows/prodat-register-transfer-temporary.yml]
permissions:
  contents: write
jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: transfer
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 28b2a9ad1d745acaa4ea7fe15af7608da95e7884
          path: candidate
      - name: Apply hash-checked source checkpoint and normalized fixture
        shell: bash
        run: |
          set -euo pipefail
          cat transfer/.source-transfer/prodat-register.patch.xz.0{0,1,2} > "$RUNNER_TEMP/register.patch.xz"
          echo "0f9f1658c25443a16544942d937ab3bc9c6a53fc148cd991c976997f38f75a46  $RUNNER_TEMP/register.patch.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/register.patch.xz" > "$RUNNER_TEMP/register.patch"
          echo "ec20ff775b4c04f4902a52cd04228dee2fc4cec8b7f6071369354bbcbccde74a  $RUNNER_TEMP/register.patch" | sha256sum -c -
          cd candidate
          test "$(git rev-parse HEAD)" = 28b2a9ad1d745acaa4ea7fe15af7608da95e7884
          git apply --check --unidiff-zero "$RUNNER_TEMP/register.patch"
          git apply --index --unidiff-zero "$RUNNER_TEMP/register.patch"
          python3 - <<'PY'
          import hashlib, os, subprocess
          from pathlib import Path
          paths = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==34, paths
          for path in paths:
              assert path=='.github/workflows/ediel-masterplan-v2.yml' or path.startswith(('lib/ediel/','lib/onboarding/','__tests__/','quality/audits/ediel-masterplan-v2/f3-register-')),path
          fixture=Path('__tests__/fixtures/prodat-register.ts')
          text=fixture.read_text(); assert text.endswith('\n\n')
          fixture.write_text(text.rstrip('\n')+'\n')
          subprocess.run(['git','add',str(fixture)],check=True)
          # Reuse the exact already-reviewed memory updater, not arbitrary workflow commands.
          p=Path('../transfer/.source-transfer/checkpoint-workflow-source.yml')
          data=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()=='d2a6caba65a286abce77edb796a3156adfb57817'
          source=data.decode()
          marker=source.index('      - name: Save precise partial progress without rewriting the original specification\n')
          start=source.index('          import json\n',marker)
          end=source.index('\n          PY\n',start)
          lines=source[start:end].splitlines()
          assert all(line.startswith('          ') for line in lines)
          script=Path(os.environ['RUNNER_TEMP'])/'save-register-progress.py'
          script.write_text('\n'.join(line[10:] for line in lines)+'\n')
          subprocess.run(['python3',str(script)],check=True)
          PY
          git add .agent-memory docs/superpowers/plans/2026-09-17-prodat-register-rules.md
          mkdir -p ../receipt
          cp .github/workflows/ediel-masterplan-v2.yml ../receipt/intended-ediel-masterplan-v2.yml
          # This token is contents-only. Workflow changes are applied later through the authorized native connector.
          git restore --source=28b2a9ad1d745acaa4ea7fe15af7608da95e7884 --staged --worktree .github/workflows/ediel-masterplan-v2.yml
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github/workflows .source-transfer supabase)"
      - name: Publish isolated source-only candidate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'heke99'
          git config user.email '129280077+heke99@users.noreply.github.com'
          git commit -m 'feat(ediel): preserve PRODAT registers and record partial qualification'
          git push origin HEAD:refs/heads/codex/prodat-register-candidate-20260917
          git rev-parse HEAD > ../receipt/candidate-commit.txt
          git rev-parse HEAD^{tree} > ../receipt/candidate-tree.txt
          git diff --name-only 28b2a9ad1d745acaa4ea7fe15af7608da95e7884 HEAD > ../receipt/changed-files.txt
          git archive HEAD | gzip -n > ../receipt/source.tar.gz
          cd ../receipt
          sha256sum source.tar.gz intended-ediel-masterplan-v2.yml > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prodat-register-checkpoint-transport-receipt
          path: receipt/
          retention-days: 7
