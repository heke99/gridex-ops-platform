name: Gridex production certification E2E

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Production certification phase to run
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - tenant-bootstrap
      confirm_production:
        description: Type PRODUCTION to confirm the real production target
        required: true
        type: string
      confirm_synthetic_tenant:
        description: For tenant-bootstrap only, type CREATE_SYNTHETIC_TENANT
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gridex-production-certification
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  production-certification:
    name: ${{ inputs.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-e2e
    env:
      GRIDEX_E2E_PROD_BASE_URL: ${{ secrets.GRIDEX_E2E_PROD_BASE_URL }}
      GRIDEX_E2E_TENANT_WEBSITE_URL: ${{ secrets.GRIDEX_E2E_TENANT_WEBSITE_URL }}
      GRIDEX_E2E_SUPERADMIN_EMAIL: ${{ secrets.GRIDEX_E2E_SUPERADMIN_EMAIL }}
      GRIDEX_E2E_SUPERADMIN_PASSWORD: ${{ secrets.GRIDEX_E2E_SUPERADMIN_PASSWORD }}
      GRIDEX_E2E_TENANT_ADMIN_EMAIL: ${{ secrets.GRIDEX_E2E_TENANT_ADMIN_EMAIL }}
      GRIDEX_E2E_TENANT_ADMIN_PASSWORD: ${{ secrets.GRIDEX_E2E_TENANT_ADMIN_PASSWORD }}
      GRIDEX_E2E_RUN_ID: prod-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Reject non-explicit production execution
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirm_production }}" != "PRODUCTION" ]]; then
            echo "Production certification requires confirm_production=PRODUCTION." >&2
            exit 1
          fi
          case "${{ inputs.mode }}" in
            preflight)
              ;;
            tenant-bootstrap)
              if [[ "${{ inputs.confirm_synthetic_tenant }}" != "CREATE_SYNTHETIC_TENANT" ]]; then
                echo "tenant-bootstrap requires confirm_synthetic_tenant=CREATE_SYNTHETIC_TENANT." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported production certification mode." >&2
              exit 1
              ;;
          esac

      - name: Verify required secrets without printing values
        shell: bash
        run: |
          set -euo pipefail
          required=(
            GRIDEX_E2E_PROD_BASE_URL
            GRIDEX_E2E_TENANT_WEBSITE_URL
            GRIDEX_E2E_SUPERADMIN_EMAIL
            GRIDEX_E2E_SUPERADMIN_PASSWORD
          )
          if [[ "${{ inputs.mode }}" == "tenant-bootstrap" ]]; then
            required+=(GRIDEX_E2E_TENANT_ADMIN_EMAIL GRIDEX_E2E_TENANT_ADMIN_PASSWORD)
          fi
          missing=0
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: $name" >&2
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]]

          if [[ "$GRIDEX_E2E_PROD_BASE_URL" != "https://app.gridex.se" && "$GRIDEX_E2E_PROD_BASE_URL" != "https://app.gridex.se/" ]]; then
            echo "Production certification is pinned to https://app.gridex.se." >&2
            exit 1
          fi
          if [[ "$GRIDEX_E2E_TENANT_WEBSITE_URL" != "https://gridex.se" && "$GRIDEX_E2E_TENANT_WEBSITE_URL" != "https://gridex.se/" ]]; then
            echo "This Gridex certification is pinned to https://gridex.se." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify production E2E safety contract
        run: node scripts/gridex-production-certification-e2e-regression.cjs
      - name: Install pinned Playwright tooling
        run: bash scripts/install-browser-e2e-tooling.sh

      - name: Run production preflight
        if: inputs.mode == 'preflight'
        run: |
          mkdir -p e2e-artifacts
          npx playwright test e2e/production/preflight.spec.mjs \
            --config=playwright.production-certification.config.mjs

      - name: Bootstrap isolated synthetic tenant
        if: inputs.mode == 'tenant-bootstrap'
        run: |
          mkdir -p e2e-artifacts
          npx playwright test e2e/production/tenant-bootstrap.spec.mjs \
            --config=playwright.production-certification.config.mjs

      - name: Upload sanitized certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gridex-production-certification-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            e2e-artifacts/gridex-production-*.json
            e2e-artifacts/production-certification-junit.xml
          if-no-files-found: warn
          retention-days: 14
