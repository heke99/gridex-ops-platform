name: Refresh secure ip-address lock

on:
  push:
    branches:
      - fix/usage-event-identity-and-quote-idempotency-20260804

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/usage-event-identity-and-quote-idempotency-20260804
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin patched transitive IP parser
        run: |
          npm pkg set overrides.ip-address=10.3.1
          npm install --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Commit refreshed dependency lock
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency lock already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Pin secure ip-address dependency"
          git push origin HEAD:fix/usage-event-identity-and-quote-idempotency-20260804
