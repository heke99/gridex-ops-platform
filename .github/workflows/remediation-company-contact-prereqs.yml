name: Remediation company contact replay prerequisites

on:
  push:
    branches:
      - remediation/gridex-ops-full-integrity-performance

permissions:
  contents: write

jobs:
  apply-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact remediation HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified replay prerequisites
        run: |
          cat > supabase/bootstrap/20260519_companies_primary_contact_email_foundation.sql <<'SQL'
          -- Clean-replay prerequisite derived from 20260519_final_saas_hardening.sql.
          -- Restore only the company contact field required by later canonical tenant-mail views.
          alter table if exists public.companies
            add column if not exists primary_contact_email text;
          SQL

          cat > supabase/bootstrap/20260520_companies_support_email_foundation.sql <<'SQL'
          -- Clean-replay prerequisite derived from 20260520_batch_6e_rbac_tenant_stats_whitelabel.sql.
          -- Restore only the company support field required by later canonical tenant-mail views.
          alter table if exists public.companies
            add column if not exists support_email text null;
          SQL

          node <<'NODE'
          const fs = require('fs');
          const p = 'scripts/gridex-aud-003-legacy-foundation.additions.json';
          const doc = JSON.parse(fs.readFileSync(p, 'utf8'));
          const ensureAfter = (item, after) => {
            doc.foundation = doc.foundation.filter((value) => value !== item);
            const idx = doc.foundation.indexOf(after);
            doc.foundation.splice(idx >= 0 ? idx + 1 : 0, 0, item);
          };
          ensureAfter('bootstrap/20260519_companies_primary_contact_email_foundation.sql', 'bootstrap/20260519_user_profiles_foundation.sql');
          ensureAfter('bootstrap/20260520_companies_support_email_foundation.sql', 'bootstrap/20260520_pricing_component_rules_foundation.sql');
          doc.derivedBootstrap['bootstrap/20260519_companies_primary_contact_email_foundation.sql'] = {
            source: 'migrations/20260519_final_saas_hardening.sql',
            artifactSha256: 'fbdc09f9d0c463b8568ae70b96f518c2dcbc87f41d54df60099b76d9706d435a',
            purpose: 'Restore only the source-defined companies.primary_contact_email field required by later canonical tenant event-mail readiness; no company rows are seeded.'
          };
          doc.derivedBootstrap['bootstrap/20260520_companies_support_email_foundation.sql'] = {
            source: 'migrations/20260520_batch_6e_rbac_tenant_stats_whitelabel.sql',
            artifactSha256: '0d9b0853accf38682c0a9399b1a6085800f77f8c53ad742f2d852663c79151df',
            purpose: 'Restore only the source-defined companies.support_email field required by later canonical tenant event-mail readiness; no company rows are seeded.'
          };
          fs.writeFileSync(p, JSON.stringify(doc, null, 2) + '\n');
          NODE

          cat > .agent-memory/current-state.md <<'EOF'
          # Current state

          Last updated: 2026-08-08T16:15:00Z

          - Branch: `remediation/gridex-ops-full-integrity-performance`
          - PR: `#90`
          - Last verified code HEAD before this DB prerequisite: `ed3d746cfdc4489920bc56e3686d92affedcc8d3`
          - Active finding: `GRIDEX-REM-002`
          - Status: `IMPLEMENTED_NOT_VERIFIED`

          Large-file blocker is structurally fixed: `lib/website/customerApplications.ts` was split into bounded domain modules, all generated files are <=2500 lines, temporary split tooling was removed, and full repository `npm run typecheck` passed with the permanent 4096 MB compiler budget aligned with the existing build budget.

          Latest clean replay on `0527a632d323b908d10719cd7d07f84488e50e51` advanced through Batch M, O6, `20260615203000` and `20260615214500`, then failed in `20260615230000_tenant_legal_defaults_live_test_intake_tracking.sql` because `companies.primary_contact_email` was absent. The same canonical view also reads `companies.support_email`.

          Current implementation restores exactly those two source-defined fields from checksum-tracked pre-ledger sources: `20260519_final_saas_hardening.sql` and idempotent `20260520_batch_6e_rbac_tenant_stats_whitelabel.sql`. No live Supabase write and no historical migration edit.

          Next: run exact-HEAD OPS hardening; continue only from the next actual clean-replay failure. On full replay/fingerprint success, mark REM-002 VERIFIED and stop migration archaeology.
          EOF

          cat > .agent-memory/current-task.md <<'EOF'
          # Current task

          Last updated: 2026-08-08T16:15:00Z
          Branch: `remediation/gridex-ops-full-integrity-performance`
          PR: `#90`

          `GRIDEX-REM-002` remains the active release blocker.

          Verified prior failure: `20260615230000_tenant_legal_defaults_live_test_intake_tracking.sql` reads `companies.primary_contact_email` and `companies.support_email`; those fields are defined by pre-ledger canonical source files but were absent from clean replay.

          Current implementation adds only those two schema prerequisites and pins their provenance in `scripts/gridex-aud-003-legacy-foundation.additions.json`.

          Independent large-file DoD blocker is fixed and locally workflow-verified: the customer application pipeline is split into <=2500-line modules and repository typecheck passed.

          Next action: exact-HEAD CI. No further discovery unless a defined release gate actually fails.
          EOF

          cat > .agent-memory/open-blockers.md <<'EOF'
          # Open blockers

          Last updated: 2026-08-08T16:15:00Z

          1. `GRIDEX-REM-002` clean replay/fingerprint remains open until exact-HEAD CI passes end-to-end. Current implementation restores the two company contact columns required by the first failing tenant-mail readiness view.

          2. Large-file implementation must still be confirmed by ordinary OPS-hardening CI on the same descendant HEAD, although the dedicated split workflow already passed full repository typecheck and the <=2500 line gate.

          PR #90 remains unmerged until same-HEAD release verification is green.
          EOF

          cat > .agent-memory/handover.md <<'EOF'
          # Remediation handover

          Branch: `remediation/gridex-ops-full-integrity-performance`
          PR: `#90`

          The customer application large-file blocker is fixed by a behavior-preserving module split; dedicated workflow verification passed repository typecheck and every generated module is <=2500 lines. Temporary split tooling has been removed.

          `GRIDEX-REM-002` remains open. The latest replay first failure was `20260615230000_tenant_legal_defaults_live_test_intake_tracking.sql`, whose event-mail readiness view reads `companies.primary_contact_email` and `companies.support_email`. Current changes restore only those two source-defined columns from `20260519_final_saas_hardening.sql` and `20260520_batch_6e_rbac_tenant_stats_whitelabel.sql`.

          Continue only from exact CI evidence. Once full clean replay + fingerprint + same-HEAD gates pass, mark REM-002 VERIFIED, run one bounded release rescan, update final reports/memory, merge PR #90 to main and verify main.
          EOF

          node <<'NODE'
          const fs = require('fs');
          const checkpoint = {
            project: 'gridex-ops-platform',
            updated_at: '2026-08-08T16:15:00Z',
            branch: 'remediation/gridex-ops-full-integrity-performance',
            pr: 90,
            last_verified_commit: 'ed3d746cfdc4489920bc56e3686d92affedcc8d3',
            active_phase: 'FULL_INTEGRITY_PERFORMANCE_REMEDIATION',
            active_task: 'GRIDEX-REM-002',
            active_subtask: 'Restore verified company contact prerequisites for tenant mail readiness',
            status: 'IMPLEMENTED_NOT_VERIFIED',
            exact_known_failure: {
              migration: '20260615230000_tenant_legal_defaults_live_test_intake_tracking.sql',
              line: 302,
              error: 'column c.primary_contact_email does not exist',
              required_same_view_fields: ['companies.primary_contact_email', 'companies.support_email']
            },
            large_file_gate: {
              customer_applications_before_lines: 9808,
              split_workflow_typecheck: 'PASS',
              generated_files_over_2500: 0,
              ordinary_ci_pending: true
            },
            next_action: 'Run exact-HEAD OPS hardening; continue only from an actual failing release gate.',
            external_blockers: [],
            resume_from: '.agent-memory/handover.md'
          };
          fs.writeFileSync('.agent-memory/checkpoint.json', JSON.stringify(checkpoint, null, 2) + '\n');
          NODE

      - name: Commit prerequisites and remove temporary workflow
        env:
          BRANCH: remediation/gridex-ops-full-integrity-performance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/bootstrap/20260519_companies_primary_contact_email_foundation.sql \
                  supabase/bootstrap/20260520_companies_support_email_foundation.sql \
                  scripts/gridex-aud-003-legacy-foundation.additions.json \
                  .agent-memory/current-state.md \
                  .agent-memory/current-task.md \
                  .agent-memory/open-blockers.md \
                  .agent-memory/handover.md \
                  .agent-memory/checkpoint.json
          git rm .github/workflows/remediation-company-contact-prereqs.yml
          git commit -m "fix(db): restore company contact replay prerequisites"
          git push origin "HEAD:${BRANCH}"
