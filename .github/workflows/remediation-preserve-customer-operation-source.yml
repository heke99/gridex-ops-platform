name: Preserve customer operation source replay

on:
  push:
    branches:
      - remediation/gridex-ops-full-integrity-performance

permissions:
  contents: write

jobs:
  register-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve full checksum-pinned source replay
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/gridex-aud-003-legacy-foundation.additions.json';
          const rel = 'bootstrap/20260618_customer_operation_jobs_foundation.sql';
          const doc = JSON.parse(fs.readFileSync(path, 'utf8'));
          doc.derivedBootstrap[rel] = {
            source: 'migrations/20260618110000_customer_operation_automation_jobs.sql',
            artifactSha256: '7db6def1c2f9f78443ef26f8e9124830a8771ef8b34c64f54ca4629ab01864f1',
            preserveSourceReplay: true,
            purpose: 'Restore the early customer_operation_jobs relation while preserving complete checksum-pinned, tenant-safe/non-destructive 20260618110000 customer operation automation for chronological replay, including customer_info_requests route/message correlation fields required by later dispatch finalization.'
          };
          fs.writeFileSync(path, JSON.stringify(doc, null, 2) + '\n');
          NODE
      - name: Verify static migration provenance
        run: node scripts/gridex-aud-003-migration-provenance-regression.cjs
      - name: Commit metadata and remove temporary workflow
        env:
          BRANCH: remediation/gridex-ops-full-integrity-performance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/gridex-aud-003-legacy-foundation.additions.json
          git rm .github/workflows/remediation-preserve-customer-operation-source.yml
          git commit -m "fix(db): preserve customer operation source replay"
          git push origin "HEAD:${BRANCH}"
