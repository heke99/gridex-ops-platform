name: Preserve external tenant quote source replay

on:
  push:
    branches:
      - remediation/gridex-ops-full-integrity-performance

permissions:
  contents: write

jobs:
  register-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve full checksum-pinned source replay
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/gridex-aud-003-legacy-foundation.additions.json';
          const rel = 'bootstrap/20260722_external_tenant_reference_foundation.sql';
          const doc = JSON.parse(fs.readFileSync(path, 'utf8'));
          const current = doc.derivedBootstrap[rel];
          if (!current) throw new Error('missing external tenant reference derived bootstrap');
          if (current.source !== 'migrations/20260722133000_external_tenant_quote_api_completion.sql') throw new Error(`unexpected source: ${current.source}`);
          current.preserveSourceReplay = true;
          current.purpose = 'Restore the early stable external tenant reference prerequisite while preserving complete checksum-pinned, forward-only/tenant-safe 20260722133000 external tenant quote/API completion for chronological replay, including website_contract_quotes and canonical external publication/API contracts.';
          fs.writeFileSync(path, JSON.stringify(doc, null, 2) + '\n');
          NODE
      - name: Verify static migration provenance
        run: node scripts/gridex-aud-003-migration-provenance-regression.cjs
      - name: Commit metadata and remove temporary workflow
        env:
          BRANCH: remediation/gridex-ops-full-integrity-performance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/gridex-aud-003-legacy-foundation.additions.json
          git rm .github/workflows/remediation-preserve-external-tenant-quote-source.yml
          git commit -m "fix(db): preserve external tenant quote source replay"
          git push origin "HEAD:${BRANCH}"
