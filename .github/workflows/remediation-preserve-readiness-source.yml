name: Remediation preserve production readiness source

on:
  push:
    branches:
      - remediation/gridex-ops-full-integrity-performance

permissions:
  contents: write

jobs:
  apply-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact remediation HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve complete readiness source replay
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'scripts/gridex-aud-003-legacy-foundation.additions.json';
          const doc = JSON.parse(fs.readFileSync(p, 'utf8'));
          const key = 'bootstrap/20260614_integration_api_client_readiness_foundation.sql';
          const meta = doc.derivedBootstrap[key];
          if (!meta || meta.source !== 'migrations/20260614140000_ops_production_multitenant_readiness.sql') {
            throw new Error('unexpected 20260614 readiness lineage');
          }
          meta.preserveSourceReplay = true;
          meta.purpose = 'Restore early integration API client profile/readiness columns while preserving the complete additive/idempotent 20260614140000 production multitenant readiness source for normal chronological replay, including canonical legal bundles and price books required by later migrations.';
          fs.writeFileSync(p, JSON.stringify(doc, null, 2) + '\n');
          NODE

          cat > .agent-memory/current-state.md <<'EOF'
          # Current state

          Last updated: 2026-08-08T16:21:00Z

          - Branch: `remediation/gridex-ops-full-integrity-performance`
          - PR: `#90`
          - Active finding: `GRIDEX-REM-002`
          - Status: `IMPLEMENTED_NOT_VERIFIED`

          Large-file split is now ordinary-CI proven through migration/provenance checks, API billing tenant regression, full repository typecheck, quote idempotency and targeted Vitest. The hardening regression failure was a path-only assertion and has been corrected to the new `customerApplicationShared.ts` owner without removing the assertion.

          Clean replay on `14bc298e1005e63b07a95e8226817c047a1c0fdd` proves the company contact prerequisites work: replay passes `20260615230000` and advances to `20260616150000_public_contract_offer_api_visibility_fix.sql`, where `public.legal_bundles` is missing.

          Root cause: complete checksum-pinned, additive/idempotent `20260614140000_ops_production_multitenant_readiness.sql` was suppressed by the narrow integration API-client readiness bootstrap. Current implementation sets `preserveSourceReplay=true` for that existing artifact so the early prerequisite remains and the complete canonical source replays chronologically. No live Supabase write and no historical migration edit.

          Next: exact-HEAD CI. Continue only from the next actual replay or required-check failure. Stop migration work immediately when full replay/fingerprint passes.
          EOF

          cat > .agent-memory/current-task.md <<'EOF'
          # Current task

          Last updated: 2026-08-08T16:21:00Z
          Branch: `remediation/gridex-ops-full-integrity-performance`
          PR: `#90`

          Active: `GRIDEX-REM-002` deterministic canonical empty-database replay.

          Current first SQL failure from exact replay evidence: `20260616150000_public_contract_offer_api_visibility_fix.sql:70`, `relation public.legal_bundles does not exist`.

          Canonical owner `20260614140000_ops_production_multitenant_readiness.sql` is additive/idempotent and creates `legal_bundles`, `legal_bundle_items`, `price_books`, `price_book_lines`, launch state/intake structures and their readiness columns. It was skipped because the existing narrow integration API-client readiness bootstrap referenced it.

          Current implementation preserves that narrow prerequisite while enabling complete source replay at 20260614140000.

          Next action: exact-HEAD CI only; no new discovery absent a failing defined release gate.
          EOF

          cat > .agent-memory/open-blockers.md <<'EOF'
          # Open blockers

          Last updated: 2026-08-08T16:21:00Z

          `GRIDEX-REM-002` remains the active database release blocker until clean replay and fingerprint pass on the final same HEAD. Current implementation restores complete 20260614140000 production multitenant readiness source replay to resolve the verified `legal_bundles` failure.

          The customer application large-file implementation is complete structurally and has passed ordinary CI typecheck; final same-HEAD regression/security verification remains required.

          PR #90 remains unmerged until all final release gates are green.
          EOF

          cat > .agent-memory/handover.md <<'EOF'
          # Remediation handover

          Branch: `remediation/gridex-ops-full-integrity-performance`
          PR: `#90`

          Large-file blocker: customer application pipeline split into <=2500-line modules; ordinary CI typecheck is green. The one hardening-regression failure was a stale file-path assertion and is corrected without weakening the token check.

          Database blocker: clean replay now reaches `20260616150000` and fails on missing `public.legal_bundles`. Canonical additive/idempotent `20260614140000_ops_production_multitenant_readiness.sql` owns that relation and was being skipped because of a narrow derived bootstrap. Current metadata sets `preserveSourceReplay=true` so complete source replay returns at its chronological position.

          Continue only from exact CI evidence. On clean replay + fingerprint success, mark REM-002 VERIFIED, stop migration archaeology, run one bounded release rescan, update final state, merge PR #90 and verify main.
          EOF

          node <<'NODE'
          const fs = require('fs');
          const checkpoint = {
            project: 'gridex-ops-platform',
            updated_at: '2026-08-08T16:21:00Z',
            branch: 'remediation/gridex-ops-full-integrity-performance',
            pr: 90,
            active_phase: 'FULL_INTEGRITY_PERFORMANCE_REMEDIATION',
            active_task: 'GRIDEX-REM-002',
            active_subtask: 'Preserve complete 20260614140000 production multitenant readiness source replay',
            status: 'IMPLEMENTED_NOT_VERIFIED',
            exact_known_failure: {
              migration: '20260616150000_public_contract_offer_api_visibility_fix.sql',
              line: 70,
              error: 'relation public.legal_bundles does not exist',
              owner_source: '20260614140000_ops_production_multitenant_readiness.sql'
            },
            large_file_gate: {
              customer_applications_before_lines: 9808,
              generated_files_over_2500: 0,
              ordinary_ci_typecheck: 'PASS',
              final_same_head_ci_pending: true
            },
            next_action: 'Run exact-HEAD CI and continue only from an actual failing release gate.',
            external_blockers: [],
            resume_from: '.agent-memory/handover.md'
          };
          fs.writeFileSync('.agent-memory/checkpoint.json', JSON.stringify(checkpoint, null, 2) + '\n');
          NODE
      - name: Commit lineage fix and remove temporary workflow
        env:
          BRANCH: remediation/gridex-ops-full-integrity-performance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/gridex-aud-003-legacy-foundation.additions.json \
                  .agent-memory/current-state.md \
                  .agent-memory/current-task.md \
                  .agent-memory/open-blockers.md \
                  .agent-memory/handover.md \
                  .agent-memory/checkpoint.json
          git rm .github/workflows/remediation-preserve-readiness-source.yml
          git commit -m "fix(db): preserve production readiness source replay"
          git push origin "HEAD:${BRANCH}"
