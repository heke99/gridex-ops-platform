name: Register company governance replay foundation

on:
  push:
    branches:
      - remediation/gridex-ops-full-integrity-performance

permissions:
  contents: write

jobs:
  register-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Register checksum-pinned foundation and order
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const additionsPath = 'scripts/gridex-aud-003-legacy-foundation.additions.json';
          const orderPath = 'scripts/gridex-aud-003-foundation-order.json';
          const artifact = 'supabase/bootstrap/20260519_companies_governance_foundation.sql';
          const rel = 'bootstrap/20260519_companies_governance_foundation.sql';
          const expected = '7e245a6f95321c4fcf3fd0194b2c50a8ea99f9af4cfa05c917741e496ed6a41d';
          const actual = crypto.createHash('sha256').update(fs.readFileSync(artifact)).digest('hex');
          if (actual !== expected) throw new Error(`artifact checksum mismatch: ${actual}`);

          const additions = JSON.parse(fs.readFileSync(additionsPath, 'utf8'));
          if (!additions.foundation.includes(rel)) {
            const anchor = 'bootstrap/20260519_companies_primary_contact_email_foundation.sql';
            const idx = additions.foundation.indexOf(anchor);
            additions.foundation.splice(idx >= 0 ? idx + 1 : 0, 0, rel);
          }
          additions.derivedBootstrap[rel] = {
            source: 'migrations/20260519_batch_6d_superadmin_tenant_governance.sql',
            artifactSha256: expected,
            purpose: 'Restore only the source-defined companies lifecycle/governance block required by later canonical company/legal-profile and tenant lifecycle flows: canonical tenant status constraint, status reason, lifecycle audit timestamps/actors and governance status index; no company rows are seeded or rewritten.'
          };
          fs.writeFileSync(additionsPath, JSON.stringify(additions, null, 2) + '\n');

          const order = JSON.parse(fs.readFileSync(orderPath, 'utf8'));
          if (!order.foundation.includes(rel)) {
            const anchor = 'bootstrap/20260519_companies_primary_contact_email_foundation.sql';
            const idx = order.foundation.indexOf(anchor);
            order.foundation.splice(idx >= 0 ? idx + 1 : 0, 0, rel);
          }
          fs.writeFileSync(orderPath, JSON.stringify(order, null, 2) + '\n');
          NODE
      - name: Verify static migration provenance
        run: node scripts/gridex-aud-003-migration-provenance-regression.cjs
      - name: Commit metadata/order and remove temporary workflow
        env:
          BRANCH: remediation/gridex-ops-full-integrity-performance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/gridex-aud-003-legacy-foundation.additions.json scripts/gridex-aud-003-foundation-order.json
          git rm .github/workflows/remediation-register-company-governance-foundation.yml
          git commit -m "fix(db): register company governance replay lineage"
          git push origin "HEAD:${BRANCH}"
