name: Register contract offer versions replay foundation

on:
  push:
    branches:
      - remediation/gridex-ops-full-integrity-performance

permissions:
  contents: write

jobs:
  register-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Register checksum-pinned foundation and order
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const additionsPath = 'scripts/gridex-aud-003-legacy-foundation.additions.json';
          const orderPath = 'scripts/gridex-aud-003-foundation-order.json';
          const artifact = 'supabase/bootstrap/20260519_contract_offer_versions_foundation.sql';
          const rel = 'bootstrap/20260519_contract_offer_versions_foundation.sql';
          const expected = 'dfc498aa35f02dcc1b4ab30481f8f52981a8987ccde911c06e4b52541d0c63e6';
          const actual = crypto.createHash('sha256').update(fs.readFileSync(artifact)).digest('hex');
          if (actual !== expected) throw new Error(`artifact checksum mismatch: ${actual}`);

          const additions = JSON.parse(fs.readFileSync(additionsPath, 'utf8'));
          if (!additions.foundation.includes(rel)) {
            const anchor = 'bootstrap/20260519_companies_governance_foundation.sql';
            const idx = additions.foundation.indexOf(anchor);
            additions.foundation.splice(idx >= 0 ? idx + 1 : 0, 0, rel);
          }
          additions.derivedBootstrap[rel] = {
            source: 'migrations/20260519_final_saas_hardening.sql',
            artifactSha256: expected,
            purpose: 'Restore only source-defined contract_offer_versions and its company/offer history index required by later canonical contract/invoice completion; no offer versions or tenant/product rows are seeded.'
          };
          fs.writeFileSync(additionsPath, JSON.stringify(additions, null, 2) + '\n');

          const order = JSON.parse(fs.readFileSync(orderPath, 'utf8'));
          if (!order.foundation.includes(rel)) {
            const anchor = 'bootstrap/20260519_companies_governance_foundation.sql';
            const idx = order.foundation.indexOf(anchor);
            order.foundation.splice(idx >= 0 ? idx + 1 : 0, 0, rel);
          }
          fs.writeFileSync(orderPath, JSON.stringify(order, null, 2) + '\n');
          NODE
      - name: Verify static migration provenance
        run: node scripts/gridex-aud-003-migration-provenance-regression.cjs
      - name: Commit metadata/order and remove temporary workflow
        env:
          BRANCH: remediation/gridex-ops-full-integrity-performance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/gridex-aud-003-legacy-foundation.additions.json scripts/gridex-aud-003-foundation-order.json
          git rm .github/workflows/remediation-register-contract-offer-versions-foundation.yml
          git commit -m "fix(db): register contract offer versions replay lineage"
          git push origin "HEAD:${BRANCH}"
