name: Register Ediel outbox replay prerequisite

on:
  push:
    branches:
      - remediation/gridex-ops-full-integrity-performance

permissions:
  contents: write

jobs:
  register-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Register checksum-pinned replay prerequisite
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const path = 'scripts/gridex-aud-003-legacy-foundation.additions.json';
          const artifact = 'supabase/bootstrap/20260618_ediel_outbox_claim_lock_prerequisite.sql';
          const rel = 'bootstrap/20260618_ediel_outbox_claim_lock_prerequisite.sql';
          const expected = '278b30d6fd9a428f3d57d33bc4daadb39c5afb9fffb67080d2247bc94ce77192';
          const actual = crypto.createHash('sha256').update(fs.readFileSync(artifact)).digest('hex');
          if (actual !== expected) throw new Error(`artifact checksum mismatch: ${actual}`);
          const doc = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!doc.interleaved.some((item) => item.path === rel)) {
            doc.interleaved.push({
              path: rel,
              afterLedgerVersion: '20260618194500',
              beforeLedgerVersion: '20260618200000'
            });
          }
          doc.interleaved.sort((a, b) => a.beforeLedgerVersion.localeCompare(b.beforeLedgerVersion) || a.path.localeCompare(b.path));
          doc.derivedBootstrap[rel] = {
            source: 'migrations/20260615_multitenant_integrity_and_claim_locks.sql',
            artifactSha256: expected,
            purpose: 'Restore only the source-defined ediel_outbox claim-lock fields consumed by canonical 20260618200000 queue hardening (locked_at, locked_by, send_attempt_count, current_send_attempt_id); no outbox rows are seeded or modified.'
          };
          fs.writeFileSync(path, JSON.stringify(doc, null, 2) + '\n');
          NODE
      - name: Verify static migration provenance
        run: node scripts/gridex-aud-003-migration-provenance-regression.cjs
      - name: Commit metadata and remove temporary workflow
        env:
          BRANCH: remediation/gridex-ops-full-integrity-performance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/gridex-aud-003-legacy-foundation.additions.json
          git rm .github/workflows/remediation-register-outbox-claim-lock.yml
          git commit -m "fix(db): register Ediel outbox replay lineage"
          git push origin "HEAD:${BRANCH}"
