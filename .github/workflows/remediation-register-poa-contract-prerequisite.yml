name: Register POA contract replay prerequisite

on:
  push:
    branches:
      - remediation/gridex-ops-full-integrity-performance

permissions:
  contents: write

jobs:
  register-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Register checksum-pinned replay prerequisite
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const path = 'scripts/gridex-aud-003-legacy-foundation.additions.json';
          const artifact = 'supabase/bootstrap/20260617_powers_of_attorney_customer_contract_prerequisite.sql';
          const rel = 'bootstrap/20260617_powers_of_attorney_customer_contract_prerequisite.sql';
          const expected = '0dd8f05ef993d6b4c55aa4ac2217de1e6b8d392a2efcf03ad0edf24d4a3460d5';
          const actual = crypto.createHash('sha256').update(fs.readFileSync(artifact)).digest('hex');
          if (actual !== expected) throw new Error(`artifact checksum mismatch: ${actual}`);
          const doc = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!doc.interleaved.some((item) => item.path === rel)) {
            doc.interleaved.push({
              path: rel,
              afterLedgerVersion: '20260617170000',
              beforeLedgerVersion: '20260617183000'
            });
          }
          doc.interleaved.sort((a, b) => a.beforeLedgerVersion.localeCompare(b.beforeLedgerVersion));
          doc.derivedBootstrap[rel] = {
            source: 'migrations/20260528_debug_post_repair_schema_guardrails.sql',
            artifactSha256: expected,
            purpose: 'Restore only the source-defined powers_of_attorney.customer_contract_id runtime field immediately before the canonical 20260617183000 portal-document backfill reads it; no POA rows are seeded or rewritten.'
          };
          fs.writeFileSync(path, JSON.stringify(doc, null, 2) + '\n');
          NODE
      - name: Verify static migration provenance
        run: node scripts/gridex-aud-003-migration-provenance-regression.cjs
      - name: Commit metadata and remove temporary workflow
        env:
          BRANCH: remediation/gridex-ops-full-integrity-performance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/gridex-aud-003-legacy-foundation.additions.json
          git rm .github/workflows/remediation-register-poa-contract-prerequisite.yml
          git commit -m "fix(db): register POA contract replay lineage"
          git push origin "HEAD:${BRANCH}"
