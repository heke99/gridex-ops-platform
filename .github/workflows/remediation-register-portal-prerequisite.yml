name: Register portal replay prerequisite

on:
  push:
    branches:
      - remediation/gridex-ops-full-integrity-performance

permissions:
  contents: write

jobs:
  register-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Register checksum-pinned replay prerequisite
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const path = 'scripts/gridex-aud-003-legacy-foundation.additions.json';
          const artifact = 'supabase/bootstrap/20260616_customer_portal_user_email_prerequisite.sql';
          const expected = '8771db9f8f90bce00542164f5ec8ed498840309a0dbd2e3e0a885329c0f6724f';
          const actual = crypto.createHash('sha256').update(fs.readFileSync(artifact)).digest('hex');
          if (actual !== expected) throw new Error(`artifact checksum mismatch: ${actual}`);
          const doc = JSON.parse(fs.readFileSync(path, 'utf8'));
          const rel = 'bootstrap/20260616_customer_portal_user_email_prerequisite.sql';
          if (!doc.interleaved.some((item) => item.path === rel)) {
            doc.interleaved.push({
              path: rel,
              afterLedgerVersion: '20260616205000',
              beforeLedgerVersion: '20260616223000'
            });
          }
          doc.interleaved.sort((a, b) => a.beforeLedgerVersion.localeCompare(b.beforeLedgerVersion));
          doc.derivedBootstrap[rel] = {
            source: 'migrations/20260525_debug_fix_batch_1b_schema_code_alignment.sql',
            artifactSha256: expected,
            purpose: 'Restore only the source-defined customer_portal_accounts.user_email field and empty-replay-safe email backfill immediately before the canonical 20260616223000 portal bundle resolver indexes it; no portal accounts are seeded.'
          };
          fs.writeFileSync(path, JSON.stringify(doc, null, 2) + '\n');
          NODE
      - name: Verify static migration provenance
        run: node scripts/gridex-aud-003-migration-provenance-regression.cjs
      - name: Commit metadata and remove temporary workflow
        env:
          BRANCH: remediation/gridex-ops-full-integrity-performance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/gridex-aud-003-legacy-foundation.additions.json
          git rm .github/workflows/remediation-register-portal-prerequisite.yml
          git commit -m "fix(db): register portal user email replay lineage"
          git push origin "HEAD:${BRANCH}"
