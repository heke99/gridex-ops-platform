name: Update company metadata replay bootstrap

on:
  push:
    branches:
      - remediation/gridex-ops-full-integrity-performance

permissions:
  contents: write

jobs:
  register-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update checksum-pinned replay metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const path = 'scripts/gridex-aud-003-legacy-foundation.additions.json';
          const artifact = 'supabase/bootstrap/20260520_companies_support_email_foundation.sql';
          const rel = 'bootstrap/20260520_companies_support_email_foundation.sql';
          const expected = 'd1c082322d12e9936647f9e4d75602bf484b05bef480de5302ae9f841d9dc326';
          const actual = crypto.createHash('sha256').update(fs.readFileSync(artifact)).digest('hex');
          if (actual !== expected) throw new Error(`artifact checksum mismatch: ${actual}`);
          const doc = JSON.parse(fs.readFileSync(path, 'utf8'));
          const current = doc.derivedBootstrap[rel];
          if (!current) throw new Error('missing company metadata bootstrap metadata');
          if (current.source !== 'migrations/20260520_batch_6e_rbac_tenant_stats_whitelabel.sql') throw new Error(`unexpected source: ${current.source}`);
          current.artifactSha256 = expected;
          current.purpose = 'Restore only the source-defined Batch 6E companies metadata block required by later canonical tenant-mail, legal-profile, Ediel identity and white-label flows: billing/support contacts, address, Ediel identity, operating environment, branding/billing settings, plus the source constraint/indexes; no company rows are seeded or rewritten.';
          fs.writeFileSync(path, JSON.stringify(doc, null, 2) + '\n');
          NODE
      - name: Verify static migration provenance
        run: node scripts/gridex-aud-003-migration-provenance-regression.cjs
      - name: Commit metadata and remove temporary workflow
        env:
          BRANCH: remediation/gridex-ops-full-integrity-performance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/gridex-aud-003-legacy-foundation.additions.json
          git rm .github/workflows/remediation-update-company-metadata-bootstrap.yml
          git commit -m "fix(db): align company metadata replay lineage"
          git push origin "HEAD:${BRANCH}"
