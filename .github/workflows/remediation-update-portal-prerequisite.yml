name: Update portal replay prerequisite metadata

on:
  push:
    branches:
      - remediation/gridex-ops-full-integrity-performance

permissions:
  contents: write

jobs:
  register-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update checksum-pinned replay metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const path = 'scripts/gridex-aud-003-legacy-foundation.additions.json';
          const artifact = 'supabase/bootstrap/20260616_customer_portal_user_email_prerequisite.sql';
          const rel = 'bootstrap/20260616_customer_portal_user_email_prerequisite.sql';
          const expected = '09beeca9a8e0c70fbab2888cb2b6bb0993a0e5f09e516ed8518b90c5106c95c6';
          const actual = crypto.createHash('sha256').update(fs.readFileSync(artifact)).digest('hex');
          if (actual !== expected) throw new Error(`artifact checksum mismatch: ${actual}`);
          const doc = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!doc.derivedBootstrap[rel]) throw new Error('missing derived bootstrap registration');
          doc.derivedBootstrap[rel].artifactSha256 = expected;
          doc.derivedBootstrap[rel].purpose = 'Restore only the source-defined customer_portal_accounts runtime fields consumed by the canonical 20260616223000 portal bundle resolver (user_email, is_active, activated_at, verified_at, match_method) plus the empty-replay-safe email backfill; no portal accounts are seeded.';
          fs.writeFileSync(path, JSON.stringify(doc, null, 2) + '\n');
          NODE
      - name: Verify static migration provenance
        run: node scripts/gridex-aud-003-migration-provenance-regression.cjs
      - name: Commit metadata and remove temporary workflow
        env:
          BRANCH: remediation/gridex-ops-full-integrity-performance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/gridex-aud-003-legacy-foundation.additions.json
          git rm .github/workflows/remediation-update-portal-prerequisite.yml
          git commit -m "fix(db): align portal prerequisite replay metadata"
          git push origin "HEAD:${BRANCH}"
