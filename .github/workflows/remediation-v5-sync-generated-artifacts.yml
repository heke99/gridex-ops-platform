name: Remediation v5 sync generated artifacts

on:
  push:
    branches:
      - agent/gridex-ops-production-remediation-v5-20260812

permissions:
  contents: write

jobs:
  sync-generated-artifacts:
    if: "${{ !contains(github.event.head_commit.message, 'chore(db): sync remediation generated artifacts') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gridex-ops-production-remediation-v5-20260812
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Register only missing migration checksums
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('node:crypto')
          const fs = require('node:fs')
          const path = require('node:path')
          const basePath = 'scripts/migration-history-manifest.json'
          const additionsPath = 'scripts/migration-history-manifest.additions.json'
          const base = JSON.parse(fs.readFileSync(basePath, 'utf8'))
          const additions = JSON.parse(fs.readFileSync(additionsPath, 'utf8'))
          base.files ??= {}
          additions.files ??= {}
          const migrations = fs.readdirSync('supabase/migrations').filter((name) => name.endsWith('.sql')).sort()
          const added = []
          for (const name of migrations) {
            if (base.files[name] || additions.files[name]) continue
            const bytes = fs.readFileSync(path.join('supabase/migrations', name))
            additions.files[name] = crypto.createHash('sha256').update(bytes).digest('hex')
            added.push(name)
          }
          const sorted = Object.fromEntries(Object.entries(additions.files).sort(([a], [b]) => a.localeCompare(b)))
          fs.writeFileSync(additionsPath, `${JSON.stringify({ ...additions, files: sorted }, null, 2)}\n`)
          console.log(`registered_missing_migrations=${added.length}`)
          for (const name of added) console.log(`registered=${name}:${sorted[name]}`)
          NODE
          node scripts/check-migration-versions.cjs
      - name: Reconstruct clean schema and regenerate committed types
        shell: bash
        run: |
          set -euo pipefail
          source scripts/gridex-aud-003-clean-replay.sh
          supabase gen types typescript --local > supabase/database.types.ts
          node <<'NODE'
          const crypto = require('node:crypto')
          const fs = require('node:fs')
          const typesPath = 'supabase/database.types.ts'
          const manifestPath = 'scripts/supabase-types-manifest.json'
          const bytes = fs.readFileSync(typesPath)
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'))
          manifest.generated_at = new Date().toISOString()
          manifest.sha256 = crypto.createHash('sha256').update(bytes).digest('hex')
          const latest = fs.readdirSync('supabase/migrations')
            .filter((name) => /^\d+.*\.sql$/.test(name))
            .sort()
            .at(-1)
          if (latest) manifest.latest_migration = latest
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`)
          console.log(`generated_types_sha256=${manifest.sha256}`)
          console.log(`latest_migration=${manifest.latest_migration}`)
          NODE
          node scripts/check-supabase-generated-types.cjs
      - name: Commit generated artifacts when stale
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/database.types.ts scripts/supabase-types-manifest.json scripts/migration-history-manifest.additions.json; then
            echo 'Generated remediation artifacts are already current.'
            exit 0
          fi
          git add supabase/database.types.ts scripts/supabase-types-manifest.json scripts/migration-history-manifest.additions.json
          git -c user.name='gridex-remediation-bot' -c user.email='gridex-remediation-bot@users.noreply.github.com' \
            commit -m 'chore(db): sync remediation generated artifacts'
          git push origin HEAD:agent/gridex-ops-production-remediation-v5-20260812
