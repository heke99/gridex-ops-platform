name: Repair generated Supabase types (one-shot)

on:
  push:
    branches:
      - hardening/system-crawl-round2-20260830

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/system-crawl-round2-20260830
      - name: Repair migration and type manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          migration_manifest = Path('scripts/migration-history-manifest.additions.json')
          data = json.loads(migration_manifest.read_text())
          removed = data['files'].pop('20260830111000_manual_inbound_canonical_correlation_parity.sql', None)
          if removed is None:
              print('stale 11:10 migration key already absent')
          migration_manifest.write_text(json.dumps(data, indent=2) + '\n')

          type_manifest = Path('scripts/supabase-types-manifest.json')
          types = json.loads(type_manifest.read_text())
          types['latest_migration'] = '20260830103610_manual_inbound_tenant_graph_trigger_contract.sql'
          types['latest_migration_schema_effect'] = 'manual_inbound_tenant_graph_hardened_without_public_type_relationship_drift'
          type_manifest.write_text(json.dumps(types, indent=2) + '\n')
          PY
          git diff --check
          git diff -- scripts/migration-history-manifest.additions.json scripts/supabase-types-manifest.json
          if git diff --quiet; then
            echo 'No manifest repair required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/migration-history-manifest.additions.json scripts/supabase-types-manifest.json
          git commit -m 'Reconcile canonical migration manifests'
          git push origin HEAD:hardening/system-crawl-round2-20260830
