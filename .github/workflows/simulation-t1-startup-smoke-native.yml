      - name: One prepared C and explicit phased parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          H="$GITHUB_WORKSPACE/harness"
          HELPER="$H/scripts/simulation/runtime/assigned_backend.py"
