          python3 "$HELPER" phase-start --assignment "$TRACK1_ASSIGNMENT_FILE"
      - name: Checkpoint 0 startup actual full-runtime observation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/harness/scripts/simulation/runtime/assigned_backend.py" phase-checkpoint --assignment "$SMOKE_HOME/assignment.json" --ordinal 0
      - name: Publish actual checkpoint 0 for external independent reviewers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: t1-phase-${{ github.run_id }}-0
          path: ${{ env.SMOKE_HOME }}/phase-checkpoints/0.json
          if-no-files-found: error
          retention-days: 14
      - name: Accept authenticated append-only input 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/harness/scripts/simulation/runtime/assigned_backend.py" phase-accept --assignment "$SMOKE_HOME/assignment.json" --ordinal 0
      - name: Checkpoint 1 original native before retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/harness/scripts/simulation/runtime/assigned_backend.py" phase-checkpoint --assignment "$SMOKE_HOME/assignment.json" --ordinal 1
      - name: Publish actual checkpoint 1 for external independent reviewers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: t1-phase-${{ github.run_id }}-1
          path: ${{ env.SMOKE_HOME }}/phase-checkpoints/1.json
          if-no-files-found: error
          retention-days: 14
      - name: Accept authenticated append-only input 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/harness/scripts/simulation/runtime/assigned_backend.py" phase-accept --assignment "$SMOKE_HOME/assignment.json" --ordinal 1
      - name: Checkpoint 2 actual MAIN03 terminal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/harness/scripts/simulation/runtime/assigned_backend.py" phase-checkpoint --assignment "$SMOKE_HOME/assignment.json" --ordinal 2
