name: Staff API schema capture (capture only)

on:
  pull_request:
    paths:
      - 'supabase/migrations/*staff*.sql'
      - 'supabase/database.types.ts'
      - 'supabase/schema.sql'
      - 'supabase/schema.fingerprint.json'
      - 'supabase/config.toml'
      - 'scripts/supabase-types-manifest.json'
      - 'scripts/migration-history-manifest*.json'
      - 'scripts/gridex-aud-003-*.json'
      - 'scripts/gridex-aud-003-clean-replay.sh'
      - 'scripts/gridex-schema-snapshot.cjs'
      - 'scripts/apply-supabase-types-nullability-overrides.cjs'
      - '.github/workflows/staff-api-schema-capture.yml'

permissions:
  contents: read

concurrency:
  group: staff-schema-capture-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# This artifact producer does not compare baselines or execute native/browser
# tests. OPS hardening clean/upgrade replay and parity remain mandatory.
jobs:
  capture:
    name: Capture disposable clean-replay types and schema
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Select the existing combined-prefix capture turn
        id: capture_turn
        shell: bash
        env:
          SOURCE_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ "$SOURCE_HEAD_REF" == "codex/ediel-combined-source-capture-20261005" ]]; then
            pending="$(python3 -c 'import json; print("true" if json.load(open("scripts/supabase-types-manifest.json"))["composition_capture_pending"] is True else "false")')"
            echo "pending=$pending" >> "$GITHUB_OUTPUT"
          else
            echo 'pending=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.capture_turn.outputs.pending == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.capture_turn.outputs.pending == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.capture_turn.outputs.pending == 'true'
        with:
          version: 2.101.0
      - name: Install the matching PostgreSQL 17 client
        if: steps.capture_turn.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          server_major="$(python3 -c "import re,pathlib;print(re.search(r'^major_version\\s*=\\s*(\\d+)', pathlib.Path('supabase/config.toml').read_text(), re.M).group(1))")"
          [[ "$server_major" == 17 ]]
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-$server_major"
          echo "GRIDEX_PG_DUMP=/usr/lib/postgresql/$server_major/bin/pg_dump" >> "$GITHUB_ENV"
          "/usr/lib/postgresql/$server_major/bin/pg_dump" --version
      - name: Capture authentic artifacts from the sourced clean replay
        if: steps.capture_turn.outputs.pending == 'true'
        shell: bash
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
          SOURCE_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export CAPTURE_CHECKOUT_SHA="$(git rev-parse HEAD)"
          export CAPTURE_CHECKOUT_TREE="$(git rev-parse 'HEAD^{tree}')"
          unset GRIDEX_REPLAY_DB_URL
          export CAPTURE_INPUT_STATE="$RUNNER_TEMP/staff-schema-capture-inputs.json"
          python3 - <<'PY_FREEZE'
          import hashlib, json, os, pathlib, re, shutil, stat, subprocess, urllib.request

          manifest = json.loads(pathlib.Path('scripts/supabase-types-manifest.json').read_text())
          sc031 = os.environ['SOURCE_HEAD_REF'] == 'codex/c2-gen-sc031-main795-20261014'
          sc046_runtime_v3 = os.environ['SOURCE_HEAD_REF'] == 'codex/c2-gen-sc046-v3-main6ce6-20261014'
          selected_sc046_epoch = manifest.get('active_sc046_input_epoch')
          sc046_v5 = sc046_runtime_v3 and selected_sc046_epoch == 'gridex-C2-SC046-GEN-20261015-v5'
          sc046_v4 = sc046_runtime_v3 and selected_sc046_epoch == 'gridex-C2-SC046-GEN-20261014-v4'
          if sc046_runtime_v3 and (selected_sc046_epoch not in (None, 'gridex-C2-SC046-GEN-20261014-v4', 'gridex-C2-SC046-GEN-20261015-v5')
              or (selected_sc046_epoch is None and ('active_sc046_input_epoch' in manifest or 'pending_sc046_capture_v4' in manifest or 'pending_sc046_capture_v5' in manifest))
              or (sc046_v4 and ('pending_sc046_capture_v4' not in manifest or 'pending_sc046_capture_v5' in manifest))
              or (sc046_v5 and 'pending_sc046_capture_v5' not in manifest)):
              raise SystemExit('capture_sc046_epoch_selector_not_bound')
          if os.environ['SOURCE_HEAD_REF'] in ('codex/c2-gen-sc046-v4-prepared-source-20261014', 'codex/c2-gen-sc046-v5-prepared-source-20261015'):
              raise SystemExit('capture_sc046_source_only_branch_not_runtime')
          sc046_v3 = sc046_runtime_v3 and not (sc046_v4 or sc046_v5)
          sc046 = sc046_v3 or sc046_v4 or sc046_v5 or os.environ['SOURCE_HEAD_REF'] == 'codex/c2-gen-sc046-main573-20261014'
          pending = manifest.get('pending_sc046_capture_v5' if sc046_v5 else ('pending_sc046_capture_v4' if sc046_v4 else ('pending_sc046_capture_v3' if sc046_v3 else ('pending_sc046_capture_v2' if sc046 else ('pending_sc031_capture' if sc031 else 'pending_joint_c3_capture')))), {})
          epoch = 'gridex-C2-SC046-GEN-20261015-v5' if sc046_v5 else ('gridex-C2-SC046-GEN-20261014-v4' if sc046_v4 else ('gridex-C2-SC046-GEN-20261014-v3' if sc046_v3 else ('gridex-C2-SC046-GEN-20261014-v2' if sc046 else ('gridex-C2-SC031-GEN-20261014-v1' if sc031 else 'gridex-C2-joint-C3-GEN-20261013-v3'))))
          producer_branch = 'codex/c2-gen-sc046-v3-main6ce6-20261014' if sc046_runtime_v3 else ('codex/c2-gen-sc046-main573-20261014' if sc046 else ('codex/c2-gen-sc031-main795-20261014' if sc031 else 'codex/c2-gen-joint-c3-20261013'))
          checkpoint = ('.agent-memory/takeover-C2-GEN-SC046-20261014-checkpoint.md' if sc046 else
                        ('.agent-memory/takeover-C2-GEN-SC031-20261014-checkpoint.md' if sc031
                         else '.agent-memory/takeover-C2-GEN-joint-C3-20261013-checkpoint.md'))
          own_branch = sc031 or sc046 or os.environ['SOURCE_HEAD_REF'] in ('codex/c2-gen-joint-c3-20261013', 'codex/c2-gen-esco-01a131d2')
          primary = own_branch and manifest.get('composition_capture_pending') is True and pending.get('input_epoch') == epoch
          corroboration = (own_branch and manifest.get('composition_capture_pending') is False
                           and (manifest.get('capture', {}).get('source_epoch_attestation', {}).get('custody', {}).get('input_epoch') == epoch
                                or (sc046_v4 and manifest.get('capture', {}).get('source_epoch_attestation', {}).get('custody', {}).get('input_epoch') == 'gridex-C2-SC046-GEN-20261014-v3')))
          if own_branch and not (primary or corroboration):
              raise SystemExit('capture_owned_epoch_unqualified')
          if not (primary or corroboration):
              pathlib.Path(os.environ['CAPTURE_INPUT_STATE']).write_text(json.dumps({'epoch_attestation_enabled': False}) + '\n')
