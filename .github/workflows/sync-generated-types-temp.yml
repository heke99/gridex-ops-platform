name: Temporary generated types sync

on:
  push:
    branches:
      - perf/platform-dashboard-rls-20260826
    paths:
      - .github/workflows/sync-generated-types-temp.yml

permissions:
  contents: write
  actions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/platform-dashboard-rls-20260826
          fetch-depth: 0

      - name: Download canonical clean replay artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9598268082/zip" \
            -o /tmp/clean-replay.zip
          mkdir -p /tmp/clean-replay
          unzip -q /tmp/clean-replay.zip -d /tmp/clean-replay
          test -f /tmp/clean-replay/rem002-database.types.ts
          printf '%s  %s\n' \
            '910b86196cd2f4bed2376afa9cc555302a837d2efe7d36e11abda3e904c1807a' \
            '/tmp/clean-replay/rem002-database.types.ts' | sha256sum -c -

      - name: Sync generated types and provenance
        run: |
          set -euo pipefail
          cp /tmp/clean-replay/rem002-database.types.ts supabase/database.types.ts
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'scripts/supabase-types-manifest.json'
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'))
          manifest.generated_at = new Date().toISOString()
          manifest.generated_with = 'supabase-cli-2.101.0-clean-replay'
          manifest.generated_types = 'supabase/database.types.ts'
          manifest.sha256 = '910b86196cd2f4bed2376afa9cc555302a837d2efe7d36e11abda3e904c1807a'
          manifest.latest_migration = '20260826093000_platform_dashboard_and_rls_read_performance.sql'
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`)
          NODE
          node scripts/check-supabase-generated-types.cjs

      - name: Commit canonical generated artifacts and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-generated-types-temp.yml
          git add supabase/database.types.ts scripts/supabase-types-manifest.json
          git commit -m 'chore: sync generated Supabase types for dashboard RPC'
          git push origin HEAD:perf/platform-dashboard-rls-20260826
