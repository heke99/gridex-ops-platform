name: Sync PR283 clean replay types

on:
  push:
    branches:
      - fix/production-facility-switch-flow-20260902
    paths:
      - .github/workflows/sync-pr283-clean-replay-types.yml

permissions:
  contents: write
  actions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-facility-switch-flow-20260902
          fetch-depth: 0

      - name: Download authoritative clean-replay artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9867074405/zip" \
            -o /tmp/pr283-clean-replay.zip
          rm -rf /tmp/pr283-clean-replay
          mkdir -p /tmp/pr283-clean-replay
          unzip -q /tmp/pr283-clean-replay.zip -d /tmp/pr283-clean-replay

      - name: Verify and sync generated types
        run: |
          set -euo pipefail
          GENERATED=/tmp/pr283-clean-replay/rem002-database.types.ts
          EXPECTED=92e8f0a5b9782a98e46325b46e1102e0a7edfe2c6231fc77eff3b24e459e3f13
          test -f "$GENERATED"
          ACTUAL="$(sha256sum "$GENERATED" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          cp "$GENERATED" supabase/database.types.ts
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('scripts/supabase-types-manifest.json')
          data = json.loads(p.read_text())
          data['supabaseTypesSha256'] = '92e8f0a5b9782a98e46325b46e1102e0a7edfe2c6231fc77eff3b24e459e3f13'
          data['syncedAt'] = '2026-09-02T21:18:00Z'
          data['sourceCommit'] = 'PR #283 clean empty-database replay artifact from workflow run 33683021051'
          data['intent'] = 'Commit the authoritative generated Supabase public types after canonical clean replay converged supplier identity schema with production.'
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
          test "$(sha256sum supabase/database.types.ts | awk '{print $1}')" = "$EXPECTED"

      - name: Commit generated parity and remove helper workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-pr283-clean-replay-types.yml
          git add supabase/database.types.ts scripts/supabase-types-manifest.json
          git commit -m "Sync clean replay Supabase types"
          git push origin HEAD:fix/production-facility-switch-flow-20260902
