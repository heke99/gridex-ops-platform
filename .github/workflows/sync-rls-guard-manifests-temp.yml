name: Temporary RLS guard manifest sync

on:
  push:
    branches:
      - perf/platform-dashboard-rls-20260826
    paths:
      - supabase/migrations/20260826103000_electricity_suppliers_masterdata_rls_guard.sql
      - .github/workflows/sync-rls-guard-manifests-temp.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/platform-dashboard-rls-20260826
          fetch-depth: 0

      - name: Register migration checksum and advance types provenance tail
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('node:crypto')
          const fs = require('node:fs')
          const migration = '20260826103000_electricity_suppliers_masterdata_rls_guard.sql'
          const migrationPath = `supabase/migrations/${migration}`
          const additionsPath = 'scripts/migration-history-manifest.additions.json'
          const typesManifestPath = 'scripts/supabase-types-manifest.json'

          const checksum = crypto.createHash('sha256').update(fs.readFileSync(migrationPath)).digest('hex')
          const additions = JSON.parse(fs.readFileSync(additionsPath, 'utf8'))
          additions.files = additions.files || {}
          additions.files[migration] = checksum
          additions.files = Object.fromEntries(Object.entries(additions.files).sort(([a], [b]) => a.localeCompare(b)))
          fs.writeFileSync(additionsPath, `${JSON.stringify(additions, null, 2)}\n`)

          const typesManifest = JSON.parse(fs.readFileSync(typesManifestPath, 'utf8'))
          typesManifest.latest_migration = migration
          fs.writeFileSync(typesManifestPath, `${JSON.stringify(typesManifest, null, 2)}\n`)
          console.log(`Registered ${migration}: ${checksum}`)
          NODE
          node scripts/check-migration-versions.cjs
          node scripts/check-supabase-generated-types.cjs

      - name: Commit canonical manifests and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-rls-guard-manifests-temp.yml
          git add scripts/migration-history-manifest.additions.json scripts/supabase-types-manifest.json
          git commit -m 'chore: register electricity supplier RLS guard migration'
          git push origin HEAD:perf/platform-dashboard-rls-20260826
