name: T2 disposable TERM runtime
on:
  pull_request:
    paths:
      - '.github/workflows/t2-term-disposable.yml'
      - 'scripts/simulation/track2/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -B scripts/simulation/track2/hosted/qualification.test.py
      - run: bash -n scripts/simulation/track2/{up,run,down}.sh scripts/simulation/track2/lib/common.sh scripts/simulation/track2/hosted/{prepare,cleanup}.sh
  allocation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      run-id: ${{ github.run_id }}
      source-head: ${{ github.sha }}
    steps:
      - name: Expose invocation identity for T2 admission binding
        env:
          RUN_ID: ${{ github.run_id }}
          SOURCE_HEAD: ${{ github.sha }}
        run: printf 'T2 invocation %s source %s; backend not provisioned\n' "$RUN_ID" "$SOURCE_HEAD"
  term:
    if: github.event_name == 'workflow_dispatch'
    needs: [source-contracts, allocation]
    runs-on: ubuntu-24.04
    environment: t2-qualified-disposable
    timeout-minutes: 150
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SIM_REQUIRE_ACTOR_RECEIPT: '1'
      NODE_OPTIONS: --max-old-space-size=6144
      SIM_RUNTIME_ASSIGNMENT_FILE: ${{ runner.temp }}/t2-admission.json
      SIM_HOME: ${{ runner.temp }}/t2-runtime
      RUN_DIR: ${{ github.workspace }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 2.101.0
      - name: Install matching PostgreSQL clients
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsS --retry 3 --connect-timeout 10 --max-time 30 \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: Receive private run-bound admission
        shell: bash
        env:
          T2_ADMISSION_B64: ${{ secrets.T2_ADMISSION_B64 }}
          T2_ADMISSION_SIGNATURE_B64: ${{ secrets.T2_ADMISSION_SIGNATURE_B64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          for variable, suffix in [('T2_ADMISSION_B64', ''), ('T2_ADMISSION_SIGNATURE_B64', '.sig')]:
              value = base64.b64decode(os.environ[variable], validate=True)
              descriptor = os.open(os.environ['SIM_RUNTIME_ASSIGNMENT_FILE'] + suffix,
                                   os.O_CREAT | os.O_EXCL | os.O_WRONLY | os.O_NOFOLLOW, 0o600)
              with os.fdopen(descriptor, 'wb') as stream:
                  stream.write(value)
          PY
      - name: Authenticate source before dependency scripts
        run: python3 -B scripts/simulation/track2/hosted/qualify-runtime.py --operation check-source
      - name: Exact lock dependencies
        run: npm ci
      - name: Prepare and qualify on this dedicated host
        shell: bash
        run: |
          # No raw replay/build/assignment output enters Actions logs/artifacts.
          umask 077
          if ! bash scripts/simulation/track2/hosted/prepare.sh --execute > "$RUNNER_TEMP/t2-prepare.private.log" 2>&1; then
            echo 'T2 preparation HOLD; private evidence retained on this host'
            exit 1
          fi
      - name: Execute exactly the admitted scenario
        shell: bash
        run: |
          umask 077
          if ! python3 -B scripts/simulation/track2/hosted/qualify-runtime.py --operation scenario > "$RUNNER_TEMP/t2-scenario.private.log" 2>&1; then
            echo 'T2 scenario failed; no acceptance claimed'
            exit 1
          fi
          if ! python3 -B scripts/simulation/track2/hosted/qualify-runtime.py --operation actor-proof > "$RUNNER_TEMP/t2-actors.private.log" 2>&1; then
            echo 'T2 per-case actor evidence HOLD; no acceptance claimed'
            exit 1
          fi
      - name: Always clean exact owned resources on this host
        if: always()
        shell: bash
        run: |
          umask 077
          if [[ -f "$SIM_RUNTIME_ASSIGNMENT_FILE" && -f "$SIM_RUNTIME_ASSIGNMENT_FILE.sig" ]]; then
            if ! bash scripts/simulation/track2/down.sh --full > "$RUNNER_TEMP/t2-cleanup.private.log" 2>&1; then
              echo 'T2 cleanup HOLD; no blanket deletion; private journal retained'
              exit 1
            fi
          fi
      - name: Create strictly allowlisted safe summary
        if: always()
        run: python3 -B scripts/simulation/track2/hosted/qualify-runtime.py --operation safe-summary
      - name: Export only safe review receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: t2-safe-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/t2-safe-receipt.json
          if-no-files-found: error
          retention-days: 7
      # No raw logs, keys, fixtures or assignment/receipt journals are uploaded.
