name: Target contract go-live regression v2

on:
  push:
    branches:
      - test/contract-go-live-target-v2-20260901

permissions:
  contents: read

jobs:
  invoice-live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run isolated Fakturatest E66 to invoice
        env:
          GRIDEX_E2E_ACTOR_USER_ID: ${{ secrets.GRIDEX_E2E_ACTOR_USER_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.GRIDEX_E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: gridex-test-harness-required-public-key-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.GRIDEX_E2E_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx vitest run __tests__/invoice-test-live-e2e-20260901.test.ts --reporter=verbose
