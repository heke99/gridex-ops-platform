name: Temporary Supabase type regeneration

on:
  push:
    branches:
      - perf/customer-status-aggregate-20260825

permissions:
  contents: write
  actions: read

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/customer-status-aggregate-20260825
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: gridex-rem-002-clean-replay
          path: /tmp/gridex-rem002
          repository: heke99/gridex-ops-platform
          run-id: 32905810471
          github-token: ${{ github.token }}

      - name: Verify and install generated types
        shell: bash
        run: |
          set -euo pipefail
          GENERATED=/tmp/gridex-rem002/rem002-database.types.ts
          test -f "$GENERATED"
          ACTUAL="$(sha256sum "$GENERATED" | awk '{print $1}')"
          EXPECTED="5b87521c05156255a26fe73794580ca12085bcf0f29b2dd1740281d80697f21a"
          test "$ACTUAL" = "$EXPECTED"
          cp "$GENERATED" supabase/database.types.ts
          node - <<'NODE'
          const fs = require('fs')
          const path = 'scripts/supabase-types-manifest.json'
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'))
          manifest.generated_at = new Date().toISOString()
          manifest.generated_with = 'supabase-cli-2.101.0-clean-replay'
          manifest.sha256 = '5b87521c05156255a26fe73794580ca12085bcf0f29b2dd1740281d80697f21a'
          manifest.latest_migration = '20260825235900_gridex_customer_status_counts_v1.sql'
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`)
          NODE
          test "$(sha256sum supabase/database.types.ts | awk '{print $1}')" = "$EXPECTED"

      - name: Commit exact replay output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/database.types.ts scripts/supabase-types-manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: regenerate Supabase types [types-generated]"
          git push origin HEAD:perf/customer-status-aggregate-20260825
