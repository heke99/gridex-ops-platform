name: Temporary settlement contract patch release

on:
  push:
    branches:
      - fix/openapi-settlement-contract-20260822
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/openapi-settlement-contract-20260822
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply authoritative settlement contract patch
        run: python scripts/temp-patch-settlement-release.py
      - name: Generate immutable OpenAPI patch release
        run: |
          npm run api:finalize
          npm run api:materialize
      - name: Verify release and targeted runtime contract
        run: |
          npm run api:compatibility
          npm run api:release:verify
          npx vitest run __tests__/website-application-settlement-contract.test.ts __tests__/website-settlement-model.test.ts __tests__/website-quote-validate-contract-parity.test.ts
          npm run typecheck
      - name: Remove temporary executors and commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-settlement-contract-release.yml scripts/temp-patch-settlement-release.py
          git add -A
          git commit -m "fix(api): publish satisfiable settlement contract 2026-08-22.2"
          git push origin HEAD:fix/openapi-settlement-contract-20260822
