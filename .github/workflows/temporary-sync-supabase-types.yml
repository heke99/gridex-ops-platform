name: Temporary sync Supabase types

on:
  push:
    branches:
      - feat/tenant-integrity-auditor-v1
    paths:
      - .github/workflows/temporary-sync-supabase-types.yml

permissions:
  contents: write
  actions: read

jobs:
  sync-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tenant-integrity-auditor-v1
          fetch-depth: 1
      - name: Download verified clean-replay artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/rem002
          mkdir -p /tmp/rem002
          gh run download 33085270224 \
            --repo heke99/gridex-ops-platform \
            --name gridex-rem-002-clean-replay \
            --dir /tmp/rem002
          test -s /tmp/rem002/rem002-database.types.ts
          actual_sha="$(sha256sum /tmp/rem002/rem002-database.types.ts | awk '{print $1}')"
          expected_sha="b71e6f97363e1fd3d041327443d1ba0d042614a3c49c01524a21dd95bf78f848"
          test "$actual_sha" = "$expected_sha"
          cp /tmp/rem002/rem002-database.types.ts supabase/database.types.ts
      - name: Update generated-types manifest
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'scripts/supabase-types-manifest.json'
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'))
          manifest.generated_at = new Date().toISOString()
          manifest.generated_with = 'supabase-cli-2.101.0-clean-replay'
          manifest.sha256 = 'b71e6f97363e1fd3d041327443d1ba0d042614a3c49c01524a21dd95bf78f848'
          manifest.latest_migration = '20260827135630_tenant_integrity_requested_by_fk_index.sql'
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n')
          NODE
          node scripts/check-supabase-generated-types.cjs
      - name: Commit exact generated types
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/database.types.ts scripts/supabase-types-manifest.json
          if git diff --cached --quiet; then
            echo "No generated type changes to commit."
            exit 0
          fi
          git commit -m "Regenerate Supabase types for tenant integrity schema"
          git push origin HEAD:feat/tenant-integrity-auditor-v1
