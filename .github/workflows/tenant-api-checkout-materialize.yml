name: Tenant API checkout materialization

on:
  push:
    branches:
      - codex/tenant-website-checkout-contract-20260819

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/tenant-website-checkout-contract-20260819
          fetch-depth: 0

      - name: Apply source remediation
        run: |
          set -euo pipefail
          node scripts/tenant-api-checkout-remediation.cjs
          node scripts/tenant-api-release-remediation.cjs
          node scripts/tenant-api-manifest-remediation.cjs

      - name: Finalize and materialize OpenAPI release
        run: |
          set -euo pipefail
          node scripts/finalize-openapi-release.cjs
          node scripts/materialize-openapi-release.cjs

      - name: Commit materialized remediation
        run: |
          set -euo pipefail
          rm scripts/tenant-api-checkout-remediation.cjs
          rm scripts/tenant-api-release-remediation.cjs
          rm scripts/tenant-api-manifest-remediation.cjs
          rm .github/workflows/tenant-api-checkout-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No materialized changes"
            exit 0
          fi
          git commit -m "feat: canonical tenant checkout result and faster API delivery"
          git push origin HEAD:codex/tenant-website-checkout-contract-20260819
