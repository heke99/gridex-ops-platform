name: Tenant integrity regression

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'lib/tenant/integrity.ts'
      - 'lib/tenant/scope.ts'
      - 'lib/tenant/lifecycle.ts'
      - 'lib/tenant/operationPolicy.ts'
      - 'lib/integrations/apiAuth.ts'
      - 'lib/integrations/webhooks.ts'
      - 'lib/email/emailOutbox.ts'
      - 'lib/ediel/orchestrator.ts'
      - 'app/admin/companies/**'
      - 'app/admin/system/tenant-integrity/**'
      - 'scripts/gridex-tenant-integrity-regression.cjs'
      - 'scripts/gridex-tenant-shutdown-regression.cjs'
      - 'lib/supabase/service.ts'
      - 'lib/supabase/tenantDb.ts'
      - 'lib/admin/guards.ts'
      - 'lib/admin/apiGuards.ts'
      - 'scripts/check-service-role-tenant-ratchet.cjs'
      - 'scripts/service-role-tenant-ratchet.json'
      - 'scripts/sql/tenant-isolation-invariants.sql'
      - 'supabase/schema.sql'
      - 'scripts/tenant-fk-inventory.mjs'
      - 'scripts/sql/tenant-fk-inventory.sql'
      - 'quality/audits/ediel-masterplan-v2/tenant-fk-baseline.json'
      - '__tests__/tenant-fk-ratchet.test.ts'
      - '.github/workflows/tenant-integrity-regression.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'lib/tenant/integrity.ts'
      - 'lib/tenant/scope.ts'
      - 'lib/tenant/lifecycle.ts'
      - 'lib/tenant/operationPolicy.ts'
      - 'lib/integrations/apiAuth.ts'
      - 'lib/integrations/webhooks.ts'
      - 'lib/email/emailOutbox.ts'
      - 'lib/ediel/orchestrator.ts'
      - 'app/admin/companies/**'
      - 'app/admin/system/tenant-integrity/**'
      - 'scripts/gridex-tenant-integrity-regression.cjs'
      - 'scripts/gridex-tenant-shutdown-regression.cjs'
      - 'lib/supabase/service.ts'
      - 'lib/supabase/tenantDb.ts'
      - 'lib/admin/guards.ts'
      - 'lib/admin/apiGuards.ts'
      - 'scripts/check-service-role-tenant-ratchet.cjs'
      - 'scripts/service-role-tenant-ratchet.json'
      - 'scripts/sql/tenant-isolation-invariants.sql'
      - 'supabase/schema.sql'
      - 'scripts/tenant-fk-inventory.mjs'
      - 'scripts/sql/tenant-fk-inventory.sql'
      - 'quality/audits/ediel-masterplan-v2/tenant-fk-baseline.json'
      - '__tests__/tenant-fk-ratchet.test.ts'
      - '.github/workflows/tenant-integrity-regression.yml'

permissions:
  contents: read

jobs:
  tenant-integrity-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify tenant integrity contracts
        run: node scripts/gridex-tenant-integrity-regression.cjs
      - name: Verify tenant shutdown contracts
        run: node scripts/gridex-tenant-shutdown-regression.cjs
      # F-15: service_role bypasses RLS, so every direct call site carries tenant
      # isolation on its own. The count may fall but never rise; new tenant-scoped
      # queries use tenantDb(companyId) from lib/supabase/tenantDb.
      - name: Service-role tenant ratchet
        run: node scripts/check-service-role-tenant-ratchet.cjs
      # DB-02: single-column tenant->tenant FKs may only decrease. New links use a
      # composite (company_id, <ref>_id) FK onto UNIQUE (company_id, id).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Tenant FK ratchet gate (self-test)
        run: npx vitest run __tests__/tenant-fk-ratchet.test.ts
      - name: Tenant FK ratchet (supabase/schema.sql snapshot via PGlite)
        run: npm run db:tenant-fk:check
