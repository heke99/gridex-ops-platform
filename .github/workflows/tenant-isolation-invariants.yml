name: Tenant isolation invariants

# Runs scripts/sql/tenant-isolation-invariants.sql against a real database.
#
# Every check exists because a finding from the 2026-09-02 audit got through
# without one: an unclassified table, a client-reachable tenant table with no
# company guard, a tenant row with no tenant, a unique business key that is not
# company-scoped, a view without security_invoker, a policy targeting a role that
# cannot reach its table, or a role whose platform/company scope is inconsistent.
#
# The gate needs a live schema, so it follows the same shape as the canonical
# quote DB release gate: manual dispatch with an explicit confirmation, or called
# from another workflow.

on:
  workflow_dispatch:
    inputs:
      confirm_gate:
        description: Type GRIDEX_OPS_TENANT_INVARIANTS to run the gate
        required: true
        type: string
  workflow_call:
  schedule:
    # weekly drift check, so an invariant that erodes between releases is caught
    - cron: '0 5 * * 1'

permissions:
  contents: read

env:
  DATABASE_URL: ${{ secrets.GRIDEX_OPS_DATABASE_URL || secrets.DATABASE_URL || secrets.SUPABASE_DB_URL || secrets.POSTGRES_URL_NON_POOLING || secrets.POSTGRES_URL }}

jobs:
  tenant-isolation-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-e2e
    steps:
      - name: Require explicit manual confirmation when dispatched
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.confirm_gate }}" == "GRIDEX_OPS_TENANT_INVARIANTS" ]] || {
            echo 'confirm_gate must be GRIDEX_OPS_TENANT_INVARIANTS' >&2
            exit 1
          }

      - name: Require database credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${DATABASE_URL:-}" ]] || {
            echo 'Missing GRIDEX_OPS_DATABASE_URL/DATABASE_URL/SUPABASE_DB_URL/POSTGRES_URL secret.' >&2
            exit 1
          }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Assert tenant isolation invariants
        run: node scripts/run-tenant-sql.mjs scripts/sql/tenant-isolation-invariants.sql
