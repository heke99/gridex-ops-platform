name: tenant-post-auth-patcher

on:
  push:
    branches:
      - fix/tenant-scoped-post-auth-applications-20260820

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[tenant-post-auth-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/tenant-scoped-post-auth-applications-20260820

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch tenant-scoped post-auth flow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected patch block missing in {path}")
              p.write_text(text.replace(old, new, 1))

          process = "lib/website/customerApplicationProcess.ts"
          replace_once(process, '''  const authUserId = clean(body.auth_user_id);\n  const customerPortalUserId = clean(body.customer_portal_user_id);\n  if (!authUserId || !customerPortalUserId) {\n    return failureResponse(\n      new WebsiteApplicationError({\n        message:\n          "auth_user_id och customer_portal_user_id krävs och ska komma från samma verifierade serversession i tenantens Mina sidor.",\n        status: 422,\n        code: "portal_auth_identity_required",\n        field: "customer_portal_user_id",\n        stage: "validation",\n        hint: "Skapa eller verifiera användaren i tenantens egen auth innan webbansökan skickas.",\n      }),\n    );\n  }\n  if (\n    authUserId !== customerPortalUserId ||\n    !isUuid(authUserId) ||\n    !isUuid(customerPortalUserId)\n  ) {\n    return failureResponse(\n      new WebsiteApplicationError({\n        message:\n          "auth_user_id och customer_portal_user_id måste vara samma UUID från den verifierade serversessionen.",\n        status: 422,\n        code: "portal_auth_identity_mismatch",\n        field: "customer_portal_user_id",\n        stage: "validation",\n      }),\n    );\n  }\n''', '''  const authUserId = clean(body.auth_user_id);\n  const customerPortalUserId = clean(body.customer_portal_user_id);\n  const tenantIdentityPolicyResult = await supabaseService\n    .from("companies")\n    .select("metadata")\n    .eq("id", input.client.company_id)\n    .maybeSingle();\n  if (tenantIdentityPolicyResult.error || !tenantIdentityPolicyResult.data) {\n    return failureResponse(\n      new WebsiteApplicationError({\n        message: "Tenantens policy för Mina sidor-identitet kunde inte verifieras.",\n        status: 503,\n        code: "tenant_identity_policy_unavailable",\n        stage: "validation",\n        details: { retryable: true },\n      }),\n    );\n  }\n  const tenantMetadata =\n    tenantIdentityPolicyResult.data.metadata &&\n    typeof tenantIdentityPolicyResult.data.metadata === "object" &&\n    !Array.isArray(tenantIdentityPolicyResult.data.metadata)\n      ? (tenantIdentityPolicyResult.data.metadata as Record<string, unknown>)\n      : {};\n  const portalIdentitySubmissionMode =\n    clean(tenantMetadata.website_portal_identity_mode)?.toLowerCase() ===\n    "post_auth_allowed"\n      ? "post_auth_allowed"\n      : "pre_auth_required";\n\n  if ((authUserId && !customerPortalUserId) || (!authUserId && customerPortalUserId)) {\n    return failureResponse(\n      new WebsiteApplicationError({\n        message:\n          "auth_user_id och customer_portal_user_id måste skickas tillsammans när portalidentitet anges.",\n        status: 422,\n        code: "website_portal_identity_pair_required",\n        field: "customer_portal_user_id",\n        stage: "validation",\n      }),\n    );\n  }\n  if (\n    !authUserId &&\n    !customerPortalUserId &&\n    portalIdentitySubmissionMode === "pre_auth_required"\n  ) {\n    return failureResponse(\n      new WebsiteApplicationError({\n        message:\n          "Denna tenant kräver auth_user_id och customer_portal_user_id från samma verifierade serversession före tecknande.",\n        status: 422,\n        code: "portal_auth_identity_required",\n        field: "customer_portal_user_id",\n        stage: "validation",\n        hint: "Verifiera användaren i tenantens egen auth innan webbansökan skickas, eller ändra tenantens uttryckliga portalpolicy till post_auth_allowed.",\n      }),\n    );\n  }\n  if (\n    authUserId &&\n    customerPortalUserId &&\n    (authUserId !== customerPortalUserId ||\n      !isUuid(authUserId) ||\n      !isUuid(customerPortalUserId))\n  ) {\n    return failureResponse(\n      new WebsiteApplicationError({\n        message:\n          "auth_user_id och customer_portal_user_id måste vara samma UUID från den verifierade serversessionen.",\n        status: 422,\n        code: "portal_auth_identity_mismatch",\n        field: "customer_portal_user_id",\n        stage: "validation",\n      }),\n    );\n  }\n''')

          replace_once(process, '''    const identity = await stage("portal_identity_create", () =>\n      upsertPortalIdentity({\n        client: input.client,\n        customerId: resolvedCustomerResult.customer.id,\n        externalCustomerId,\n        externalAccountId:\n          clean(body.external_account_id) ??\n          clean(body.customer_portal_user_id) ??\n          clean(body.auth_user_id) ??\n          clean(body.web_auth_user_id),\n        authUserId:\n          clean(body.auth_user_id) ??\n          clean(body.web_auth_user_id) ??\n          clean(body.customer_portal_user_id),\n        customerPortalUserId:\n          clean(body.customer_portal_user_id) ??\n          clean(body.auth_user_id) ??\n          clean(body.web_auth_user_id),\n        customerNumber,\n        email: normalizedEmail(body.customer.email),\n      }),\n    );\n\n    const portalUserId =\n      clean(body.customer_portal_user_id) ??\n      clean(body.auth_user_id) ??\n      clean(body.web_auth_user_id) ??\n      clean(body.external_account_id);\n    if (!portalUserId) {\n      throw new WebsiteApplicationError({\n        message: "Mina sidor-identiteten saknas efter validering.",\n        status: 500,\n        code: "portal_auth_identity_missing_after_validation",\n        stage: "portal_user_link",\n        details: { retryable: false },\n      });\n    }\n    const portalLink = await stage("portal_user_link", () =>\n      ensureCustomerPortalUserLink({\n        client: input.client,\n        customerId: resolvedCustomerResult.customer.id,\n        userId: portalUserId,\n        email: normalizedEmail(body.customer.email),\n        externalCustomerId,\n        customerNumber,\n        identityId: identity.id,\n        matchMethod: "website_application_auth_user",\n      }),\n    );\n    if (!portalLink?.accountId || !portalLink.identityId) {\n      throw new WebsiteApplicationError({\n        message: "Kundens Mina sidor-koppling kunde inte verifieras efter att kundgrafen skapades.",\n        status: 503,\n        code: "customer_portal_link_not_ready",\n        stage: "portal_user_link",\n        details: { retryable: true },\n        hint: "Kontrollera customer_portal_accounts, customer_portal_identities och kör om fortsättningssteget.",\n      });\n    }\n''', '''    const identity = await stage("portal_identity_create", () =>\n      upsertPortalIdentity({\n        client: input.client,\n        customerId: resolvedCustomerResult.customer.id,\n        externalCustomerId,\n        externalAccountId:\n          clean(body.external_account_id) ??\n          clean(body.customer_portal_user_id) ??\n          clean(body.auth_user_id) ??\n          clean(body.web_auth_user_id),\n        authUserId:\n          clean(body.auth_user_id) ??\n          clean(body.web_auth_user_id) ??\n          clean(body.customer_portal_user_id),\n        customerPortalUserId:\n          clean(body.customer_portal_user_id) ??\n          clean(body.auth_user_id) ??\n          clean(body.web_auth_user_id),\n        customerNumber,\n        email: normalizedEmail(body.customer.email),\n        applicationId: applicationRowId,\n      }),\n    );\n\n    const portalUserId =\n      clean(body.customer_portal_user_id) ??\n      clean(body.auth_user_id) ??\n      clean(body.web_auth_user_id);\n    let portalIdentityStatus: "linked" | "pending_auth" = "pending_auth";\n    if (portalUserId) {\n      const portalLink = await stage("portal_user_link", () =>\n        ensureCustomerPortalUserLink({\n          client: input.client,\n          customerId: resolvedCustomerResult.customer.id,\n          userId: portalUserId,\n          email: normalizedEmail(body.customer.email),\n          externalCustomerId,\n          customerNumber,\n          identityId: identity.id,\n          matchMethod: "website_application_auth_user",\n        }),\n      );\n      if (!portalLink?.accountId || !portalLink.identityId) {\n        throw new WebsiteApplicationError({\n          message: "Kundens Mina sidor-koppling kunde inte verifieras efter att kundgrafen skapades.",\n          status: 503,\n          code: "customer_portal_link_not_ready",\n          stage: "portal_user_link",\n          details: { retryable: true },\n          hint: "Kontrollera customer_portal_accounts, customer_portal_identities och kör om fortsättningssteget.",\n        });\n      }\n      portalIdentityStatus = "linked";\n    }\n''')

          replace_once(process, '''      portal_identity_id: identity.id,\n      customer_site_id: site?.id ?? null,\n''', '''      portal_identity_id: identity.id,\n      portal_identity_status: portalIdentityStatus,\n      portal_identity_required: true,\n      portal_identity_submission_mode: portalIdentitySubmissionMode,\n      customer_site_id: site?.id ?? null,\n''')

          persistence = "lib/website/customerApplicationPersistence.ts"
          replace_once(persistence, '''  const customerId = input.existing.customer_id ?? clean(response.customer_id);\n  const customerNumber = input.existing.customer_number ?? clean(response.customer_number);\n  const siteId = input.existing.customer_site_id ?? clean(response.customer_site_id);\n  const meteringPointId = input.existing.metering_point_id ?? clean(response.metering_point_id);\n  const contractId = input.existing.contract_id ?? clean(response.contract_id);\n  const portalUserId = clean(input.body.customer_portal_user_id) ?? clean(input.body.auth_user_id);\n  if (!customerId || !customerNumber || !contractId || !portalUserId) return null;\n  if (expectsSiteOrMetering(input.body) && !siteId) return null;\n\n  const identity = await upsertPortalIdentity({\n    client: input.client,\n    customerId,\n    externalCustomerId: input.externalCustomerId,\n    externalAccountId: portalUserId,\n    authUserId: portalUserId,\n    customerPortalUserId: portalUserId,\n    customerNumber,\n    email: normalizedEmail(input.body.customer.email),\n    applicationId: input.existing.id,\n  });\n  const portalLink = await ensureCustomerPortalUserLink({\n    client: input.client,\n    customerId,\n    userId: portalUserId,\n    email: normalizedEmail(input.body.customer.email),\n    externalCustomerId: input.externalCustomerId,\n    customerNumber,\n    identityId: identity.id,\n    matchMethod: "website_application_idempotent_resume",\n  });\n  if (!portalLink?.accountId || !portalLink.identityId) {\n    throw new Error("customer_portal_link_not_ready_for_resume");\n  }\n''', '''  const customerId = input.existing.customer_id ?? clean(response.customer_id);\n  const customerNumber = input.existing.customer_number ?? clean(response.customer_number);\n  const siteId = input.existing.customer_site_id ?? clean(response.customer_site_id);\n  const meteringPointId = input.existing.metering_point_id ?? clean(response.metering_point_id);\n  const contractId = input.existing.contract_id ?? clean(response.contract_id);\n  const portalUserId = clean(input.body.customer_portal_user_id) ?? clean(input.body.auth_user_id);\n  if (!customerId || !customerNumber || !contractId) return null;\n  if (expectsSiteOrMetering(input.body) && !siteId) return null;\n\n  let portalIdentityId = clean(response.portal_identity_id);\n  if (portalUserId) {\n    const identity = await upsertPortalIdentity({\n      client: input.client,\n      customerId,\n      externalCustomerId: input.externalCustomerId,\n      externalAccountId: portalUserId,\n      authUserId: portalUserId,\n      customerPortalUserId: portalUserId,\n      customerNumber,\n      email: normalizedEmail(input.body.customer.email),\n      applicationId: input.existing.id,\n    });\n    const portalLink = await ensureCustomerPortalUserLink({\n      client: input.client,\n      customerId,\n      userId: portalUserId,\n      email: normalizedEmail(input.body.customer.email),\n      externalCustomerId: input.externalCustomerId,\n      customerNumber,\n      identityId: identity.id,\n      matchMethod: "website_application_idempotent_resume",\n    });\n    if (!portalLink?.accountId || !portalLink.identityId) {\n      throw new Error("customer_portal_link_not_ready_for_resume");\n    }\n    portalIdentityId = portalLink.identityId;\n  } else if (!portalIdentityId) {\n    const identity = await upsertPortalIdentity({\n      client: input.client,\n      customerId,\n      externalCustomerId: input.externalCustomerId,\n      customerNumber,\n      email: normalizedEmail(input.body.customer.email),\n      applicationId: input.existing.id,\n    });\n    portalIdentityId = identity.id;\n  }\n  if (!portalIdentityId) throw new Error("customer_portal_identity_not_ready_for_resume");\n''')

          replace_once(persistence, '''    portal_identity_id: portalLink.identityId,\n    workflow_id: workflow.workflowId,\n''', '''    portal_identity_id: portalIdentityId,\n    portal_identity_status: portalUserId ? "linked" : "pending_auth",\n    workflow_id: workflow.workflowId,\n''')

          readiness = "lib/integrations/tenantWebsiteReadiness.ts"
          replace_once(readiness, '''  branding?: JsonRecord | null\n  portal_url_schema_ready: boolean\n''', '''  branding?: JsonRecord | null\n  metadata?: JsonRecord | null\n  portal_url_schema_ready: boolean\n''')
          replace_once(readiness, '''  portal_identity_required: true\n  portal_url: string | null\n''', '''  portal_identity_required: true\n  portal_identity_submission_mode: 'pre_auth_required' | 'post_auth_allowed'\n  portal_url: string | null\n''')
          replace_once(readiness, '''    .select('id,status,external_tenant_reference,customer_portal_url,website,branding')\n''', '''    .select('id,status,external_tenant_reference,customer_portal_url,website,branding,metadata')\n''')
          replace_once(readiness, '''    .select('id,status,external_tenant_reference,website,branding')\n''', '''    .select('id,status,external_tenant_reference,website,branding,metadata')\n''')
          replace_once(readiness, '''  const branding = jsonRecord(company?.branding)\n  const canonicalPortalUrl = normalizePortalUrl(company?.customer_portal_url)\n''', '''  const branding = jsonRecord(company?.branding)\n  const tenantMetadata = jsonRecord(company?.metadata)\n  const portalIdentitySubmissionMode =\n    clean(tenantMetadata.website_portal_identity_mode)?.toLowerCase() === 'post_auth_allowed'\n      ? 'post_auth_allowed'\n      : 'pre_auth_required'\n  const canonicalPortalUrl = normalizePortalUrl(company?.customer_portal_url)\n''')
          replace_once(readiness, '''    portal_identity_required: true,\n    portal_url: portalUrl,\n''', '''    portal_identity_required: true,\n    portal_identity_submission_mode: portalIdentitySubmissionMode,\n    portal_url: portalUrl,\n''')

          route = "app/api/v1/website/customer-applications/route.ts"
          replace_once(route, '''            portal_identity_required: readiness.portal_identity_required,\n            status_delivery_modes: readiness.status_delivery_modes,\n''', '''            portal_identity_required: readiness.portal_identity_required,\n            portal_identity_submission_mode: readiness.portal_identity_submission_mode,\n            status_delivery_modes: readiness.status_delivery_modes,\n''')

          Path("docs/release/2026-08-20-tenant-scoped-post-auth-website-applications.md").write_text('''# Tenant-scoped post-auth website applications\n\nWebsite checkout identity timing is now an explicit per-tenant policy. The authenticated API credential remains the only tenant authority; client-supplied `company_id`, `tenant_id`, or aliases are never authoritative.\n\n- `pre_auth_required` preserves the previous behaviour: `auth_user_id` and `customer_portal_user_id` must be the same verified UUID before checkout.\n- `post_auth_allowed` permits checkout without a portal session. OPS still creates the tenant-scoped customer/contract/application graph and an unlinked portal identity projection. The real authenticated portal user is linked later through the customer portal resolver/sync flow inside the same `company_id`.\n- If either portal identifier is supplied, both are required and must match. Anonymous mode is never a partial or mismatched identity bypass.\n- The submission-time mode is frozen on `website_customer_applications.portal_identity_submission_mode` so later tenant policy changes cannot invalidate historical applications.\n- Composite database foreign keys bind website applications, portal identities, portal accounts, API clients, customers, sites, metering points and contracts to the same tenant.\n\nGridex is configured as `post_auth_allowed`; other tenants retain the safe `pre_auth_required` default until explicitly configured.\n''')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify types and targeted tenant flow
        run: |
          npm run typecheck
          node scripts/gridex-multitenant-website-application-flow-regression.cjs

      - name: Commit patched implementation
        shell: bash
        run: |
          rm .github/workflows/tenant-post-auth-patcher.yml
          git config user.name "gridex-automation"
          git config user.email "actions@users.noreply.github.com"
          git add lib/website/customerApplicationProcess.ts \
                  lib/website/customerApplicationPersistence.ts \
                  lib/integrations/tenantWebsiteReadiness.ts \
                  app/api/v1/website/customer-applications/route.ts \
                  docs/release/2026-08-20-tenant-scoped-post-auth-website-applications.md \
                  .github/workflows/tenant-post-auth-patcher.yml
          git commit -m "Support tenant-scoped post-auth website applications [tenant-post-auth-patched]"
          git push origin HEAD:fix/tenant-scoped-post-auth-applications-20260820
