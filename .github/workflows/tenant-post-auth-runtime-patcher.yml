name: tenant-post-auth-runtime-patcher

on:
  push:
    branches:
      - fix/tenant-scoped-post-auth-applications-20260820

permissions:
  contents: write

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tenant-scoped-post-auth-applications-20260820
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/tenant-post-auth-runtime-cutover.mjs
      - name: Persist tenant-scoped post-auth runtime
        run: |
          if git diff --quiet; then
            echo "No post-auth runtime drift remains."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            lib/website/customerApplicationProcess.ts \
            app/api/v1/website/customer-applications/route.ts \
            scripts/finalize-openapi-release.cjs
          git commit -m "fix(checkout): apply tenant-scoped post-auth runtime"
          git push origin HEAD:fix/tenant-scoped-post-auth-applications-20260820
